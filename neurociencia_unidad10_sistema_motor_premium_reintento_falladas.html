<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurociencia Unidad 10 Premium | DAVID MILÁN STUDIO</title>
<style>
:root{--bg:#05070d;--bg2:#0b1323;--gold:#d4af37;--gold2:#f3d98b;--white:#f8f4e8;--muted:#aab3c5;--green:#33d17a;--red:#ff6b6b;--blue:#4da3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at top left,rgba(212,175,55,.22),transparent 34%),radial-gradient(circle at bottom right,rgba(30,90,180,.28),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2),#05070d);color:var(--white);display:flex;justify-content:center;align-items:center;padding:35px 18px}
.quiz-container{width:100%;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(212,175,55,.28);border-radius:30px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);color:var(--gold2);letter-spacing:3px;font-weight:800;font-size:13px;margin-bottom:18px;background:rgba(255,255,255,.04)}
h1{font-size:clamp(30px,5vw,54px);line-height:1;margin-bottom:10px;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{font-size:17px;color:var(--muted);font-weight:400;margin-bottom:26px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.stat{padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:800}
.progress-wrap{height:10px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin-bottom:24px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:.35s ease}
.question-card{background:rgba(4,8,16,.55);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px}
.question{font-size:21px;font-weight:800;line-height:1.45;margin-bottom:22px}
.options{display:grid;gap:13px}
.option-btn{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));color:var(--white);font-size:16px;text-align:left;cursor:pointer;transition:.25s ease}
.option-btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(212,175,55,.65);box-shadow:0 12px 30px rgba(212,175,55,.12)}
.option-btn:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.16)!important;border-color:var(--green)!important;color:#dfffea!important}
.incorrect{background:rgba(255,107,107,.16)!important;border-color:var(--red)!important;color:#ffe0e0!important}
.feedback{display:none;margin-top:22px;padding:20px;border-radius:20px;line-height:1.65;font-size:15px}
.feedback.show{display:block}.feedback-correct{background:rgba(51,209,122,.12);border-left:5px solid var(--green)}.feedback-incorrect{background:rgba(255,107,107,.12);border-left:5px solid var(--red)}
.feedback strong{font-size:18px}.solution-label{display:block;margin-top:12px;color:var(--gold2);font-weight:900}
.controls{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:16px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;transition:.25s ease}.btn:hover{transform:translateY(-2px)}
.next-btn{display:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080b12}.secondary-btn{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.14)}
.score-container{display:none;text-align:center;padding:24px}.score-text{font-size:30px;font-weight:900;color:var(--gold2);margin-bottom:18px}.result-message{color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:24px}
.medal{display:inline-block;margin:14px 0 10px;padding:12px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.10);color:var(--gold2);font-weight:900}
.missed-box{text-align:left;margin:24px 0;padding:20px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}.missed-box h3{color:var(--gold2);margin-bottom:12px}.missed-box ul{padding-left:20px;color:#dbe2f2;line-height:1.6}
.mode-label{color:var(--blue);font-weight:900}
@media(max-width:650px){.quiz-container{padding:22px}.question-card{padding:20px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="quiz-container">
  <div class="brand">DAVID MILÁN STUDIO</div>
  <h1>Mega-Test Premium</h1>
  <h2>Unidad 10 · Sistema Motor</h2>
  <div id="quiz-screen">
    <div class="topbar">
      <div class="stat" id="progress-text">Pregunta 1 de 80</div>
      <div class="stat" id="score-tracker">Puntuación: 0</div>
      <div class="stat" id="mode-text">Modo completo</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="question-card">
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div id="feedback-container" class="feedback"></div>
      <div class="controls">
        <button class="btn secondary-btn" onclick="restartQuiz()">Reiniciar test</button>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Siguiente pregunta</button>
      </div>
    </div>
  </div>
  <div id="result-screen" class="score-container">
    <div class="score-text" id="final-score"></div>
    <div class="medal" id="medal-text"></div>
    <div class="result-message" id="final-message"></div>
    <div id="missed-summary" class="missed-box"></div>
    <div class="controls" style="justify-content:center;">
      <button class="btn secondary-btn" onclick="restartQuiz()">Volver a intentar todo</button>
      <button class="btn next-btn" id="retry-missed-btn" onclick="retryMissed()">Reintentar preguntas falladas</button>
    </div>
  </div>
</div>
<script>
const originalQuestions = [

        // INTRODUCCIÓN Y ORGANIZACIÓN
        { q: "¿Qué tres grandes tipos de movimientos se distinguen dentro del sistema motor humano?", o: ["Reflejos, rítmicos automáticos y voluntarios.", "Espásticos, flácidos y tónicos.", "Corticales, subcorticales y medulares."], c: 0, e: "Dentro del sistema motor se distinguen tres grandes tipos de movimientos: reflejos, rítmicos automáticos y voluntarios." },
        { q: "Caminar o masticar son ejemplos de movimientos generados por patrones centrales y modulados por niveles superiores. Son:", o: ["Movimientos reflejos puros.", "Movimientos voluntarios de alta precisión.", "Movimientos rítmicos automáticos."], c: 2, e: "Los movimientos rítmicos automáticos, como caminar o masticar, son generados por patrones centrales modulados por niveles superiores." },
        { q: "El control del movimiento se rige por un doble modelo organizativo. ¿Cuáles son estas dos organizaciones?", o: ["Pirámide asimétrica y lineal.", "Jerárquica y en paralelo.", "Hemisférica cruzada y homolateral."], c: 1, e: "La organización del sistema motor combina un modelo jerárquico y un modelo en paralelo, lo que garantiza rapidez y flexibilidad." },
        { q: "En la organización jerárquica del sistema motor, ¿qué nivel es responsable de los reflejos y la activación directa de los músculos a través de las motoneuronas?", o: ["Nivel medular.", "Nivel troncoencefálico.", "Nivel cortical."], c: 0, e: "Nivel medular: Responsable de los reflejos y de la activación directa de los músculos a través de las motoneuronas." },
        { q: "En la organización jerárquica, ¿qué nivel regula la postura, el equilibrio y los movimientos automáticos actuando como centro integrador?", o: ["Nivel cortical.", "Nivel medular.", "Nivel troncoencefálico."], c: 2, e: "Nivel troncoencefálico: Regula la postura, el equilibrio y los movimientos automáticos." },
        { q: "El nivel cortical en la organización jerárquica incluye a la corteza motora primaria, el área premotora y el área motora suplementaria. Su función principal es:", o: ["Generar la locomoción rítmica subconsciente.", "La planificación, programación e iniciación del movimiento voluntario.", "Estabilizar los núcleos vestibulares del tronco."], c: 1, e: "Nivel cortical: Su función principal es la planificación, programación e iniciación del movimiento voluntario." },
        { q: "La organización en paralelo del sistema motor permite:", o: ["Realizar acciones motoras complejas y combinadas, como caminar mientras hablamos.", "Que la médula espinal asuma funciones de pensamiento.", "Inhibir totalmente los ganglios basales durante la vigilia."], c: 0, e: "La organización en paralelo permite realizar acciones motoras complejas y combinadas, como caminar mientras hablamos o escribir mientras mantenemos la postura." },
        { q: "¿Qué dos estructuras subcorticales son clave para el funcionamiento en paralelo, armonizando y optimizando el movimiento en tiempo real?", o: ["Hipocampo y amígdala.", "Cerebelo y ganglios basales.", "Bulbo raquídeo y médula espinal."], c: 1, e: "El cerebelo y los ganglios basales son estructuras clave para el funcionamiento en paralelo, armonizando, corrigiendo y optimizando el movimiento." },
        
        // CORTEZA CEREBRAL
        { q: "La corteza motora primaria (M1), encargada de la ejecución de movimientos voluntarios finos, se ubica en el:", o: ["Giro poscentral del lóbulo parietal.", "Giro precentral del lóbulo frontal.", "Polo occipital."], c: 1, e: "La corteza motora primaria (M1) se ubica en el giro precentral del lóbulo frontal." },
        { q: "La representación cortical del cuerpo en M1, donde áreas de control fino como la mano o la cara ocupan grandes extensiones, se conoce como:", o: ["Sistema piramidal.", "Homúnculo motor o somatotópica.", "Decusación piramidal."], c: 1, e: "Su organización somatotópica u homúnculo motor refleja la importancia funcional de cada segmento corporal (manos/cara ocupan grandes áreas)." },
        { q: "¿De qué área cortical recibe información M1 para ajustar el movimiento en tiempo real según la retroalimentación táctil y propioceptiva?", o: ["De la corteza occipital primaria.", "De la corteza auditiva.", "De la corteza somatosensorial."], c: 2, e: "M1 recibe información de la corteza somatosensorial, lo que permite ajustar el movimiento en tiempo real." },
        { q: "Un síntoma característico de una lesión en la corteza motora primaria (M1) de un hemisferio es:", o: ["Parálisis o paresia en el mismo lado de la lesión (ipsilateral).", "Sordera verbal pura.", "Parálisis o paresia contralateral."], c: 2, e: "Parálisis o paresia contralateral: el déficit se manifiesta en el hemicuerpo opuesto a la lesión." },
        { q: "Tras una lesión en M1, la pérdida de control inhibitorio sobre las motoneuronas espinales suele producir:", o: ["Flacidez total permanente y arreflexia.", "Ceguera hemisférica.", "Espasticidad, hiperreflexia y reflejos patológicos (ej. Babinski)."], c: 2, e: "Produce espasticidad y reflejos patológicos debido a la pérdida de control inhibitorio sobre las motoneuronas espinales." },
        { q: "¿Qué estructuras se encuentran anteriores a M1 y son esenciales para planificar secuencias motoras complejas y coordinar movimientos?", o: ["El tálamo anterior.", "Las áreas premotoras y el área motora suplementaria.", "El vermis del cerebelo."], c: 1, e: "Las áreas premotoras y el área motora suplementaria se encuentran anterior a M1 y planifican movimientos complejos." },
        { q: "Si un paciente comprende una orden verbal pero no logra ejecutar el gesto correcto (como simular usar un peine), padece:", o: ["Apraxia ideacional.", "Apraxia ideomotora.", "Apraxia constructiva."], c: 1, e: "Apraxia ideomotora: el paciente comprende la orden verbal, pero no logra ejecutar el gesto correcto." },
        { q: "La incapacidad para coordinar secuencias motoras complejas (ej. preparar un café) aunque los movimientos aislados sí puedan realizarse, se denomina:", o: ["Apraxia ideacional.", "Ataxia espinal.", "Apraxia ideomotora."], c: 0, e: "Apraxia ideacional: incapacidad para coordinar secuencias motoras complejas, aunque movimientos aislados puedan realizarse." },
        { q: "Las lesiones en el área motora suplementaria producen específicamente déficits en:", o: ["Movimientos bimanuales coordinados (ej. abotonarse una camisa) y problemas de iniciación.", "El control reflejo de la deglución.", "La visión periférica."], c: 0, e: "En lesiones del área motora suplementaria, el paciente muestra déficit en movimientos bimanuales coordinados y alteración en la iniciación." },
        { q: "¿Qué estructura se encarga del 'control cognitivo del movimiento', decidiendo qué acción realizar, cuándo y cómo tras evaluar el contexto?", o: ["El lóbulo occipital.", "La corteza prefrontal.", "La cápsula interna."], c: 1, e: "La corteza prefrontal se encarga del control cognitivo del movimiento: evalúa objetivos, contexto, y decide qué acción realizar." },
        { q: "Una lesión en la corteza prefrontal puede dar lugar a repeticiones de una misma acción sin finalidad, aunque ya no sea adecuada al contexto. Esto es:", o: ["Corea espasmódica.", "Reflejo rotuliano invertido.", "Perseveraciones motoras."], c: 2, e: "Perseveraciones motoras: repetición de una misma acción sin finalidad, aunque ya no sea adecuada al contexto." },
        { q: "Dentro de las cortezas de asociación, ¿cuál es crucial para la orientación espacial integrando información visual, somatosensorial y propioceptiva?", o: ["El lóbulo temporal.", "La corteza prefrontal ventrolateral.", "El lóbulo parietal posterior."], c: 2, e: "Lóbulo parietal posterior: integra información visual, somatosensorial y propioceptiva, crucial para la orientación espacial." },

        // TRONCO ENCEFÁLICO
        { q: "El tronco encefálico conecta la médula espinal con el cerebro. ¿Qué estructuras lo conforman?", o: ["Hipotálamo, tálamo y epitálamo.", "Mesencéfalo, protuberancia y bulbo raquídeo.", "Globo pálido, putamen y caudado."], c: 1, e: "El tronco encefálico (mesencéfalo, protuberancia y bulbo raquídeo) conecta la médula espinal con el cerebro." },
        { q: "¿Qué función cumple el tronco encefálico a través de los pares craneales III, IV y VI?", o: ["La digestión automática.", "El control de los reflejos oculares (reflejo vestíbulo-ocular).", "La recepción de estímulos olfativos."], c: 1, e: "Reflejos oculares: a través de los pares craneales (III, IV, VI), asegura la coordinación de los movimientos de los ojos." },
        { q: "Una lesión muy extensa en el tronco encefálico que provoca un 'bloqueo motor severo' donde el paciente conserva consciencia pero pierde todo movimiento voluntario es el:", o: ["Síndrome de enclaustramiento (locked-in syndrome).", "Síndrome de Brown-Séquard.", "Parkinsonismo atípico."], c: 0, e: "Bloqueo motor severo: en lesiones extensas, como en el síndrome de enclaustramiento (locked-in syndrome)." },
        { q: "Los síndromes alternos del tronco encefálico se caracterizan por:", o: ["Sordera cortical y ceguera profunda simultánea.", "Parálisis espástica exclusiva de las piernas.", "Una combinación de parálisis de nervios craneales ipsilaterales y hemiparesia contralateral."], c: 2, e: "Síndromes alternos del tronco: combinación de parálisis de nervios craneales ipsilaterales y hemiparesia contralateral (ej. síndrome de Weber)." },

        // VÍAS DESCENDENTES (Piramidales y Extrapiramidales)
        { q: "Las vías motoras descendentes transmiten señales desde el cerebro a la médula y se clasifican en dos grandes sistemas:", o: ["Aferentes y eferentes.", "Piramidales y extrapiramidales.", "Simpáticas y parasimpáticas."], c: 1, e: "Se clasifican en piramidales y extrapiramidales, según su origen, función y patrón de control." },
        { q: "¿Qué vía es el principal sistema para el control de movimientos voluntarios finos y precisos?", o: ["La vía extrapiramidal.", "La vía piramidal.", "El tracto rubroespinal exclusivo."], c: 1, e: "La vía piramidal es el principal sistema para el control de movimientos voluntarios finos y precisos." },
        { q: "En el tracto corticoespinal (vía piramidal), ¿dónde cruzan al lado opuesto la mayoría de sus fibras para establecer el control contralateral?", o: ["En el cuerpo calloso.", "En el quiasma óptico.", "En la decusación de las pirámides (bulbo)."], c: 2, e: "La mayoría de sus fibras cruzan al lado opuesto en la decusación de las pirámides, estableciendo un control contralateral." },
        { q: "¿Qué tracto de la vía piramidal conecta la corteza motora con los núcleos motores de los pares craneales para mover la cara, lengua y cuello?", o: ["El tracto vestibuloespinal.", "El tracto corticonuclear (o corticobulbar).", "El tracto reticuloespinal."], c: 1, e: "Tracto corticonuclear: Conecta la corteza motora con los núcleos motores de los pares craneales." },
        { q: "Las vías extrapiramidales, a diferencia de las piramidales, NO son esenciales para los movimientos finos voluntarios. Su función es:", o: ["Asegurar la estabilidad, la coordinación intermuscular y la ejecución fluida de la acción (postura y tono).", "Exclusivamente procesar la memoria declarativa.", "Llevar la información del dolor a la corteza sensorial."], c: 0, e: "Estas vías no son esenciales para movimientos finos voluntarios, sino que aseguran la estabilidad, coordinación intermuscular y ejecución fluida." },
        { q: "¿Qué tracto extrapiramidal controla el tono postural y la locomoción automática, originándose en la formación reticular?", o: ["Tracto tectoespinal.", "Tracto corticoespinal.", "Tracto reticuloespinal."], c: 2, e: "Tracto reticuloespinal: Se origina en la formación reticular del tronco encefálico y controla tono postural, reflejos y locomoción." },
        { q: "El tracto rubroespinal, que complementa la vía piramidal en brazos y manos facilitando la fuerza y coordinación, procede del:", o: ["Núcleo caudado.", "Núcleo rojo del mesencéfalo.", "Núcleo subtalámico."], c: 1, e: "Tracto rubroespinal: Procede del núcleo rojo del mesencéfalo y complementa la función de la vía piramidal en miembros superiores." },
        { q: "¿Qué tracto extrapiramidal regula el equilibrio y postura de la cabeza y el cuerpo frente a cambios, originándose en los núcleos vestibulares?", o: ["Tracto vestibuloespinal.", "Tracto tectoespinal.", "Tracto reticuloespinal."], c: 0, e: "Tracto vestibuloespinal: Nace en los núcleos vestibulares del tronco encefálico y regula equilibrio y postura." },
        { q: "Si escuchas un estruendo y giras la cabeza rápidamente hacia el sonido como reflejo, estás usando el:", o: ["Tracto corticonuclear.", "Tracto tectoespinal (origen en el colículo superior).", "Tracto rubroespinal."], c: 1, e: "Tracto tectoespinal: Se origina en el colículo superior... guía movimientos reflejos de cabeza y cuello en respuesta a estímulos visuales o auditivos." },

        // GANGLIOS BASALES
        { q: "¿Cuál de las siguientes estructuras NO forma parte de los ganglios basales?", o: ["El globo pálido.", "El tálamo anterior.", "El núcleo estriado."], c: 1, e: "Los ganglios basales incluyen el núcleo estriado (caudado/putamen), globo pálido, sustancia negra y núcleo subtalámico. El tálamo es la estación de relevo." },
        { q: "El 'núcleo estriado', que actúa como principal puerta de entrada a los ganglios basales, está compuesto por:", o: ["Cerebelo y bulbo.", "Sustancia negra y globo pálido.", "Núcleo caudado y putamen."], c: 2, e: "Núcleo estriado: compuesto por el caudado y el putamen." },
        { q: "La VÍA DIRECTA de los ganglios basales actúa como un 'acelerador'. Su función es:", o: ["Suprimir los movimientos no deseados.", "Paralizar los miembros inferiores durante el sueño.", "Facilitar el inicio de los movimientos voluntarios."], c: 2, e: "Vía directa: se encarga de facilitar el inicio de los movimientos voluntarios, actuando como un 'acelerador'." },
        { q: "En la vía directa, la corteza excita las neuronas del estriado que poseen receptores:", o: ["Dopaminérgicos D1.", "Dopaminérgicos D2.", "Serotoninérgicos."], c: 0, e: "El proceso comienza cuando la corteza cerebral envía proyecciones... a las neuronas con receptores dopaminérgicos D1." },
        { q: "Al activarse la vía directa, se inhibe el globo pálido interno. Como consecuencia:", o: ["El tálamo queda inhibido y se detiene el movimiento.", "La actividad inhibitoria que llega al tálamo disminuye (se libera el tálamo), lo que excita la corteza.", "Se contraen todos los músculos del tronco rígidamente."], c: 1, e: "Como consecuencia de esta inhibición sobre los núcleos de salida, la actividad inhibitoria que llega al tálamo disminuye, lo que libera a las neuronas talámicas." },
        { q: "La VÍA INDIRECTA de los ganglios basales actúa como un 'freno', por lo que su función principal es:", o: ["Acelerar la marcha automática.", "Suprimir los movimientos no deseados o alternativas competidoras.", "Frenar la actividad del cerebelo."], c: 1, e: "Vía indirecta: tiene la función de suprimir los movimientos no deseados, actuando como un 'freno'." },
        { q: "En la vía indirecta, el estriado es activado por la corteza a través de neuronas que expresan receptores:", o: ["GABAérgicos tipo B.", "Dopaminérgicos D2.", "Dopaminérgicos D1."], c: 1, e: "En este caso, la corteza también activa al estriado, pero ahora sobre neuronas que expresan receptores dopaminérgicos D2." },
        { q: "En la vía indirecta, el globo pálido externo deja de inhibir al núcleo subtalámico. Esto provoca que el núcleo subtalámico:", o: ["Quede liberado, aumente su actividad excitando al globo pálido interno y aumente la inhibición al tálamo.", "Se paralice temporalmente deteniendo el flujo sanguíneo.", "Envíe dopamina directamente a los músculos."], c: 0, e: "El núcleo subtalámico queda liberado, aumenta su actividad y excita al globo pálido interno... incrementando la inhibición sobre el tálamo." },
        { q: "¿Cómo actúa la dopamina (liberada por la sustancia negra pars compacta) sobre los circuitos de los ganglios basales?", o: ["Paraliza ambas vías bloqueando el movimiento completamente.", "Potencia la vía directa (actuando sobre D1) y debilita el freno de la vía indirecta (sobre D2), facilitando el movimiento.", "Sólo potencia la vía indirecta, suprimiendo siempre la acción."], c: 1, e: "La dopamina potencia la vía directa (incrementa eficacia en D1) y tiene efecto opuesto en la indirecta (D2), limitando su freno sobre el movimiento." },
        { q: "La patología motora que surge por la pérdida de dopamina, provocando reducción de la vía directa, sobreactivación de la indirecta, bradicinesia y rigidez es:", o: ["La Enfermedad de Parkinson.", "La Enfermedad de Huntington.", "La Esclerosis Múltiple."], c: 0, e: "Enfermedad de Parkinson: la pérdida de dopamina conlleva reducción de la vía directa y sobreactivación de la vía indirecta (bradicinesia y rigidez)." },
        { q: "La degeneración de neuronas estriatales de la vía indirecta, que impide suprimir los movimientos generando coreas e hipercinesias, causa la:", o: ["Ataxia cerebelosa.", "Enfermedad de Huntington.", "Apraxia ideacional."], c: 1, e: "En la enfermedad de Huntington, la degeneración de las neuronas estriatales de la vía indirecta impide la supresión de movimientos, generando coreas." },

        // CEREBELO
        { q: "El cerebelo es una estructura de la fosa posterior cuya función esencial respecto al movimiento es:", o: ["Generar la orden inicial de los movimientos finos y proyectarla a los músculos.", "Coordinarlo, ajustarlo y facilitar el aprendizaje motor en tiempo real.", "Producir hormonas que estimulan los músculos esqueléticos."], c: 1, e: "Aunque no genera directamente los movimientos, cumple una función esencial de coordinación, ajuste y aprendizaje." },

        { q: "Un síntoma clásico de lesión cerebelosa, caracterizado por la falta de coordinación de los movimientos voluntarios, es la:", o: ["Afasia transcortical.", "Dismetría.", "Ataxia."], c: 2, e: "Las lesiones cerebelosas producen ataxia, un trastorno caracterizado por la falta de coordinación de los movimientos voluntarios." },

        { q: "La médula espinal es un centro de integración motora primaria con autonomía para controlar:", o: ["El aprendizaje del lenguaje verbal.", "Movimientos básicos, reflejos y patrones motores rítmicos.", "La memoria declarativa emocional."], c: 1, e: "Posee un grado significativo de autonomía para el control de movimientos básicos, reflejos y patrones motores rítmicos." },

        { q: "El reflejo mediado por los órganos tendinosos de Golgi que previene lesiones inhibiendo la contracción excesiva del músculo se llama:", o: ["Reflejo miotático inverso.", "Reflejo extensor cruzado.", "Reflejo ciliar."], c: 0, e: "Reflejo miotático inverso: Mediado por los órganos tendinosos de Golgi... previene lesiones al inhibir contracción excesiva." },
        { q: "Ante un estímulo doloroso (ej. pisar un clavo), el reflejo de retirada suele ir acompañado de otro reflejo para mantener el equilibrio con la otra pierna. Se llama:", o: ["Reflejo rotuliano inverso.", "Reflejo cruzado extensor.", "Reflejo tónico del cuello."], c: 1, e: "Reflejo flexor y de retirada... Suele acompañarse de reflejo cruzado extensor para mantener el equilibrio." },
        { q: "Las redes de interneuronas medulares capaces de producir la marcha automática sin control cortical continuo se denominan:", o: ["Cápsulas internas rítmicas.", "Generadores centrales de patrones.", "Aferencias lemniscales primarias."], c: 1, e: "Generadores centrales de patrones: redes de interneuronas capaces de producir movimientos rítmicos coordinados (marcha)." },
        { q: "Tras una lesión medular completa, se instaura primero una parálisis flácida que luego da paso a:", o: ["Una recuperación del movimiento espontáneo tras un mes.", "Una parálisis espástica (músculos rígidos y reflejos exagerados) por pérdida del control inhibidor cortical.", "Una atrofia total del tronco del encéfalo."], c: 1, e: "Inicio de parálisis flácida... seguida de parálisis espástica (músculos rígidos con aumento del tono, reflejos exagerados) por pérdida de control inhibidor cortical." },
        { q: "El síndrome de Brown-Séquard, que produce hemiparesia ipsilateral, es el ejemplo clínico típico de una lesión medular...", o: ["Completamente seccionada.", "Del circuito cerebeloso superior.", "Parcial."], c: 2, e: "Lesiones parciales: pérdida de funciones específicas (ejemplo: síndrome de Brown-Séquard con hemiparesia ipsilateral)." },

        { q: "Las motoneuronas inferiores transmiten la orden final a los músculos. ¿Dónde se localizan sus cuerpos neuronales?", o: ["En el asta posterior medular y núcleo rojo.", "En el asta anterior de la médula espinal y núcleos de los nervios craneales.", "En la cápsula interna del cerebro."], c: 1, e: "Localizadas en el asta anterior de la médula espinal y en los núcleos motores de los nervios craneales." },
        { q: "¿Qué nombre recibe el conjunto formado por una motoneurona ALFA y todas las fibras musculares esqueléticas que inerva?", o: ["Sarcómero funcional.", "Placa motora aislada.", "Unidad motora."], c: 2, e: "Unidad motora: Conjunto formado por una motoneurona alfa y las fibras musculares que inerva." },
        { q: "Para ejecutar movimientos que requieren mucha PRECISIÓN (como los de la mano), la unidad motora debe ser:", o: ["Muy grande, inervando miles de fibras.", "Pequeña, inervando pocas fibras.", "Carente de motoneuronas alfa."], c: 1, e: "La precisión del movimiento depende del tamaño de la unidad motora (pequeñas en músculos de la mano, grandes en posturales)." },

        { q: "¿Qué células trabajan en la médula coordinando la acción de las motoneuronas alfa y gamma y modulando reflejos de inhibición recíproca?", o: ["Células gliales ependimarias.", "Las interneuronas.", "Las células de Purkinje."], c: 1, e: "Interneuronas: Las motoneuronas alfa y gamma trabajan coordinadamente gracias a interneuronas inhibitorias y excitatorias." },
        { q: "La sinapsis especializada donde el axón de la motoneurona alfa contacta con la fibra muscular se denomina:", o: ["Placa motora (unión neuromuscular).", "Bóveda sináptica de Golgi.", "Gap junction estriada."], c: 0, e: "Placa motora (unión neuromuscular): Sinapsis especializada donde el axón de la motoneurona alfa libera acetilcolina." },
        { q: "En la placa motora, la motoneurona alfa despolariza la membrana muscular al liberar el neurotransmisor:", o: ["GABA.", "Acetilcolina (ACh).", "Dopamina."], c: 1, e: "La motoneurona alfa libera acetilcolina (ACh). La unión de ACh a receptores nicotínicos provoca despolarización." },
        { q: "Tras la despolarización en la fibra muscular, ¿qué ion es liberado por el retículo sarcoplásmico para permitir la interacción entre actina y miosina (contracción)?", o: ["Sodio (Na+).", "Calcio (Ca2+).", "Potasio (K+)."], c: 1, e: "El potencial desencadena la liberación de calcio en el retículo sarcoplásmico. El calcio permite la interacción entre actina y miosina." },
        { q: "Los órganos sensoriales que informan sobre la LONGITUD del músculo y su velocidad de estiramiento son:", o: ["Los husos neuromusculares.", "Los órganos tendinosos de Golgi.", "Las placas motoras secundarias."], c: 0, e: "Husos neuromusculares: informan sobre la longitud del músculo y su velocidad de estiramiento." },
        { q: "Los órganos que detectan la TENSIÓN generada por la contracción, protegiendo al músculo de una sobrecarga, son:", o: ["Los órganos tendinosos de Golgi.", "Los husos neuromusculares.", "Los corpúsculos de Pacini musculares."], c: 0, e: "Órganos tendinosos de Golgi: detectan la tensión generada por la contracción, protegiendo de sobrecarga." },

        { q: "En rehabilitación neurológica, los dispositivos que se colocan en las piernas del paciente para reproducir el patrón locomotor (robot de marcha) se denominan:", o: ["Interfaces pasivas.", "Exoesqueletos.", "Neurosimuladores holográficos."], c: 1, e: "Exoesqueletos de marcha: dispositivos que se colocan en las piernas y permiten reproducir el patrón locomotor." },

let questions=[...originalQuestions],currentQuestion=0,score=0,answered=false,missedQuestions=[],retryMode=false;
const questionText=document.getElementById('question-text'),optionsContainer=document.getElementById('options-container'),feedbackContainer=document.getElementById('feedback-container'),nextBtn=document.getElementById('next-btn'),progressText=document.getElementById('progress-text'),scoreTracker=document.getElementById('score-tracker'),quizScreen=document.getElementById('quiz-screen'),resultScreen=document.getElementById('result-screen'),finalScore=document.getElementById('final-score'),finalMessage=document.getElementById('final-message'),progressBar=document.getElementById('progress-bar'),missedSummary=document.getElementById('missed-summary'),retryMissedBtn=document.getElementById('retry-missed-btn'),modeText=document.getElementById('mode-text'),medalText=document.getElementById('medal-text');
function loadQuestion(){answered=false;feedbackContainer.style.display='none';feedbackContainer.className='feedback';feedbackContainer.innerHTML='';nextBtn.style.display='none';const q=questions[currentQuestion],total=questions.length,percent=Math.round((currentQuestion/total)*100);progressText.innerText=`Pregunta ${currentQuestion+1} de ${total}`;progressBar.style.width=`${percent}%`;modeText.innerHTML=retryMode?'<span class="mode-label">Modo repaso: falladas</span>':'Modo completo';questionText.innerText=`${currentQuestion+1}. ${q.q}`;optionsContainer.innerHTML='';q.o.forEach((opt,index)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerText=opt;btn.onclick=()=>selectOption(index,btn);optionsContainer.appendChild(btn);});}
function selectOption(index,btn){if(answered)return;answered=true;const q=questions[currentQuestion],allBtns=optionsContainer.querySelectorAll('.option-btn');allBtns.forEach(b=>b.disabled=true);const correctText=q.o[q.c];if(index===q.c){btn.classList.add('correct');score++;scoreTracker.innerText=`Puntuación: ${score}`;feedbackContainer.classList.add('show','feedback-correct');feedbackContainer.innerHTML=`<strong>Correcto.</strong><span class="solution-label">Por qué es correcto:</span>${q.e}`;}else{btn.classList.add('incorrect');allBtns[q.c].classList.add('correct');if(!missedQuestions.some(item=>item.q===q.q)){missedQuestions.push(q)}feedbackContainer.classList.add('show','feedback-incorrect');feedbackContainer.innerHTML=`<strong>Respuesta equivocada.</strong><br>Has marcado: <b>${q.o[index]}</b><br>La solución correcta es: <b>${correctText}</b><span class="solution-label">Por qué esa es la solución correcta:</span>${q.e}`;}nextBtn.style.display='block';nextBtn.innerText=currentQuestion===questions.length-1?'Ver resultados':'Siguiente pregunta';}
function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){loadQuestion()}else{showResults()}}
function showResults(){quizScreen.style.display='none';resultScreen.style.display='block';progressBar.style.width='100%';const percentage=Math.round((score/questions.length)*100);finalScore.innerHTML=`Has acertado ${score} de ${questions.length} preguntas (${percentage}%)`;if(percentage>=90)medalText.innerText='🏆 Medalla de Oro · Dominio excelente';else if(percentage>=75)medalText.innerText='🥈 Medalla de Plata · Muy buen nivel';else if(percentage>=60)medalText.innerText='🥉 Medalla de Bronce · Base aprobada';else medalText.innerText='📚 Modo refuerzo · Conviene repasar';let message='';if(percentage>=90)message='Extraordinario. Dominas sistema motor, vías descendentes, ganglios basales, cerebelo, reflejos y placa motora.';else if(percentage>=70)message='Buen resultado. Repasa las falladas para consolidar vías piramidales, extrapiramidales, ganglios basales y cerebelo.';else message='Conviene repasar organización motora, corteza motora, tronco encefálico, vías descendentes, ganglios basales, cerebelo y motoneuronas.';finalMessage.innerText=message;if(missedQuestions.length>0){missedSummary.style.display='block';missedSummary.innerHTML=`<h3>Preguntas falladas: ${missedQuestions.length}</h3><ul>${missedQuestions.map((q,i)=>`<li>${i+1}. ${q.q}</li>`).join('')}</ul>`;retryMissedBtn.style.display='inline-block';}else{missedSummary.style.display='block';missedSummary.innerHTML='<h3>No has fallado ninguna pregunta.</h3><p>Resultado perfecto. No hay preguntas que reintentar.</p>';retryMissedBtn.style.display='none';}}
function retryMissed(){if(missedQuestions.length===0)return;questions=[...missedQuestions];missedQuestions=[];currentQuestion=0;score=0;retryMode=true;scoreTracker.innerText='Puntuación: 0';resultScreen.style.display='none';quizScreen.style.display='block';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
function restartQuiz(){questions=[...originalQuestions];currentQuestion=0;score=0;answered=false;missedQuestions=[];retryMode=false;scoreTracker.innerText='Puntuación: 0';quizScreen.style.display='block';resultScreen.style.display='none';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
loadQuestion();

</script>
