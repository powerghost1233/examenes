radial-gradient(circle at top left,rgba(212,175,55,.20),transparent 30%),

<script>
const originalQuestions=[{"q": "¿En qué año y lugar se fija habitualmente la aparición de la psicología científica?", "o": ["En 1859, con la publicación de El origen de las especies en Londres.", "En 1879, con la fundación del laboratorio de Wundt en Leipzig.", "En 1860, con la publicación de los Elementos de psicofísica de Fechner."], "c": 1, "e": "El texto establece que la aparición de la psicología científica se fija arbitrariamente en 1879, año de fundación del laboratorio de Wundt en Leipzig (Alemania)."}, {"q": "En el plano intelectual del siglo XIX, ¿qué filosofía proporcionó el \"suelo intelectual\" en el que nació la psicología?", "o": ["El Racionalismo cartesiano.", "El Romanticismo idealista.", "El Positivismo."], "c": 2, "e": "El texto indica textualmente que \"el positivismo, como filosofía basada en la ciencia, va a ser el suelo intelectual en el que va a nacer la psicología\"."}, {"q": "¿Qué autor es considerado el principal exponente del positivismo en el siglo XIX?", "o": ["Auguste Comte.", "Immanuel Kant.", "John Stuart Mill."], "c": 0, "e": "Auguste Comte (1789-1857) es señalado como el pensador francés que establece el positivismo como el gran sistema que ordena el mundo filosófico desde el modelo del saber científico."}, {"q": "Para el positivismo de Comte, el conocimiento se fundamenta en:", "o": ["La intuición metafísica del alma.", "Los datos de \"fenómenos\" concretos proporcionados por la sensación.", "Las deducciones lógicas independientes de la experiencia."], "c": 1, "e": "Comte defendió una doctrina empirista y fenomenista donde el conocimiento se funda en datos de fenómenos concretos (hechos) que nos proporciona la sensación."}, {"q": "¿Por qué Auguste Comte NO admitía la psicología como ciencia?", "o": ["Porque creía que la mente humana cambiaba constantemente y no tenía leyes.", "Porque el conocimiento por introspección exige que el sujeto sea a la vez el observador y lo observado.", "Porque la consideraba una rama de la teología y no de la biología."], "c": 1, "e": "Comte rechazaba la psicología porque habría que observarla mediante introspección, lo que obligaría al sujeto a dividirse (ser observador y observado simultáneamente), alterando los datos."}, {"q": "¿Qué nombre recibió el procedimiento para determinar el carácter diagnosticando los abultamientos y depresiones del cráneo?", "o": ["Psicofísica.", "Craneoscopia (o frenología).", "Etología."], "c": 1, "e": "Franz J. Gall propuso la \"craneoscopia\" (frenología), consistente en examinar el cráneo buscando abultamientos para realizar un diagnóstico psicológico de las capacidades."}, {"q": "¿Quién fue el principal creador de la doctrina frenológica?", "o": ["Ernst H. Weber.", "Mariano Cubí.", "Franz J. Gall."], "c": 2, "e": "El médico vienés Franz J. Gall (1758-1828) fue quien propuso este método para determinar las propensiones y cualidades mentales dominantes."}, {"q": "La base teórica de la frenología suponía que las distintas funciones mentales (lenguaje, agresividad, etc.):", "o": ["Se localizaban en el corazón y el sistema vascular.", "Dependían exclusivamente de la educación del individuo.", "Tenían un centro o localización precisa en el cerebro."], "c": 2, "e": "Suponía que tales funciones tenían una \"localización\" precisa en el cerebro, y que un aumento en su actividad se reflejaba en la masa cerebral y, por tanto, en el cráneo."}, {"q": "¿Quién fue el representante español más destacado de la escuela frenológica?", "o": ["Luis Vives.", "Mariano Cubí.", "José Ortega y Gasset."], "c": 1, "e": "El documento cita explícitamente a Mariano Cubí (1801-1875) como el líder de una importante escuela frenológica en España."}, {"q": "Aunque los frenólogos fueron calificados de charlatanes, ¿cuál fue su aportación histórica positiva?", "o": ["Descubrieron el umbral diferencial.", "Incitaron a buscar las \"localizaciones cerebrales\" como base del saber psicológico.", "Fueron los primeros en aplicar la introspección en laboratorios."], "c": 1, "e": "El texto afirma que \"los frenólogos incitaron a buscar esas posibles localizaciones cerebrales, como base del saber psicológico\"."}, {"q": "¿Qué es la psicofísica?", "o": ["La ciencia que estudia las localizaciones cerebrales de la moralidad.", "La disciplina que busca relacionar los estímulos (física) y las sensaciones (psicología).", "Una rama de la filosofía que rechaza la experimentación fisiológica."], "c": 1, "e": "Surge como un nuevo campo para estudiar el conocimiento relacionando estímulos y sensaciones."}, {"q": "¿Qué fisiólogo propuso la \"ley de energía específica de los sentidos\"?", "o": ["Johannes Müller.", "Gustav Fechner.", "Wilhelm Wundt."], "c": 0, "e": "Johannes Müller advirtió que las sensaciones dependen del modo especial de procesar de cada sentido, a lo que llamó \"ley de energía específica de los sentidos\"."}, {"q": "Según Johannes Müller, si aplicamos un estímulo de presión sobre el ojo, ¿qué percibiremos?", "o": ["Una sensación dolorosa de tacto en la córnea.", "Una pérdida temporal del conocimiento.", "Un fenómeno visual, como fosfenos o \"estrellitas\"."], "c": 2, "e": "Para ilustrar su ley, Müller usa el ejemplo de la presión en el ojo, que genera un fenómeno visual (fosfenos), demostrando que la sensación depende del receptor, no del estímulo."}, {"q": "¿Qué fisiólogo realizó los primeros experimentos cuantitativos sobre el sentido del tacto en Leipzig (1834)?", "o": ["Charles Darwin.", "Ernst H. Weber.", "Franz Brentano."], "c": 1, "e": "Ernst H. Weber (1795-1878) realizó una serie de experimentos táctiles y descubrió la constante que lleva su nombre."}, {"q": "Según los descubrimientos de Weber, para notar un incremento en la sensación, el aumento del estímulo debe ser:", "o": ["Siempre el mismo valor absoluto, independientemente del estímulo inicial.", "Proporcional al estímulo de partida.", "Inversamente proporcional a la intensidad de la luz."], "c": 1, "e": "Weber descubrió que el incremento del estímulo habrá de ser proporcional al estímulo primero (multiplicado por la constante k)."}, {"q": "¿Cómo se denomina al valor mínimo de estímulo que ha de añadirse para que el sujeto perciba un cambio en la sensación?", "o": ["Umbral diferencial.", "Umbral superior.", "Límite de apercepción."], "c": 0, "e": "El \"umbral diferencial\" es la mínima cantidad de estímulo que ha de añadirse a otro ya dado para que se perciba un incremento sensorial."}, {"q": "Weber denominó \"umbral inferior\" a:", "o": ["El nivel a partir del cual el dolor se hace insoportable.", "El límite para empezar a sentir una sensación, por debajo del cual no se percibe nada.", "El nivel de fatiga del órgano sensorial."], "c": 1, "e": "Es el límite para empezar a sentir; los estímulos por debajo de ese límite no son percibidos por el sujeto."}, {"q": "¿Qué sucede al cruzar el \"umbral superior\" de Weber?", "o": ["Que el sujeto empieza a distinguir colores ultravioletas.", "Que ya no se notan nuevos aumentos de estimulación, porque se ha hecho máxima.", "Que el estímulo físico desaparece por completo."], "c": 1, "e": "Estableció un umbral superior a partir del cual ya no se notan nuevos aumentos porque la estimulación es máxima."}, {"q": "¿En qué obra cumbre de 1860 establece Gustav Fechner la relación matemática entre mundo físico y psíquico?", "o": ["El origen de las especies.", "Psicología desde el punto de vista empírico.", "Elementos de psicofísica."], "c": 2, "e": "En Elementos de psicofísica (1860), primer tratado sobre la disciplina y considerado a veces como verdadero inicio de la psicología científica."}, {"q": "Según los estudios de Fechner, ¿cómo crecen respectivamente las series de sensaciones y estímulos?", "o": ["Ambas crecen multiplicativamente.", "Ambas crecen sumativamente.", "Las sensaciones crecen sumativamente y los estímulos multiplicativamente."], "c": 2, "e": "Advirtió que las sensaciones crecen de modo sumativo (añadiendo dmp), mientras que los estímulos lo hacen de modo multiplicativo (usando la constante de Weber)."}, {"q": "Para llegar a su famosa ley matemática, Fechner tuvo que hacer una suposición teórica importante respecto a las sensaciones. ¿Cuál fue?", "o": ["Que las \"diferencias mínimas perceptibles\" (dmp) son todas iguales.", "Que las sensaciones son procesos biológicos sin vínculo con el cerebro.", "Que el umbral inferior no existe."], "c": 0, "e": "Fechner supuso que los incrementos en las sensaciones (dmp) son todos iguales dado que todos son \"mínimos\", considerándolos unidades de medida."}, {"q": "¿Cuál es la formulación matemática final de la Ley Psicofísica de Fechner?", "o": ["Sensación = Estímulo multiplicado por k.", "Sensación = Logaritmo del estímulo.", "Sensación = Umbral inferior más estímulo."], "c": 1, "e": "Fechner vio la relación matemática de exponentes y potencias y estableció que los valores de la sensación equivalen al logaritmo de los valores de los estímulos."}, {"q": "A nivel filosófico, la psicofísica de Fechner demostraba que \"lo físico\" y \"lo mental\" se podían relacionar en un marco común. ¿A qué postura filosófica apoyaba esto frente al dualismo cartesiano?", "o": ["Al materialismo dialéctico.", "A una posición \"monista\" (una sola sustancia).", "Al idealismo solipsista."], "c": 1, "e": "Fechner vino a mantener una posición monista en lugar del dualismo anterior, ya que fenómenos físicos y psíquicos resultan relacionables matemáticamente."}, {"q": "Además de su formulación matemática, ¿qué otro concepto importante habilitó Fechner al estudiar el umbral inferior?", "o": ["La existencia de reflejos medulares incondicionados.", "La apertura hacia la admisión de un nivel \"inconsciente\" de procesos orgánicos no percibidos.", "La negación de toda fisiología."], "c": 1, "e": "Al reconocer estimulaciones orgánicas que no superan el umbral de conciencia, se abrió camino hacia la admisión de procesos inconscientes."}, {"q": "El científico y filósofo inglés John Stuart Mill defendió que la psicología era científica porque poseía leyes empíricas. ¿A qué leyes se refería principalmente?", "o": ["A las leyes de la asociación de ideas (por semejanza y contigüidad).", "A las leyes de la gravitación universal.", "A las leyes matemáticas de los logaritmos."], "c": 0, "e": "Mill admitió que existían leyes empíricas, como las de la asociación de ideas, probando que es un área estructurada."}, {"q": "¿Qué nombre le dio John Stuart Mill a la ciencia que tendría por objeto el surgimiento de la personalidad individual (el carácter) de cada uno?", "o": ["Psicofísica de masas.", "Etología.", "Sociología comprensiva."], "c": 1, "e": "Él la llamó \"etología\" (ciencia del carácter), basada en cómo el \"ego\" resulta de sus experiencias y asociaciones."}, {"q": "Amigo de J.S. Mill, este pensador hizo un verdadero manual de psicología dividiendo el estudio entre \"sentidos e inteligencia\" y \"emociones y voluntad\":", "o": ["Alexander Bain.", "Wilhelm Dilthey.", "Francis Galton."], "c": 0, "e": "Alexander Bain (1818-1903) es citado como el creador de un manual que divide la psicología en estos bloques gobernados por asociación."}, {"q": "La obra clave de Charles Darwin sobre la evolución, publicada en 1859, se titula:", "o": ["El origen del hombre.", "El origen de las especies.", "Sistema de lógica inductiva."], "c": 1, "e": "Darwin publicó \"El origen de las especies\" en 1859, manteniendo la existencia de una evolución biológica."}, {"q": "¿Qué autor francés previo a Darwin defendía una evolución basada en que \"la función crea el órgano\" (herencia de caracteres adquiridos)?", "o": ["Jean-Baptiste de Lamarck.", "Carlos Linneo.", "Auguste Comte."], "c": 0, "e": "Lamarck creó el lamarckismo, sosteniendo que el cambio de hábitos genera variaciones (el uso fortalece, el desuso atrofia)."}, {"q": "Darwin tomó de Thomas Malthus la idea de que:", "o": ["Las variaciones se producen por voluntad divina.", "La población crece más deprisa que los alimentos, generando una \"lucha por la vida\".", "El hombre y el mono no tienen antepasados comunes."], "c": 1, "e": "Robert Malthus advirtió que los recursos crecen menos rápido que la población, forzando una \"lucha por la vida\", idea clave para la selección natural de Darwin."}, {"q": "El mecanismo central postulado por Darwin mediante el cual sobreviven los individuos mejor adaptados al entorno es:", "o": ["La síntesis creadora.", "El fijismo biológico.", "La selección natural."], "c": 2, "e": "La \"selección natural\" asegura que los organismos mejor adaptados sobreviven y desplazan a los competidores."}, {"q": "En su libro de 1871 \"El origen del hombre\", Darwin sostiene que la mente humana:", "o": ["Es producto de un alma inmaterial.", "Procede, por evolución, de la mente de especies infrahumanas (los simios).", "Es radicalmente distinta en esencia a la de cualquier animal."], "c": 1, "e": "Mantuvo que la mente, la psique y sus facultades proceden por evolución de especies infrahumanas más próximas."}, {"q": "Para Darwin, la diferencia psicológica entre el hombre y las especies animales superiores (como primates) es una diferencia:", "o": ["En esencia, no en grado.", "En grado, no en esencia.", "Totalmente nula; son idénticas funcionalmente."], "c": 1, "e": "Darwin afirma literalmente que hay diferencia \"en grado, no en esencia\", atribuyendo a los primates emociones e intuiciones similares."}, {"q": "En su libro de 1872 sobre la expresión de las emociones, Darwin sugiere que muchos gestos humanos son:", "o": ["Creaciones culturales sin base fisiológica.", "Restos que ya no son útiles de respuestas que sí lo fueron en el pasado.", "Productos exclusivos del lenguaje articulado moderno."], "c": 1, "e": "Explicó que algunas emociones son restos inútiles actualmente pero procedentes de respuestas adaptativas de especies pasadas."}, {"q": "Según Darwin, una consecuencia importante de la complejidad mental del hombre es que su conducta es más flexible porque:", "o": ["Tiene menos instintos fijos que el animal.", "Carece por completo de memoria genética.", "Posee un alma racional sobrenatural."], "c": 0, "e": "Reconoció que en el hombre hay \"menos instintos\", por lo que su conducta es menos estereotipada y más flexible mediante el lenguaje y cerebro fino."}, {"q": "Una de las consecuencias fundamentales del evolucionismo para el desarrollo de la psicología fue:", "o": ["El rechazo definitivo al uso de los test.", "El fin de los estudios sobre desarrollo infantil.", "El impulso a medir y comparar niveles de funcionamiento mental (aparición de los test)."], "c": 2, "e": "La necesidad de comparar a los individuos por su distinto grado de adaptación impulsó los test y el estudio de diferencias."}, {"q": "Primo de Darwin y polifacético científico, este pionero inició la moderna psicología diferencial:", "o": ["Wilhelm Wundt.", "Francis Galton.", "Karl Pearson."], "c": 1, "e": "Sir Francis Galton, interesado por las variaciones individuales, es el creador de la psicología diferencial midiendo aptitudes."}, {"q": "¿En qué evento y año instaló Galton su laboratorio de evaluación masiva de individuos?", "o": ["En la Exposición Internacional de Londres de 1884.", "En la Exposición Universal de París de 1889.", "En la Universidad de Leipzig en 1879."], "c": 0, "e": "Galton aplicó pruebas objetivas a muchos visitantes en un pequeño laboratorio en la Exposición Internacional de Londres de 1884."}, {"q": "En la psique humana, Galton distinguía dos grandes dimensiones o conjuntos de facultades:", "o": ["Razonamiento espacial y razonamiento verbal.", "Instintos primitivos y condicionamientos.", "El talento (cognitivo) y el carácter (acción/sentimiento)."], "c": 2, "e": "Galton distinguió \"el talento y el carácter, es decir, el conjunto de facultades cognitivas y el de las relacionadas con la acción y el sentimiento\"."}, {"q": "Estudiando la riqueza de las imágenes mentales, Galton se sorprendió al encontrar que:", "o": ["Los científicos eran los que poseían imágenes mentales más vívidas.", "Entre los científicos era normal una gran pobreza de imágenes, operando con representaciones abstractas.", "Las mujeres no poseían capacidad para generar representaciones visuales."], "c": 1, "e": "Galton advirtió \"con sorpresa que entre los científicos era normal una gran pobreza, mientras que era muy alto el número de representaciones conceptuales abstractas\"."}, {"q": "¿Cuál es el título de la obra más conocida de Galton publicada en 1869 sobre las personas de capacidades excepcionales?", "o": ["El origen del genio.", "Genio hereditario.", "La biometría del alma."], "c": 1, "e": "La obra \"Genio hereditario\" estudiaba a familias de personalidades distinguidas asumiendo el genio como capacidad estadística rara."}, {"q": "Metodológicamente, Galton comparó series de familias y también empleó un diseño pionero en psicología:", "o": ["El estudio de parejas de gemelos.", "Los condicionamientos pavlovianos con perros.", "Los tiempos de reacción eléctricos."], "c": 0, "e": "Para diferenciar entre herencia y variabilidad, comparó medidas en parejas de gemelos frente a hermanos normales."}, {"q": "La conclusión principal a la que llegó Galton tras sus estudios biométricos fue:", "o": ["Que el medio ambiente determina al 100% el nivel de talento.", "Que la herencia representaba el factor más importante para explicar las facultades mentales.", "Que el talento dependía puramente del tamaño absoluto del cráneo."], "c": 1, "e": "Concluyó que \"la herencia representaba, con mucho, el factor más importante a la hora de explicar el desarrollo de las facultades mentales\"."}, {"q": "Galton formuló los principios del estudio científico de los procesos reproductivos para mantener a la descendencia libre de deficiencias genéticas. Esto recibe el nombre de:", "o": ["Frenología.", "Eugenesia.", "Etología reproductiva."], "c": 1, "e": "Formuló los principios de la \"eugenesia\", concebida como el estudio científico reproductivo para mejorar la masa hereditaria."}, {"q": "Uno de los mayores discípulos británicos de Galton, fundamental en el desarrollo de la biometría y la estadística, fue:", "o": ["Wilhelm Wundt.", "Karl Pearson.", "James McKeen Cattell."], "c": 1, "e": "Karl Pearson (1857-1936) fue discípulo de Galton y gran investigador en estadística biométrica."}, {"q": "El gran manual de psicología experimental publicado por Wundt entre 1873-1874 se titula:", "o": ["Psicología de los pueblos.", "Elementos de psicología fisiológica.", "Compendio de psicofísica."], "c": 1, "e": "Su libro Grundzüge der Physiologischen Psychologie sirvió de obra de referencia internacional para la nueva disciplina experimental."}, {"q": "¿Cómo define formalmente Wundt a la psicología como ciencia?", "o": ["El estudio del inconsciente dinámico humano.", "La ciencia del comportamiento públicamente observable.", "La ciencia de las formas más generales de la experiencia humana inmediata y de su conexión según leyes."], "c": 2, "e": "El autor expone explícitamente esta definición dada por Wundt sobre la \"experiencia humana inmediata\"."}, {"q": "Según Wundt, ¿cuál es la diferencia radical entre la ciencia natural (física/fisiología) y la psicología?", "o": ["La física emplea matemáticas y la psicología no.", "La ciencia natural analiza fenómenos abstrayendo al sujeto; la psicología los estudia en su relación ineludible con el sujeto que los vive (experiencia inmediata).", "Ambas ciencias no tienen ninguna diferencia; son exactamente lo mismo."], "c": 1, "e": "Wundt señala que mientras la ciencia natural se independiza del observador (mediata), la psicología toma los hechos tal como se dan a un sujeto (inmediata)."}, {"q": "El sistema wundtiano recibe comúnmente el nombre de \"Estructuralismo\" porque:", "o": ["Construía laberintos experimentales estructurados.", "Buscaba descomponer la experiencia en sus \"materiales\" atómicos y observar la estructura que forman al conectarse.", "Creía que el cerebro era una estructura rígida e invariable."], "c": 1, "e": "Se llama así porque analiza la experiencia, busca los \"materiales\" simples (átomos) y la \"estructura\" que terminan formando al unirse."}, {"q": "¿Cuáles son los dos elementos atómicos fundamentales o materiales básicos de la experiencia en la teoría de Wundt?", "o": ["Memoria y Atención.", "Instintos y Reflejos.", "Sensaciones y Sentimientos (o afectos)."], "c": 2, "e": "Para Wundt los materiales básicos son de dos tipos: sensaciones (visuales, auditivas...) y sentimientos que reaccionan a la estimulación."}, {"q": "Las \"sensaciones\" en Wundt poseen principalmente dos dimensiones básicas:", "o": ["Cualidad e intensidad.", "Longitud y masa.", "Tensión y relajación."], "c": 0, "e": "Poseen \"materia\" según el sentido y dimensiones como cualidad (qué es) e intensidad (cuánto es)."}, {"q": "¿Qué modelo tridimensional postuló Wundt para clasificar los \"sentimientos\"?", "o": ["Fuerte/débil, claro/oscuro, rápido/lento.", "Placer/dolor, excitación/depresión, tensión/relajación.", "Pasado/presente/futuro."], "c": 1, "e": "Wundt define tres dimensiones del sentimiento: de agrado (placer/dolor), actividad (excitación/depresión) y expectativa temporal (tensión/relajación)."}, {"q": "Cuando los elementos mentales básicos se unen y forman una totalidad nueva e innovadora, que no es simple suma de sus partes, ocurre lo que Wundt llamó:", "o": ["Intencionalidad.", "Síntesis creadora.", "Ley de Weber."], "c": 1, "e": "La \"síntesis creadora\" une los materiales de forma que resulta una unidad vivencial totalmente nueva y única cada vez."}, {"q": "¿Qué término wundtiano describe el proceso mental cuando una representación se sitúa en el centro de atención o foco de claridad de la conciencia?", "o": ["Introspección.", "Apercepción.", "Hermenéutica."], "c": 1, "e": "Cuando una representación está en la zona de mayor claridad de la conciencia y está siendo plenamente atendida, se da la \"apercepción\"."}, {"q": "La ley propuesta por Wundt según la cual al alcanzar un objetivo, la voluntad se orienta dinámicamente hacia uno nuevo en un ciclo continuo, se llama:", "o": ["Ley de herencia mendeliana.", "Ley del efecto reflejo.", "Ley de heterogénesis de los fines."], "c": 2, "e": "Resumió la organización volitiva en la \"ley de heterogénesis de los fines\", donde se van generando nuevas metas al cumplir las previas."}, {"q": "Según Wundt, frente a la \"causalidad eficiente\" propia de las ciencias físicas puras, la psicología opera bajo una \"causalidad psíquica\" hecha de:", "o": ["Átomos materiales inmutables.", "Motivos y consecuencias entre representaciones y fines.", "Impulsos eléctricos cerebrales."], "c": 1, "e": "La causalidad psicológica tiene lugar en la subjetividad, organizada por \"motivos y consecuencias\" ligadas a metas."}, {"q": "Para estudiar procesos superiores como los mitos, el lenguaje o las costumbres colectivas, Wundt diseñó una segunda gran rama disciplinar llamada:", "o": ["Psicología de los pueblos (Völkerpsychologie).", "Frenología social.", "Psicoanálisis de masas."], "c": 0, "e": "Completó su psicología experimental con la \"Psicología de los pueblos\" (1900-1920) para procesos de índole social colectiva."}, {"q": "En la \"Psicología de los pueblos\", Wundt sostenía que la metodología adecuada para abordarla NO era la fisiológico-experimental, sino:", "o": ["Los estudios con gemelos homocigóticos de Galton.", "Los métodos de la etnología y la antropología.", "La disección anatómica."], "c": 1, "e": "Afirmó expresamente que las técnicas del laboratorio no tenían aplicación aquí, recurriendo a los métodos de etnología y antropología histórica."}, {"q": "El método propio de la psicología experimental de Leipzig consistía en aplicar estrictos controles a la capacidad humana de informar de estados simples. ¿Cómo se conoce esta técnica?", "o": ["Extrospección etológica.", "Introspección (u observación interior) controlada.", "Hipnosis profunda regresiva."], "c": 1, "e": "El método utiliza la información de la experiencia subjetiva mediante \"introspección\", limitada por Wundt a procesos muy simples para evitar asociaciones libres."}, {"q": "¿Quién fue el brillante psicólogo inglés, asentado en la Universidad de Cornell (EE. UU.), que promovió y continuó el sistema \"Estructuralista\" puro de Wundt?", "o": ["Edward B. Titchener.", "William James.", "John B. Watson."], "c": 0, "e": "Titchener (1867-1927) fue uno de los profundos conocedores del sistema que, desde EE. UU., promovió el modelo del maestro sin grandes modificaciones."}, {"q": "¿A quién de sus contemporáneos o inmediatos seguidores influyó notablemente la \"Psicología de los pueblos\" citando las obras de Wundt?", "o": ["A Sigmund Freud, en sus obras antropológicas.", "A Ivan Pavlov en el condicionamiento animal.", "A Hermann Ebbinghaus en sus curvas de memoria."], "c": 0, "e": "El texto destaca como curiosidad que la obra sociológica de Wundt tuvo pocos continuadores directos, pero Sigmund Freud recogió sus ideas y lo citó."}, {"q": "Las investigaciones post-wundtianas (como las de Oswald Külpe o Hermann Ebbinghaus) rompieron reglas del maestro en Leipzig al atreverse a aplicar experimentación en:", "o": ["Los tiempos de reacción motores de animales simples.", "Procesos mentales superiores complejos (como el pensamiento o la memoria).", "Las emociones básicas sin sentido."], "c": 1, "e": "Wundt rechazaba experimentalmente estos temas, pero Külpe (pensamiento) y Ebbinghaus (memoria) iniciaron su estudio empírico rompiendo esa limitación."}, {"q": "En 1874, Franz Brentano publicó una influyente obra que fundó la llamada:", "o": ["Psicología de los actos involuntarios medulares.", "Psicología del acto intencional.", "Psicología diferencial del talento."], "c": 1, "e": "Brentano propuso que no interesan tanto los \"contenidos\" estáticos como los \"actos mentales\" mediante la psicología del acto intencional."}, {"q": "Para Brentano, la cualidad esencial definitoria de los fenómenos psíquicos (frente a los físicos) es:", "o": ["Su materialidad celular y peso medible.", "La intencionalidad o referencia intencional.", "Que son todos actos inconscientes ciegos."], "c": 1, "e": "Brentano dice que la característica fundamental es la \"intencionalidad\" (el acto donde el sujeto está abierto o referido hacia un objeto)."}, {"q": "Según el concepto brentaniano, \"yo recuerdo un viaje\" describe una estructura intencional constituida por:", "o": ["Un estímulo nervioso puramente físico sin contenido psicológico.", "Un acto subjetivo referido a un contenido, objeto u representación ante el sujeto.", "Una síntesis creadora irracional."], "c": 1, "e": "Un fenómeno psíquico es un \"acto\" (el recordar) de un sujeto donde se da un contenido o referente (el viaje pasado)."}, {"q": "Brentano divide los actos intencionales en tres clases primordiales. ¿Cuáles son?", "o": ["Reflejos, percepciones inconscientes e impulsos.", "Memoria a corto plazo, memoria a largo plazo y atención voluntaria.", "Representaciones, actos de juicio (afirmar/negar) y actos de amor u odio (afectivos)."], "c": 2, "e": "Distingue la presentación (representación), los de afirmar/negar activamente (juicio) y donde valoramos emocionalmente (amor y odio)."}, {"q": "Discípulo directo de Brentano que recogió y radicalizó sus ideas de la conciencia intencional para fundar el movimiento filosófico de la \"Fenomenología\":", "o": ["Edmund Husserl.", "José Ortega y Gasset.", "Wilhelm Wundt."], "c": 0, "e": "Edmund Husserl fue alumno de Brentano y fundó la fenomenología basándose en que la conciencia intencional constituye \"mi mundo\"."}, {"q": "El profesor de la Universidad de Berlín, Wilhelm Dilthey, propuso ubicar a la psicología no como ciencia natural, sino en la base de:", "o": ["Las matemáticas puras.", "Las \"ciencias del espíritu\" (historia, filología, economía...).", "La física cuántica teórica."], "c": 1, "e": "Dilthey impulsó el movimiento desde \"las ciencias del espíritu\", orientadas a hechos que poseen un \"sentido\" o un \"valor\" humano profundo."}, {"q": "Según Dilthey, frente a los meros objetos de la ciencia natural que son física y descriptivamente \"ciegos\", los fenómenos psicológicos e históricos se caracterizan por tener siempre:", "o": ["Estructura atómica.", "Peso y volumen.", "Sentido y valor (son buenos, útiles, legítimos, etc.)."], "c": 2, "e": "Destaca que las disciplinas del espíritu estudian hechos (acciones de hombres) caracterizados por albergar un \"sentido\" subjetivo y un \"valor\"."}, {"q": "Para diferenciar la metodología epistemológica de las ramas del saber, Dilthey usó dos palabras alemanas esenciales. Afirmó que la ciencia natural se dedica a \"explicar\" (Erklären) leyes causales hipotéticas, mientras que la psicología histórica se dedica a:", "o": ["\"Experimentar\" (Experimentieren).", "\"Comprender\" o captar el sentido (Verstehen).", "\"Medir\" (Messen)."], "c": 1, "e": "La \"comprensión\" (verstehen) es ver vivencialmente la conexión evidente de sentido (como entre una pregunta y la respuesta), frente a explicaciones hipotéticas naturales."}, {"q": "Ante el proyecto experimental estructuralista, Wilhelm Dilthey opinaba que en la vida psíquica:", "o": ["Se debía aplicar ciegamente el atomismo o elementalismo wundtiano a toda costa.", "Había que rechazar enérgicamente el atomismo, pues la vida mental está dada previamente como un \"todo\" unitario o complexión global no sumarizada.", "Todo se resolvía mediante el hallazgo de la constante de Weber táctil."], "c": 1, "e": "Dilthey se opuso fuertemente al elementalismo o atomismo de Wundt argumentando que la vida psíquica se experimenta como una unidad o todo interconectado, del cual inferimos partes de \"arriba a abajo\"."}, {"q": "Analizando la estructura unitaria de la conciencia comprensiva, Dilthey distingue \"representaciones\", \"afectos\" y un tercer elemento que toma decisiones organizadas:", "o": ["Logaritmos psicofísicos.", "Instintos animales Darwinianos básicos.", "Voliciones (orientadas a metas y resultados)."], "c": 2, "e": "Clasifica los aspectos indisolubles del todo vital en representaciones, afectos e impulsos orientados a realizar decisiones que denomina voliciones."}, {"q": "Para entender por qué los humanos operan como lo hacen, Dilthey postula que los actos de la conciencia y su valoración dependen de la matriz socio-histórica llamada:", "o": ["Cosmovisión (Weltanschauung).", "El umbral absoluto invariante universal.", "El inconsciente colectivo biológico inmutable."], "c": 0, "e": "Defendió el carácter netamente histórico del sujeto humano, cuyas creencias derivan de las visiones del mundo impuestas socialmente en su época (Weltanschauung)."}, {"q": "El discípulo de Dilthey, Eduard Spranger (1882-1963), elaboró una célebre clasificación basada en esta idea comprensiva de los valores, generando una:", "o": ["Tipología psicológica de valores (hombre teorético, económico, estético, político, religioso).", "Curva normal del genio hereditario para selección biológica.", "Teoría sobre las sinapsis cerebrales y neuronas motoras."], "c": 0, "e": "Spranger derivó una \"tipología\" de hombres según los valores vitales predominantes estructurados históricamente en sus motivos vitales."}, {"q": "Definición técnica clave: El evolucionismo biológico decimonónico se erigió y definió en frontal oposición conceptual a las viejas concepciones dogmáticas biológicas llamadas:", "o": ["Intencionalistas.", "Dualistas.", "\"Fixistas\" (que asumían creación inicial estática e invariable de especies)."], "c": 2, "e": "El anexo de conceptos subraya que el Evolucionismo rechaza tajantemente las posturas \"fixistas\" como las de Linneo sobre la inmutabilidad absoluta y fija de especies creadas."}, {"q": "Según la resolución aportada por la \"Autocomprobación\" final, el hecho fundamental de Darwin para explicar variaciones dentro de una raza no dependía de conocer la genética actual (que ignoraba), sino de asumir que dichas variaciones:", "o": ["Eran un esfuerzo volitivo o deseo consciente puramente Lamarckiano de adaptación física (ej. querer alas).", "Se producían \"espontáneamente\" y su heredabilidad era constatable pragmáticamente observando animales criados en rebaño y plantas.", "Nunca podían trasladarse de una flor estéril a sus supuestos descendientes genéticos artificiales."], "c": 1, "e": "El anexo de comprobación afirma que, desconociendo la mutación molecular genética que llegaría después, Darwin sí constató empiristamente la aparición espontánea evidente y heredable de estas ventajas con la cría animal."}, {"q": "En los anexos de conceptos, la definición profunda de \"Experiencia Mediata\" en la teoría del conocimiento de Wundt implica epistemológicamente:", "o": ["Considerar únicamente las asociaciones verbales a corto plazo registradas en papel y lápiz en menos de medio segundo.", "El procedimiento mediante el cual todas las ciencias puras observan la experiencia \"abstráyéndose de\" o eliminando del relato al propio sujeto perceptor humano que la vive.", "La metodología obligatoria que emplea la frenología clásica para inferir protuberancias dudosas en las cejas de genios."], "c": 1, "e": "Wundt asume que aislar el dato desatendiendo o prescindiendo analíticamente del Yo que lo vive es generar la experiencia \"mediata\" física genérica."}, {"q": "Como resolución de la Autocomprobación sobre Galton, el grado estadístico de \"covariación\" o correlación obtenido en sus test con gemelos idénticos comparado con individuos carentes de relación sanguínea, demostró concluyentemente:", "o": ["Un valor inmenso en gemelos e irrisorio en extraños, confirmando la supremacía hereditaria sobre el puro entrenamiento medioambiental social para él.", "Que las semejanzas físicas evidentes no influyen jamás en paralelos aptitudinales cognitivos ni emocionales demostrables en gabinete empírico.", "Que la dotación económica escolar anula todos los cromosomas del talento personal heredado sin excepción metodológica posible en su modelo."], "c": 0, "e": "La sección final recalca como \"solución\" que encontrar una correlación elevadísima en pares idénticos contra niveles paupérrimos en genéticas inconexas, fue interpretado como predominancia innatista total por Galton."}, {"q": "Sintéticamente, la disciplina psicofísica se interesó especialmente en el diseño de dos clases genéricas de investigación: una cualitativa o de \"energías de las vías sensoriales\" (Johannes Müller) y otra netamente Cuantitativa matemática, iniciada en Leipzig por:", "o": ["Charles Darwin y Auguste Comte trabajando juntos en barcos zoológicos y hospitales parisienses.", "Ernst H. Weber indagando las proporciones incrementales de sensibilidad en pesajes cutáneos y presiones sobre la epidermis, seguido por Fechner.", "Wilhelm Wundt en su magna obra tardía de mitología y etnografía titulada Volkerpsychologie (sic) social abstracta comparativa."], "c": 1, "e": "Los conceptos asientan a Müller en el apartado psicofísico cualitativo, mientras que la verdadera matematización y cuantificación de estímulos proporcionales arranca en manos de Weber (en el tacto corporal) hasta Fechner."}, {"q": "El epílogo del documento señala que el progresivo avance en el análisis biológico decimonónico posibilitó que la psicología interpretara a la Mente del hombre de la siguiente manera:", "o": ["Como un alma mística insondable caída en el dualismo estricto de las ideas platónicas inmodificables.", "Como una tabla rasa absolutamente inactiva que es grabada pasivamente por los hechos físicos del campo de fuerzas mecanicista de Newton únicamente y por completo.", "Como un sofisticado sistema orgánico biológico activo posibilitado genéticamente, cuya función y despliegue final teleológico vital supremo es favorecer al individuo adaptándose flexiblemente a su medio en cambio perenne."], "c": 2, "e": "El colofón señala repetidamente que gracias al evolucionismo darwiniano y la ciencia experimental asimilada, la \"vida\" y la conciencia del individuo dejan de verse dogmáticamente y son reinterpretadas naturalísticamente como el máximo mecanismo o sistema biológico flexible puesto al servicio de un \"proceso de adaptación de un organismo a su medio\"."}];
let questions=[...originalQuestions],current=0,score=0,missed=[],retryMode=false;

function loadQuestion(){
let q=questions[current];
document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='La Psicología del Siglo XIX: positivismo, psicofísica, evolucionismo, Galton, Wundt, Brentano y Dilthey.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
