<script>
const originalQuestions=[{"q": "1. Según el texto, ¿qué finalidad básica tiene el conocimiento para el ser humano?", "o": ["Únicamente lograr fama y reconocimiento intelectual.", "Adaptarse a su mundo, proyectar su vida y saber a qué atenerse.", "Desarrollar teorías abstractas sin utilidad práctica."], "c": 1, "e": "El conocimiento es un instrumento esencial que permite al hombre adaptarse a su mundo y planificar sus actos [1, 2]."}, {"q": "2. ¿Qué pensador de la antigua Grecia diferenció cinco tipos básicos de conocimiento?", "o": ["Sócrates.", "Platón.", "Aristóteles."], "c": 2, "e": "Aristóteles (s. IV a. C.) diferenció la experiencia, arte, ciencia, sabiduría e intuición [3]."}, {"q": "3. Según Aristóteles, ¿qué caracteriza al grado de conocimiento denominado \"arte o técnica\" (tékhne)?", "o": ["Conocer las causas últimas de la realidad.", "Saber hacer cosas concretas basándose en recetas y experiencia acumulada.", "Captar el orden de la naturaleza mediante visiones unitarias."], "c": 1, "e": "El arte o técnica permite saber hacer cosas concretas (un trabajo manual, un remedio) basado en la experiencia [4]."}, {"q": "4. A diferencia de la técnica, ¿qué supone alcanzar el nivel de la ciencia (epistéme)?", "o": ["Un conocimiento empírico sin estructurar.", "El conocimiento de las causas y los factores que controlan y regulan un fenómeno.", "La experiencia basada en emociones y construcciones imaginarias."], "c": 1, "e": "La ciencia es \"saber por qué\", conociendo los factores y circunstancias causales que determinan un fenómeno [4]."}, {"q": "5. ¿Cómo concibe la ciencia el conocimiento de los fenómenos?", "o": ["Como un conjunto de hechos aislados sin conexión causal.", "Como representaciones aplicables solo a casos individuales y excepcionales.", "Estableciendo relaciones de dependencia (causalidad funcional) formulables en conceptos generales."], "c": 2, "e": "Un conocimiento científico trata de establecer relaciones de dependencia o causalidad funcional mediante conceptos [5, 6]."}, {"q": "6. ¿Qué formuló John Stuart Mill respecto al establecimiento de causalidad (\"A\" es causa de \"B\")?", "o": ["Tres tablas o reglas básicas: presencias, ausencias y variaciones concomitantes.", "El método introspectivo y las leyes de la asociación.", "La separación estricta entre mente y cuerpo."], "c": 0, "e": "Mill estableció que para afirmar causa deben cumplirse las relaciones en la tabla de presencias, ausencias y variaciones concomitantes [6, 7]."}, {"q": "7. Según la regla de ausencias de Stuart Mill, si \"A\" es verdaderamente causa de \"B\":", "o": ["Cuando falta \"A\", \"B\" puede seguir apareciendo esporádicamente.", "Cuando falta \"A\", entonces nunca debe aparecer \"B\".", "Si no está \"A\", \"B\" aumenta en intensidad."], "c": 1, "e": "La tabla de ausencias dicta que cuando falte la causa \"A\", nunca debe aparecer el efecto \"B\" [7]."}, {"q": "8. Tener una visión científica de un campo significa poder hacer primariamente dos operaciones ante un fenómeno X:", "o": ["Intuir y contemplar.", "Explicar (causas) y predecir (efectos).", "Narrar e historiar."], "c": 1, "e": "Supone conocer el orden causal para poder explicar cuáles han sido sus causas y predecir cuáles van a ser sus efectos [8]."}, {"q": "9. ¿A qué filósofo se le atribuye la frase positivista \"saber para prever y prever para poder\"?", "o": ["Aristóteles.", "John Stuart Mill.", "Auguste Comte."], "c": 2, "e": "Fue formulada por Comte a principios del s. XIX resumiendo la relación entre ciencia, predicción y control técnico [9]."}, {"q": "10. ¿Cuál es el origen etimológico de la palabra \"método\"?", "o": ["Del griego lógos y epistéme.", "Del griego metá (\"más allá\", según) y hódos (\"camino\").", "Del latín ancilla (\"sierva\") y theologiae."], "c": 1, "e": "Método viene de metá y hódos, y Platón lo definió como \"el camino que lleva al saber\" [10]."}, {"q": "11. ¿En qué consiste el método analítico?", "o": ["Une informaciones dispersas buscando asociación de elementos.", "Va de lo general a lo particular deductivamente.", "Parte de un conocimiento complejo y procura separar sus elementos constituyentes."], "c": 2, "e": "El analítico separa elementos para saber cómo algo está compuesto, a diferencia del sintético que une información [10, 11]."}, {"q": "12. El método que ha hecho posible los grandes avances científicos combinando inducción y deducción es:", "o": ["El método filosófico introspectivo.", "El método hipotético-deductivo.", "El paradigma conductista exclusivo."], "c": 1, "e": "El método hipotético-deductivo combina la inducción empírica y la deducción teórica [12]."}, {"q": "13. En el método hipotético-deductivo, un \"experimento crucial\" sirve para:", "o": ["Dilucidar entre la validez o falsedad de un modelo teórico.", "Encontrar el \"punto de unicidad\" del paciente en clínica.", "Abandonar completamente la observación de hechos."], "c": 0, "e": "En ocasiones, el experimento permite decidir definitivamente si un modelo es válido o falso (experimento crucial) [12]."}, {"q": "14. ¿De dónde surge históricamente el conocimiento científico (epistéme)?", "o": ["De las profecías y revelaciones babilónicas.", "En Grecia, dentro del campo de la filosofía, sustituyendo interpretaciones religiosas.", "En la Edad Media, producto de la escolástica cristiana."], "c": 1, "e": "Surge en Grecia al sustituir la fe en las revelaciones religiosas por nuevas creencias racionales filosóficas [13, 14]."}, {"q": "15. Para los pensadores griegos, el principio orgánico originador que explica las propiedades de las cosas se llamaba:", "o": ["Epistéme.", "Lógos.", "Arkhé (vinculado a la physis)."], "c": 2, "e": "Creían en una naturaleza (physis) que es el \"principio\" o arkhé que genera las cosas y explica sus propiedades [15]."}, {"q": "16. ¿Qué rol asumió la filosofía, y por ende la ciencia, durante el comienzo de la Edad Media?", "o": ["Se orientó exclusivamente al ateísmo experimental.", "Se convirtió en \"sierva de la teología\" (ancilla theologiae) y priorizó el conocimiento del Ser Divino.", "Recuperó plenamente el paradigma aristotélico original sin influencia religiosa."], "c": 1, "e": "En la Edad Media se convirtió en sierva de la teología, limitando enormemente el saber científico [16]."}, {"q": "17. ¿Qué característica fundamental diferencia a la ciencia \"antigua\" de la \"moderna\"?", "o": ["La antigua busca conocer \"esencias\" interiores; la moderna se atiene a \"leyes fenoménicas\".", "La antigua construye modelos matemáticos abstractos; la moderna es puramente descriptiva.", "La antigua aspira al dominio técnico, mientras la moderna es especulativa."], "c": 0, "e": "La antigua cree que el principio natural es la esencia; la moderna renuncia a ello y estudia descriptivamente leyes fenoménicas [17]."}, {"q": "18. La ciencia antigua empleaba una metodología predominantemente:", "o": ["Deductiva, cuantitativa y matemática.", "Inductiva, empirista, descriptiva y cualitativa.", "Centrada en el paradigma del ordenador."], "c": 1, "e": "Fue fundamentalmente inductiva, empirista, descriptiva y cualitativa buscando esencias a través de cosas concretas [17]."}, {"q": "19. Respecto a su aplicación práctica, la nueva ciencia moderna surge con la pretensión de:", "o": ["Crear técnicas para controlar, dominar y transformar la naturaleza.", "Ser un saber totalmente \"inútil\" y meramente contemplativo.", "Justificar teológicamente el orden del mundo medieval."], "c": 0, "e": "Surge pretendiendo no solo hacer teoría, sino crear técnica para aplicar leyes, controlar y transformar la naturaleza [18]."}, {"q": "20. ¿Qué importante psicólogo enunció que la psicología tiene \"un largo pasado, pero una corta historia\"?", "o": ["Wilhelm Wundt.", "John B. Watson.", "Hermann Ebbinghaus."], "c": 2, "e": "Fue Hermann Ebbinghaus quien dijo esta famosa frase para diferenciar la psicología filosófica de la nueva científica [19]."}, {"q": "21. ¿Qué se entiende por la \"corta historia\" de la psicología según Ebbinghaus?", "o": ["El saber acumulado en la antigua Grecia.", "Los descubrimientos literarios sobre la mente de Shakespeare y Cervantes.", "La nueva disciplina científica moderna iniciada a fines del s. XIX."], "c": 2, "e": "La historia corta refiere a la fundación de la ciencia moderna de los fenómenos psíquicos y sus leyes, datando su inicio hacia 1879 [20, 21]."}, {"q": "22. ¿Quién fundó el primer laboratorio experimental de psicología en Leipzig (1879)?", "o": ["Wilhelm Wundt.", "Auguste Comte.", "René Descartes."], "c": 0, "e": "El texto marca el inicio de la ciencia psicológica con la fundación del laboratorio en Leipzig por Wilhelm Wundt en 1879 [21]."}, {"q": "23. ¿Por qué las geniales descripciones psicológicas del teatro de Shakespeare o las novelas de Cervantes no equivalen a la psicología científica?", "o": ["Porque están mal escritas.", "Porque el saber literario no establece relaciones causales y funcionales rigurosas.", "Porque pertenecen al periodo de la Edad Media escolástica."], "c": 1, "e": "La ciencia busca relaciones funcionales, metodológicas y precisas para prever y controlar, algo que el valioso arte descriptivo no hace estrictamente [21, 22]."}, {"q": "24. El historiador de la ciencia que formuló la idea del desarrollo científico como una \"sucesión de paradigmas\" fue:", "o": ["John Stuart Mill.", "Thomas Kuhn.", "Charles Darwin."], "c": 1, "e": "Thomas Kuhn formuló la idea de que la ciencia evoluciona mediante paradigmas que se van sustituyendo [23-25]."}, {"q": "25. Un paradigma astronómico clásico que situaba a la Tierra en el centro y fue posteriormente sustituido fue el:", "o": ["Paradigma heliocéntrico o copernicano.", "Paradigma ptolemaico o geocéntrico.", "Paradigma galileano."], "c": 1, "e": "El paradigma geocéntrico de Ptolomeo mantenía la Tierra en el centro, y fue sustituido por el heliocéntrico de Copérnico [24]."}, {"q": "26. Según Kuhn, ¿qué es una \"matriz disciplinar\"?", "o": ["Un listado matemático usado exclusivamente por los escolásticos.", "Un conjunto de elementos (conceptos, valores, técnicas y problemas tipo) que la comunidad comparte.", "El rechazo definitivo a emplear la experimentación cuantitativa."], "c": 1, "e": "Es el conjunto de problemas resueltos, conceptos, técnicas e interpretaciones compartidos por una comunidad científica [26, 27]."}, {"q": "27. El proceso mediante el cual se resuelven nuevas cuestiones manteniendo el mismo paradigma vigente se denomina:", "o": ["Falsación ontológica.", "Ciencia normal.", "Revolución científica."], "c": 1, "e": "Kuhn llama \"ciencia normal\" al desarrollo acumulativo y resolución de problemas usando las bases del paradigma actual [28, 29]."}, {"q": "28. ¿Cuándo ocurre, según Kuhn, una \"revolución científica\"?", "o": ["Cuando el paradigma vigente logra explicar todas las anomalías observadas.", "Cuando aparece un nuevo modelo capaz de explicar los problemas no resueltos por el anterior, además de conservar sus aciertos.", "Cuando una disciplina abandona la investigación y retorna a la técnica empírica."], "c": 1, "e": "Ocurre cuando un modelo alternativo sustituye al viejo resolviendo tanto las antiguas cuestiones como las nuevas anomalías insalvables [28, 30]."}, {"q": "29. ¿Qué investigador postuló un paradigma \"fixista\" en biología basado en catástrofes para explicar los fósiles?", "o": ["Charles Darwin.", "Jean-Baptiste de Lamarck.", "Georges Cuvier."], "c": 2, "e": "Cuvier explicaba los fósiles como resultado de catástrofes y creía que las especies permanecían fijas, sin evolución [31]."}, {"q": "30. La historia de la psicología se puede agrupar en etapas según dos variables principales, que son:", "o": ["El objeto de estudio y el método empleado (filosófico o científico).", "La religión dominante y la geografía.", "El número de psicólogos colegiados y la tecnología de ordenadores."], "c": 0, "e": "Se diferencian básicamente en razón de su \"objeto\" y del \"método\" empleado para conocerlo [32, 33]."}, {"q": "31. ¿Cuál es el objeto central en la primera etapa de la psicología, que va de Platón al siglo XVI?", "o": ["La conducta pública observable.", "El alma o psique concebida como sustancia vital.", "Los procesos cognitivos latentes."], "c": 1, "e": "Es la etapa de la psicología del alma, concebida como sustancia que da vida y capacidades [34, 35]."}, {"q": "32. El representante clásico del surgimiento de \"la psicología filosófica de la mente\" y el dualismo psicofísico en la Edad Moderna fue:", "o": ["Thomas Kuhn.", "Luis Vives.", "René Descartes."], "c": 2, "e": "Descartes, en el siglo XV (inicio modernidad), definió la \"sustancia pensante\" frente a la \"sustancia extensa\" [36]."}, {"q": "33. La tercera etapa, \"La psicología científica de la mente\", rompe con la anterior al:", "o": ["Eliminar la búsqueda de esencias filosóficas para adoptar métodos cuantitativos y buscar leyes de fenómenos.", "Recuperar a Aristóteles como máxima autoridad experimental.", "Centrarse únicamente en reflejos musculares descartando cualquier experiencia subjetiva consciente."], "c": 0, "e": "Aplica los conceptos de la ciencia moderna (fenomenismo, sin esencias, cuantitativo) a las capacidades de la conciencia humana [37, 38]."}, {"q": "34. En la etapa de la psicología científica de la mente, ¿qué principal fuente de datos generó problemas por su carácter subjetivo?", "o": ["Las estadísticas biométricas poblacionales.", "La información introspectiva (observación interior).", "Los fósiles humanos de Cuvier."], "c": 1, "e": "Se usó ampliamente la información introspectiva, lo que, al no ser públicamente observable, forzó la transición a métodos más objetivos [39]."}, {"q": "35. En busca de un objeto observable y medible públicamente, surgió la etapa de la \"psicología de la conducta\". ¿Quién fue su principal promotor?", "o": ["Sigmund Freud.", "John B. Watson.", "Hermann Ebbinghaus."], "c": 1, "e": "Watson, fundador del conductismo a principios del s. XX, propuso centrarse en lo que el organismo hace o dice [40]."}, {"q": "36. Watson definió el objeto de la psicología reduciendo la conducta a un esquema que frecuentemente se conoce como:", "o": ["Paradigma Ancilla-Theologiae.", "Paradigma E-R (Estímulo-Respuesta).", "Paradigma Mente-Cuerpo."], "c": 1, "e": "Redujo la conducta a un entramado de estímulos y respuestas, originando el paradigma \"E\"-\"R\" [40]."}, {"q": "37. ¿Qué limitación principal obligó a trascender el conductismo estricto hacia una \"psicología de la mente y la conducta\"?", "o": ["Enfocarse solo en la \"periferia\" dejaba sin explicar procesos centrales, interpretativos e intencionales no observables.", "La falta de instrumentos estadísticos para medir los estímulos en humanos.", "El abandono de los presupuestos metafísicos sobre la inmortalidad del alma."], "c": 0, "e": "Al mirar solo la periferia, se ignoraban los procesos latentes, planes y propósitos que determinan las respuestas manifiestas [41, 42]."}, {"q": "38. Según el texto, un fenómeno como el \"sentido\" de un artículo traducido o actitudes sociales como la \"xenofobia\" demuestran que:", "o": ["Todo se resuelve mediante análisis estímulo-respuesta reflejo puro.", "Existen procesos centrales y dimensiones experienciales latentes que no son directamente observables desde la periferia.", "El método introspectivo no sirve para nada en absoluto."], "c": 1, "e": "Demuestran que la conducta manifiesta implica procesos centrales, vivencias del hablante y actitudes latentes determinantes [43, 44]."}, {"q": "39. ¿Qué campo disciplinar influyó notablemente en el desarrollo de la etapa cognitiva, comparando el procesamiento de datos con el psiquismo humano?", "o": ["La paleontología.", "La cibernética y la computación.", "La geometría no euclidiana."], "c": 1, "e": "La cibernética hizo ver que las respuestas dependen de \"programas\", impulsando la comprensión cognitiva de planes y procesamientos [42]."}, {"q": "40. El paradigma predominante hoy en día, que recupera el análisis de los planes y procesos centrales humanos, recibe el nombre principal de:", "o": ["Conductismo radical.", "Psicología cognitiva.", "Psicología fenomenológica esencial."], "c": 1, "e": "La psicología cognitiva (surgida hacia 1960) integra mente y conducta y representa el nivel de la mayoría de las investigaciones actuales [45]."}, {"q": "41. La psicología moderna nació con la pretensión doble de:", "o": ["Describir el pasado histórico y rezar a las deidades.", "Interpretar teóricamente y controlar técnicamente las situaciones.", "Aislar al individuo del marco de su sociedad civil."], "c": 1, "e": "Busca tanto teoría como técnica aplicada para mejorar bienestar y adaptación [45-47]."}, {"q": "42. Un componente clave que define sociológicamente el concepto de \"profesión\" es:", "o": ["Se ejerce de manera fortuita, sin necesidad de formación ni reglas.", "El desempeño de un rol basado en capacitación reconocida que justifica retribución.", "La negación de toda contraprestación económica por cuestiones éticas."], "c": 1, "e": "Es una función social basada en capacitación previa (facultad) que otorga rol y retribución social reconocida [48]."}, {"q": "43. Para proteger a los ciudadanos y al especialista, las profesiones reguladas combaten la realización de tareas propias por parte de individuos sin titulación oficial. A esto se le denomina:", "o": ["Buena praxis.", "Intrusismo laboral.", "Matriz disciplinar."], "c": 1, "e": "El colegio combate el intrusismo laboral, donde individuos sin titulación realizan actividades de la profesión [49, 50]."}, {"q": "44. A qué psicólogo le solicitó el gobierno francés un instrumento para discriminar alumnos que requerirían educación especial?", "o": ["Théodore Simon.", "Alfred Binet.", "Lightner Witmer."], "c": 1, "e": "Binet, junto con Simon, recibió el encargo y generó en 1905 la primera escala métrica de la inteligencia [51]."}, {"q": "45. La creación de la \"escala métrica de la inteligencia\" de 1905 es fruto del surgimiento de necesidades sociales en el ámbito de:", "o": ["La selección de reclutas para la Primera Guerra Mundial.", "La enseñanza escolar primaria obligatoria en Francia.", "Los juicios penales para diagnosticar la veracidad de testimonios."], "c": 1, "e": "Surgió cuando la enseñanza primaria se volvió obligatoria y los maestros necesitaban identificar retrasos en el aprendizaje [51]."}, {"q": "46. ¿A quién se atribuye la apertura de la primera clínica psicológica en EE. UU. en 1896, resolviendo un caso de trastorno de lectura?", "o": ["Édouard Claparède.", "John B. Watson.", "Lightner Witmer."], "c": 2, "e": "Witmer trató un caso de dislexia en Pensilvania e inauguró el ámbito clínico aplicado [52]."}, {"q": "47. Antes de la I Guerra Mundial, las tres grandes áreas aplicadas que se comenzaron a perfilar en la psicología fueron:", "o": ["Educativa, clínica e industrial (del trabajo).", "Cognitiva, introspectiva y experimental animal.", "Jurídica, de la publicidad y deportiva exclusivamente."], "c": 0, "e": "Con Binet, Witmer y la selección de tranvías, se dibujaron las áreas educativa, clínica e industrial/del trabajo [52]."}, {"q": "48. ¿Qué evento histórico global impulsó dramáticamente el uso de test para selección de especialistas y tratamiento de traumas, acelerando la profesionalización?", "o": ["La Revolución Industrial Francesa del s. XVIII.", "La Primera Guerra Mundial (1914-1918).", "La llegada del hombre a la luna en 1969."], "c": 1, "e": "La guerra impulsó el uso técnico de la psicología para seleccionar combatientes y tratar afecciones traumáticas [53]."}, {"q": "49. En 1920 se creó en Ginebra la Sociedad Internacional de Psicotecnia, gracias al psicólogo suizo:", "o": ["Emilio Mira y López.", "Théodore Simon.", "Édouard Claparède."], "c": 2, "e": "Claparède promovió esta sociedad enfocada en psicotecnia y estandarización de test a nivel internacional [54]."}, {"q": "50. ¿Qué siglas se corresponden con la actual Unión Internacional de Ciencia Psicológica que engloba a los investigadores ante la UNESCO y la OMS?", "o": ["IUPsyS.", "IAAP.", "PIR."], "c": 0, "e": "La IUPsyS representa la ciencia a nivel internacional frente a grandes organizaciones mundiales [54]."}, {"q": "51. ¿En qué año se fundó la primera cátedra de psicología experimental en la Universidad de Madrid, España?", "o": ["1879.", "1902.", "1968."], "c": 1, "e": "La primera cátedra experimental se establece en Madrid en 1902 [55]."}, {"q": "52. Una figura fundamental que dirigió el temprano Instituto de Orientación Profesional en Barcelona en 1918 fue:", "o": ["Emilio Mira y López.", "Hermann Ebbinghaus.", "Lightner Witmer."], "c": 0, "e": "Mira y López es señalado como el director que propulsó la psicología aplicada desde dicho instituto [55]."}, {"q": "53. Antes de que existiera una licenciatura plena de psicología en España, en 1953 y 1962, ¿cómo se formaban los psicólogos?", "o": ["Cursando un módulo online obligatorio.", "Estudiando Filosofía Tomista en seminarios sin ninguna práctica.", "En Escuelas de Psicología universitarias como centro de posgrado (dos años de diploma)."], "c": 2, "e": "Titulados de otras carreras obtenían un diploma de posgrado en Escuelas de Psicología (Madrid '53, Barcelona '62) [56]."}, {"q": "54. La implantación definitiva de la licenciatura en psicología (primero dentro de facultades de letras) ocurre en España en el año:", "o": ["1968.", "1934.", "1998."], "c": 0, "e": "La llegada a la universidad como licenciatura reglada se produce en 1968 [57]."}, {"q": "55. ¿Cuándo se formalizó en España la colegiación mediante la fundación del Colegio Oficial de Psicólogos (COP)?", "o": ["En los primeros días de la II República (1931).", "Al final de 1979.", "Simultáneamente al Plan Bolonia en el siglo XXI."], "c": 1, "e": "El COP se fundó a finales de 1979 y luego en 2000 se reestructuró por autonomías [57]."}, {"q": "56. El sistema de residencia clínica especializado que otorga el diploma de psicólogo clínico (PIR) en España se consolidó en:", "o": ["1896, replicando el modelo de Witmer.", "1968, al mismo tiempo que la licenciatura.", "1998, vía cooperación Sanidad-Educación."], "c": 2, "e": "El título oficial de Psicólogo Especialista en Clínica (vía PIR) se establece desde 1998 [57]."}, {"q": "57. Conforme la psicología ha ido diversificándose, su aplicación a campos novedosos ha incluido áreas de alto impacto como:", "o": ["La frenología craneal y el mesmerismo astral.", "La física cuántica y las telecomunicaciones por hardware.", "El deporte, juzgados de familia, prisiones y hospitales."], "c": 2, "e": "El documento constata campos como psicología del deporte, asesoramiento jurídico, prisiones y salud [58]."}, {"q": "58. Un principio clave del método científico dictamina que las operaciones y los datos deben ser:", "o": ["Privados y reservados a eruditos.", "Públicos, objetivos y abiertos a replicación.", "Subjetivos y basados en dogmas institucionales."], "c": 1, "e": "En todos los pasos, la metodología exige datos públicos, unívocos y contrastables (replicables) [59]."}, {"q": "59. La idea de que toda ciencia (incluida la psicología) produce modelos interpretativos que son construcciones temporales dependientes de su época refleja el concepto de:", "o": ["Universalidad estática inalterable.", "Dogmatismo teológico medieval.", "Historicidad de la ciencia."], "c": 2, "e": "La historicidad implica que la ciencia crea modelos y paradigmas sujetos al tiempo histórico y posibles sustituciones [29, 60]."}, {"q": "60. ¿Cuál de los siguientes no es uno de los componentes de la \"matriz disciplinar\" descrita por Kuhn?", "o": ["El rechazo axiomático a formular leyes causales.", "Un problema-tipo que ha servido de modelo.", "Reglas operativas y métodos técnicos."], "c": 0, "e": "Sus elementos son el problema tipo, lo simbólico, las técnicas, problemas pendientes y la comunidad [25, 27, 61]."}, {"q": "61. Al inicio, la inteligencia en los test de Binet se conceptualizaba predictivamente como:", "o": ["La agudeza de visión y audición de un estudiante militar.", "La capacidad general de comprensión, invención, y ajuste a situaciones (éxito escolar).", "La velocidad de reflejos motores del individuo en clínica."], "c": 1, "e": "Binet evaluaba una capacidad general de comprensión, invención y solución de problemas ligada al ajuste social [62]."}, {"q": "62. Al surgir la ciencia moderna con Copérnico y Galileo, el enfoque epistémico varió desplazándose desde:", "o": ["Las descripciones fisiológicas anatómicas puras a la demonología teórica.", "La especulación cualitativa abstracta al control cuantitativo de fenómenos y a la técnica.", "El estudio riguroso de la physis aristotélica al método psicoanalítico."], "c": 1, "e": "Cambia del esencialismo inútil y especulativo antiguo al conocimiento simbólico matemático orientado a predecir y controlar [18, 63]."}, {"q": "63. Un profesional psicólogo está sujeto a un conjunto normativo moral formalizado que excluye malas prácticas, esto es:", "o": ["El manual diagnóstico DSM universal.", "El código deontológico o ético de la profesión.", "El principio de falsación de Popper."], "c": 1, "e": "Una característica esencial de toda profesión moderna es el sometimiento a un código moral/deontológico de buena praxis [64]."}, {"q": "64. Para comprobar la regla de Mill de \"variaciones concomitantes\", cuando la causa \"A\" aumenta:", "o": ["El efecto \"B\" debe mantenerse completamente neutro.", "El efecto \"B\" debe variar también de forma paralela u homotética (aumentando o disminuyendo en consecuencia).", "La variable interviniente desaparece de la observación."], "c": 1, "e": "\"B\" debe variar concomitantemente (aumentando o disminuyendo de manera paralela y ligada a la alteración de \"A\") [7]."}, {"q": "65. Cuando un psicólogo aborda la investigación de la \"memoria\" asumiendo que está condicionada biológicamente y por el entorno, emplea el encuadre de:", "o": ["La etapa 1: Alma antigua.", "La disciplina como ciencia natural de interrelaciones psicofísicas y contextuales.", "La etapa dogmática medieval teológica."], "c": 1, "e": "La psicología científica (etapas 3, 4 y 5) se interesa en la interdependencia con el cuerpo biofísico y el medio ambiente como ciencia natural [22, 38]."}, {"q": "66. \"Cualquier persona que ejerce habitualmente actividades psicológicas cobrando, pero carece del título reglado\", comete:", "o": ["Un error de tipo 1 metodológico.", "Intrusismo laboral que debe ser vigilado por su Colegio.", "Falsación experimental kuhniana."], "c": 1, "e": "El colegio combate la acción de intrusos carentes de titulación (intrusismo) [49, 65]."}, {"q": "67. Según la filosofía clásica (Aristóteles), tener la intuición (noûs) representaría:", "o": ["Una gran visión unitaria de la realidad propia de la cima filosófica.", "Saber construir herramientas agrícolas por costumbre heredada.", "Observar presencias de Stuart Mill visualmente."], "c": 0, "e": "La sabiduría y la intuición son el vértice aristotélico ligado a lo unificado y puramente filosófico superior a la ciencia causal concreta [5]."}, {"q": "68. En la actualidad investigadora en España, los estudios especializados de grado y postgrado tienen lugar en:", "o": ["Solo en dos escuelas de psicología (Madrid y Barcelona).", "Exclusivamente a través del PIR.", "En más de veinte universidades distribuidas por todo el Estado."], "c": 2, "e": "El texto indica que hay más de 20 universidades en España con multitud de investigadores, congresos y excelente vida científica actual [58]."}, {"q": "69. Cuando Binet diseñó su test en Francia buscaba clasificar tres tipos de escolares:", "o": ["Culpables, inocentes o dudosos judicialmente.", "Avanzados, normales y retrasados para el éxito académico.", "Introvertidos, extrovertidos e histéricos psiquiátricamente."], "c": 1, "e": "Se buscaba distinguir para el ritmo escolar a los alumnos normales, los muy dotados, y aquellos que serían \"retrasados\" en seguir las lecciones [52]."}, {"q": "70. El autor representativo de la etapa del Alma que la definió en la Antigüedad Clásica es:", "o": ["Hermann Ebbinghaus.", "Platón y posteriormente Aristóteles.", "Francis Bacon."], "c": 1, "e": "Autores como Platón y Aristóteles desde el siglo IV a. C. inician esta concepción sustancial [34]."}, {"q": "71. ¿A quiénes afectaba fundamentalmente la \"psicología filosófica de la mente\" de los siglos XV-XVIII?", "o": ["Descartes, racionalistas y empiristas ingleses.", "Pavlov, Skinner y Watson.", "Lamarck y Darwin exclusivamente."], "c": 0, "e": "Esa etapa la desarrollaron Descartes y los empiristas y racionalistas [37]."}, {"q": "72. La psicología cognitiva entiende que si el sujeto actúa como un ordenador procesando, ¿de qué depende la conducta final (además de los estímulos de entrada)?", "o": ["Exclusivamente del volumen cerebral craneal (frenología).", "De los programas, intenciones y procesos interpretativos mentales del individuo.", "Del arquetipo astral colectivo en la psique antigua."], "c": 1, "e": "Al igual que el ordenador usa un programa, el sujeto posee planes, representaciones y propósitos centrales internos [42]."}, {"q": "73. ¿Qué modelo causal sustituye a las \"esencias\" en la modernidad para poder hacer matemáticas precisas?", "o": ["El modelo de fe religiosa abstracta ciega.", "El modelo fenoménico basado en conocimientos o símbolos cuantitativos (hipótesis).", "Las tablillas clínicas astrológicas."], "c": 1, "e": "En lugar de esencias, se usan símbolos, números y modelos definidos para captar relaciones medibles en las leyes [63]."}, {"q": "74. El Instituto de Trabajo de 1920 que impulsó la psicología organizativa y selección de operarios europeos se situaba en la ciudad de:", "o": ["Madrid.", "Moscú.", "Londres."], "c": 1, "e": "El texto menciona explícitamente el Instituto del Trabajo fundado en Moscú en 1920 [53]."}, {"q": "75. En España, además de las ramas clínica y de salud, ha tenido especial auge en la orientación general moderna la titulación de:", "o": ["Filosofía escolástica superior exclusivamente.", "Psicopedagogía, paralela a la psicología educativa clásica.", "Parapsicología experimental."], "c": 1, "e": "Como diversificación paralela a la educativa, destaca el crecimiento del área especializada de psicopedagogía desde los 90s [57]."}, {"q": "76. Según la resolución de la actividad final del texto, si \"El medicamento HQ es eficaz destruyendo al virus V-2\", al disminuir la dosis HQ:", "o": ["Aumenta el nivel vital del virus V-2 (variación concomitante).", "El virus V-2 se evapora totalmente (ausencia milagrosa).", "Ocurre una anomalía heliocéntrica insalvable."], "c": 0, "e": "Por regla de la variación, al disminuir la causa \"HQ\", aumenta lógicamente la presencia de su opuesto, el \"V-2\" [66]."}, {"q": "77. Para poder afirmar el cumplimiento de la primera etapa general de investigación en ciencia natural moderna, un científico necesita:", "o": ["Una intuición pura mística sin base física.", "La observación, donde constatan empíricamente unos datos o hechos iniciales.", "Crear directamente la ley universal sin testearla."], "c": 1, "e": "El primer paso claro en la construcción de teoría hipotético-deductiva general es la observación o constatación de \"datos\" básicos de partida [59]."}, {"q": "78. \"Saber a qué atenerse respecto de lo que nos rodea\" define sociológicamente la meta primordial para:", "o": ["Un conocimiento sensible y posterior conocimiento vital general u ordinario.", "Solamente para el paradigma conductista estricto.", "Solo para quien ha realizado el examen del sistema PIR."], "c": 0, "e": "La primera necesidad general humana ante el mundo es adquirir conocimiento y representación mental, ya desde las formas más bajas, para planificar actos y adaptarse [1]."}, {"q": "79. La Asociación Internacional de Psicología Aplicada moderna (IAAP) provino históricamente de:", "o": ["La extinta sociedad de astrología escolástica.", "La Sociedad Internacional de Psicotecnia suiza de Claparède (1920).", "El Instituto Nacional de Psiquiatría del Reino Unido (1921)."], "c": 1, "e": "La IAAP desciende directamente de aquella iniciativa suiza primigenia de psicotecnia de 1920 de Édouard Claparède [54]."}, {"q": "80. El texto subraya que gran parte de la psicología científica de la mente del siglo XIX (conciencia) adoptó metodologías que venían siendo muy útiles en otra área:", "o": ["El arte y la novela renacentista exclusivamente narrativa.", "La física de los movimientos planetarios gigantes cosmológicos.", "La ciencia natural aplicada a la biología orgánica y la fisiología corporal humana."], "c": 2, "e": "Para la etapa científica se importaron a la mente métodos empíricos y analíticos de interrelación tomados de ciencias biológicas y de la fisiología subyacente [38, 39]."}];
let questions=[...originalQuestions],current=0,score=0,missed=[],retryMode=false;

function loadQuestion(){
let q=questions[current];
document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='Historia de la Psicología: ciencia, paradigmas, etapas históricas, profesionalización y psicología aplicada.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}
loadQuestion();
</script>
