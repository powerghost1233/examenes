<style>
:root{--gold:#d4af37;--gold2:#f3d98b;--bg:#05070d;--bg2:#0b1323;--txt:#f5f5f5;--muted:#aab3c5;--ok:#33d17a;--bad:#ff6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;min-height:100vh;background:
radial-gradient(circle at top left,rgba(212,175,55,.20),transparent 30%),
radial-gradient(circle at bottom right,rgba(50,90,180,.25),transparent 35%),
linear-gradient(135deg,var(--bg),var(--bg2),#05070d);
display:flex;justify-content:center;align-items:center;padding:30px;color:var(--txt)}
.container{width:100%;max-width:1000px;background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);border:1px solid rgba(212,175,55,.25);
border-radius:28px;padding:32px;box-shadow:0 25px 80px rgba(0,0,0,.45)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.4);color:var(--gold2);font-weight:800;letter-spacing:3px;margin-bottom:18px}
h1{font-size:52px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{margin:8px 0 25px;color:var(--muted);font-weight:400}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.stat{padding:12px 16px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:700}
.bar{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:20px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:.3s}
.card{padding:24px;border-radius:22px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08)}
.q{font-size:22px;font-weight:800;line-height:1.4;margin-bottom:20px}
.options{display:grid;gap:12px}
.opt{padding:15px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer;color:white;text-align:left;font-size:15px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
.opt:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.18)!important;border-color:var(--ok)!important}
.incorrect{background:rgba(255,107,107,.18)!important;border-color:var(--bad)!important}
.feedback{display:none;margin-top:18px;padding:18px;border-radius:16px;line-height:1.6}
.show{display:block}
.good{background:rgba(51,209,122,.12);border-left:5px solid var(--ok)}
.bad{background:rgba(255,107,107,.12);border-left:5px solid var(--bad)}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:14px 22px;border:none;border-radius:14px;font-weight:800;cursor:pointer}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111}
.dark{background:rgba(255,255,255,.08);color:white;border:1px solid rgba(255,255,255,.12)}
#results{display:none;text-align:center}
.medal{margin:15px auto;padding:12px 20px;border-radius:999px;border:1px solid rgba(212,175,55,.35);display:inline-block;color:var(--gold2)}
.missed{text-align:left;margin-top:20px;padding:18px;border-radius:16px;background:rgba(0,0,0,.2);line-height:1.55}
.missed h3{color:var(--gold2);margin-bottom:10px}
.missed ul{padding-left:20px}
@media(max-width:650px){.container{padding:22px}h1{font-size:36px}.q{font-size:18px}}
</style>

<script>
const originalQuestions=[{"q": "A diferencia de las escuelas de Wundt y James que estudiaban los procesos conscientes, ¿qué característica define el surgimiento de la \"psicología profunda\" a finales del siglo XIX?", "o": ["La exclusión total de los procesos psicopatológicos.", "La exploración de un nivel no consciente que condiciona y determina al psiquismo humano.", "La medición de tiempos de reacción en el laboratorio."], "c": 1, "e": "El texto indica que el psiquismo humano parece tener un esencial componente no consciente que determina a los procesos conscientes, obligando a explorar ese nivel más hondo o \"profundo\"."}, {"q": "En la Edad Moderna, el filósofo racionalista Leibniz admitió la existencia de representaciones que se dan en nosotros prácticamente sin conciencia. ¿Cómo las llamó?", "o": ["Pulsiones de muerte.", "Arquetipos.", "Pequeñas percepciones."], "c": 2, "e": "G. W. Leibniz admitió que las sustancias pensantes tienen representaciones prácticamente sin conciencia, y \"las llamó «pequeñas percepciones»\"."}, {"q": "¿Qué filósofo alemán del siglo XIX mantuvo que el fundamento del universo se hallaba precisamente en un \"inconsciente absoluto\"?", "o": ["Eduard von Hartmann.", "René Descartes.", "Arthur Schopenhauer."], "c": 0, "e": "El texto menciona explícitamente: \"un filósofo alemán del siglo XIX, Eduard von Hartmann, mantuvo que el fundamento del universo se hallaba precisamente en un inconsciente absoluto\"."}, {"q": "¿Desde qué disciplina, al estudiar los \"umbrales de conciencia\", se descubrió que había procesos inconscientes cuando la estimulación carecía de la intensidad mínima requerida?", "o": ["La frenología.", "La psicofísica (con Fechner).", "La etnología primitiva."], "c": 1, "e": "Señala que \"la psicofísica –recuérdese a Fechner– descubrió que había «umbrales» de conciencia, y habría procesos por debajo del umbral consciente (procesos infraliminares)\"."}, {"q": "¿Qué nombre le dio el médico del siglo XVIII Anton Mesmer al método curativo que utilizaba y que hoy vinculamos al hipnotismo?", "o": ["Análisis catártico.", "Magnetismo animal o mesmerismo.", "Tensión psicológica."], "c": 1, "e": "\"En el siglo XVIII, un médico, Anton Mesmer... usó el hipnotismo como método curativo, bajo la denominación de «magnetismo animal» o «mesmerismo»\"."}, {"q": "A finales del siglo XIX, ¿qué escuela francesa alcanzó notoriedad en la psicoterapia al ampliar el empleo de técnicas hipnóticas de la mano de Liébeault y Bernheim?", "o": ["La Escuela de Nancy.", "La Escuela de Wurzburgo.", "El Círculo de Viena."], "c": 0, "e": "\"los franceses Ambroise Liébeault e Hippolyte Bernheim... médicos en Nancy, ampliaron el empleo de las técnicas hipnóticas en el campo terapéutico y crearon un grupo –la Escuela de Nancy–\"."}, {"q": "El eminente psiquiatra francés Jean-Martin Charcot estudió fundamentalmente el síndrome patológico de:", "o": ["La esquizofrenia.", "La histeria.", "El autismo."], "c": 1, "e": "\"Jefe de un servicio en el Hospital de La Salpêtrière... consiguió establecer la existencia de un síndrome patológico, la histeria\"."}, {"q": "Charcot demostró empíricamente que los síntomas histéricos somáticos (como parálisis o cegueras) podían modificarse o suprimirse temporalmente usando:", "o": ["La hipnosis.", "El psicoanálisis.", "La estimulación eléctrica de la corteza motora."], "c": 0, "e": "\"Charcot llegó a establecer que había unos síntomas determinados... y que se podían modificar mediante el uso de la hipnosis (así, una enferma con parálisis en una pierna podía... recobrar el uso)\"."}, {"q": "Según Charcot, la causa principal que producía estas alteraciones \"dinámicas\" en la histeria era:", "o": ["Un tumor alojado en el hemisferio izquierdo.", "Una infección viral del útero.", "Un estado de debilidad y desintegración del sistema nervioso."], "c": 2, "e": "\"Atribuyó la enfermedad a un estado de debilidad y desintegración del sistema nervioso, que hacía posible aquellas alteraciones «dinámicas», aunque no hubiera lesión anatómica\"."}, {"q": "¿En qué años nació y falleció Sigmund Freud?", "o": ["1856-1939.", "1870-1937.", "1876-1961."], "c": 0, "e": "\"Sigmund Freud (1856-1939), creador del psicoanálisis, ha sido y es una de las figuras más influyentes en psicología\"."}, {"q": "¿En qué ciudad europea desarrolló Freud la inmensa mayor parte de su carrera médica y psicoanalítica?", "o": ["Berlín.", "Viena.", "París."], "c": 1, "e": "Nació en Freiberg, \"en una familia judía, instalada desde su niñez en Viena. Realiza allí estudios de Medicina\"."}, {"q": "En 1900, Freud publicó una de sus obras fundacionales más importantes para el psicoanálisis, titulada:", "o": ["Estudios sobre la histeria.", "Tótem y tabú.", "La interpretación de los sueños."], "c": 2, "e": "\"Publicó numerosos estudios y libros, entre ellos, La interpretación de los sueños (1900)\"."}, {"q": "¿Por qué razón tuvo Freud que abandonar Viena en 1938 y exiliarse a Londres?", "o": ["Por una invitación como catedrático vitalicio.", "Por la presión del régimen nazi debido a su origen judío.", "Para escapar de la Primera Guerra Mundial."], "c": 1, "e": "\"En 1938 tuvo que abandonar Viena por presión del régimen nazi y se exilió a Londres, donde murió al año siguiente\"."}, {"q": "En su primera etapa, puramente neuropatológica, Freud realizó estudios sobre el valor anestésico de una sustancia, perdiendo la primacía del descubrimiento. ¿Qué sustancia era?", "o": ["El opio.", "El cloroformo.", "La cocaína."], "c": 2, "e": "\"Se interesó luego por la acción de la cocaína (1884-1886), descubriendo su valor anestésico... a resultas de lo cual abandonó ese campo\"."}, {"q": "En 1885, Freud logró una beca para viajar a París (Hospital de La Salpêtrière). ¿Con qué gran maestro estudió allí los trastornos histéricos?", "o": ["Con Eugen Bleuler.", "Con Jean-Martin Charcot.", "Con Wilhelm Fliess."], "c": 1, "e": "\"logró una beca para ampliar estudios con Charcot, en el Hospital de La Salpêtrière... encontró en este gran psiquiatra... un modelo que iba a servirle para reorientar su carrera\"."}, {"q": "El primer libro propiamente dicho publicado por Freud (1891) relacionaba el lenguaje con el cerebro. Su título fue:", "o": ["La afasia.", "La histeria.", "El yo y el ello."], "c": 0, "e": "\"También se ocupó del tema del lenguaje, en especial de la «afasia», viendo ahí el papel del cerebro. A esta cuestión dedicó el primero de sus libros (La afasia, 1891)\"."}, {"q": "¿Qué médico vienés colega de Freud trató originalmente el célebre \"caso de Anna O\"?", "o": ["Alfred Adler.", "Josef Breuer.", "Carl Jung."], "c": 1, "e": "\"había entrado en contacto con un médico vienés, Josef Breuer, que había tratado a alguna paciente histérica (en especial, una de ellas, denominada «Anna O»)\"."}, {"q": "La verdadera identidad de la paciente \"Anna O\", conocida posteriormente como una escritora y periodista feminista austriaca, era:", "o": ["Emma Eckstein.", "Sabina Spielrein.", "Bertha Pappenheim."], "c": 2, "e": "\"«Anna O», luego identificada como la escritora y periodista feminista austriaca Bertha Pappenheim (1859-1936)\"."}, {"q": "Uno de los síntomas funcionales extraños de Anna O fue la pérdida temporal del uso de su lengua natal (el alemán), viéndose forzada a comunicarse en:", "o": ["Inglés.", "Francés.", "Latín."], "c": 0, "e": "\"llegó a perder temporalmente el uso de su lengua, el alemán, viéndose precisada a comunicarse en inglés con los suyos\"."}, {"q": "Al buscar la raíz de la hidrofobia (incapacidad para beber agua) de Anna O, bajo hipnosis descubrieron el recuerdo de:", "o": ["Un ahogamiento traumático infantil en un lago.", "Ver al perrito de su señorita de compañía bebiendo agua de un vaso.", "Un castigo paterno encerrada en el baño."], "c": 1, "e": "\"en aquella etapa de hidrofobia recordó cierta ocasión en la que vio... un pequeño perrito bebiendo agua en un vaso, lo que le produjo una gran repugnancia\"."}, {"q": "Para describir su propia liberación curativa al relatar sus vivencias bajo hipnosis, Anna O bautizó al método coloquialmente como:", "o": ["Logoterapia mística.", "Charla curativa o \"deshollinar la chimenea\".", "Análisis de resistencias."], "c": 1, "e": "\"«Anna O» llamó a esto una «charla curativa» con la que «deshollinaba la chimenea».\""}, {"q": "¿Cómo llamó Freud al fenómeno clínico mediante el cual la paciente se enamora o proyecta sentimientos intensos hacia su terapeuta (como le ocurrió a Breuer)?", "o": ["Sublimación erótica.", "Complejo de Electra agudo.", "Transferencia."], "c": 2, "e": "\"Vio que la atracción amorosa sentida por la paciente hacia el terapeuta no era propiamente amor, sino un fenómeno que se ha llamado «transferencia»\"."}, {"q": "En su obra \"Estudios sobre la histeria\" (1895), Breuer y Freud concluyeron la célebre frase de que los neuróticos/histéricos \"padecen de...\":", "o": ["Lesiones cerebrales localizadas.", "Exceso de tensión mental consciente.", "Reminiscencias (huellas de traumas del pasado no liberados)."], "c": 2, "e": "\"Concluyeron que los pacientes histéricos... padecen no de lesiones orgánicas ni físicas, sino «de reminiscencias», es decir, de las huellas o memorias de traumas del pasado\"."}, {"q": "Al proceso terapéutico de recordar, verbalizar y neutralizar afectivamente las vivencias traumáticas reprimidas se le denominó, utilizando un viejo término griego:", "o": ["Noegénesis.", "Catarsis.", "Ataxia."], "c": 1, "e": "\"Este sería un proceso de «purificación» (con un término griego, catarsis), que liberaría al paciente de las vivencias traumáticas retenidas\"."}, {"q": "El primer gran intento teórico (inédito hasta 1950) que Freud escribió en 1895 para explicar la mente humana a su amigo Wilhelm Fliess se titula:", "o": ["El yo y el ello neurológico.", "Proyecto de psicología para neurólogos.", "Tractatus logico-psicológico."], "c": 1, "e": "\"En 1895 redactó un primer borrador, que envió para su comentario... a Wilhelm Fliess... El texto, Proyecto de psicología para neurólogos, solo se ha conocido como obra póstuma\"."}, {"q": "En el \"Proyecto\", Freud ofrece una visión materialista donde las neuronas que reciben excitación tratan de descargarse de la energía para recuperar la situación anterior (placer). A este equilibrio se le llama hoy:", "o": ["Somatización.", "Homeostasis.", "Convergencia."], "c": 1, "e": "\"toda neurona busca mantener su equilibrio energético (fenómeno que hoy denominamos homeostasis). Así, cuando reciben excitaciones... tratan de descargarse\"."}, {"q": "Cuando un trauma impide que la energía psíquica se descargue (displacer), esta se desvía originando síntomas corporales somáticos, proceso que Freud denominó:", "o": ["Conversión.", "Disociación esquizoide.", "Logoterapia."], "c": 0, "e": "\"Estos sustituyen y expresan el conflicto psíquico en lo que se llama un proceso de «conversión» o sustitución de lo psíquico por lo orgánico, típico de los casos de histeria\"."}, {"q": "Según el modelo dinámico maduro de Freud, una de las pulsiones más esenciales es aquella de índole sexual que busca la conservación de la especie y el placer, a la que llamó:", "o": ["Thánatos.", "Tensión psíquica.", "Libido."], "c": 2, "e": "\"Otra es la «libido», pulsión de índole sexual, que busca la conservación de la especie... pero que luego generaliza su meta... al «placer»\"."}, {"q": "Ya en su madurez clínica, Freud añadió un tercer tipo de pulsión opuesta a las de conservación y placer, que explicaría la violencia y la guerra:", "o": ["El impulso de superioridad adleriano.", "El instinto de muerte o Thánatos.", "El arquetipo de la sombra."], "c": 1, "e": "\"añadió un tercer tipo de «pulsión», aquella que explicaría la tendencia a la destrucción, la violencia, la guerra, que llamó «instinto de muerte» (o thánatos)\"."}, {"q": "A diferencia de las posturas médicas de la época, Freud afirmó la existencia innegable de una sexualidad:", "o": ["Que solo se inicia estrictamente en la pubertad biológica.", "Que está presente ya desde los inicios de la niñez (sexualidad infantil).", "Que es enteramente asexual en la etapa fálica."], "c": 1, "e": "\"Por ello afirmó, frente a muchísimos críticos, que hay una sexualidad ya desde los inicios de la niñez\"."}, {"q": "En la teoría del desarrollo psicosexual, ¿cuál es la primera etapa descrita, en la que la satisfacción está ligada a comportamientos del bebé como el chupeteo?", "o": ["Etapa fálica.", "Etapa oral.", "Etapa de latencia."], "c": 1, "e": "\"La «etapa oral», en la que la satisfacción está ligada a la boca (por ejemplo, el chupeteo propio de los bebés)\"."}, {"q": "¿Qué nombre recibe la fase del desarrollo psicosexual donde la satisfacción infantil se localiza en el control de la micción y defecación (esfínteres)?", "o": ["Etapa anal.", "Etapa de retención hídrica.", "Etapa genital."], "c": 0, "e": "\"La «etapa anal», donde el placer está ligado al control de los esfínteres (control de la micción y de la defecación)\"."}, {"q": "Antes de llegar a la pubertad (etapa genital), el niño atraviesa una fase sin activación sexual y con amnesia de las etapas anteriores. Es la llamada:", "o": ["Etapa de inhibición moral.", "Etapa de latencia.", "Etapa fálica reprimida."], "c": 1, "e": "\"A esta seguiría una «etapa de latencia», donde la sexualidad no estaría activada, que iría acompañada de completo olvido o amnesia respecto de todas las etapas precedentes\"."}, {"q": "Cuando el individuo satisface su impulso de placer tomado a su propio cuerpo como objeto (en alusión al mito del joven frente al agua), se denomina:", "o": ["Libido objetal.", "Libido narcisista.", "Libido anal."], "c": 1, "e": "\"en unos casos ese objeto es fundamentalmente el propio cuerpo (lo que llamará Freud una «libido narcisista», en alusión al mito de Narciso)\"."}, {"q": "En torno a los cinco años se produce una situación vincular básica donde el varón hace de su madre el objeto de deseo y choca con su padre. Freud denominó a esto:", "o": ["Complejo de Electra.", "Complejo de inferioridad orgánica.", "Complejo de Edipo."], "c": 2, "e": "\"En torno a los cinco años, el niño haría de su madre el objeto de deseo «amoroso», y trataría de poseerla... La llamó «complejo de Edipo»\"."}, {"q": "El equivalente al complejo de Edipo descrito para el desarrollo del psiquismo en la niña se denomina habitualmente:", "o": ["Complejo de Narciso.", "Complejo de Electra.", "Complejo de castración femenina."], "c": 1, "e": "\"su equivalente en el caso de la mujer, aunque no exactamente igual, sería el «complejo de Electra»\"."}, {"q": "En el niño varón, la prohibición paterna frente a su manipulación masturbatoria durante el Edipo genera una profunda angustia ligada a un gravísimo temor:", "o": ["El temor al abandono oral.", "El temor a la muerte del progenitor.", "El temor a la castración."], "c": 2, "e": "\"el niño vendría a temer que, de seguir el enfrentamiento con el padre, este podría extirparle su órgano sexual... Y esto genera un gravísimo «temor a la castración»\"."}, {"q": "En sus Obras Completas, Freud ilustra las ansiedades edípicas con el caso histórico del \"pequeño Juanito\", un niño que sufría una severa fobia a:", "o": ["La oscuridad.", "Los caballos (que tiraban de los tranvías en Viena).", "Las inyecciones de sus médicos."], "c": 1, "e": "\"presenta el caso de un niño, el «pequeño Juanito», al que trató con ocasión de padecer una fobia hacia los caballos... en Viena, tiraban de los tranvías\"."}, {"q": "En el sueño del \"pequeño Juanito\", una jirafa grande y violenta que protesta porque el niño quiere quitarle a la jirafa pequeña fue interpretada por Freud como:", "o": ["Una alucinación somática debida a una fiebre alta.", "El padre amenazando al niño por querer quedarse con la madre (jirafa pequeña).", "Un mero reflejo aleatorio de su miedo a los animales de granja."], "c": 1, "e": "\"lo interpretaron como un sueño de contenido edípico, en el que la jirafa grande (el padre) protestaba y amenazaba al niño porque este quería quedarse con la jirafa pequeña (la madre)\"."}, {"q": "Durante el desenlace del Edipo, el niño asume todas las reglas, valores y normas del padre, interiorizándolas para evitar el castigo. A este proceso Freud lo llama:", "o": ["Identificación.", "Transferencia paterna.", "Automatismo asimilativo."], "c": 0, "e": "\"un proceso de «identificación», por el cual el niño llegará a identificarse con el padre, asumiendo todas sus reglas, valores y normas\"."}, {"q": "El mecanismo de defensa fundamental mediante el cual el sujeto \"expulsa de la conciencia toda sombra de deseo\" o recuerdo inaceptable para evitar la angustia es:", "o": ["La compensación adleriana.", "La represión.", "El lapsus analítico."], "c": 1, "e": "\"Uno es la «represión», una reacción por la que el niño va a expulsar de la conciencia toda sombra de deseo hacia la madre, de manera que todo lo relacionado con ese tema quede fuera\"."}, {"q": "El núcleo biológico de instintos ciegos en la personalidad, que opera buscando la satisfacción perentoria de las necesidades, se denomina freudianamente:", "o": ["El yo.", "El superego.", "El ello."], "c": 2, "e": "\"Una de esas estructuras es el fondo de energías y pulsiones, al que ya nos hemos referido. Lo denomina «ello» y este opera buscando la satisfacción de sus necesidades\"."}, {"q": "¿Qué principio fundamental gobierna y guía la operatividad de los impulsos inconscientes radicados en el \"ello\"?", "o": ["El principio de realidad.", "El principio del deber moral.", "El principio del placer."], "c": 2, "e": "\"Lo denomina «ello» y este opera buscando la satisfacción de sus necesidades, guiado por lo que Freud llamará el «principio del placer»\"."}, {"q": "La instancia que actúa mediando entre el instinto y las posibilidades objetivas del mundo, y que constituye el sujeto empírico operando según el \"principio de realidad\", es:", "o": ["El \"ello\" preconsciente.", "El \"yo\" o \"ego\".", "La \"sombra\" psíquica."], "c": 1, "e": "\"La segunda estructura es la que llama el «yo»... actúa ajustando continuamente las necesidades... al mundo real que nos rodea... opera según un «principio de realidad»\"."}, {"q": "El \"yo\" o \"ego\" se va constituyendo mediante el conjunto de enlaces y asociaciones aprendidas que guían la acción relacionando contenidos con placer y dolor. Estos enlaces se denominan:", "o": ["Complejos autónomos.", "Catexias.", "Automatismos directores."], "c": 1, "e": "\"algunas que relacionan ciertos contenidos con placeres y dolores que guían la acción. El conjunto de tales enlaces –a los que llama «catexias»–, constituye ese «yo» o «ego»\"."}, {"q": "La tercera gran instancia u estructura psíquica, que actúa como censor moral normativo y al que Freud denomina \"el heredero del complejo de Edipo\", es:", "o": ["El subconsciente periférico.", "El inconsciente colectivo.", "El superego (o \"yo ideal\")."], "c": 2, "e": "\"incluye una tercera estructura o «instancia», que es la que hemos llamado «superego». Esta... se corresponde con el «yo ideal»... Freud dirá que este «superego» es el «heredero del complejo de Edipo»\"."}, {"q": "A diferencia del ello y el yo, el \"superego\" o \"yo ideal\" restringe la conducta operando estrictamente bajo:", "o": ["El principio del placer inmediato.", "El principio del deber y el ajuste a la regla moral.", "El automatismo catatónico instintivo."], "c": 1, "e": "\"El «superego» opera de acuerdo con el «principio del deber», esto es, de la necesidad de ajuste a la regla o norma moral\"."}, {"q": "A nivel descriptivo de consciencia, aquellos contenidos de los que no soy consciente en este instante (ej. mi número de teléfono) pero que pueden hacerse conscientes fácilmente, están en el nivel:", "o": ["Inconsciente profundo.", "Preconsciente.", "Consciencia lúcida."], "c": 1, "e": "\"yo no soy consciente de mi número de teléfono mientras no me lo preguntan... está en un nivel que Freud llama «preconsciente» (lo no consciente que, sin embargo, puede hacerse consciente)\"."}, {"q": "El nivel profundo que acoge aquellos recuerdos o traumas fuertemente reprimidos, que \"no entran ni pueden entrar\" normalmente en la consciencia, es:", "o": ["El preconsciente moral.", "La conciencia vigilante.", "El inconsciente."], "c": 2, "e": "\"Pero está, además, el «inconsciente», que es un ámbito donde se hallan aquellos procesos que no entran ni pueden entrar en la conciencia (lo reprimido)\"."}, {"q": "En el célebre \"Caso de Emma\", el psicoanálisis destapa que la paciente padecía una compulsión paralizante (\"conversión histérica\") manifestada como el miedo irracional a:", "o": ["Comer pasteles frente a su madre.", "Subir a un tranvía tirado por caballos.", "Entrar sola en una tienda."], "c": 2, "e": "\"El caso de Emma... Freud presenta el caso de una joven, Emma, que tiene una compulsión que le impide «entrar sola en una tienda»\"."}, {"q": "La causa profunda que el análisis descubrió en la conducta fóbica de Emma, desencadenada por la risa de unos dependientes, remite a un grave trauma infantil oculto:", "o": ["Un ataque violento de un animal en una granja familiar.", "El castigo físico de un profesor.", "Una agresión sexual perpetrada por un pastelero cuando ella tenía 8 años."], "c": 2, "e": "\"A los ocho años fue a una pastelería. El pastelero la agredió sexualmente, y «le pellizcó los genitales...»... esa risa le evoca (inconscientemente) el recuerdo del pastelero\"."}, {"q": "Aplicando sus teorías a los fenómenos de masa o sociológicos, Freud intentó explicar el origen del totemismo y las normas morales y éticas humanas remontándolo psicoanalíticamente a:", "o": ["La pura utilidad biológica racional darwiniana.", "La mítica \"muerte del padre todopoderoso\" llevada a cabo por sus hijos envidiosos.", "Un contrato social pacífico pactado por los jefes tribales de Europa central."], "c": 1, "e": "\"un padre todopoderoso... habría concitado sobre sí el odio... de sus hijos, que habrían llevado a cabo la «muerte del padre»... Para Freud, en esa mítica «muerte del padre» se hallaría el origen de la normatividad social...\"."}, {"q": "Según Freud, las formaciones oníricas donde lo latente es encubierto bajo un contenido manifiesto para evadir la barrera represiva son:", "o": ["Las pesadillas orgánicas (sin sentido psicológico).", "Los sueños, considerados la mejor vía para acceder al inconsciente y concebidos como realizaciones disfrazadas de deseos.", "Alucinaciones patológicas intratables."], "c": 1, "e": "\"Los sueños son para él «realizaciones de deseos». Un deseo reprimido busca hacerse presente... a través de unas simbolizaciones... Dirá, por eso, que los sueños son el mejor camino, la via regia, para acceder al inconsciente\"."}, {"q": "Freud argumentó que los pequeños actos fallidos y equivocaciones en nuestro día a día no son mero producto del azar sino que obedecen a un propósito encubierto. Expuso esta idea en su libro:", "o": ["La afasia neurológica clínica.", "Psicopatología de la vida cotidiana.", "El porvenir de una ilusión."], "c": 1, "e": "\"Errores, olvidos o lapsus... todo elemento... tiene que ser visto como resultado de alguna causa inconsciente. La exploración de estos procesos llena las páginas de su Psicopatología de la vida cotidiana\"."}, {"q": "¿Qué método adoptó definitivamente la terapia freudiana una vez se distanció de la hipnosis iniciada con Breuer y Charcot?", "o": ["La electroterapia indolora.", "El análisis de asociaciones libres del paciente recostado en un diván.", "El test estadístico psicométrico sobre la personalidad."], "c": 1, "e": "\"Al prescindir de ese método [la hipnosis], Freud se apoyó en la idea de que la psique es una estructura de asociaciones... puestas en marcha... mediante asociaciones libres en la mente del paciente... tendido en el «diván»\"."}, {"q": "En la clínica psicoanalítica, ¿qué fenómeno ocurre cuando la evocación libre de ideas del paciente se detiene bruscamente, impidiéndole seguir la cadena?", "o": ["Un estado de catatonia aguda.", "Una \"resistencia\" al análisis, que indica la inminente cercanía del núcleo inconsciente traumático.", "Una curación instantánea completa (o catarsis final)."], "c": 1, "e": "\"siempre, en esa evocación de asociaciones, había un punto en el que la cadena se corta, en el que aparece una «resistencia» al análisis. Lo interpretó como el punto donde la cadena asociativa se acerca al núcleo patógeno\"."}, {"q": "Para Freud, nada en la vida de la mente sucede por azar (\"todo error o sueño está allí porque en el plano inconsciente alguna causa así lo determina\"). A este principio fundamental se le conoce como:", "o": ["Principio de indeterminación.", "Libre albedrío total.", "Determinismo psíquico absoluto."], "c": 2, "e": "\"Ante todo, rige en ella un absoluto determinismo psíquico. Las asociaciones e interacciones de procesos están causalmente determinadas... Todo, en la vida psíquica, está sobredeterminado causalmente\"."}, {"q": "¿Qué brillante psicopatólogo francés elaboró una idea alternativa del inconsciente y defendió la tesis de \"El automatismo psicológico\" en 1889?", "o": ["Hippolyte Bernheim.", "Pierre Janet.", "Ambroise Liébeault."], "c": 1, "e": "\"Pierre Janet (1859-1947), psicopatólogo francés... Su estudio minucioso... le sirvió de base para la construcción de su teoría, formulada ya en su tesis doctoral, El automatismo psicológico (1889)\"."}, {"q": "El concepto clave mediante el cual Pierre Janet explicaba la unidad de la conducta y la integración de las diferentes operaciones vitales era:", "o": ["El determinismo genético.", "La tensión psicológica dinámica.", "La líbido biológica reprimida."], "c": 1, "e": "\"sostiene un dinamismo mental con el que va integrando diferentes operaciones y produciendo actos complejos. Ello es posible cuando se mantiene una determinada «tensión psicológica»\"."}, {"q": "Según Janet, en trastornos severos como la catatonia o el sonambulismo irrumpe un \"automatismo\" mecánico y sin consciencia a causa de:", "o": ["Una altísima tensión creativa.", "Un complejo de Electra mal resuelto.", "Una caída y agotamiento (debilitación) de dicha tensión psicológica."], "c": 2, "e": "\"En caso de que aquella [la tensión psicológica] esté debilitada, se da un estado patológico y se abre la puerta a la desintegración de funciones... Semejante pérdida de tensión explicaría fenómenos como el sonambulismo o la catatonia\"."}, {"q": "Janet consideró que la conciencia reflexiva interior del ser humano operaba a modo de:", "o": ["Un mero almacén pasivo de recuerdos.", "Una forma de conducta social interiorizada (diálogo intrapersonal entre un \"yo director\" y un \"yo dirigido\").", "Un instinto heredado del subconsciente biológico."], "c": 1, "e": "\"Para él, esta representa una forma de conducta social, que se habría interiorizado. Así... me observo, me dirijo. Dentro de uno mismo hay un diálogo entre el «yo director» y el «yo dirigido»\"."}, {"q": "Al formular su tensión vital energética, Janet discrepó muy severamente del psicoanálisis de Freud, ya que rechazaba tajantemente:", "o": ["El papel del hipnotismo.", "La existencia de los traumas.", "La interpretación y sexualización extrema del dinamismo psíquico (la doctrina de la libido)."], "c": 2, "e": "\"Janet rechazaba aquella sexualización del dinamismo que proponía Freud con su doctrina sobre la libido. Para aquel, la tensión psicológica tenía una condición asexual\"."}, {"q": "Este médico austríaco se separó del círculo freudiano para fundar la llamada \"psicología individual\", influyendo notablemente luego en el humanismo americano:", "o": ["Eugen Bleuler.", "Carl Gustav Jung.", "Alfred Adler."], "c": 2, "e": "\"Alfred Adler (1870-1937)... médico vienés... decidió abandonar la sociedad psicoanalítica para iniciar un nuevo rumbo... la constitución de lo que se ha llamado frecuentemente la psicología «individual»\"."}, {"q": "Para Adler, el origen del comportamiento neurótico no estriba en fijaciones sexuales sino que surge cuando el individuo experimenta una falla o tara corporal inicial, que denominó:", "o": ["Angustia de castración.", "Minusvalía orgánica.", "Lesión cortical irreversible."], "c": 1, "e": "\"Su preocupación inicial se centró en... las que mostraban personas con algún tipo de minusvalía orgánica. La minusvalía, originada por un defecto o tara corporal\"."}, {"q": "Esa tara orgánica obliga al sujeto a intentar superarse a toda costa; si fracasa, sufre una tensión psicológica psiquiátrica ligada a un sentimiento que Adler bautizó como:", "o": ["Tensión de inferioridad inconsciente.", "Complejo de inferioridad (por déficit de compensación).", "Trastorno de disociación catatónico."], "c": 1, "e": "\"La minusvalía... genera en quien la padece un complejo de inferioridad... Nace de ahí entonces un impulso psicológico que busca la compensación, pero si esta no se logra plenamente... surgen afecciones nerviosas\"."}, {"q": "A diferencia del determinismo sexual (libido) freudiano, Adler propone que el gran motor que orienta la autoestima humana en la búsqueda de la superación de sus deficiencias radica en la dimensión de:", "o": ["El misticismo religioso.", "El \"valor\" y el afán de \"poder\".", "La amnesia hipnótica colectiva."], "c": 1, "e": "\"En lugar de la libido freudiana, como motor de la conducta, Adler se atuvo a la dimensión del «valor» y del «poder»\"."}, {"q": "Según Adler, el \"inconsciente\" humano no es en realidad una cueva oscura y prohibida para los deseos reprimidos, sino simplemente:", "o": ["Aquella parte de nuestra conciencia que aún no comprendemos o no sabemos formular en conceptos claros.", "La suma de todas las pulsiones genéticas de la humanidad milenaria.", "El área prefrontal derecha del cerebro humano en reposo."], "c": 0, "e": "\"El inconsciente no es sino aquello que no hemos sido capaces de formular en conceptos claros... es aquella parte de nuestra conciencia que no comprendemos\"."}, {"q": "En el sistema marcadamente cognitivo de Adler, cada persona organiza sus percepciones, metas y acciones dotando a su conducta individual de una significación propia; esto es lo que él llama su:", "o": ["Catexia objetal.", "Estilo de vida.", "Análisis simbólico latente."], "c": 1, "e": "\"Para Adler cada persona es una unidad operativa y posee un «estilo de vida» que puede ser normal o patológico. Este influye y condiciona las acciones...\"."}, {"q": "¿Qué investigador suizo creó la escuela de \"psicología analítica\" tras haber trabajado como psiquiatra junto a Bleuler (autismo), Janet y colaborado intensamente con Freud?", "o": ["Alfred Adler.", "Eduard von Hartmann.", "Carl Gustav Jung."], "c": 2, "e": "\"Jung (1876-1961) fue un psiquiatra suizo que comenzó su formación con Eugen Bleuler... trabajó en París también con Pierre Janet... Conoce a Freud en 1907... creó una escuela de «psicología analítica»\"."}, {"q": "A nivel empírico en psicología de la personalidad, Jung aportó la célebre categorización tipológica que distingue entre individuos:", "o": ["Atléticos y leptosómicos.", "Introvertidos y extravertidos.", "Ciclotímicos y melancólicos crónicos."], "c": 1, "e": "\"Muy difundida es su clasificación de los «tipos psicológicos» en dos grandes categorías: «introvertido» y «extravertido». La división se funda en la distinta orientación general del individuo\"."}, {"q": "Para indagar los problemas emocionales ocultos, Jung estructuró con Bleuler una prueba que cronometraba el tiempo de respuesta (\"latencia\") del individuo al proferirle ciertas palabras-estímulo. Se trata de:", "o": ["El Test de Matrices Progresivas.", "La Prueba Diagnóstica de Rorschach.", "El Test de Asociaciones Jung-Bleuler."], "c": 2, "e": "\"Confeccionó además con Bleuler el «Test de Asociaciones Jung-Bleuler», que trata de detectar los complejos emocionales... La índole de la respuesta y el tiempo tardado... marcados por una dilación o «latencia»\"."}, {"q": "Precisamente el Test de Asociaciones verbales ideado por Jung-Bleuler sentó las bases para el posterior desarrollo metodológico (años 30) aplicado a la criminología americana:", "o": ["La identificación dactiloscópica.", "La hipnosis policial regresiva.", "La técnica del \"detector de mentiras\" de J. A. Larson."], "c": 2, "e": "\"Sobre ese modelo se iba a estructurar más tarde la técnica del «detector de mentiras» del americano J. A. Larson, en 1923, basado en el estudio de las respuestas psicofisiológicas\"."}, {"q": "Para Jung, los problemas o atascos neuróticos suponen formaciones patológicas o núcleos emocionales que retienen la energía psíquica del individuo (su libido). A esos nudos los llamó:", "o": ["Tics.", "Automatismos directores.", "Complejos."], "c": 2, "e": "\"Supone, por lo pronto, la existencia de fuerzas psíquicas que crean núcleos de carácter emocional o «complejos», que representan una cierta «detención de energía» y formación de un núcleo\"."}, {"q": "Jung defendía que la persona es como un iceberg cuya mayor porción yace en un estrato inconsciente que heredamos de la historia de la humanidad, conteniendo mitos, cuentos y esquemas comunes; se trata del:", "o": ["Inconsciente prefrontal superior.", "Inconsciente colectivo.", "Inconsciente reprimido de la infancia (fásico)."], "c": 1, "e": "\"Una de sus convicciones básicas es que en la persona hay un «inconsciente» personal junto a otro «inconsciente colectivo». Este último conlleva instintos y patrones que se transmiten en las culturas y razas\"."}, {"q": "Esos ancestrales modelos o patrones transculturales de humanidad que emergen desde el inconsciente colectivo para gobernar las vidas desde la mitología hasta los sueños, se designan formalmente como:", "o": ["Monadas de Leibniz.", "Falsos recuerdos implantados.", "Arquetipos."], "c": 2, "e": "\"Precisamente entre esos patrones incluye unos ciertos «arquetipos» o modelos de humanidad, que regulan o compensan desde el inconsciente la vida consciente del individuo\"."}, {"q": "Entre los arquetipos junguianos encontramos uno que funge de \"máscara\" o dimensión visible hacia los demás, protegiendo al sujeto de exponer su hondo fondo inconsciente. Este es:", "o": ["El Ego puro.", "La Sombra.", "La Persona (prósopon)."], "c": 2, "e": "\"la «persona» –(o prósopon, máscara)– que es su dimensión visible, y oculta hacia fuera el mundo profundo del inconsciente\"."}, {"q": "El terrible arquetipo que compendia todo lo vergonzoso, reprimido, repulsivo y oculto que un individuo niega de sí mismo pero que resulta vital aceptar para no enfermar psíquicamente es:", "o": ["El superyó moral.", "La sombra.", "El animus."], "c": 1, "e": "\"la «sombra», dimensión inconsciente que el individuo ha de buscar incorporar y que reúne lo reprimido y repudiado que el sujeto ha de aceptar para evitar la ruptura patológica\"."}, {"q": "Jung postulaba una naturaleza bisexual primigenia. Por lo tanto, el fondo psíquico del varón alberga complementariamente una dimensión o arquetipo inconsciente femenino que enriquece sus sentimientos. Ese arquetipo es:", "o": ["El Ánimus.", "El Ánima.", "El Prósopon."], "c": 1, "e": "\"el anima y el animus, por su lado, son la expresión de una básica bisexualidad... de modo que el anima –o dimensión femenina– complementa al varón; y el animus –dimensión masculina– a la mujer\"."}, {"q": "(Autocomprobación) En el campo patológico, ¿por qué razón fundamental se originan las neurosis según el modelo explícito de Pierre Janet?", "o": ["Exclusivamente por traumas infantiles reprimidos del complejo de Edipo.", "Por una deficiencia y vaciado de la tensión psicológica, originando una \"disgregación\" y \"automatismos\".", "A causa de una minusvalía física compensada excesivamente hacia la agresión criminal."], "c": 1, "e": "En Solución 4: \"Los procesos neuróticos, para Janet, son debidos a una deficiencia de la tensión psicológica que conduce a una situación de «disgregación» en la que aparecen, además, los «automatismos»\"."}, {"q": "El texto subraya, como conclusión de la unidad, que la psicología profunda liderada inicialmente por el psicoanálisis forzó permanentemente a la disciplina a:", "o": ["Desterrar la palabra \"mente\" y aplicar el estímulo-respuesta animal como modelo único.", "Reconocer que el psiquismo humano es idéntico a la conciencia y que todo acto es predecible sin variables ocultas.", "Romper con la equiparación exclusiva entre \"psicología y análisis de la conciencia\", debiendo integrar y explorar los poderosos motores del mundo inconsciente."], "c": 2, "e": "\"idea de que la conducta humana está basada... en procesos que escapan a la conciencia representó una gigantesca ampliación para la psicología y terminó con la equiparación entre psicología y análisis de la conciencia... La psicología profunda vino a reconocer el esencial papel... de los procesos inconscientes\"."}];
let questions=[...originalQuestions],current=0,score=0,missed=[],retryMode=false;

function loadQuestion(){
let q=questions[current];
document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='Psicología Profunda: inconsciente, Freud, histeria, psicoanálisis, Janet, Adler y Jung.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}
loadQuestion();
</script>
