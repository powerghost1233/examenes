<script>
const originalQuestions=[{"q": "¿Qué vinculación esencial pretende mostrar esta unidad didáctica gracias a las ideas del evolucionismo?", "o": ["Entre la psicología y la teología clásica.", "Entre la psicología y los procesos vitales, viendo las funciones psíquicas como mecanismos de adaptación al medio.", "Entre el psicoanálisis y el aprendizaje mecanicista."], "c": 1, "e": "El texto indica que el evolucionismo ha mostrado que las funciones psíquicas son mecanismos que producen \"adaptación al medio\" y conservación del individuo."}, {"q": "Junto al estructuralismo de Wundt, ¿cuál es la otra escuela psicológica inicial?", "o": ["El Psicoanálisis.", "La Gestalt.", "El Funcionalismo."], "c": 2, "e": "El documento afirma que, junto al estructuralismo de Wundt, la otra escuela psicológica inicial es el funcionalismo."}, {"q": "Frente al concepto de \"estructura\" consciente, ¿cuál es la pregunta básica del funcionalismo?", "o": ["¿Cuál es la \"función\" que cumplen los fenómenos psíquicos y su utilidad vital (\"para qué\")?", "¿Cuántos átomos mentales existen en la mente humana?", "¿Qué áreas anatómicas cerebrales controlan la visión?"], "c": 0, "e": "Su pregunta básica es \"¿cuál es la función que cumplen los fenómenos psíquicos?\", preguntándose por su \"para qué\" y utilidad vital."}, {"q": "El movimiento filosófico del cual el funcionalismo es la versión psicológica se denomina:", "o": ["Positivismo Lógico.", "Pragmatismo.", "Existencialismo."], "c": 1, "e": "El evolucionismo biológico penetró en la filosofía como \"pragmatismo\", y su versión psicológica vino a ser el funcionalismo."}, {"q": "Para los pragmatistas, la verdad de un conocimiento consiste en:", "o": ["Su coherencia lógica estricta.", "Su capacidad introspectiva abstracta.", "Su utilidad para promover con éxito la adaptación al medio."], "c": 2, "e": "El valor del conocimiento consiste en promover la adaptación; por ello, consideraban que la verdad de un conocimiento consiste en su utilidad (\"Lo verdadero es lo útil\")."}, {"q": "¿Quién inició el pragmatismo en EE.UU., obteniendo luego gran desarrollo gracias a William James?", "o": ["Charles S. Peirce.", "John B. Watson.", "Edward Titchener."], "c": 0, "e": "El movimiento se inició de la mano de Charles S. Peirce y adquirió gran influencia gracias a William James."}, {"q": "William James publicó en 1890 una obra capital titulada:", "o": ["El origen de las especies.", "Principios de psicología.", "El alma del niño."], "c": 1, "e": "William James publicó su obra capital \"Principios de psicología\" en 1890."}, {"q": "William James llegó a establecer un pequeño laboratorio de demostraciones en la Universidad de Harvard en el año:", "o": ["1876.", "1879.", "1905."], "c": 0, "e": "Llegó a establecer un pequeño laboratorio de docencia en 1876, considerado por muchos como un serio rival del fundado por Wundt en 1879."}, {"q": "James adoptó en su libro un punto de vista excluyendo la metafísica, al que definió como:", "o": ["Psicoanalítico.", "Estrictamente positivista.", "Dialéctico materialista."], "c": 1, "e": "En su libro dice que adopta un \"punto de vista estrictamente positivista\", excluyendo lo metafísico."}, {"q": "Según W. James, la vida mental está intercalada entre dos procesos corporales/biológicos, que son:", "o": ["Sueño y vigilia.", "Estimulación (input) y procesos de respuesta (reacciones).", "Digestión y circulación."], "c": 1, "e": "La mente se sitúa en un circuito donde primero es afectada (input) y luego responde al entorno mediante procesos orgánicos (respuestas/reacciones)."}, {"q": "A diferencia de Wundt, James no empezó a estudiar la mente \"de abajo arriba\" con átomos psíquicos, sino partiendo de:", "o": ["Los actos reflejos nerviosos medulares exclusivamente.", "La conciencia completa tal como se da a cada uno, considerándola una \"corriente\" continua.", "Las estructuras anatómicas del lóbulo frontal."], "c": 1, "e": "No parte de átomos psíquicos, sino que empieza considerando la conciencia completa como \"una corriente\" o flujo de vivencias."}, {"q": "Según James, una de las características fundamentales de la conciencia es que es un proceso \"selectivo\". ¿Qué significa esto?", "o": ["Que percibe absolutamente todo sin filtrar nada.", "Que elige sus contenidos, aceptándolos o rechazándolos.", "Que solo funciona durante las horas diurnas."], "c": 1, "e": "Los fenómenos conscientes son \"procesos selectivos, que eligen sus contenidos, aceptándolos o rechazándolos\"."}, {"q": "James comparó la mente con:", "o": ["Un teatro de posibilidades simultáneas de las que selecciona algunas.", "Un bloque de piedra inmutable.", "Una máquina de vapor a presión."], "c": 0, "e": "James veía la mente como \"un teatro de posibilidades simultáneas\" cuya conciencia consiste en comparar, seleccionar e inhibir mediante la atención."}, {"q": "En relación al movimiento y la actividad adaptativa, James decía que \"toda conciencia es...\"", "o": ["Estática.", "Absoluta.", "Motora."], "c": 2, "e": "James dirá que \"toda conciencia es motora, incluso cuando su actividad termina en movimientos imperceptibles\"."}, {"q": "Para James, las pautas estereotipadas que buscan un fin útil \"sin ensayos ni aprendizajes\" (como la araña tejiendo) son:", "o": ["Los hábitos.", "Los instintos.", "Los reflejos condicionados."], "c": 1, "e": "Los instintos son respuestas complejas mecanizadas ante ciertos estímulos que buscan un fin útil \"sin ensayos ni aprendizajes\"."}, {"q": "La teoría de la emoción co-desarrollada por James se conoce como:", "o": ["Teoría central de la emoción.", "Teoría del inconsciente profundo.", "Teoría periférica de la emoción (o de James-Lange)."], "c": 2, "e": "Se la conoce como la \"teoría periférica\" de la emoción, defendida por él y el fisiólogo danés Carl Lange."}, {"q": "Según la teoría de James-Lange, ¿cuál es el orden correcto de los eventos en una emoción?", "o": ["Percibo estímulo -> Siento emoción (tristeza) -> Lloro (reacción corporal).", "Percibo estímulo -> Reacción corporal automática (lloro) -> Conciencia del cambio corporal (siento tristeza).", "Siento emoción -> Percibo estímulo -> Reacciono corporalmente."], "c": 1, "e": "La fórmula de James dice \"estoy triste porque lloro\"; primero es la reacción corporal refleja y la impresión de ésta en el córtex genera la vivencia emocional."}, {"q": "¿Qué fisiólogo propuso la \"teoría talámica\" intermedia, donde vivencia emocional y respuesta orgánica se dan simultáneamente?", "o": ["Walter Cannon.", "Wilhelm Wundt.", "Iván Pavlov."], "c": 0, "e": "Walter Cannon propuso en los años veinte una fórmula intermedia donde la estimulación iría al tálamo, originando simultáneamente la reacción orgánica y la vivencia en el córtex."}, {"q": "¿Cómo define James fisiológicamente el \"hábito\"?", "o": ["Como un instinto de supervivencia heredado.", "Como la formación de una \"nueva vía de descarga\" consolidada en el sistema nervioso.", "Como un trauma psicológico suprimido."], "c": 1, "e": "El hábito se debería a que \"se forma en el sistema nervioso una nueva vía de descarga, más consolidada, que permite que esa acción sea rápida y precisa\"."}, {"q": "James divide el \"Yo empírico\" en tres niveles, que son:", "o": ["Yo ello, Yo superyó, Yo consciente.", "El mí material, el mí social y el mí espiritual.", "Yo físico, Yo onírico, Yo cognitivo."], "c": 1, "e": "James llama a los niveles del yo empírico: \"el mí material\", \"el mí social\" y \"el mí espiritual\"."}, {"q": "Según la teoría de James, la fama y la imagen que tenemos en los demás conforman:", "o": ["El mí espiritual.", "El ego puro.", "El mí social."], "c": 2, "e": "Define \"el mí social\" expresamente como (fama, imagen en otros)."}, {"q": "¿Cuál es la fórmula matemática que propuso James para evaluar la autoestima?", "o": ["Autoestima = Éxito / Pretensiones.", "Autoestima = Edad Mental / Edad Cronológica.", "Autoestima = Logaritmo del Estímulo."], "c": 0, "e": "Propuso evaluarla con la fórmula: Autoestima = Éxito / Pretensiones."}, {"q": "Para explicar quién es el que \"conoce\" o compara los recuerdos y éxitos, James propuso un concepto que denominó:", "o": ["El inconsciente colectivo.", "El ego puro o el \"pensador\" (dato último irreductible).", "El mí social abstracto."], "c": 1, "e": "Supuso un \"yo conocedor\" al que llamó \"ego puro\", o \"el pensador\", considerándolo un \"dato último, irreductible, de la psicología\"."}, {"q": "Al final de su vida, William James publicó un ensayo donde criticaba su propio objeto de estudio original. ¿Cómo se tituló?", "o": ["¿Existe la conciencia? (1904).", "La negación del pragmatismo.", "El fin de los instintos."], "c": 0, "e": "En un ensayo titulado \"¿Existe la conciencia?\" (Does 'Consciousness' Exist?), declaró que desconfiaba de ella como entidad."}, {"q": "Si no existe la conciencia como entidad, James concluyó que en la experiencia solo tenemos \"fenómenos puros\" que, dependiendo del contexto, funcionan como:", "o": ["Pensamiento o como cosa (objetividad).", "Sueños o como realidades alternativas.", "Conductas innatas insalvables."], "c": 0, "e": "Concluyó que un mismo fenómeno, según con qué se agrupe, \"en un grupo hace de pensamiento, en el otro grupo, de cosa\"."}, {"q": "En esa idea de la doble interpretación del fenómeno (como subjetivo o como cosa), James coincidía con un físico y psicólogo alemán precursor del positivismo lógico llamado:", "o": ["Carl Lange.", "Ernst Mach.", "Hermann Ebbinghaus."], "c": 1, "e": "Asumía una doctrina iniciada en Alemania por Ernst Mach, quien mantuvo esa idea de doble interpretación de un fenómeno."}, {"q": "Tras la obra de James y Wundt, la psicología de la conciencia sufrió un embate cuando otro autor americano fundó el conductismo renunciando totalmente a la conciencia. ¿Quién fue?", "o": ["Iván Pavlov.", "Sigmund Freud.", "John B. Watson."], "c": 2, "e": "John B. Watson, al fundar el conductismo, renunció a la conciencia como objeto de estudio para enfocarlo sobre la conducta."}, {"q": "¿Cuáles de los siguientes autores son mencionados como \"Otros funcionalistas\" americanos?", "o": ["Wundt, Titchener, Külpe.", "John Dewey, James R. Angell, Harvey A. Carr.", "Rousseau, Pestalozzi, Locke."], "c": 1, "e": "El texto enumera explícitamente a John Dewey, James R. Angell y Harvey A. Carr como funcionalistas en EE. UU."}, {"q": "Durante el Renacimiento, pedagogos pioneros mostraron interés por educar a los niños, entre ellos el español:", "o": ["Luis Vives.", "Santiago Ramón y Cajal.", "Mariano Cubí."], "c": 0, "e": "Aparece ya en la pedagogía renacentista con pensadores como el alemán Morsellano y el español Luis Vives (1492-1540)."}, {"q": "El checo Juan Amós Comenio reorganizó los conocimientos pedagógicos en el siglo XVII en su obra:", "o": ["Tratado sobre la educación.", "Didáctica magna.", "El Emilio."], "c": 1, "e": "El checo Juan Amós Comenio \"reorganizó los conocimientos pedagógicos en su Didáctica magna\"."}, {"q": "¿Qué filósofo ilustrado escribió el libro \"Emilio\", examinando las influencias de la naturaleza y sociedad para no deformar al niño?", "o": ["John Locke.", "Jean-Jacques Rousseau.", "Juan Enrique Pestalozzi."], "c": 1, "e": "El ginebrino Jean-Jacques Rousseau, en su Emilio, examina los influjos de la naturaleza y de la sociedad para formar al niño."}, {"q": "Charles Darwin también fue pionero en los estudios del desarrollo infantil al publicar en 1887 la obra:", "o": ["El alma del niño.", "Estudio biográfico de un bebé.", "La evolución de las especies infantiles."], "c": 1, "e": "El propio Darwin fue autor de un famoso trabajo sobre su hijo llamado \"Estudio biográfico de un bebé\" (1887)."}, {"q": "El alemán Wilhelm Preyer publicó en 1882 un estudio sistemático dedicado al desenvolvimiento de las potencialidades mentales (\"psicogénesis\"). ¿Cómo se titula?", "o": ["El alma del niño.", "Paidología general.", "Crecimiento y desarrollo mental."], "c": 0, "e": "Entre los estudios más sistemáticos se cuenta el libro \"El alma del niño\" (1882) del alemán Wilhelm Preyer."}, {"q": "En 1896, el alemán Oscar Chrisman propuso un nombre para una disciplina especial que uniera la biología, anatomía y psicología del niño. Lo llamó:", "o": ["Psiquiatría evolutiva.", "Ortogenia.", "Paidología."], "c": 2, "e": "Oscar Chrisman propuso que el estudio global se denominara \"paidología\", del griego pais (niño) y logos (tratado)."}, {"q": "Alfred Binet, figura esencial en la psicología infantil francesa, tenía formación inicial académica como:", "o": ["Licenciado en derecho y doctor en ciencias naturales.", "Ingeniero físico.", "Sacerdote escolástico."], "c": 0, "e": "El texto menciona que Alfred Binet era \"licenciado en derecho y doctor en ciencias naturales\"."}, {"q": "Binet fundó en 1895 una importante revista de psicología experimental llamada:", "o": ["Mind.", "L'Année Psychologique.", "The Psychological Review."], "c": 1, "e": "Binet \"fundó una revista importante, L'Année Psychologique (1895)\"."}, {"q": "¿Qué acontecimiento histórico-social impulsó en Francia la necesidad del test de inteligencia de Binet?", "o": ["La Primera Guerra Mundial y el reclutamiento.", "La implantación de la escolarización obligatoria a finales del siglo XIX.", "Una epidemia de polio en París."], "c": 1, "e": "\"A finales del siglo XIX, en Francia se implantó la escolarización obligatoria\". Los maestros necesitaban detectar a alumnos discapacitados, propiciando la creación del test."}, {"q": "Binet concebía la inteligencia a través de cuatro dimensiones que integran una función compleja. Estas son:", "o": ["Sensación, percepción, memoria y atención.", "Comprensión, invención, censura y dirección.", "Frecuencia, longitud, concreción e imaginabilidad."], "c": 1, "e": "Concebía la inteligencia con cuatro dimensiones: comprender (comprensión), buscar/reunir (invención), separar lo valioso (censura), y mantener el camino (dirección)."}, {"q": "En junio de 1905, Binet publica la primera \"escala métrica de la inteligencia\" junto a su colaborador:", "o": ["Édouard Claparède.", "Théodore Simon.", "William Stern."], "c": 1, "e": "Trabajó en su realización con su colaborador Théodore Simon y en junio de 1905 publican su \"escala métrica de la inteligencia\"."}, {"q": "El test de Binet-Simon organizó las preguntas ajustadas a:", "o": ["Los niveles de clase/edades cronológicas de los niños.", "El tamaño craneal medido por frenología.", "El nivel económico de los padres."], "c": 0, "e": "Establecieron preguntas ajustadas a la escala de edades, seleccionando aquellas que la mayoría de los sujetos de esa edad contestaban correctamente."}, {"q": "La escala de Binet originó el concepto que indicaba el \"nivel de competencia\" del sujeto, independientemente de sus años de vida. Esto se denominó:", "o": ["Edad madurativa.", "Edad mental.", "Inteligencia fluida."], "c": 1, "e": "Obtuvo el concepto de \"edad mental\", señalado por el nivel de competencia del sujeto, que podía ser mayor o menor que la cronológica."}, {"q": "Según la escala Binet-Simon, para que un retraso intelectual fuera considerado \"patológico\", debía existir una diferencia entre edad mental y cronológica de:", "o": ["6 meses.", "1 año.", "Dos o más años."], "c": 2, "e": "El texto especifica que \"Un retraso de dos o más años vino a ser considerado patológico\"."}, {"q": "¿Quién propuso el índice llamado \"Cociente de Inteligencia (CI)\"?", "o": ["William Stern.", "Alfred Binet.", "Henry H. Goddard."], "c": 0, "e": "Un psicólogo alemán, William Stern, propuso este índice dividiendo \"edad mental\" entre \"edad cronológica\" y multiplicando por 100."}, {"q": "Según la fórmula del CI de Stern, ¿cuál es el valor exacto para los sujetos normales o promedio?", "o": ["50.", "100.", "120."], "c": 1, "e": "\"Su valor es igual a 100 para los sujetos normales, por encima para superdotados, y por debajo para discapacitados\"."}, {"q": "En 1916, Lewis M. Terman realizó una importantísima adaptación y revisión estadounidense de la escala Binet. ¿Cómo se conoce a esta revisión?", "o": ["Revisión Wechsler.", "Revisión Stanford.", "Revisión Yale."], "c": 1, "e": "En 1916 Lewis M. Terman hizo una importante revisión, la Revisión Stanford (revisada de nuevo en 1937)."}, {"q": "La primera escala de Binet de 1905 constaba de 30 ítems, pero en la revisión de 1911 sumaba un total de:", "o": ["100 ítems.", "66 ítems.", "10 ítems."], "c": 1, "e": "La primera escala tuvo 30 ítems, y en 1911, cada edad tenía 5, con un total de 66."}, {"q": "Analizando a sus hijas, Alice y Madeleine, Binet estudió el razonamiento y concluyó que el pensamiento humano frecuentemente opera:", "o": ["\"Sin imágenes\", realizando operaciones sintéticas adaptativas independientes de lo sensible.", "Únicamente asociando imágenes visuales de alta resolución.", "De manera puramente matemática y algorítmica."], "c": 0, "e": "Reconoció que el pensamiento opera frecuentemente \"sin imágenes\", resolviendo operaciones independientemente de los contenidos sensibles."}, {"q": "En estos mismos estudios con sus hijas, Binet descubrió distintos tipos de personalidad mental, contraponiendo a la hija extravertida/observadora con la hija:", "o": ["Introvertida e imaginativa.", "Agresiva y dominante.", "Melancólica y depresiva."], "c": 0, "e": "Contrapuso la categoría de \"introvertida e imaginativa\" de una de ellas a la \"extravertida y observadora\" de la otra."}, {"q": "El libro de Binet del año 1900 que influyó notablemente en la psicología forense y en los testimonios de testigos se titula:", "o": ["La sugestibilidad.", "Psicopatología judicial.", "Memoria de testigos."], "c": 0, "e": "Su libro sobre \"La sugestibilidad\" (1900) influyó mucho en la psicología forense y el testimonio de testigos."}, {"q": "¿Cómo se denomina al último libro de Binet que ha sido considerado su \"balance y testamento pedagógico\"?", "o": ["Paidología estructural.", "Las ideas modernas sobre los niños.", "Ensayo sobre el alma infantil."], "c": 1, "e": "Su último libro \"Las ideas modernas sobre los niños\" ha sido considerado como su balance y testamento pedagógico."}, {"q": "Según los ejemplos de la Escala de Binet y Simon (1911), repetir 7 cifras o interpretar hechos es una tarea propia de niños de:", "o": ["5 años.", "8 años.", "13 años."], "c": 2, "e": "La figura 1 muestra explícitamente que la Edad XIII (13 años) requiere repetir siete cifras e interpretar hechos."}, {"q": "Según los ejemplos de la Escala de Binet y Simon (1911), ¿qué se le exige a un niño en la Edad V (5 años)?", "o": ["Interpretar hechos históricos.", "Copiar un cuadrado y comparar dos pesos.", "Contar de 20 a 0."], "c": 1, "e": "A los 5 años se les pide: Compara dos pesos, copia un cuadrado y repite una frase de 10 sílabas."}, {"q": "¿Por qué es fundamental para la enseñanza y los maestros la existencia de \"criterios evolutivos\" infantiles?", "o": ["Porque limitan los salarios del personal docente.", "Porque sirven de norma respecto a qué puede y debe enseñarse en cada edad y qué métodos usar.", "Porque demuestran que el ambiente no influye absolutamente nada en la mente."], "c": 1, "e": "Los criterios evolutivos son guía y norma de lo que el sujeto puede aprender, lo que se debe enseñar en cada edad y los métodos óptimos."}, {"q": "La concepción del niño varía históricamente. En 1989, frente a sociedades donde el niño es explotado o abandonado, las Naciones Unidas proclamaron:", "o": ["Los derechos del niño, como norma protectora.", "La prohibición total del test de Binet.", "La obligatoriedad del trabajo infantil a los 14 años."], "c": 0, "e": "Esas diferencias impulsaron a las Naciones Unidas, en 1989, a hacer una solemne proclamación de los derechos del niño."}, {"q": "¿Qué destacado psicólogo suizo fundó en Ginebra el \"Instituto Jean-Jacques\" para aunar psicología y educación?", "o": ["Jean Piaget.", "Édouard Claparède.", "Théodore Simon."], "c": 1, "e": "Édouard Claparède (1873-1941) fundó en Ginebra un centro de fama internacional, el Instituto Jean-Jacques."}, {"q": "Respondiendo a \"¿para qué sirve la infancia?\", Claparède afirma que es una etapa muy útil porque en ella domina:", "o": ["La maduración estática inmodificable.", "La imitación mecánica ciega.", "La plasticidad, que permite aprender y adaptarse mediante el juego y la imitación."], "c": 2, "e": "Para Claparède la infancia es \"una etapa donde domina la plasticidad, que permite aprender\" mediante juego e imitación adaptándose al entorno."}, {"q": "Para lograr un desarrollo correcto en el niño, Claparède propone una regla básica para el maestro. ¿Cuál es?", "o": ["Sustituir rápidamente los motivos del niño por los objetivos del adulto.", "Que el maestro ha de aprender del niño, respetando sus intereses y motivos propios.", "Eliminar completamente el juego del aula educativa."], "c": 1, "e": "No se pueden sustituir los motivos del niño por los del adulto, \"el maestro ha de aprender del niño\", respetando sus intereses y motivos."}, {"q": "La visión de Claparède coincide plenamente con los postulados de la pedagogía de:", "o": ["La Escuela Nueva.", "La Escuela Conductista Radical.", "La Escolástica Medieval."], "c": 0, "e": "El texto menciona textualmente: \"En esto coincide plenamente con la llamada Pedagogía de la Escuela Nueva.\""}, {"q": "Paralelamente a quienes enfatizaban el aprendizaje, autores como Arnold Gesell pusieron el acento del desarrollo en:", "o": ["La plasticidad ilimitada del cerebro humano.", "Las puras experiencias ambientales y sociales.", "La maduración biopsíquica regida por la herencia (sistema neuroendocrino)."], "c": 2, "e": "Surgió una corriente paralela (representada por Gesell) que \"estudiaba el desarrollo biológico y psicológico desde la perspectiva de la maduración biopsíquica\" dictada por la herencia."}, {"q": "Arnold Gesell creó y dirigió durante años una famosa clínica de desarrollo infantil ubicada en:", "o": ["La Universidad de Harvard.", "La Universidad de Yale.", "La Universidad de Ginebra."], "c": 1, "e": "Arnold Gesell (1880-1961) creó y dirigió durante años una clínica de desarrollo infantil en la Universidad de Yale."}, {"q": "Para Gesell, el individuo ejercita conductas para las que su organismo le ha capacitado previamente mediante cambios biológicos, tales como:", "o": ["La mielinización de las vías nerviosas.", "El trauma del nacimiento.", "Las fobias condicionadas ambientalmente."], "c": 0, "e": "Menciona como ejemplos el funcionamiento de sistemas biológicos, \"por ejemplo, la mielinización de las vías nerviosas, la maduración de los órganos sexuales...\"."}, {"q": "Según Gesell, la variable principal que determina en buena medida la conducta y permite establecer pautas seriadas es:", "o": ["El estatus económico.", "La \"edad\".", "La educación escolar."], "c": 1, "e": "La conducta \"está en buena medida determinada, dentro de ciertos límites, por la variable 'edad'\", sirviendo para establecer secuencias evolutivas normales."}, {"q": "Gesell concebía que la infancia, antes que \"plasticidad\", significaba primordialmente:", "o": ["Una época demoníaca a corregir.", "\"Inmadurez\", falta de plena potencialidad y desarrollo reglado genéticamente.", "Etapa de total conocimiento inconsciente."], "c": 1, "e": "\"Para Gesell la infancia significa ante todo 'inmadurez', falta de plena potencialidad y desarrollo, y no tanto plasticidad o entrenamiento\"."}, {"q": "Para Gesell, las influencias ambientales frente al proceso innato de crecimiento orgánico tenían únicamente un valor:", "o": ["Determinante al 100%.", "Modulador.", "Inexistente y nulo."], "c": 1, "e": "La tendencia del crecimiento representaba la causa principal y \"a su lado, las influencias ambientales tenían solo un valor modulador de aquella\"."}, {"q": "A nivel metodológico, además de utilizar parejas de gemelos, Gesell destacó por:", "o": ["Grabar películas de las secuencias de desarrollo natural (observación cualitativa).", "Realizar autopsias en sujetos con retraso.", "Prohibir el uso del cronómetro en la clínica infantil."], "c": 0, "e": "\"Aplicó técnicas cualitativas... por ejemplo, grabó películas con secuencias de desarrollo\", observando el desarrollo \"ecológico\"."}, {"q": "En su estudio con gemelos (donde analizó 612 datos separados de conducta), los resultados le indujeron a pensar fuertemente que:", "o": ["El aprendizaje ambiental anula cualquier rastro biológico.", "Eran los genes los que gobernaban en gran medida el comportamiento (encontró correspondencia exacta en 513 de ellos).", "Los gemelos no presentaban ninguna similitud madurativa."], "c": 1, "e": "La correspondencia casi exacta en 513 de 612 datos conductuales \"le condujo a pensar que eran los genes, más que el medio, los que gobernaban en gran medida el comportamiento\"."}, {"q": "Gesell se mantuvo en una posición absolutamente irreductible frente a una escuela psicológica imperante. ¿Cuál?", "o": ["El Funcionalismo clásico.", "El Estructuralismo introspectivo.", "El Conductismo, ya que éste minusvaloraba la herencia."], "c": 2, "e": "\"Gesell mantuvo una posición irreductible al conductismo, que minusvaloraba la herencia a favor del peso del aprendizaje\"."}, {"q": "En el esquema general del funcionalismo, los fenómenos psíquicos:", "o": ["Aparecen desconectados de cualquier actividad vital física.", "Son mecanismos que posibilitan y mantienen la vida del sujeto.", "Solamente importan si pueden ser divididos en sus átomos simples constituyentes."], "c": 1, "e": "\"Se ha de comenzar por admitir que los procesos mentales son unos determinados procesos vitales; por lo pronto, son funciones que posibilitan y mantienen esa vida\"."}, {"q": "Según James, una de las grandes funciones de la conciencia y la memoria a la hora de sobrevivir es que permiten:", "o": ["Recordar el trauma de nacimiento con precisión absoluta.", "Contrapesar la fuerza de lo inmediato, abriendo un abanico de posibilidades ante un estímulo.", "Detener los latidos cardiacos voluntariamente."], "c": 1, "e": "\"La memoria de experiencias pasadas permite en numerosas ocasiones contrapesar la fuerza de lo inmediato, y abre un abanico de posibilidades\"."}, {"q": "El filósofo empirista inglés pionero en redactar un Tratado sobre la educación de los niños en 1693 fue:", "o": ["William James.", "John Locke.", "John Dewey."], "c": 1, "e": "Fueron los empiristas quienes acentuaron la educación: \"John Locke escribió un Tratado sobre la educación de los niños (1693)\"."}, {"q": "En relación al CI (Cociente de Inteligencia), el texto nos aclara terminológicamente en la sección de conceptos que:", "o": ["Se trata de un \"coeficiente\" estático aleatorio.", "Es un \"cociente\", al ser estrictamente el resultado de dividir la edad mental por la cronológica.", "Es la resta logarítmica de la desviación estándar poblacional."], "c": 1, "e": "En Conceptos Básicos aclara: \"No es un coeficiente... sino que es un cociente, porque es el resultado de dividir la edad mental... por la cronológica\"."}, {"q": "La teoría de la emoción de James, según la Autocomprobación 1, afirma que si vemos un objeto atemorizador:", "o": ["Primero surge la vivencia de miedo, luego el mandato cortical a los músculos y por último huimos.", "El individuo automáticamente huye (reacción) y, al percibir su cerebro que ya huye, surge el miedo.", "El tálamo bloquea la huida hasta que el córtex lo apruebe tras meditar."], "c": 1, "e": "En Solución 1 se especifica: Estimulación -> El individuo automáticamente huye -> \"Al percibir su cerebro que ya está huyendo, entonces tiene la vivencia del temor\"."}, {"q": "¿Por qué Claparède opina que \"el maestro ha de aprender del niño\"? (Solución autocomprobación 2):", "o": ["Porque los niños contemporáneos nacen con un saber innato de física cuántica superior al adulto.", "Para poder educarle adecuadamente, el maestro debe conocer antes cómo es la mente y personalidad del alumno.", "Para invertir los roles jerárquicos y acabar con la disciplina autoritaria escolar."], "c": 1, "e": "En Solución 2: \"El maestro tiene que educar al niño sabiendo cómo es la mente y personalidad de éste... por eso primero tiene que aprender cómo es el niño\"."}, {"q": "El psicólogo estadounidense Granville Stanley Hall, discípulo de James, comprobó la necesidad educativa de enseñar a los niños:", "o": ["Conceptos básicos relacionados con su mundo, tras evaluar los contenidos de sus mentes.", "Exclusivamente álgebra avanzada desde los 3 años.", "Trabajos manuales frenológicos en el laboratorio."], "c": 0, "e": "Publicó un trabajo sobre los contenidos de las mentes de los niños (1883) \"y comprobó la necesidad de enseñarles los conceptos básicos relacionados con su mundo\"."}, {"q": "Binet, al concebir la inteligencia humana, estableció que esta se componía de unas dimensiones (comprensión, invención, censura y dirección). A esto se le considera una función:", "o": ["Simple y atomizada.", "Compleja, que va madurando durante la infancia y puede sufrir perturbaciones patológicas.", "Biológicamente inmutable desde el nacimiento."], "c": 1, "e": "Se afirma que \"integran una función compleja, que va madurando durante la infancia, y que puede presentar perturbaciones\"."}, {"q": "Al analizar un fenómeno o vivencia (como \"ver una mesa\"), James indica que si esta experiencia se agrupa junto a \"otras mesas vistas\", \"tiendas de muebles\", etc., funciona psicológicamente como:", "o": ["Corriente de pensamiento (subjetividad).", "Una reacción puramente periférica (emoción).", "Una cosa (núcleo de objetividad)."], "c": 2, "e": "Si se integra con \"otras mesas vistas\", etc., \"entonces todo se reúne bajo el núcleo de mesa como una cierta objetividad (hace de cosa)\"."}, {"q": "Para que un hábito logre consolidarse en las rutas nerviosas facilitando respuestas rápidas y mecanizadas, se hace indispensable:", "o": ["El trauma infantil.", "La repetición (lo que primero es consciente, por repetición se mecaniza).", "Eliminar la mielina del sujeto."], "c": 1, "e": "\"Primero la respuesta se hace de modo consciente, pero gracias a la repetición se mecaniza\" creando la nueva vía de descarga."}, {"q": "El \"yo puro\", como conocedor integrador para James, ¿con qué concepto filosófico previo corría el riesgo de ser confundido y que James rechazaba utilizar en su análisis positivista?", "o": ["Con el \"Alma\" metafísica tradicional.", "Con la glándula pineal.", "Con el Ello freudiano."], "c": 0, "e": "El \"pensador\", dice el texto, \"muchos lo confundirían con la idea de 'alma', pero James no podía hacer eso para mantenerse firme en el análisis de fenómenos\"."}, {"q": "Gesell, al observar un marcado desfase o grave discrepancia en las secuencias madurativas y evolutivas normales de un niño (como la de andar a 1 año), lo interpretaría como síntoma de:", "o": ["Mala educación moral de los padres.", "Que algún defecto orgánico puede estar viciando su proceso de ontogenia (desarrollo biológico individual).", "Falta exclusiva de juego e imitación en preescolar."], "c": 1, "e": "\"Una grave discrepancia en el desarrollo de un niño puede ser indicativo de que algún defecto orgánico puede estar viciando su proceso de ontogenia\"."}, {"q": "Según el apartado \"Concepto de desarrollo\", ¿cuál es la diferencia nuclear entre estudiar el \"desarrollo\" madurativo de Gesell frente al campo del \"aprendizaje\"?", "o": ["En el aprendizaje importa la maduración endocrina, en el desarrollo importa el castigo operante.", "En el desarrollo importa la herencia y las pautas biopsíquicas, mientras que en los cambios del aprendizaje importa la experiencia.", "No hay diferencia técnica alguna; los conductistas y Gesell defendían lo mismo."], "c": 1, "e": "\"El estudio del desarrollo... se refiere a un campo distinto al del aprendizaje. Aquí importa la experiencia, mientras que en aquel importa la herencia\"."}];
let questions=[...originalQuestions],current=0,score=0,missed=[],retryMode=false;

function loadQuestion(){
let q=questions[current];
document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='Psicología de la Adaptación: funcionalismo, pragmatismo, William James, Binet, Claparède y Gesell.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}
loadQuestion();
</script>
