dividir pragmáticamente la ruta de la meta inmensa o enorme objetivo ideal colosal irrealizable al instante en su campo, y dar y dar forma a \"tensiones parciales operativas psicológicas pequeñas asimilables e intermedias como los medios y los instrumentos pequeños y peldaños para el fin último mayor de la vida real material de ese instante\"; a esas diminutas y operativas y útiles tensiones y propósitos de segundo orden o de medios intermedios utilitarios de la vida Lewin los ha formalizado, designado y bautizado académicamente en su teoría y matriz con el término científico y técnico original suyo germánico adoptado al español asombroso e inconfundible mundialmente y exclusivo y único formal característico irrepetible técnico exacto e indudable de las formales:", "o": ["Supersticiones irracionales e ideas delirantes clínicas catatónicas profundas de represión patológica y neurosis de escape oníricas irreales y fantasías disociadas esquizoides psicóticas irreversibles agudas profundas o fobias pavlovianas inhibitorias letárgicas o silentes viscerales.", "Cuasinecesidades (las tensiones parciales y pequeñas que concretan o aterrizan un poco más el propósito o meta genérica del sujeto, asumiéndolo prácticamente a modo de medios para fines, permitiéndole y posibilitando ir logrando cumplir escalonadamente y progresivamente todo el proyecto vivo existencial).", "Fuerzas nucleares débiles electromagnéticas radioactivas letales alfa puras silentes invisibles subatómicas muertas inanimadas radiactivas puras y muertas sin materia ni forma macro atómica real viva de organismo complejo molar animal somático vertebrado con sistema nervioso u orgánico o tejido de neuronas vivo."], "c": 1, "e": "\"...generan los propósitos y lo que llama «cuasinecesidades», que son tensiones parciales psicológicas que concretan el propósito general que mueve al sujeto (como ocurre con los medios para un fin), y que permiten ir cumpliéndolo por pasos sucesivos.\""}, {"q": "Ante la obvia e imperiosa gran necesidad matemática de dotar a una novísima, abstracta, resbaladiza y cualitativa naciente ciencia o sistema del campo social biográfico psicológico inmaterial interactivo fluido vital dinámico germánico o de las interrelaciones puras formales y movimientos existenciales de los humanos invisibles inmateriales, de un robusto, firme, duro y validado ropaje estricto científico algebraico duro y matemático, de grafos, dibujos de fronteras lógicas, figuras de posición u origen y vectores numéricos en el papel para que los colegas científicos le respetaran en occidente en un mundo mecanicista que amaba los metros llanos absolutos y cifras de los galgos pavlovianos de laboratorio biológico en básculas o en cronómetros eléctricos somáticos molares exactos de décima de segundo, el doctor Lewin apostó, adoptó e implementó valientemente (con fe e ingenio sin parangón en el momento histórico en el que no había casi ordenadores ni simuladores algorítmicos complejos sociológicos de campo de partículas asimilables macro sociológicas fluidas como la sociedad de la época viva tensa y conflictiva) los postulados espaciales maleables dúctiles abstractos del \"análisis de la posición e interrelación constante\", adoptando los modelos y figuras que ofrecen y manejan los matemáticos especialistas y puros en qué rama exótica analítica abstracta específica de las ciencias duras físicas matemáticas universitarias asombrosa genial topográfica formal posicional de figuras y sus bordes llamada e identificada universalmente hoy día en las aulas la:", "o": ["Estadística descriptiva biométrica puramente campanal de Gauss probabilística azarosa inorgánica correlacional abstracta y aislada numérica atomista muerta sin contexto de forma espacial biológica física orgánica espacial representativa.", "Topología (como ciencia de las figuras y el espacio, transformaciones que permanecen estables aunque el contorno o campo se dilate o se modifique y encoja en fronteras biográficas espaciales o del entorno vital tenso, permitiéndole o posibilitándole trazar el mapa general general cartográfico riguroso asombroso predictivo que determina qué transformaciones y acontecimientos son lógicamente plausibles o y cuáles en verdad están bloqueados y no en ese mundo personal existencial vital particular único humano).", "Aritmética lineal deductiva aritmética euclidiana plana platónica de Platón de Pitágoras esotérica religiosa sectaria abstracta inútil pitagórica silente hermética religiosa teológica pura en latín decimonónica asilar eclesiástica clerical aislada pasiva sin aplicación pragmática utilitaria vital real sociológica alguna viva material palpable de seres en constante devenir tenso existencial cotidiano urbano occidental."], "c": 1, "e": "\"Creyó que la formalización que mejor cuadraba con la psicología era la rama de la matemática que se conoce como topología. Se considera como una ciencia que se ocuparía del «análisis de posiciones»... busca las propiedades de las figuras que permanecen cuando son deformadas...\"."}, {"q": "Complementando a los estudios topológicos de fronteras o de bordes, para representar o plasmar gráficamente en el papel de forma rotunda y sencilla o visible y muy diáfana las fuerzas vivas internas e interrelacionales empíricas biográficas intensas o direccionales motivadoras reales e impulsoras y tensiones latentes que impulsaban o repelían a los pacientes y sus decisiones lógicas u existenciales conflictivas y a la persona concreta en liza, se apoyó de nuevo Lewin maravillosamente importando o prestando herramientas puramente geométricas de magnitud espacial abstracta en flechas como indicadores, siendo este elemento matemático de magnitud asimilativa direccional clave designado conceptual y formal y oficialmente desde antaño como la figura matemática abstracta con flecha o direccional bautizada técnica o formalmente y por todos conocida universalmente a la que Lewin decidió sabiamente llamar como el útil u indicador formal:", "o": ["Vector (que representa e indica diáfana y lógicamente la magnitud o el peso e indicando y marcando además a la vez la innegable e importantísima flecha de destino de dirección clara hacia dónde asimilativamente o a qué polo el humano situado en el origen se desplaza, se siente asimilado inclinado empujado o dirigido y proyecta orientar y dirigir todos sus actos metas u energías vivas vitales biológicas en el campo y con cuánta inmensa o leve e insoportable intensidad acudirá veloz hacia ella en el plano y situación dada presente al fin).", "Reflejo condicional somático aversivo salival estático sordo puro inamovible ciego vegetativo instintivo incondicional heredado mudo genético purista celular atómico microscópico inerte y estático e inamovible e invisible.", "Condensador estático galvánico y termoeléctrico pasivo puramente molecular atómico subcelular radiactivo puro electromagnético no medible letárgico inanimado que congela el pensamiento analítico abstracto inactivo orgánico molecular."], "c": 0, "e": "\"Las fuerzas que operan en ese campo decidió representarlas mediante representaciones vectoriales. En geometría, un vector es la representación gráfica de una magnitud que a la vez marca una dirección; es decir, es un signo que indica hacia dónde y con qué intensidad se desplazará aquel punto que es el «origen»...\"."}, {"q": "Los individuos, según constata empíricamente a la luz del análisis biográfico o psicológico del campo el pensador Lewin de la psicología social ecológica al analizarlos, nunca se proponen utopías suicidas inviables absurdas o descabelladas disparatadas alocadas por sistema ciego repetitivamente sin cesar chocando de frente e insistiendo como idiotas pavlovianos animales molares viscerales estériles irracionales y, por puro corolario relacional deductivo inverso biográfico tampoco asimilativamente se dignan lógicamente o bajan al absurdo y al tedio infame mortecino inútil u oneroso e improductivo banal superfluo estéril fatuo nimio y sin valor biológico de perder en el lodo vital todo su precioso valioso e insustituible tiempo vital en objetivos insultantemente estúpidos, baladíes, absurdamente y asimilativamente fáciles o simplistas o nimios; todo este equilibrio asimilativo y cálculo interno personal sutil y complejo psicosocial evaluativo que calibra la balanza interior constante que realiza un ser humano al juzgarse en la biografía propia y frente a lo que se ve asimilado a exigir de sí y lo que le conviene asimilativamente retarse según los fracasos u asombrosos éxitos logrados y conseguidos en su historia, recibe técnicamente como invención académica el útil, famoso y conocido ilustre nombre o acuñación en la jerga de Kurt Lewin o de la literatura académica psicosocial como el asombroso indicador y marcador psicológico o rasgo asimilativo sociológico referenciado del:", "o": ["Nivel de aspiraciones (completamente moldeable, cambiante y biográfico vital personalísimo condicionado a los reveses existenciales u alegrías, y además muy relacional y condicionado al entorno, grupo o comparativa constante entre amigos pares o congéneres vecinos o compañeros que operan fijando metas racionales sanas adaptativas pragmáticas vivas asimilativas orgánicas e interaccionales).", "Nivel o estado estéril catatónico profundo vegetativo y abúlico de neurosis aguda terminal histérica de trauma infantil onírico o psicoanalítico instintivo y atávico del subconsciente profundo heredado filogenético silente edípico.", "Gradiente ciego pavloviano instintivo motor de secreción asimilativa digestiva pancreática estéril sorda de inervación vascular aferente letárgica periférica atómica o mecanicista de Watson y Skinner puros sin consciencia ni pensamiento humano cognitivo representacional abstracto superior inteligente mediador reflexivo u introspectivo orgánico cortical humano de propósito consciente vital vivo grupal pragmático lógico topológico asimilativo social integrador empírico real empático solidario de \"dinámica de grupos\"."], "c": 0, "e": "\"Resulta así que cada persona tiene, en cada situación, un determinado «nivel de aspiraciones», que es modificable y que se va ajustando en función de los éxitos o fracasos... Ese nivel está relacionado con la autovaloración que el sujeto hace de sus capacidades y habilidades.\""}, {"q": "Durante el gran final y ocaso genial y fructífero maduro histórico de su carrera norteamericana y biografía académica (habiendo huido del exterminio asimilativo nazi antisemita letal europeo que diezmó la cuna germana asolando y asesinando e impulsando a huir la brillantez judía a occidente asimilada al fin y postrada salvada acogida y mimada subvencionada abrumadoramente en el campus e instalaciones con medios y doctorandos ilimitados y genios brillantes norteamericanos de enorme talento libre), Kurt Lewin funda un pionero campo empírico en Maine (EEUU) y pone en marcha colosal y visionaria y pragmáticamente a un grupo y seminario asombroso que será la punta de lanza inmortal y referenciado masivamente en empresas, universidades y pedagogías sociales del que beberá toda la élite posterior capitalista sociológica constructiva formadora en pedagogía grupal u organizativa global de postguerra para organizar equipos; a esta corriente de la psicología práctica formadora nacida de la teoría topológica u grupal ecológica de interrelación mutua constructiva pragmática y que fue dirigida magistral y gloriosamente luego en su madurez asimilada asombrosamente por los astutos e insignes discípulos geniales pioneros mundiales prolíficos como Festinger, Cartwright o Zajonc u Zander y tantos de la cumbre oficial mundial asimilada en la APA de la posguerra dorada, se la identifica rotunda y unánime referencialmente a nivel literario oficial como la famosa grandiosa y útil escuela sociológica o práctica investigadora formal nacida de él en asombrosa plenitud o disciplina general de análisis de los entornos llamada la gloriosa:", "o": ["La parapsicología del trance y la telequinesia lúgubre estéril charlatana victoriana pasiva aislada supersticiosa mágica puramente irracionalista del ocultismo londinense burgués sordo.", "La eugenesia biométrica asilar somática cranial estructuralista de laboratorio germano racista elitista segregador de la supremacía instintiva del peso craneal occipital puro ciego de la frenología de Gall y Lombroso criminal nato y extinto en prisiones estériles inorgánicas oscuras y cerradas de la psiquiatría rancia inmovilista decimonónica del horror pasivo muerto sordo alienado del frenopático manicomial ciego gótico sordo represivo medieval inorgánico molecular mudo.", "Dinámica de grupos (rama o investigación para el desarrollo, análisis u arte organizativo de la dirección cooperativa sana asimilada práctica vital social productiva analítica de tareas orgánicas asimilativas constructivas libres sociales reales empíricas y útiles colectivas humanas en el ámbito del mundo vivo, escuelas y el trabajo y de tensiones sociológicas que fue iniciada vitalmente tras sus postulados empíricos pioneros de Maine en 1945 liderada póstumamente por toda una cohorte y ola de mentes doradas de discípulos estelares)."], "c": 2, "e": "\"Una consecuencia de todo ello fueron las investigaciones sobre «dinámica de grupos», realizadas por sus discípulos más destacados... Lewin puso en marcha, en 1945, un laboratorio en Bethel... en el arte de organizar y dirigir tareas colectivas.\""}, {"q": "Para probar asombrosa, fáctica e incuestionablemente el incalculable, abrumador y gigantesco impacto decisivo ambiental e invisible relacional inmaterial, el poder y la brutal opresión psicológica topográfica del entorno y el clima del grupo u atmósfera psicosocial comunal que asfixia u oprime e insufla valencia o tensión que permea el espacio vital existencial y coacciona de forma invisible biológica somática el alma del individuo maleable humano social indefenso y niño tierno maleable frente a la presión colectiva, Kurt Lewin, de manera pionera inmortal y brillante con sus inseparables e insignes coautores e investigadores brillantes R. Lippitt y R. K. White (en su célebre, histórico y asombroso estudio o experimento de 1939 \"climas sociales creados experimentalmente\"), organizó intencionalmente con rigor inaudito tres modelos asimilativos o climas puramente cerrados separados diferentes antagónicos y herméticos formales grupales de clases de chavales de entre diez o doce años. Entre los asombrosos y trágicos o diáfanos e iluminadores descubrimientos recabados de forma patente cruda asombrosa por el estudio en cuestión y citados en el texto con claridad, descubrió horrorizado u asombrosamente pero con rigor estadístico y visual biográfico topológico irrefutable, que había específicamente un tipo u clima de organización escolar forzado experimental impuesta que, por desgracia evidente o trágica previsible aversiva o tóxica, generaba de manera asimilativa, sistemática y patente sin escape y en cascada u espiral trágica pautas asimilables opresivas asimiladas de cruda \"dominación sumisa o pautas agresivas tóxicas patentes de unos críos y sumisiones pasivas mudas temerosas u alienantes ciegas letárgicas oprimidas de otros muchos e instigaba o azuzaba, desviaba u enfocaba dramáticamente de modo perverso la fiera agresividad frustrada en bloque descargándola contra víctimas expiatorias inermes débiles inocentes del grupo a modo cobarde ciego de chivos expiatorios y asimilativos y que aniquilaba veloz y apagaba lúgubre y mortíferamente toda luz vital asimilativa apagando y demoliendo y borrando las caras vivas y las sonrisas vitales cooperativas tiernas simpáticas libres vivaces y apáticas asimiladas mudas temerosas aterrorizadas infames y letárgicas alienadas inertes de un grupo\". Este infausto, trágico, funesto, negro y opresivo modelo o ensayo perverso de clima perjudicial e insano se trataba empírica e innegablemente de toda obviedad o referenciada empírica oficial y técnicamente como el experimento o grupo de aula del clima o grupo sombrío escolar denominado:", "o": ["Grupo del modelo de Laissez-faire puro estricto ausente pasivo inoperante letárgico anónimo vacío sin maestro ni dictado e informe mudo aburrido pasota desidioso.", "Grupo del modelo Autoritario o clima de autocracia total absoluto coercitivo.", "Grupo del modelo Democrático asimilativo participativo horizontal u cooperativo simpático e igualitario sano equilibrado asimilativo constructivo."], "c": 1, "e": "\"mientras en el grupo autoritario aparecían pautas agresivas de dominación de unos sobre otros, y unos niños se sometían pasivamente al líder... Además, los niños del grupo autoritario resultaron manifiestamente mucho más sumisos al líder, y en ocasiones, dirigieron hacia un «chivo expiatorio» su agresividad...\"."}, {"q": "Por el polo absolutamente contrario, opuesto y luminoso, el estudio sociológico y pionero de dinámica asimilativa infantil y agresión u comportamiento de Lewin en sus grupos constató innegable empíricamente un resultado e hito esperanzador empírico real al vislumbrar palpable un modelo de aula en donde la agresividad hostil destructiva descendía notoriamente de modo estadístico claro y, en su lugar, se erigía, fortalecía, germinaba y brotaba con pujanza y vitalidad un ecosistema de interacciones evidentemente más \"amistosas, interrelacionadas positivas en su gran mayoría asimilada sana, participativas cooperativas equilibradas u constructivas\" y menos agresivas nocivas tóxicas o lesivas, logrando asombrosa e inusitadamente y sin esfuerzo en los alumnos mantener viva de verdad y patente empírica visible la vida asimilada feliz viva participativa, la expresividad u viveza empírica sin apagar rostros sonrientes letárgicos y pasivos. Este excepcional u asombrosamente positivo exitoso empírico y asimilado útil y esperanzador ensayo humano formativo constructivo grupal sano se correspondía innegablemente con la aplicación sociológica pragmática vital educativa social formadora directriz de base o del ambiente u clima y aula denominada referencial y técnicamente como el de:", "o": ["La escuela conductista skinneriana de condicionamiento de razón fija y castigo galvánico punitivo aversivo en jaulas insonorizadas somáticas viscerales ciegas letárgicas con ratas u palomas famélicas alienadas mudas.", "El modelo, clima asimilado u aula asimilativa del grupo Democrático u participativo (donde rige cooperación u participación activa vitalista).", "El modelo represivo u autoritario dictatorial férreo autocrático lúgubre germánico de castigo físico de castigos silentes y disciplina cuartelera prusiana estática de azotes y látigos irracionales atávicos edípicos silentes represivos."], "c": 1, "e": "\"...en el grupo democrático las interacciones eran más amistosas y positivas, y menos agresivas... El grupo amistoso, abierto y cooperativo, lleno de vida...\"."}, {"q": "Como hallazgo extremadamente llamativo, asombroso para el neófito lego ignorante simplista analítico profano al campo psicológico, y también para los profanos a la lectura analítica de la psicología, el ensayo o prueba de climas sociales escolares reveló una cruda verdad al evidenciar o exponer sorpresivamente u objetiva empírica innegable que \"la libertad absoluta silente y el vacío completo directivo humano sin ninguna figura ni líder aparente que guíe asimilativamente constructivamente y por sí solo u deje totalmente y por completo librados y ciegos y al azar pasota a los niños por sí mismos\", paradójica e inesperada pero estadísticamente con rigor formal inusitado real asombroso no desembocaba de manera mágica ingenua ni idílica en ningún rousseaniano bucólico místico mágico paraíso infantil puro terrenal romántico libre y pacífico místico, sino que por el contrario dicho estado de desamparo normativo inoperante e inorgánico arrojaba unas pasmosas y tristes preocupantes funestas cifras presentando unos espeluznantes u \"altísimos e innegables índices y picos de niveles agresivos agresivos asimilados y asombrosamente altos comparables y prácticamente análogos asimilativos o similares o iguales\" a los de la tiranía opresiva de la mismísima férrea pesadilla del grupo del dictador tiránico autocrático autoritario, sumado además con el agravante fáctico empírico e indicador de que en aquel maremágnum de vacío iban a su vez irrumpiendo u apareciendo aleatoria esporádicamente erráticos sublíderes opresivos caciques asimilados pasajeros según la marea caprichosa del grupo u momentos imprevisibles, sembrando el desgobierno nocivo y caótico alienante del caos inorgánico animal ciego o desorden agresivo. Este modelo de falso idilio fallido asimilativo vacío inoperante u pasota vacío estéril pernicioso u dañino se correspondía oficial, estadística referenciada en la historia u técnicamente con el ensayo y modelo del aula, doctrina, corriente u grupo pasivo nombrado y bautizado e innegociablemente denominado históricamente en francés literario u académico como el del modelo y ambiente de:", "o": ["Laissez-faire (dejar hacer, pasota, vacío, libertad total absoluta sin ningún modelo, guía ni de directriz alguna participativa ni de líder pasota pasivo).", "Terapia humanista incondicional asimilativa plena profunda rogeriana existencialista existencial mística zen o pasiva budista contemplativa irreal pura silente.", "Dinámica topológica cuántica lewiniana autocrática de la suma o resta geométrica de la Gestalt prusiana teológica medieval atávica ruda estricta dictatorial cínica pesimista atópica sorda mística mítica abstracta inútil muerta fósil muerta inoperante cínica letal pasiva."], "c": 0, "e": "\"Por otro lado, el grupo laissez-faire apareció presentando muy altos niveles de agresividad, análogos a los del grupo autoritario, aunque en él aparecían distintos líderes según las situaciones y momentos diferentes que se iban produciendo.\""}, {"q": "Lewin sacó una asombrosa, célebre y amarga o brillante asimilada profunda realista lección filosófica sociológica pragmática vital humanística y pedagógica final empírica de incalculable u enorme peso al comprobar la extrema velocidad, pasmosa inercia de caída libre pasiva letárgica y triste rapidez (apenas media hora veloz cronometrada en el primer maldito y sombrío fúnebre día) con la que un hermoso e interaccional libre cálido e idílico grupo activo o aula llena y radiante feliz de niños cooperativos democráticos vivos y sonrientes se hundió sumisa, pasiva, abúlica sombría aterrorizada o amedrentada silente cabizbaja letárgica obediente muerta pálida rindiéndose o claudicando muda pasiva como rebaño cobarde sordo o alienado ante un poder superior opresivo hostil frente al dictador en el experimento; al comparar aquella facilidad de decaimiento en esclavo sumiso letárgico asimilado al infierno autocrático, y enfrentarla al constatar luego a su vez por el contrario y reverso empírico constrastable lo muchísimo e inmensamente asimilado que \"cuesta esfuerzo de recuperación lenta laboriosa lenta o es muchísimo de costoso en tiempo y esfuerzo invertido o dedicación formadora o paciencia larga restaurar\" el camino de subida opuesto y contrario es decir intentar hacer retornar lenta asimilativamente costosa a un rebaño de esclavos mudos cobardes u apáticos sombríos hacia la libertad cívica y asimilarles participativamente como iguales democráticos sanos y vitales empáticos solidarios y cooperativos amables de nuevo sin violencia a través del tiempo, dictó como colofón, axioma y conclusión final una gran máxima política psicológica y pedagógica imponente mundialmente conocida que aseveraba textualmente o enseñaba pragmáticamente al mundo libre occidental textualmente literal que innegable e inapelablemente que:", "o": ["La genética puramente estructuralista y anatómica asilar forense criminal inorgánica abstracta de los cráneos muertos decide irremediable ciegamente irracional e instintivamente en letargo pre lógico e irreversible puro silente la moralidad abstracta pura de los salvajes en la tribu primitiva caníbal mística onírica de diván.", "La neurosis edípica y la histeria catatónica profunda mística y amnésica catártica vienesa pasiva burguesa freudiana en diván aristocrático ocioso determina el grado o volumen pasivo abúlico del nivel letárgico o silente del superego castrador somático.", "«La autocracia (y su miedo lúgubre) se impone y domina pasiva sumisamente e instantáneamente trágicamente sola imponiéndose violentamente sin resistencia real sólida al individuo de sopetón y golpe, mientras que por el reverso la convivencia y civilidad o la \"democracia\" es algo o modelo de valor inmenso frágil e inmenso o ideal humano sano que forzosamente y laboriosamente \"se ha de aprender asimilativamente con tiempo de sobra\" de asimilación constructiva»."], "c": 2, "e": "\"El cambio de la autocracia a la democracia parecía necesitar más tiempo que el de la democracia a la autocracia. La autocracia se impone al individuo. La democracia, la ha de aprender» (Lewin, 1973).\""}, {"q": "A modo de apretado y contundente resumen de la unidad para el alumno en su conclusión final y epílogo de la Gestalt, el texto recuerda contundentemente como eje directriz central que los trabajos pioneros insignes y los estudios fenomenológicos u empíricos magistrales holísticos de los genios germanos (Wertheimer, Köhler y Koffka, Lewin) combatieron implacablemente hasta la médula u desmintieron empíricamente siempre las frías descarnadas u absurdas y pobres e infecundas posturas \"elementalistas y asocianistas analíticas vacías cínicas inertes y miopes\", proclamando a los cuatro vientos, instaurando de manera oficial, y defendiendo para la historia u alzando irreductible incólume y magistral u opuesto a la física mecanicista o al modelo ciego estúpido instintivo silente mecanicista automático sordo soso inorgánico de la reflexología u escuela y conducta americana animal incondicionada inorgánica pasiva ciega estática del rígido y mudo estímulo-respuesta del conductismo extremo de la época (\"S\"-\"R\" puro de Watson), un nuevo y asombroso e integrador esquema dinámico de \"Toda una unidad o Totalidad perceptiva vital asimilativa viva macro\" global donde introducen como pivote esencial, corazón asimilador, rector, configurador e inteligible o director irremplazable, orgánico y activo la letra e intermediario asimilado de la organización del campo del \"Sujeto/Cerebro u Gestalt\" que estructura o filtra e impulsa de manera global todo, defendiendo y bautizando técnica u oficialmente a nivel académico para la eternidad el nuevo formato paradigmático representacional y superior complejo interactivo integrador y global del nuevo modelo de ecuación global denominado como el glorioso, famoso u oficial e histórico modelo asimilativo gestaltista humano e inteligente del:", "o": ["Modelo atómico puramente inorgánico y cuántico puro de inacción contemplativa inerte muerta y pasiva de estadística puramente eugénica racista y criminal asilar abstracta del peso óseo inerte y sordo pasivo cerebral y occipital.", "Modelo \"S\" - \"R\" puro molecular reflejo salival visceral gástrico parasimpático simple pasivo y catatónico y sordo medular asimilativo básico innato en la médula ósea y periférico.", "Modelo «S»-«O»-«R» (Estímulo - Organización/gestalt subyacente estructurada a través del asimilador cerebral o campo orgánico de fondo humano total vivo y constructivo u - Respuesta o reacción biológica asimilativa y propositiva humana molar)."], "c": 2, "e": "\"En lugar del modelo «S»-«R», los gestaltistas defendieron un modelo «S»-«O»-«R», donde «O» significa «organización», estructura, gestalt.\""}, {"q": "Finalmente, en la sección última de autocomprobación dirigida al aprendizaje del lector al fondo u final, al abordar asimilativamente de qué modo un sujeto inteligente y asimilativo de laboratorio llega u alcanza súbitamente sorpresivamente u alegremente por fin y lógicamente de lleno de sopetón tras analizar silente o bloqueado largamente a encontrar exitosamente con luz de manera plena satisfactoria coherente la anhelada de forma incesante resolución u solución abstracta correcta u inteligente brillante y oculta tras el telón a una adivinanza, barrera u situación matemática o de lógica trampa a la que se enfrentaba (ej. como descifrar con éxito la escondida regla matemática secreta abstracta de las casillas en la sucesión \"2, 4, 16, 256\" entendiendo lógicamente con un destello mental que su regla de repetición infinita subyacente de asimilación progresiva obedece a que \"cada nuevo número equivale inexorable a elevar e instaurar al cuadrado de su elemento anterior en la fila\"), el temario identifica oficial e incuestionablemente que en dicho instante de asimilación brillante, el psiquismo humano experimenta con enorme alivio alegre catártico u vivencial íntimo claro y fenomenológico una especial sensación reveladora vivencia clara, un fenómeno e iluminación interna intelectual de encaje perfecto del campo que de manera coloquial, y también técnica ya y literaria asimilada en la cátedra occidental y global se ha venido llamando o se describe de manera descriptiva exacta comúnmente e históricamente en las aulas universitarias asombrosa y vívidamente como el fenómeno o la famosa:", "o": ["Reacción gástrica espinal aversiva condicionada de segundo o tercer orden irradiado silente visceral del miedo escénico silente instintivo ciego visceral.", "Experiencia mística oculta mediúmnica letárgica del éxtasis inanimado catatónico inmovilizador de trauma amnésico o neurosis terminal o estupor estático e irreversibilidad profunda psiquiátrica clínica irreversible u alienación sádico letárgico asilar crónico profundo onírico somnílocuo irracional infantil puro primario.", "Vivencia del \"¡ajá!\" (el insight y de golpe sentir la vivencia y la exclamación interna profunda y gozosa liberadora intelectual íntima feliz del \"¡ahora ya lo comprendo!\")."], "c": 2, "e": "\"Cuando descubre esa relación o relaciones, entonces tiene la llamada vivencia del «ajá», esto es, la vivencia del «¡ahora ya lo comprendo!», y logra la solución. Así, si se le dice a un sujeto que nos diga, dada la serie...\"."}];

document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='Gestalt: percepción holista, figura-fondo, movimiento phi, insight, Köhler, Goldstein y teoría de campo de Lewin.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}
loadQuestion();
</script>
</body>
</html>
