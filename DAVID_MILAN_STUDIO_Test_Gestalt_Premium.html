<style>
:root{--gold:#d4af37;--gold2:#f3d98b;--bg:#05070d;--bg2:#0b1323;--txt:#f5f5f5;--muted:#aab3c5;--ok:#33d17a;--bad:#ff6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;min-height:100vh;background:
radial-gradient(circle at top left,rgba(212,175,55,.20),transparent 30%),
radial-gradient(circle at bottom right,rgba(50,90,180,.25),transparent 35%),
linear-gradient(135deg,var(--bg),var(--bg2),#05070d);
display:flex;justify-content:center;align-items:center;padding:30px;color:var(--txt)}
.container{width:100%;max-width:1000px;background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);border:1px solid rgba(212,175,55,.25);
border-radius:28px;padding:32px;box-shadow:0 25px 80px rgba(0,0,0,.45)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.4);color:var(--gold2);font-weight:800;letter-spacing:3px;margin-bottom:18px}
h1{font-size:52px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{margin:8px 0 25px;color:var(--muted);font-weight:400}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.stat{padding:12px 16px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:700}
.bar{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:20px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:.3s}
.card{padding:24px;border-radius:22px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08)}
.q{font-size:22px;font-weight:800;line-height:1.4;margin-bottom:20px}
.options{display:grid;gap:12px}
.opt{padding:15px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer;color:white;text-align:left;font-size:15px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
.opt:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.18)!important;border-color:var(--ok)!important}
.incorrect{background:rgba(255,107,107,.18)!important;border-color:var(--bad)!important}
.feedback{display:none;margin-top:18px;padding:18px;border-radius:16px;line-height:1.6}
.show{display:block}
.good{background:rgba(51,209,122,.12);border-left:5px solid var(--ok)}
.bad{background:rgba(255,107,107,.12);border-left:5px solid var(--bad)}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:14px 22px;border:none;border-radius:14px;font-weight:800;cursor:pointer}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111}
.dark{background:rgba(255,255,255,.08);color:white;border:1px solid rgba(255,255,255,.12)}
#results{display:none;text-align:center}
.medal{margin:15px auto;padding:12px 20px;border-radius:999px;border:1px solid rgba(212,175,55,.35);display:inline-block;color:var(--gold2)}
.missed{text-align:left;margin-top:20px;padding:18px;border-radius:16px;background:rgba(0,0,0,.2);line-height:1.55}
.missed h3{color:var(--gold2);margin-bottom:10px}
.missed ul{padding-left:20px}
@media(max-width:650px){.container{padding:22px}h1{font-size:36px}.q{font-size:18px}}

<script>
const originalQuestions=[{"q": "¿Qué escuela psicológica iniciada en Alemania floreció durante el primer tercio del siglo XX ofreciendo modelos diversos de explicación mental antes de ser desmantelada por el nazismo?", "o": ["La escuela conductista.", "La Escuela de la Gestalt, o psicología de la forma.", "La escuela estructuralista de Wundt."], "c": 1, "e": "El texto indica: \"Entre las que alcanzaron más relieve se encuentra la Escuela de la Gestalt, o la psicología de la forma, iniciada en Alemania y luego desmantelada allí durante el nazismo\"."}, {"q": "Tras el desmantelamiento de la escuela en Alemania por el nazismo, ¿hacia qué país emigraron sus representantes más notorios prolongando su influencia?", "o": ["A la Unión Soviética.", "A Francia.", "A los EE. UU."], "c": 2, "e": "El texto menciona que se prolongó \"singularmente en EE. UU. tras la emigración allí de sus más notorios representantes\"."}, {"q": "¿Quién fue el iniciador principal de la escuela de la Gestalt (1880-1943)?", "o": ["Max Wertheimer.", "Wolfgang Köhler.", "Kurt Koffka."], "c": 0, "e": "\"Su iniciador fue Max Wertheimer (1880-1943), psicólogo de ascendencia judía que tuvo la fortuna de hallar a su alrededor algunos discípulos...\"."}, {"q": "¿En torno a qué universidad organizó Max Wertheimer inicialmente al grupo fundacional de la Gestalt?", "o": ["Universidad de Viena.", "Universidad de Frankfurt.", "Universidad de Iowa."], "c": 1, "e": "\"Wertheimer organizó el grupo en torno a su cátedra de la Universidad de Frankfurt.\""}, {"q": "¿Qué psicólogo dirigió una estación experimental para el estudio de monos antropoides en la isla española de Tenerife?", "o": ["Kurt Lewin.", "Kurt Goldstein.", "Wolfgang Köhler."], "c": 2, "e": "\"Köhler dirigió una estación sostenida por la Academia de Ciencias de Berlín para el estudio de monos antropoides en la isla española de Tenerife...\"."}, {"q": "¿Qué institución científica era la encargada de sostener económicamente e impulsar la estación de chimpancés de Tenerife dirigida por Köhler?", "o": ["La Universidad de Iowa.", "La Academia de Ciencias de Berlín.", "El Instituto de Giessen."], "c": 1, "e": "Menciona explícitamente: \"estación sostenida por la Academia de Ciencias de Berlín para el estudio de monos antropoides en la isla española de Tenerife\"."}, {"q": "Tras emigrar a EE. UU., ¿cuál de los miembros fundadores de la Gestalt llegó a ser presidente de la Sociedad de Psicología Americana (APA)?", "o": ["Wolfgang Köhler.", "Max Wertheimer.", "Kurt Koffka."], "c": 0, "e": "Refiriéndose a Köhler: \"años después, en EE. UU., fue profesor y llegó a ser presidente de la Sociedad de Psicología Americana (APA).\""}, {"q": "¿Qué destacado discípulo del grupo, médico y neurólogo, desarrolló importantes investigaciones en neuropsicología tanto en Frankfurt como en EE. UU.?", "o": ["Karl Duncker.", "Kurt Goldstein.", "Kurt Lewin."], "c": 1, "e": "\"Goldstein, médico y neurólogo, fue también profesor en Frankfurt y luego en Berlín, desarrollando importantes investigaciones en neuropsicología.\""}, {"q": "¿A qué universidad estadounidense se trasladó Kurt Lewin donde creó un influyente grupo de investigación en psicología social y educativa promoviendo la \"dinámica de grupos\"?", "o": ["Universidad Humboldt de Berlín.", "Universidad de Iowa.", "Universidad de Giessen."], "c": 1, "e": "\"Finalmente, Lewin... emigró pronto y se instaló en la Universidad de Iowa (EE. UU.), donde creó un importante grupo de trabajo en psicología social y educativa, promoviendo el estudio de la dinámica de grupos\"."}, {"q": "¿Cuál era el nombre de la importante revista que sirvió como órgano de expresión científica y difusión para el grupo de la Gestalt?", "o": ["Journal of Social Psychology.", "Zeitschrift für Psychologie.", "Psychologische Forschung."], "c": 2, "e": "\"Todos ellos trabajaron en estrecha colaboración... y que tuvo como órgano de expresión una importante revista –Psychologische Forschung–\"."}, {"q": "Cuando el nazismo persiguió a los miembros judíos del grupo, hubo uno de ellos, el único no judío del grupo, que renunció a su cátedra y protestó solidariamente antes de refugiarse en EE. UU. ¿De quién se trata?", "o": ["Wolfgang Köhler.", "Max Wertheimer.", "Kurt Lewin."], "c": 0, "e": "\"...Köhler, el único no judío del grupo, renunció a su cátedra tras protestar por la persecución de sus colegas, y como ellos, también buscó refugio en EE. UU.\""}, {"q": "Según la introducción histórica, ¿qué escuela psicológica ascendió al primer plano en EE. UU. tras la Segunda Guerra Mundial, desplazando a las ideas gestaltistas a un segundo lugar?", "o": ["El estructuralismo de Wundt.", "El conductismo.", "El psicoanálisis."], "c": 1, "e": "\"...el mundo occidental sufrió un vuelco, y tuvo posiblemente... la de colocar el conductismo a la cabeza del mundo psicológico, mientras las ideas gestaltistas pasaban a un segundo plano.\""}, {"q": "La experiencia empírica inicial que detonó la concepción gestáltica la vivió Max Wertheimer en el año 1910 al ir fijándose en un cartel luminoso mientras viajaba en:", "o": ["Un barco de vapor.", "Un coche de caballos.", "Un tren."], "c": 2, "e": "\"En 1910, Max Wertheimer, viajando en un tren, se fijó en un anuncio luminoso con bombillas que se encendían y apagaban...\"."}, {"q": "¿Qué fenómeno perceptual exacto advirtió Wertheimer al observar las bombillas físicas fijas del anuncio que se encendían y apagaban sucesivamente?", "o": ["La constancia del tamaño.", "El movimiento aparente.", "El aprendizaje por ensayo y error."], "c": 1, "e": "\"...advirtió que, aunque las bombillas estaban fijas, él percibía unas luces girando por el borde del cartel. Percibía un «movimiento aparente».\""}, {"q": "Para experimentar formalmente en laboratorio con este movimiento, ¿qué aparato óptico utilizó Wertheimer que permitía hacer visibles a intervalos figuras presentadas en distintas posiciones?", "o": ["Un telescopio de refracción.", "Un caleidoscopio.", "Un estroboscopio."], "c": 2, "e": "\"...comenzó a experimentar con un estroboscopio unas figuras pintadas en distintas posiciones, al ser vistas a través de un ocular, se presentan moviéndose.\""}, {"q": "El descubrimiento perceptivo de que la proyección de fotos fijas a cierta velocidad genera la ilusión óptica de movimiento real y continuo es el fundamento tecnológico esencial de:", "o": ["El cinematógrafo.", "La telegrafía sin hilos.", "El microscopio electrónico."], "c": 0, "e": "\"Estaba palpando el fenómeno enorme del cinematógrafo. La proyección de fotos fijas... permite ver moverse las figuras en la pantalla con toda naturalidad.\""}, {"q": "¿Qué nombre técnico o acuñación teórica particular dio Wertheimer a este movimiento aparente captado cognitivamente pese a basarse en estímulos fijos?", "o": ["Movimiento alfa.", "Movimiento phi.", "Movimiento cenestésico."], "c": 1, "e": "\"...el sujeto ve no una fiel reproducción de los estímulos físicos, que son figuras fijas... sino un movimiento, al que se vino a llamar movimiento phi.\""}, {"q": "La deducción principal de Wertheimer ante el movimiento phi fue concebir que al mirar nuestro cerebro no une estímulos como piezas sueltas de un mosaico, sino que percibe directamente una:", "o": ["«Estructura global» procesada por el sistema nervioso.", "Serie de instintos innatos independientes.", "Suma algorítmica de puntos ciegos retinianos."], "c": 0, "e": "\"...no percibimos unos «estímulos constantes» que se junten como piezas de un mosaico... sino que percibimos una «estructura global» que debe ser procesada por nuestro sistema nervioso...\"."}, {"q": "Otro tipo de evidencias de la Gestalt consistió en emplear imágenes donde con los mismos trazos fijos el sujeto puede ver alternativamente cosas diferentes (ej. la copa y los perfiles). ¿Cómo se llama a estas figuras?", "o": ["Figuras estroboscópicas.", "Figuras topológicas de Lewin.", "Figuras «reversibles»."], "c": 2, "e": "\"Una serie de experimentos emplearon unas imágenes o figuras llamadas «reversibles». Una muy difundida es la de una copa que unas veces se ve como tal copa, otras se ve como dos perfiles humanos...\"."}, {"q": "¿Qué imaginativo psicólogo creó la célebre figura reversible que presenta simultáneamente a una \"vieja dama\" y a una \"joven fina y bella\" (la nuera y la suegra)?", "o": ["Karl Duncker.", "Boring.", "Max Planck."], "c": 1, "e": "En el pie de la Figura 1 aparece la referencia exacta: \"Figura 1. Figura reversible de «la nuera y la suegra» creada por Boring\"."}, {"q": "¿Qué psicólogo danés de la escuela gestáltica es destacado en el texto por haber estudiado profusamente y popularizado este tipo de figuras reversibles?", "o": ["Karl Duncker.", "Kurt Goldstein.", "Ronald Lippitt."], "c": 0, "e": "\"Estas figuras, estudiadas por muchos autores, entre otros por el danés Karl Duncker, ponen de manifiesto que podemos ver «un objeto \"A\"» o «un objeto \"B\"», distintos...\"."}, {"q": "Al experimentar con las figuras reversibles, los gestaltistas demostraron que lo responsable de que veamos a la suegra o a la nuera alternativamente no son los estímulos físicos, sino:", "o": ["La ceguera al color de la retina ocular periférica.", "El cambio en la organización o forma de esos mismos datos sensibles.", "Las cuasinecesidades reprimidas freudianas."], "c": 1, "e": "\"En tal caso, sin que cambie el material sensible –sensaciones–, cambia su organización o forma, y esta es la responsable de que veamos «la nuera» o «la suegra», alternativamente.\""}, {"q": "¿Cuál es el principio, convertido en lema clásico, que los psicólogos de la Gestalt formularon para recoger su tesis central sobre la percepción de las totalidades?", "o": ["El todo es mayor que la suma de sus partes.", "La parte siempre antecede biológicamente a la suma del todo.", "La forma exterioriza el impulso conductual orgánico."], "c": 0, "e": "\"Los gestaltistas formularon un principio que recoge estas experiencias: «el todo es mayor que la suma de sus partes».\""}, {"q": "En la configuración general de un campo visual, la estructura central concreta y saliente, percibida como el objeto principal que acapara la atención y el espacio destacado, se denomina técnicamente en la Gestalt:", "o": ["Cuasinecesidad.", "Valencia focal.", "Figura."], "c": 2, "e": "\"Las estructuras que se forman tienen una cierta «figura», que aparece como objeto concreto saliente y destacado...\"."}, {"q": "El complemento visual relativamente indeterminado que parece extenderse uniformemente por debajo y detrás de la \"figura\", recibiendo menor atención consciente, se conoce como:", "o": ["Fondo.", "Campo de tensión.", "Sensorium periférico."], "c": 0, "e": "\"...y tienen también un «fondo» indeterminado que parece extenderse debajo y detrás del objeto. La percepción, pues, se organiza como una figura sobre un fondo.\""}, {"q": "En el caso de observar las dos caras enfrentadas (figura reversible 2), ¿qué ocurre con el papel excluyente que juegan los espacios perceptuales?", "o": ["Las caras negras actúan como figura y el espacio central blanco se convierte instantáneamente en el fondo de la percepción.", "Se visualizan a la vez las dos caras de perfil y la copa blanca frontal solapadas armónicamente sin supresión mutua posible.", "El movimiento aparente phi difumina completamente toda separación anatómica entre los tres elementos visualizados."], "c": 0, "e": "\"Cuando se ven las dos caras enfrentadas una a otra, de perfil, entonces el espacio blanco se convierte en el fondo de la nueva percepción.\""}, {"q": "En un astuto experimento de Köhler, ¿qué aprendieron en realidad las gallinas al enseñarles a picar el montón de granos que reposaba sobre un papel gris más claro (y evitar el de un gris más oscuro)?", "o": ["A comer siempre sobre el exacto y concreto tono absoluto de gris que habían memorizado como patrón visual fijo e inamovible (constancia estimular estricta).", "A habituarse y relacionar el concepto relativo \"en el papel más claro de los dos que tenían delante\", y no el tono concreto aislado.", "A utilizar cañas para alcanzar los granos más remotos sobre los papeles grises y oscuros con inteligencia abstracta superior en laberintos."], "c": 1, "e": "\"Para Köhler, esto significaba que los animales no habían aprendido a comer en un papel de un tono de gris determinado y concreto, sino que se habían habituado a hacerlo «en el papel más claro de los dos que tenían delante».\""}, {"q": "La lección fundamental del experimento de las gallinas de Köhler evidenció que los seres vivos operamos percibiendo estructuras donde los elementos no son aislados y fijos sino que dependen y cobran sentido por sus:", "o": ["Valores relativos o de interrelación dentro del conjunto visual total.", "Pautas fisiológicas gástricas invariables hereditarias incondicionadas.", "Mediciones fotométricas de luminiscencia estroboscópicas exclusivas."], "c": 0, "e": "\"Operaban, pues, percibiendo una estructura, dentro de la cual los elementos tenían más unos «valores relativos» que «absolutos».\""}, {"q": "Frente a la pretensión de Wundt y del estructuralismo clásico de asegurar que los estímulos siempre originan de modo invariable las mismas sensaciones constantes (\"constancia de estímulo\"), la escuela Gestalt contrapuso el principio perceptivo empírico de la:", "o": ["Constancia fisiológica estática de la conducta general motora externa humana.", "Constancia de objeto.", "Ley matemática exacta de la inercia fenomenológica geométrica interna."], "c": 1, "e": "\"Los gestaltistas proclamaron la existencia de una «constancia de objeto», que oponían a la pretendida tesis de Wundt y los estructuralistas de la «constancia de estímulo»...\"."}, {"q": "Cuando la luminosidad ambiente de una sala varía (al apagar una lámpara al mirar un cuadro), y sin embargo somos capaces de seguir identificando los mismos tonos en el lienzo (solo que de modo algo más borroso o tenue), está operando nuestra:", "o": ["Ilusión topológica isomorfa profunda inconsciente.", "Constancia de tamaño.", "Constancia del color."], "c": 2, "e": "\"Una es la constancia del color (por ejemplo, los colores se perciben sin cambios apreciables, aunque haya modificación de la luminosidad ambiente... no vemos que cambie el color, sino que vemos que en un caso nuestra percepción es más clara o intensa, y en el otro es peor y más borrosa).\""}, {"q": "Percibir una mesa en su apariencia rectangular ortodoxa (sin inferir que haya mutado su esencia anatómica original) a pesar de estar observándola en una acentuada y forzada inclinación perspectiva que arroja una forma trapezoidal sobre nuestros ojos es un ejemplo innegable de:", "o": ["Constancia de forma.", "Topología analítica profunda animal de rodeos de resolución ciega incondicionada.", "Ilusión óptica reversible de insight perceptivo y catártico."], "c": 0, "e": "\"Hay constancia de forma (por ejemplo, los objetos que vemos en perspectiva no los vemos como si hubieran variado de forma... para que precisamente parezcan el objeto que queremos representar).\""}, {"q": "El hecho psicológico fundamental por el que nuestra percepción sigue viendo inmutable al \"mismo objeto\" originario a medida que nos aproximamos a él (en vez de procesar que \"el cuerpo material está aumentando físicamente de tamaño y creciendo\" visualmente de la nada ante nosotros) se atribuye a la:", "o": ["Acomodación biológica instintiva de las valencias perceptivas dinámicas estructurales de huida natural.", "Constancia de tamaño.", "Reestructuración cognitiva del fondo y la figura sobre el motorium cinético puro orgánico."], "c": 1, "e": "\"Hay también constancia de tamaño, lo que hace que veamos el «mismo objeto» aunque, al irnos acercando al mismo, vaya aumentando su volumen... pero no vemos que el objeto crezca o se haga pequeño, sino que se acerca o se aleja con su tamaño propio.\""}, {"q": "La concepción final gestáltica postula que no contemplamos una abstracta nube disgregada de impresiones y destellos sensoriales desorganizados que luego deban asociarse entre sí paulatinamente paso a paso, sino que gracias a la figura-fondo vemos el mundo de modo innato ordenado en:", "o": ["Objetos, ubicados espacialmente unos cerca y otros lejos en un sistema que destaca sobre el fondo.", "Líneas matemáticas y topológicas puras de ecuaciones abstractas que debemos aprender por ensayo a unir forzosamente a lo largo de décadas biológicas.", "Movimientos aparentes desordenados estroboscópicos confusos generadores de neurosis y patologías sistémicas letárgicas irreversibles."], "c": 0, "e": "\"No vemos una nube de sensaciones... que se vayan paulatinamente enlazando o asociando, sino que vemos objetos, unos cerca y otros lejos, en un espacio que hace de fondo, como un sistema de figuras destacando...\"."}, {"q": "Según el célebre psicólogo Kurt Koffka, toda experiencia consciente del ser está presidida y vertebrada por una estructura polar u organización esencial y radical básica subyacente que denominó formarse entre:", "o": ["\"Yo y mi mundo\".", "\"La parte y su vector topológico\".", "\"El plátano colgado y el ensayo y el error\"."], "c": 0, "e": "\"Además, una organización básica es la que destacó Koffka. Es la organización que formamos «yo y mi mundo», precisamente en esa polaridad dinámica que constituye la experiencia consciente (Koffka, 1935).\""}, {"q": "En última instancia teórica fundamental de la Gestalt, el poder llevar a cabo la \"segregación\" física de figuras y poder aglutinarlas de manera visual coherente sobre fondos inespecíficos siempre implica e interviene inevitablemente la presencia subyacente de:", "o": ["Un mero almacén innato genético pasivo y ciego puramente vegetativo inactivo incondicionado de imágenes primitivas platónicas heredadas a priori en la médula ósea.", "Fuerzas dinámicas y tensiones operativas unificadoras que moldean activamente las diferenciaciones y generan y mantienen vivas las estructuras psíquicas dándoles configuración orgánica incesante.", "Una patología o constricción traumática en el hemisferio cortical izquierdo paralizante y constrictiva letal que fuerza las fusiones aleatorias sin orden de elementos fijos microscópicos."], "c": 1, "e": "\"...esto implicará la intervención de fuerzas que producen diferencias y estructura que generan distintas configuraciones... no solo la existencia de elementos... sino además la presencia de un dinamismo, la intervención de fuerzas que configuran... Dinamismo y organización son dos caras inseparables\"."}, {"q": "Entre qué fechas aproximadamente coordinó y ejecutó in situ de forma oficial el Dr. Wolfgang Köhler los inmortales y revolucionarios trabajos primordiales etológicos de su estación tinerfeña enfocados a estudiar la cognición de gorilas y chimpancés cautivos frente a diversos obstáculos y trampas lógicas elaboradas artificialmente:", "o": ["1890 - 1895.", "1913 - 1920.", "1933 - 1945."], "c": 1, "e": "\"Köhler dirigió entre 1913 y 1920 una estación que había establecido la Academia de Ciencias de Berlín junto al Puerto de la Cruz, en la isla de Tenerife, para el estudio del comportamiento de chimpancés y gorilas.\""}, {"q": "En el plano de la inteligencia animal comparada en laboratorio, los excepcionales resultados canarios recabados sólidamente por Köhler atacaban teórica y frontalmente el modelo norteamericano previo imperante basado ciegamente en \"ensayos y errores\" defendido tenazmente por su homólogo autor:", "o": ["E. L. Thorndike.", "K. Goldstein.", "M. Wertheimer."], "c": 0, "e": "\"Su autor se enfrentó a las tesis de Thorndike sobre inteligencia animal. Este, a partir de sus experimentos con la «caja problema», afirmaba que los animales aprendían a resolver problemas solo mediante ensayo y error.\""}, {"q": "¿Qué valioso formato de evidencia documental irrefutable extra de alta tecnología para la época recopiló inteligentemente y de manera profusa el Dr. Köhler para respaldar de modo aplastante la validez y veracidad genuina sin sesgo posible de los actos que sus sujetos animales ejecutaban al sortear el problema de los instrumentos:", "o": ["Una ingente colección de tomografías de contraste neurológico cortical de alta resolución con vectores trazados por radiólogos cualificados externos contrastados y auditados de Berlín capital y Fráncfort del Meno respectivamente sobre chimpancés vivos sedados clínicamente estables en laboratorios sellados en vacío total acústico.", "Una importante colección de películas mostrando y grabando visualmente en crudo a los chimpancés pensando, interactuando y ejecutando íntegramente de manera secuencial y empírica real inalterada esas mismas conductas de resolución sin manipulación externa.", "Cientos y cientos de dibujos al carboncillo natural ilustrados de manera personal por el propio investigador de memoria cada domingo de manera sosegada e íntima intentando recrear su interpretación subjetiva psicoanalítica más profunda de los sueños diurnos silentes reprimidos de los grandes antropoides en las jaulas soleadas canarias."], "c": 1, "e": "\"Reunió, además, una importante colección de películas mostrando esas conductas, lo que dio un enorme peso a sus investigaciones (Köhler, 1998).\""}, {"q": "En uno de los típicos montajes desafiantes descritos donde el simio deseaba apoderarse de un plátano pendular colgado en alto y sumamente inaccesible físicamente y de manera directa desde su envergadura natural de pie para la meta biológica apetecible fijada, la solución adoptada exitosamente empleando herramientas o elementos accesorios sueltos abandonados consistió sencillamente en:", "o": ["Arrancar los barrotes de hierro fundido gruesos de un tirón ciego guiado puramente de ira incondicionada emocional destructiva y salvaje sin planificación usando sus colmillos desnudos de manera primaria.", "Apilar inestablemente unos cajones de madera sueltos abandonados adrede por el recinto, colocándolos unos sobre otros hasta formar una precaria pero totalmente efectiva escalera o torre útil para encaramarse trepando raudo sin dudar para al fin tomar victorioso la fruta jugosa en lo alto.", "Emitir potentes gritos continuos durante doce horas pidiendo la fruta hasta que los guardas humanos cedían por la ley psicológica del efecto de Thorndike o cansancio mutuo recíproco condicionado."], "c": 1, "e": "\"Ante un plátano colgado que no alcanzaban a coger directamente, varios de sus monos acertaron a tomar unos cajones abandonados en el recinto, y colocándolos unos sobre otros, treparon con rapidez, logrando apoderarse de la fruta.\""}, {"q": "¿Qué rasgo notable advirtió sistemáticamente Köhler sobre la estructura de la torre que los monos edificaban con los citados cajones para trepar al alimento en su recinto?", "o": ["Buscaban un encaje topológico geométrico perfecto alineando sus esquinas al milímetro con las manos.", "Los apilaban de un modo sumamente inestable, importándoles únicamente el fin de la altura y no buscando en absoluto la estabilidad simétrica propia de una mente geométrica de la arquitectura humana.", "Solo usaban un cajón y luego fingían y simulaban que había dos para engañar astutamente al investigador humano allí presente apuntando todo el proceso pacientemente en su cuaderno clínico diario de anotaciones fisiológicas puras de Wundt y Titchener del laboratorio decimonónico."], "c": 1, "e": "\"En todas las ocasiones, los apilaban sin buscar su estabilidad, por lo que el montón de cajones era sumamente inestable.\""}, {"q": "En otra gesta intelectual paradigmática documentada profusamente a nivel visual y narrativo descriptivo biológico por Köhler con su chimpancé cautivo más avezado y excepcionalmente capaz y superior cognitivamente a la media de la manada insular canaria, ¿cómo llegó por azar a idear el acceso material a un plátano intencionadamente posicionado extrañamente alejado y sumamente distante de los barrotes limítrofes frontales exteriores de su recinto de confinamiento cerrado y vallado perimetralmente con rejas de hierro macizo al que no llegaban los brazos?:", "o": ["Insertó y encajó felizmente sin querer una caña estrecha más pequeña hueca dentro de otra caña algo mayor manipulándolas jugando distraído, logrando crear de la nada sorpresivamente de repente una vara muy superior extendida, instrumento total que empleó de inmediato inteligentemente sin dilación girándose veloz con ella firme en sus dedos para lograr acercar por la fuerza física arrastrando por fin el plátano dulce al fondo lejos.", "Desenterró pacientemente del suelo de tierra arcillosa blanda una pesada piedra pómez local volcánica lanzándola con inusitada furia e inmensa rabia destructora visceral animal incontrolable para aplastar violentamente el plátano desde la lejanía.", "Inició la práctica sistemática obsesiva por horas e incesante incansable rutinaria condicionada pavloviana del movimiento topológico circular del \"ensayo y error\" ciego y estúpido hasta que el experimentador humano se compadeció rompiendo el experimento entregándole un cacahuete salado de recompensa básica final en la mano desnuda y abierta y limpia de herramientas exógenas añadidas temporalmente."], "c": 0, "e": "\"En cierta ocasión, su chimpancé más capaz... estuvo jugueteando con dos cañas, hasta que por azar metió una en otra; entonces, volviéndose hacia el objetivo de la fruta, con la caña resultante de la unión de las dos menores, consiguió apoderarse del manjar.\""}, {"q": "Un mono, al trepar a una puerta que hacía de puente hacia la fruta y comprobar para su estupor frustrante repentino inusitado que una misteriosa e inoportuna pesada piedra rocosa colocada mañosamente a mala fe o adrede estratégicamente encubierta y disimulada allí en el suelo frenaba y obstaculizaba en seco todo el giro mecánico circular perimetral normal del eje natural de la hoja de madera de la puerta, procedió a:", "o": ["Reestructurar por completo la situación dinámica y el medio obstaculizado interviniente en su camino bajándose física e intencionalmente hacia el suelo, apartando hábilmente con sus manos la pesada piedra y desbloqueando así el movimiento deseado de la estructura de la puerta en su beneficio pragmático directo y claro funcional alimenticio primario biológico.", "Agotarse somáticamente física y mentalmente rindiéndose al instante sin mediar más lucha alguna de resistencia u oposición, desarrollando inevitable y lógicamente una cuasinecesidad estática paralizante de frustración incondicionada letárgica y apatía psiquiátrica clínica pura y simple como preveía el funcionalismo conductual de Wundt sin escape.", "Ignorar por completo visual y cognitivamente el bulto gris o roca y continuar empujando la puerta eternamente por repetición de \"ensayos ciegos\" infinitos en un ciclo ciego hasta romper la bisagra de puro agotamiento material físico."], "c": 0, "e": "\"...cuando los experimentadores le pusieron una piedra para obstaculizar el giro, el mono se bajó para apartarla y lograr el movimiento deseado.\""}, {"q": "Köhler defendió la asunción teórica capital revolucionaria de que cuando los antropoides experimentales asimilaban cambios que repercutían favorablemente en sus metas instrumentales (ej. la caña encajada unida larga sirviendo de medio nuevo útil de largo alcance espacial físico no previsto originariamente de antemano), la globalidad mental de toda su situación percibida de base se reorganizaba, proceso de cambio clave al que los psicólogos gestálticos bautizaron y denominaron universalmente técnica y conceptualmente como:", "o": ["Asociación atómica estímulo-reflejo primaria hereditaria innata inmutable del cordón espinal basal reflejo neuronal.", "Extinción progresiva intermitente del condicionamiento clásico operante de las variables intervinientes gástricas digestivas somáticas molares periféricas moleculares de Hull y Tolman unidas en bucle o anillo inhibitorio silente del sueño REM de los cánidos rusos siberianos.", "Reestructuración de la situación, comprendiendo creativamente que ciertos cambios y variables aportaban consecuencias reales lógicas para sus propósitos inmediatos y relaciones novedosas de \"medio y fin\"."], "c": 2, "e": "\"Köhler mantuvo la tesis de que estos animales establecían relaciones entre los elementos de la situación, y captaban las relaciones medio-fin; y, singularmente, advertían que una situación se «reestructuraba» cuando ciertos cambios tenían consecuencias para sus propósitos.\""}, {"q": "A las soluciones físicas creadas ingeniosamente por los sujetos animales sorteando creativamente impedimentos lineales y barreras a fin de alcanzar un fin a base de introducir cambios, manipulaciones o trayectos alternativos no evidentes inicialmente en la topología de la escena natural se les suele conocer en la literatura científica psicológica con el ilustrativo nombre de:", "o": ["Isomorfismos ciegos reflejos incondicionados de Pavlov de segundo grado cortical irradiado y focal silente.", "Rodeos (conductas o trayectos que implican alteraciones espaciales o desvíos inteligentes asimilando un espacio libre, como esquivar la alambrada por un lado abierto a los extremos integrando un camino mayor para alcanzar al fin la meta o grano).", "Movimientos alfa fisiológicos de Titchener aplicados en jaula cerrada opaca insonorizada americana libre de polvo visual experimental de laboratorio en Cornell con gatos en letargo profundo."], "c": 1, "e": "\"Pensó... que había ahí una serie de conductas inteligentes, creativas, capaces de introducir cambios para facilitar la solución (lo que se ha llamado «rodeos»)... realiza una conducta de «rodeo» y resuelve su dificultad.\""}, {"q": "La repentina iluminación íntima psíquica, la toma de consciencia organizadora \"de golpe\" (descrita fenomenológicamente por la vivencia del clásico *¡Ajá!* de la comprensión clara y cristalina instantánea de la regla lógica tras mirar sin comprender inicialmente un problema), recibe en la escuela Gestalt como etiqueta formal teórica técnica en inglés importada al castellano la trascendentalísima palabra:", "o": ["Insight o comprensión.", "Feedback biológico homeostático térmico de Lewin somático gástrico puro digestivo estomacal y lingual asimilativo y discriminatorio total asociativo libre de control central de inhibición recíproca celular del tejido adiposo cerebral.", "Habituación de ensayo ciego o ejercicio conductual simple de fijación muscular motora pura periférica molecular glandular y ciega inmutable aversiva negativa de base."], "c": 0, "e": "\"...denominó a esa especial «reestructuración» vivida ante ciertos cambios o modificaciones que facilitaban las soluciones con el nombre técnico de insight o comprensión.\""}, {"q": "Al analizar comparativamente la actitud de una simple gallina frente a la limitación frontal de una tela metálica de red para atrapar el grano de maíz dispuesto delante, y la actitud opuesta resuelta pragmática exhibida por un perro o un simio rodeándola por las esquinas lógicamente sin atascarse ofuscado, el texto explicita una diferencia crucial del proceso cognitivo basado en la distinción gestáltica de fondo y figura, por la cual:", "o": ["La gallina es totalmente ciega y biológicamente los pájaros de campo de tiro no procesan visualmente colores primarios.", "La gallina experimenta un pánico visceral genético de \"estímulo elicitante\" puro aversivo de evitación condicional en circuito cerrado que la fuerza a correr y embestir suicida y violentamente a 40km/h contra toda estructura alámbrica romboidal metálica de malla galvanizada humana que huela a experimentador extranjero.", "El animal torpe (la gallina) no incorpora el hueco lateral libre vacío (que es \"fondo\") a su \"figura\" operativa para ver el \"rodeo\" hacia la meta; mientras que el animal inteligente (el mono/perro) sí lo recodifica espacialmente y reestructura como \"espacio libre que conecta con el alimento\"."], "c": 2, "e": "\"el animal torpe tiene una figura, el alimento y el obstáculo, y un fondo, el resto del espacio alrededor, con el que no cuenta... Mientras que el animal inteligente incorpora a la figura aquel hueco de los espacios laterales y, al reestructurar la situación, ahora con un espacio libre... realiza una conducta de «rodeo».\""}, {"q": "De forma concisa, esquemática y explícita, la escuela gestaltista asume y estipula sin matices como axioma base que la acción psíquica del individuo (su movimiento exterior y su actuación real empírica sobre el medio que le rodea y habita y le limita) sigue y obedece ciegamente las determinaciones dictadas y estipuladas originariamente y formalmente por lo que se ha configurado internamente estructuradamente en su:", "o": ["Sensorium (las figuras o gestalten que se forman organizadas dentro de su propio campo perceptivo interno visual representacional son las que rigen lo que hará su motorium y su ejecución física consecuente real externa palpable empírica de sus brazos y patas motrices y somáticas del cuerpo).", "Sistema digestivo glandular gástrico molecular exclusivamente.", "Universo de genes autonómicos de herencia mendeliana ciega inmutable cruzada en fenotipos cerrados herméticos filogenéticos primitivos primordiales fosilizados geológicos evolutivos de Wundt decimonónicos."], "c": 0, "e": "\"Los gestaltistas lo dijeron de una manera muy explícita: lo que ocurre en el sensorium –es decir, las figuras o gestalten que se forman en el campo perceptivo– determina lo que sucederá en el motorium... Se actúa, pues, con base en lo que se percibe.\""}, {"q": "En la vívida lectura citada de las notas autobiográficas redactadas de puño y letra por Köhler (\"Köhler y los experimentos de Tenerife\"), describe fascinado que un macho orangután nombrado y conocido cariñosamente en la estación como Catalina se hallaba desesperado ante la urgencia de requerir de un palo de apoyo como instrumento intermedio mediador para asir lejanamente un ansiado fruto externo en la lejanía. Al mirar en redondo y percatarse con enorme abatimiento que no dispusiera de caña o elemento asible a la vista alguna en el suelo yermo liso a su lado en ese segundo de gran hambruna, ejecutó sorpresivamente la audaz proeza de:", "o": ["Sentarse lúgubremente asumiendo dócil el destino impuesto esperando apacible en posición de loto budista contemplativo y pasivo que su cuidador principal volviese de la ciudad con cañas importadas nuevas cortadas listas a su disposición fácil.", "Elevar su vista, y trepando por la tela de la jaula hasta el techo, separó con sumo esmero y cuidado usando sus propios dientes una astilla/palo larga de 3 pies útil directamente extraída de la gruesa viga maestra sustentadora que antes –y por puro capricho rabioso y furia indiscriminada destructiva instintiva lúdica matutina— había estado infatigablemente royendo y destrozando mordiscos a trozos horas previas, reciclándola así por completo pragmáticamente de objeto a destruir a instrumento sagrado redentor de su necesidad inmediata.", "Llorar sin consolación y agitar los brazos rogando el \"¡ajá!\" divino a los experimentadores silentes mudos y crueles apostados tras los cristales y cortinas gruesas que todo lo registraban anotándolo en el papel logarítmico del registro acumulativo del rollo continuo de B. F. Skinner calibrado de antemano."], "c": 1, "e": "\"De repente fija la vista arriba, en una viga, donde unas horas antes había trabajado con los dientes para su destrucción. Pocos momentos después sube trepando... y así como antes su trabajo había sido de simple destrucción, ahora, con mucho cuidado, empieza a separar de la viga una astilla o, más bien, un palo... de unos tres pies de largo, y muy pronto lo utiliza para alcanzar el fruto\"."}, {"q": "A tenor de los sucesos observados in situ maravillado por los ojos y mente analítica de Köhler acerca del prodigioso reciclaje inaudito asombroso de la viga estructural ejecutado genialmente por Catalina empleando los colmillos al arrancarle un palo o astilla largo útil para su meta inmediata apremiante gástrica, el experimentador deduce en su informe final citado que estamos contemplando sin ninguna sombra de dudas interpretativas ante nuestras mismísimas narices biológicas a un evidente evento de la cognición animal asombrosa catalogado y clasificado en los anales como un indudable y nítido caso de:", "o": ["Dinamismo de grupos topológicos de valencias abstractas de la geometría plana y esférica cuántica en su fase de vacío total al \"modo geométrico\" de la vieja filosofía idealista de Spinoza y Kant del siglo XVIII preilustrada romántica decimonónica incondicionada del reflejo medular de excitación motora pura de ensayo y extinción súbita letárgica animal vegetal primitiva de raíz de tallo neural basal profundo cortical de asociación simple y llana no generativa en cajas opacas lúgubres sin escape ciego.", "Ensayo y error de la escuela funcionalista norteamericana estricta molecular ciega fisiológica y muscular de conexiones neuronales simples sin variables mediadoras cognitivas de representaciones simbólicas ni mapas perceptuales operacionales subyacentes operantes de Skinner y Pavlov del refuerzo intermitente demorado programado con rollos giratorios calibrados en intervalos fijos o de razón de bolitas minúsculas secas.", "\"Transporte\" de un viejo procedimiento ya conocido en su repertorio interno previo a una situación totalmente nueva y originariamente no planeada, desvelando insight pleno pragmático del medio material circundante real manipulable para resolver su apremiante necesidad alimenticia o tensión vital no completada del campo gestáltico de la cuasinecesidad focalizada dirigida al fruto."], "c": 2, "e": "Köhler mismo concluye en la cita: \"Se trata evidentemente de un caso de 'transporte' de un procedimiento viejo a una situación nueva».\""}, {"q": "A la hora de fundamentar y articular coherentemente su doctrina psicológica estructural profunda y original sin fisuras interpretativas, los primeros y eminentes padres de la Gestalt (Wertheimer, Köhler, Koffka, Lewin) coincidieron masiva y abrumadoramente en rechazar feroz y tajantemente toda posición analítica que tratara de abordar su campo reduciendo el acto y psiquismo global a \"partes\" matemáticas abstractas desgajadas; es decir, eran innegable e inherentemente y lógicamente militantes férreos y furiosos antagonistas opuestos radicalmente a la perspectiva de la psicología o paradigma de tipo de interpretación puramente:", "o": ["«Elementalistas» o atomistas, así como las corrientes asociacionistas, conductistas y reflexológicas de los modelos moleculares y fisiológicos limitados miopes de enlaces \"S-R\" ciegos mecánicos y estáticos.", "Fenomenológica (que buscaba captar vivencial y existencialmente el fenómeno puramente subjetivo dado en directo de manera holística a nivel consciente a modo de Husserl y el existencialismo posterior afín a su causa alemana filosófica pura continental sin adulterar en frías cifras y matemáticas de laboratorio frío artificial engañoso norteamericano pragmático sin alma alguna en el proceso orgánico vital del ser y la parte fundida en un todo asombroso irreductible e incuantificable al milímetro con pesas métricas del tiempo fisiológico nervioso estricto físico y molecular ciego).", "Holista y macroscópica unificadora sintética molar de masas amplias sociológicas de dinámica topológica constructiva integradora."], "c": 0, "e": "\"es contraria a toda posición «elementalista» o atomista, que quiera llegar a los actos psíquicos desde unos elementos abstractos. Aquí, lo primero es la vivencia total y global. De ahí su radical oposición tanto a Wundt como al conductismo y a la reflexología...\"."}, {"q": "El especial acento y prioridad filosófica investigadora prestada a la \"descripción libre directa\" sin recortes mutiladores preconcebidos teóricos analíticos forzados de las experiencias vivenciadas plenamente y al natural (como percibir \"figura\" y \"fondo\" tal cual sin inventar sensaciones atómicas falsas e imposibles debajo en el tejido), evidenciaba claramente a ojos de los historiadores la notable e innegable fuerte huella germánica, impronta original y calado del movimiento de Edmund Husserl en la primera y joven Gestalt, siendo dicha corriente teórica matriz mentora inspiradora en su metodología observacional del fenómeno primigenio conocida mundial y académicamente a lo largo del siglo XX en los libros universitarios como la:", "o": ["Fenomenología.", "Escuela mecanicista de los reflejos condicionados viscerales moleculares absolutos ciegos automáticos pavlovianos del cerebro gástrico digestivo ruso canino esquelético e incruento quirúrgico.", "Introspección analítica microscópica celular biológica estructuralista abstracta atomista wundtiana matemática y estadística del tiempo de reacción con campanas calibradas de precisión neumática de relojería suiza."], "c": 0, "e": "\"...esta escuela adopta una posición «fenomenológica» (basada en la descripción del fenómeno). Aquí se ve la huella que sobre los primeros gestaltistas dejó la filosofía de Edmund Husserl, la fenomenología.\""}, {"q": "A nivel psicobiológico explícito, los gestaltistas presuponían que las singulares e irreductibles configuraciones organizativas macro de las vivencias perceptuales subjetivas (como el movimiento aparente o las constancias globales formadas de la unidad de nuestro mundo de la experiencia consciente \"yo-mundo\") eran posibilitadas orgánicamente e impulsadas secretamente y sostenidas internamente con firmeza fisiológica de base motora indiscutible a través e irremediablemente de las disposiciones dadas y de la acción funcional física estructural macro unificadora interviniente a nivel biológico dictada de los procesos globales que operan, procesan y ordenan todo a nivel físico-químico del substrato nervioso y su masa celular del:", "o": ["El corazón vascular bombeante de los instintos y latidos viscerales de pánico muscular y sudoración de los humores gástricos somáticos reflejos de la periferia autonómica simpática.", "El cerebro (los procesos cerebrales / estados cerebrales globales / campos cerebrales globales organizativos isomorfos paralelos o paralelos equivalentes simétricos anatómicos macro fisiológicos macro topológicos subyacentes en el cráneo de los mamíferos).", "El órgano de Corti coclear de las terminaciones nerviosas timpánicas distales de discriminación auditiva y acústica de Pavlov."], "c": 1, "e": "\"En la explicación de las estructuras o formas, estos investigadores hacen intervenir los procesos cerebrales... vivencias cuya estructura está posibilitada por la organización de los estados cerebrales... explicada desde unos procesos fisiológicos globales, básicamente cerebrales...\"."}, {"q": "El supuesto teórico maestro del que partía la Gestalt para vincular ciencia subjetiva y física postulaba que la \"forma\" abstracta vivenciada espiritualmente a nivel psicológico guardaba un paralelismo estructural mimético y una identidad formal exacta paralela \"idéntica\" con la forma biológica material de los estados del tejido del cerebro y los impulsos neurológicos cerebrales fisiológicos operantes que la causaban, suposición técnica o dogma fundacional basal bautizado por los autores referenciados e historiadores con el término greco-alemán formal de la hipótesis directriz académica de su escuela de la historia de la psicología europea moderna conocido como el principio dogmático universal regidor y directriz epistemológica clave fundamental teórica unificadora germánica del:", "o": ["Condicionamiento de segundo orden pavloviano o generalización sensorial auditiva y acústica abstracta molar simple del ensayo incondicional somático molecular periférico sin cajas negras abstractas o intermediarios inmedibles a nivel químico puro de laboratorio estéril americano y pragmático en el siglo nuevo de la máquina sin alma o espíritu ni entidades esotéricas como la psique.", "Isomorfismo psicofisiológico (isos, igual; morphé, forma).", "Insight o catarsis emocional visceral catatónica histérica aguda disociativa de trauma edípico arquetípico místico regresivo del letargo onírico silente somnílocuo y letárgico profundo inerte inanimado e irracional instintivo bestial de origen darwiniano primigenio."], "c": 1, "e": "\"Su idea es que las formas o gestalten psicológicas vividas subjetivamente se corresponden con formas o gestalten psicofisiológicas que tienen lugar en el cerebro. Esta suposición se conoce como la hipótesis del isomorfismo psicofisiológico (isos, igual; morphé, forma).\""}, {"q": "Más allá de su obvio entronque metodológico filosófico directo original con las premisas puras formales germánicas de la fenomenología existencialista y fenomenológica naturalista del pensador y maestro de la intuición Husserl, cabe destacar rotundamente por su impacto masivo colosal e incalculable pragmático instrumental a nivel intelectual y formal modelador analítico en los pioneros que sus conceptos capitales biológicos de totalidad dinámica fluida subyacente guardaban a su vez en su esqueleto teórico base o matriz teórica profunda inmensa e innegable relación paralela y correspondencia y raigambre honda histórica indisoluble profunda entrelazada íntimamente y asimilada con dos de los grandísimos e imponentes movimientos y colosos científicos teóricos modernos que zarandearon los paradigmas del siglo, a saber y sin lugar a duda histórica referenciada por los expertos en la materia a nivel académico puro estricto de las cátedras y manuales los referidos en el temario presente e hitos gigantes de la revolución científica decimonónica occidental de base del:", "o": ["El evolucionismo darwiniano (sobre la adaptación y utilidad biológica organizativa vital supervivencial heredada) y la física moderna relativista y cuántica (notoriamente las \"teorías de los campos\" envolventes globales unificadores e indisociables operantes donde las partes adquieren sentido y fuerzas interrelacionadas indisolubles de Planck y Einstein y sus coetáneos teóricos germanos geniales rompedores del átomo cerrado estático mecanicista de Newton).", "La parapsicología ocultista mística telepática victoriana de médiums silentes e ignorantes estafadores teatrales de masas de feria, junto a la quiromancia cartomántica gitana esotérica adivinatoria y mística de la astrología esotérica del zodíaco babilónico oriental milenario pre diluviano mesopotámico pre racional irracionalista mágico de lectura de humores puros gástricos y bilis hepáticas de hipócrates de la edad oscura preclínica primitiva griega clásica.", "La estadística biométrica criminalista forense y frenológica inglesa estricta craneal y racista supremacista de Galton midiendo el ancho del tabique nasal de los londinenses para medir inteligencia verbal escrita pura y las teorías psicoanalíticas vienesas del incesto incestuoso y el arquetipo de la sombra de Jung en castillos de Suiza oriental sin validez experimental alguna ni observación en jaula animal ciega controlable medible con un estroboscopio y un cronómetro Wundtiano fiable y caro importado."], "c": 0, "e": "\"Podemos decir que, en gran medida, sus conceptos básicos tienen que ver con dos grandes movimientos científicos modernos: uno es el evolucionismo, el otro es la ciencia física... El otro influjo, el de la física moderna, es también muy importante... guarda relación con la idea de «campo»\"."}, {"q": "Como anécdota biográfica histórica fundamental indicativa de la profunda sintonía transversal y transdisciplinar intelectual de los sabios en Alemania durante la eclosión de la física contemporánea moderna de inicios del XX en los seminarios, Wolfgang Köhler gozó a nivel personal académico y curricular inmenso del prestigiosísimo estatus incalculable e influencia formadora de haber sido discípulo oyente en las aulas y admirador directo personal del grandísimo investigador genio y \"padre fundador\" de la física contemporánea de la época (y uno de los teóricos del quantum y la energía), el notable científico galardonado y mundialmente reverenciado erudito de fama germánica de nombre inmortal histórico referenciado universalmente:", "o": ["Albert Einstein.", "Isaac Newton.", "Max Planck."], "c": 2, "e": "\"Köhler fue discípulo del gran físico Max Planck, uno de los «padres» de la física moderna...\"."}, {"q": "El inmenso préstamo e inspiración formal intelectual vital proveniente de los físicos germanos a la joven Gestalt para construir un modelo explicativo armónico integral radicaba vitalmente en la novísima y fecunda idea científica de postular una totalidad envolvente donde cuerpos y fuerzas no reaccionan abstractamente separados y ciegos, sino que todas sus manifestaciones dependen, cobran propiedades y sentido regidas siempre e indisolublemente desde la unidad magna universal que los engloba en tensiones y que todo lo reúne (nuclear, débil, electromagnética y gravitatoria en física), y a la cual la psicología copió trasladando esa visión a su \"fondo o campo perceptivo y conductual global\". A esta idea motriz fundamental teórica central revolucionaria se la designa y acuña en ambas ramas académicamente como la magistral teoría y concepto o idea fundamental teórica revolucionaria de unificación global abstracta del/la grandiosa:", "o": ["Mecanicismo atomista ciego de poleas de inercia y vacío atómico de Demócrito purista de esferas y átomos de plomo que rebotan matemáticamente mudos al choque simple molecular por puro azar cinético sordo.", "Campo (teoría del campo, unidad total envolvente que determina las propiedades e interacción armónica unida de todo el sistema integrado global de fenómenos).", "Mónada leibniziana preestablecida esotérica de glándula pineal de Descartes dualista estática metafísica teológica inabarcable sin comprobación en tubo de ensayo físico biológico químico medible topológicamente."], "c": 1, "e": "\"...guarda relación con la idea de «campo» que comenzó a utilizar, en sus explicaciones, la física moderna. Para esta, las fuerzas y los cuerpos materiales... son manifestaciones de una unidad total envolvente, el campo, dentro del cual todos los fenómenos están integrados... Análogamente, los psicólogos gestaltistas buscaron situar los fenómenos psicológicos en un campo global de experiencia...\"."}, {"q": "A diferencia del resto de teóricos puros y filósofos gestaltistas (como Wertheimer o Koffka) que estudiaban ilusiones visuales de luces en un laboratorio de psicología de escritorio de aulas universitarias abstractas humanísticas o experimentales estéticas puras en sujetos sanos, el destacado investigador Goldstein brilló inusitadamente prestando su enfoque y vocación al drama humano biológico aplicando valientemente de lleno sin cortapisas la óptica de la totalidad y la estructura y el holismo a una disciplina médica práctica dura biológica del tejido del cerebro traumatizado con heridas reales de guerra mundial y lesiones cerebrales graves a pie de cama y hospital y bisturí que es la inestimable rama sanitaria clínica médica especialista de conocimiento fisiológico conocida formal y técnicamente como:", "o": ["La logopedia y foniatría estética molecular inorgánica sorda del hueso maxilofacial.", "La odontología maxilar de extracciones y curas pulpares sinapsianas de conductos ciegos reflejos viscerales.", "La neurología y la neuropsicología."], "c": 2, "e": "\"Kurt Goldstein es, probablemente, el investigador de esta escuela que ha tenido una orientación más especializada hacia la neurología y la neuropsicología. En ese campo, elaboró una interpretación holista, gestaltista, de los procesos psicofisiológicos...\"."}, {"q": "En el año 1939 y a las puertas del abismo mundial bélico, Goldstein publicó uno de los libros más influyentes de su doctrina personal médica integrando la teoría de la Gestalt a nivel biológico, escrito donde presentaba la arquitectura de la organización neurológica y la estructura corporal como una enorme gestalt integradora de sistemas biológicos al unísono titulada original y monumentalmente en su forma escrita magna bajo el nombre universal de libro de biología estructural:", "o": ["La afasia y los reflejos cerebrales atómicos molares de Thorndike en ratas mansas y dóciles blancas.", "El mundo como figura de Wundt atomista abstracto y místico fenomenológico.", "The Organism (El Organismo)."], "c": 2, "e": "\"Uno de sus libros, The Organism (Goldstein, 1939), presenta su doctrina personal, en gran medida basada en experiencias y casos clínicos de pacientes con lesiones traumáticas cerebrales...\"."}, {"q": "La excepcionalísima, dolorosa e inestimable fuente originaria de datos, casuística real pura de laboratorio somático humano y experimentación vivencial dramática que nutrió las bases teóricas elaboradas profundamente de este médico y de su libro procedían en su casi totalidad desgraciada y lamentablemente del seguimiento hospitalario largo e investigaciones y diagnóstico preciso llevado a cabo por él personalmente compasivamente durante décadas con los veteranos que padecían la secuela funesta de haber sido expuestos de manera dramática y trágica irreparable en los campos de batalla lodosos a la metralla ciega balística del horror y los traumas irreversibles de haber sido:", "o": ["Pacientes con lesiones traumáticas cerebrales a consecuencia de la Primera Guerra Mundial (1914-1918) y sus dramáticos efectos de pérdida o alteración física cognitiva.", "Víctimas colaterales atómicas irradiadas letárgicas civiles desnutridas en grado sumo letales por las horribles cruentas y bestiales y atroces bombas destructivas y criminales genocidas radiactivas yanquis arrojadas salvajemente a sangre fría intencionadamente sobre Hiroshima y Nagasaki sin piedad y justificación humana real alguna en pleno final ya rendido agónico y ciego del pacífico militar imperial japonés inerte letárgico asfixiado postrado bloqueado al final de la era bélica en agosto de 1945 postrimero.", "Griegos antiguos hoplitas míticos y espartanos invencibles puros esotéricos literarios extraídos poéticamente con lira de la Ilíada de Homero y la guerra de Troya y Aquiles con talón dañado en lecturas clásicas universitarias humanísticas libres hermenéuticas filológicas teóricas de diván analítico simbólico."], "c": 0, "e": "\"...en gran medida basada en experiencias y casos clínicos de pacientes con lesiones traumáticas cerebrales a consecuencia de la Primera Guerra Mundial (1914-1918).\""}, {"q": "Goldstein aseveraba que, desde su modelo integrado global macro, cuando la voluntad o sistema neurológico del individuo decidía y se predisponía o coordinaba globalmente para ejecutar un acto material físico muscular determinado voluntario cualquiera de la vida (por ejemplo la acción voluntaria de \"levantar un brazo\" humano a voluntad real), el cuerpo y el cerebro sano humano se reorganizan inmediatamente en milisegundos operando y actuando análogamente como la gestalt, donde el mismísimo miembro ejecutor principal que protagoniza y lidera (el brazo levantado) se erige en:", "o": ["La \"figura\", mientras todo el resto y masa material pasiva de su cuerpo inactivo actúa cediendo espacio operando armoniosamente de forma secundaria e inconsciente asimilada como el \"fondo\" pasivo facilitador y estabilizador físico de equilibrio.", "Un apéndice fantasma ortopédico estroboscópico ciego al dolor sin conexión medular de arco silente simpático puramente parasimpático reflejo vegetativo inferior autónomo e inconsciente sin sentido neurológico molar propositivo del propósito direccional final del cerebro prefrontal racional libre instintivo e innato.", "El arquetipo místico oscuro edípico de castración del superego represivo inconsciente histérico reprimido infantil sexual latente catártico y regresivo amnésico letárgico hipnótico condicional del trauma materno o paterno severo en la cuna en fase oral genital y uretral gástrica anal retenida visceral silente."], "c": 0, "e": "\"Cuando se va a ejecutar una respuesta, todo se orienta hacia esa acción, que se convierte en figura, mientras que el resto de funciones hace de fondo más o menos inconsciente. Así, «si se levanta el brazo… el brazo levantado es la figura; el resto del cuerpo, el fondo» (Goldstein, 1961).\""}, {"q": "Entre sus más célebres disociaciones funcionales cerebrales descubiertas en los soldados con pérdida de masa gris, el facultativo constató con enorme sorpresa médica empírica un caso asombroso paradigmático con el simple objeto cotidiano de uso recurrente doméstico metálico de abrir de un trozo de acero \"una llave\"; así descubrió empíricamente probando in situ que un varón cerebralmente tocado o mermado neuronalmente por lesión cortical sí que podía mecánicamente introducirla motrizmente y abrir la cerradura pragmáticamente de la hoja y pomo de la puerta frente a él materialmente sin problema motriz atáxico, pero era dolorosamente profunda y clínicamente del todo y por completo absoluta y patéticamente inútil e impotente o incapaz del todo cognitivamente de decir, articular de viva voz vocal e intelectualmente o pronunciar qué era aquello que tenía asido en los dedos ni nombrarlo semánticamente verbal y lógicamente para identificarlo nominalmente. Esto evidenciaba que el paciente en cuestión arrastraba o sufría la dramática y selectiva destrucción clínica de la capacidad de operar y codificar información neural a nivel:", "o": ["Mágico adivinatorio teológico profundo místico silente chamánico ancestral puro.", "«Abstracto» (el nivel de procesar las palabras, categorías conceptuales teóricas formales descriptivas lógicas del lenguaje puro y conceptos).", "Muscular medular espinal aferente motor puramente conductual operante de repetición incondicional refleja visceral puramente atómica pavloviana gástrica de inervación vascular simpática en el nervio vago y ganglios."], "c": 1, "e": "\"Goldstein afirma que ese paciente ha perdido el nivel operativo «abstracto» (el de las palabras y conceptos), pero no el de la acción «concreta»; por eso podía emplear el objeto correctamente.\""}, {"q": "Consecuentemente, al lograr encajar material y espacialmente topológicamente el instrumento llave sin problemas en el bombín y girar el mecanismo con destreza abriendo en el acto para pasar, pese a su profunda y dramática ceguera verbal conceptual de mudez o amnesia semántica descrita, el paciente demostraba y dejaba patente biológicamente a las claras conservar operativo a salvo incólume e ileso de modo práctico de sus lesiones en el sistema aquel segundo nivel cerebral funcional básico que Goldstein denominaba nivel:", "o": ["Mítico-onírico silente letárgico.", "Concreto (el de la acción pragmática y el empleo correcto operativo de manipular espacial e intencionalmente de la realidad a mano sin palabras).", "Subatómico vibracional cuántico energético electromagnético puro de vacío existencial místico zen de meditación contemplativa budista pasiva sin reacción motora somática."], "c": 1, "e": "\"...pero no el de la acción «concreta»; por eso podía emplear el objeto correctamente.\""}, {"q": "Sintetizando y condensando y madurando largamente todo el caudal de sus observaciones globales reparadoras incesantes sobre las heridas y la supervivencia heroica biológica de sus heridos y sus reestructuraciones y readaptaciones neuroplásticas buscando nuevas áreas sanas y equilibrios vivos a toda costa vital con la masa sana restada, el brillante pensador acuñó teóricamente la idea motriz vitalista biológica suprema y definitiva filosófica de que en todo organismo orgánico sano vivo sin excepción y a todos los niveles biológicos reside latiendo permanentemente viva y con enorme y colosal pujanza y tesón orgánico central incuestionable una imponente inmensa y suprema \"fuerza\" y vector de impulso tenaz orientada incansablemente y obsesivamente a lograr sobrevivir, reajustarse y empujar a actuar salvando de cualquier modo íntegramente de la ruina o patología su potencial biológico innato; bautizó y etiquetó de manera formal a tal colosal fuerza motriz integradora central como la generalísima e intrínseca e irreductible biológica humana de la:", "o": ["Agresividad o instinto de muerte mortífera silente tánica de destrucción freudiana visceral letal tóxica sádica destructiva nihilista suicida profunda.", "Frecuencia u hábito pasivo mecanicista muerto estático estadístico estéril inorgánico sin sentido adaptativo homeostático o vitalista inanimado atómico y artificial incoloro.", "Tendencia a realizarse, o la poderosa vital y unificadora \"tendencia hacia la actualización de uno mismo\", figura motivadora que guía toda actividad de salud y reparación natural y defensa frente al mundo agresivo."], "c": 2, "e": "\"...hay una tensión que empuja a la acción... A esa fuerza o tensión la llamó la tendencia a realizarse, o tendencia hacia la actualización de uno mismo (Goldstein, 1961; 1951).\""}, {"q": "Este profundo, vital y luminoso concepto fundacional tan influyente filosófico postulado y formulado biológicamente en laboratorio original primerizo y clínico psiquiátrico somático formal médico y crudo por el buen doctor sobre que las entidades o personas en su fuero interno albergan y custodian una pulsión o anhelo motivador innato biológico intrínseco fuerte hacia la mejora, expansión positiva constructiva de supervivencia y \"actualización de sí mismos\", tuvo históricamente y bibliográficamente en Norteamérica sin género de dudas posteriormente (y como indica expresamente y reconoce literalmente y de modo explícito histórico el propio libro de texto de estudio en su parte final al cerrar la sección de Goldstein textualmente de manera literal y referenciada) una asimilación fortísima e influjo masivo abrumador y enérgico directo sembrador de base cimentador central teórica años o décadas más adelante como pilar y ladrillo dogmático base en el nacimiento y eclosión de los postulados humanísticos afirmativos teóricos pragmáticos y fundacionales de la famosa corriente filosófica o de la psique humana floreciente nacida en EEUU nombrada formalmente como:", "o": ["La escuela conductista skinneriana de Watson radical.", "La escuela de la psicología humanista (que se basó en el potencial y realización existencial positiva inmanente humana).", "El estructuralismo analítico estadístico correlacional abstracto puro de Galton biometría y Wundt."], "c": 1, "e": "\"Este ha sido un motivo que ha influido enérgicamente en la escuela de la psicología humanista, como veremos.\""}, {"q": "Mientras sus insignes y teóricos maestros (Wertheimer y Köhler) se entretenían abrumadoramente concentrando su intelecto masivo analítico y abstracto primordialmente puro en desentrañar las formaciones o gestalten en la experiencia \"consciente\", \"la percepción visual geométrica\", el campo fenomenológico perceptivo visual de las luces estroboscópicas ilusorias silentes atentas formales puras y en última instancia de todo ello su correlato y anclaje físico molecular denso directo anatómico estructural subyacente y macro material neurológico de las masas corticales anatómicas orgánicas formales espaciales macroscópicas físicas y tangibles duras reales isomorfas directas que anidan a modo fisiológico puramente orgánico en el campo del cráneo fisiológico cerebral estático vivo que las sustenta y rige y posibilita y permite la luz y el destello de la constancia (y también Goldstein en su caso en su vertiente puramente psiquiátrica clínica y médica somática profunda celular de bisturí del soma roto en hospitales tras las trincheras alemanas ensangrentadas incesantes lodosas lúgubres bélicas masivas mortíferas); por todo lo contrario, y como rasgo o matiz propio de enfoque social peculiar singular pragmático sociológico original genuino, dinámico vivo fluido biográfico existencial grupal interpersonal pionero e innovador en extremo genial diferencial marcado distintivo clave sin ataduras biológicas médicas, el joven prodigio discípulo germánico judío e inmortal investigador pionero e ingenioso matemático de formación asombrosa llamado Kurt Lewin estudió de una forma novedosísima o propuso innovadoramente volcar y centrar sin dilación en masa todo el foco masivo analítico macro de su nueva psicología ecológica teórica aplicable sobre la parcela del análisis profundo matemático descriptivo dinámico y tenso de las tensiones activas vivas existenciales cotidianas pragmáticas vivas del:", "o": ["La conducta o comportamiento real fáctico interaccional vivo diario pragmático dinámico biográfico o existencial cotidiano de la \"persona interactuando vitalmente inserta o inmersa y habitando rodeada de un mundo de metas inmersa y empujada dentro de un nuevo y vasto \"campo\" conceptual que él mismo creó y bautizó o denominó con la etiqueta e invención propia teórica abstracta y geométrica representacional fundamental y genial de su famoso concepto sociológico teórico purista del llamado nuevo \"espacio vital\".", "Las segregaciones puramente glandulares pancreáticas salivales amilásicas digestivas periféricas reflejas espinales moleculares aversivas negativas aisladas inconexas pasivas simples automáticas pavlovianas incondicionadas caninas rusas.", "El subconsciente represivo onírico atávico colectivo mítico ancestral mágico arcaico religioso instintivo de los tótems aborígenes freudianos profundos silentes letárgicos y la censura moral superyoica edípica incestuosa castradora de la represión vienesa clásica pura instintiva silente en el diván burgués ocioso decadente inactivo mudo analítico pasivo."], "c": 0, "e": "\"En efecto, mientras sus maestros explicaban la conducta a partir de las estructuras globales que aparecen en la experiencia consciente, y que tienen por base las estructuras que se forman en los campos cerebrales, Lewin estudia la conducta de la persona dentro de un nuevo tipo de campo, al que llamó espacio vital... Este espacio rodea a la persona y en él se sitúan las metas...\"."}, {"q": "A tenor de los manuales y el texto, la idea revolucionaria y rompedora fundacional de asentar que \"la conducta de un sujeto depende invariablemente y por completo para su inteligibilidad de la profunda y dinámica interacción viva real relacional asimilada unificadora e indisoluble que se gesta a cada momento en la totalidad que este entabla dialécticamente asimilativamente como unidad indivisible estructurada macro e integral existencial viva y palpitante inmersa interactuando en su mundo biográfico inmediato circundante en red\", convirtió o convirtió biográficamente directamente a Lewin (y su campo general relacional dinámico o teoría del mismo general e interactiva) en el padre fundacional, pionero histórico e inicio teórico conceptual evidente primigenio seminal precursor indudable originario y absoluto referenciado como el abanderado temprano iniciador genuino mundial decano y germen precursor teórico histórico indiscutible oficial norteamericano del valioso campo del conocimiento social científico conocido con el apelativo o adjetivo de:", "o": ["La psicología astrológica mística ocultista parapsicológica y mediúmnica irracional espiritista pura silente.", "La psicología «ecológica» (fijada en la interacción vital inmersa ineludible y real viva y bidireccional persona-ambiente como unidad y totalidad explicativa del campo vivencial dinámico diario grupal biográfico de interacción orgánica y adaptación ambiental total en red).", "La frenología somática estadística biométrica asilar eugénica racista supremacista y abstracta puramente criminalista y forense cadavérica y estática fría y forense del medidor del lóbulo cerebral izquierdo o derecho del criminal innato o nato purista simple de Lombroso del XIX muerto en prisión preventiva en aislamiento celular puro sin contacto alguno visual ciego y sordo y silente inactivo mudo letárgico."], "c": 1, "e": "\"La conducta depende de una totalidad que se organiza como «persona-mundo». Esta nueva idea hace de su sistema el inicio de la psicología «ecológica».\""}, {"q": "Lewin, obsesionado por emular a los físicos y dotar de armazón exacto matemático algebraico preciso y sintético rotundo formal a sus elaboradas construcciones o teoremas de la dinámica humana interrelacional conductual vital interdependiente, sintetizó de un modo asombroso y célebre e inmortalmente magistral todo el peso capital axiomático fundacional de su elaborada obra y arquitectura sociológica y conceptual relacional del campo en una sencilla, simple y elegante, pero a la par monumental e importantísima y profundísima ley u \"ecuación de la conducta\" universal base e inamovible paradigmática que resumía abstractamente y encriptaba su esencia dinámica e indicaba literalmente para la posteridad que la fórmula teórica definitiva a grabar en piedra para todo cálculo sería matemáticamente la de:", "o": ["E = H x D x K (Impulso x Hábito x Refuerzo / Ley del modelo del hábito animal y del instinto y potencial excitatorio físico motriz muscular de la rata hambrienta en laberinto estéril pavloviano estático ciego de Hull estricto y puro conductista periférico norteamericano experimental somático motor aislado y celular atómico sin propósito interno cognitivo mediador representacional silente analítico letárgico mudo o cognitivo abstracto intelectual de metas).", "E = mc² (Energía es igual a masa por la luz relativista astronómica en el vacío puro silente cuántico frío inorgánico de laboratorio del espacio muerto sin materia sordo y letárgico pasivo sin psique ni alma inerte muerto).", "B = f (P, E) [es decir, la conducta o Behaviour es siempre de forma indisoluble e innegociable e irremediable una función o producto dependiente dinámico total conjugado relacional dialéctico inseparable interactivo biológico activo resultante matemático de la Persona y el Medio físico psicológico o Enviroment]."], "c": 2, "e": "\"Esa interacción en el espacio vital la sintetiza en una ecuación: B = f (P, E). Es decir, que la conducta B (de behaviour) es una función de dos variables que la determinan: la persona P (person) y el medio E (enviroment).\""}, {"q": "En la concepción temporal o biográfica existencial viva del campo psicológico formulada en la mente y postulados de Lewin, cuando un psicoanalista, conductista o colega le cuestionaba incisivamente si el determinismo que empujaba la acción operaba desde atavismos genéticos pasados (la historia traumática) o anhelos y predicciones vacuas no nacidas abstractas puras divinas del día de mañana, Lewin (influido por el rigor del vector de la fuerza instantánea y presente de la física del aquí y ahora y la topología pragmática y existencial de su momento del instante fenomenológico del hombre activo asimilativo integrador del campo consciente unificado activo del sujeto) le respondía o dictaminaba como dogma o tesis y ley axiomática inviolable que en la inmensa organización asimilativa global operativa de la totalidad de ese campo de fuerzas y tensiones determinantes y propósitos de valencias motivadoras causales del aquí y ahora orgánico y topológico vivo que marca todo, la única y fundamental y primordial instancia o dimensión vital o marco del tiempo referencial que verdaderamente ostentaba peso, valía, contaba, importaba, mandaba, regía y marcaba realmente operativamente empíricamente en directo el ritmo como \"básicamente\" primordial y principal y efectivo en la ecuación viva de un sujeto humano maduro sano libre sin amarras de sombras neuróticas muertas silentes atávicas pasivas muertas, era simple y llanamente de forma rotunda el tiempo del:", "o": ["El Presente empírico vital activo inmediato circundante asimilado ahora del sujeto (argumentando a su vez en defensa coherente frente al ataque y crítica histórica a la memoria que \"incluso, llegado el caso, si un suceso o rastro biográfico del pasado o antaño arrastrado como trauma e influye o frena visiblemente la acción viva en el ahora del actor en la liza biográfica, ello solo querrá y podrá decir que no está física ni operativamente muerto del todo ni yermo fenecido, sino que en su sistema ese trauma vive dolorosamente hoy y por ende es un ente y factor o fuerza real algo activo palpablemente vivo y operante y doloroso hoy, aquí, dentro de las valencias o vectores y sombras o barreras de ese mismo 'presente' interaccional vivo, tenso relacional que se mide ahora en el laboratorio psicosocial\").", "El Pasado pretérito muerto fósil reprimido remoto puramente genético atávico freudiano somático hereditario determinista ciego pasivo irracional fatalista inmutable inalterable de los tótems australianos aborígenes antropológicos chamánicos muertos y pasados mudos y primitivos sin consciencia en la selva originaria simiesca darwiniana ciego de las cavernas oscuras pre rústicas inorgánicas de hueso y polvo y lodo.", "El Futuro lejano escatológico profético utópico de ciencia ficción o irreal fantaseado onírico silente hipnótico sugestivo magnético místico de adivinación del mesmerismo psiquiátrico de bola de cristal y cartas del tarot adivinas de charlatanes pseudocientíficos de feria pueblerina lúgubre del medioevo estático dogmático represor gótico sin ciencia ni luz ni sol."], "c": 0, "e": "\"La organización de ese campo depende del tiempo, y lo que en aquella cuenta es básicamente el presente. Si algo del pasado todavía influye en el ahora, ello querrá decir que no está muerto, sino que es algo vivo y operante.\""}, {"q": "Cuando la persona (el elemento P) en el entorno (E) experimenta necesidades o anhelos y tensiones o cuasinecesidades que la impulsan y motivan y empujan u orientan, el campo total vital se electrifica dinámicamente y se carga como un campo magnético físico abstracto figurado lleno de fuerzas o \"valencias\" invisibles; Lewin denominó con rigor a esa atracción o repulsión intrínseca empírica u ontológica positiva o negativa biológica de acercamiento o evitación que \"poseen\", emiten, ostentan, adquieren o emanan y despliegan los \"objetos-meta\" situados en dicho campo biográfico vital existencial y que son capaces de tirar magnéticamente conductualmente (o repeler visceral y frontalmente espantando al individuo humano pragmático hacia atrás huyendo del peligro inminente de ese objetivo fatal en ciernes si son malas) y determinan por qué y cómo obra la persona movida en esa geometría, como la fuerza directriz fundamental, el valor asimilativo atrayente empírico direccional relacional relacional o la pura:", "o": ["Reflexología de orden superior canino salival pura rusa aversiva letal tánica destructiva molecular sin escape condicionada asimilada por castigo o choque galvánico estático pavloviano visceral automático letárgico sin propósito racional o propósito alguno intelectivo de mapa o ruta.", "Valencia (su fuerza de atracción o su valor como repelente para el hombre en el campo dinámico, condicionada por el sujeto y sus necesidades cambiantes empíricas y biográficas vitales dinámicas vivas asimiladas de metas lógicas o irracionales vitales a cada momento u hora y situación).", "Ley matemática pasiva del ensayo y del cansancio somático repetitivo estático biológico de inercia o desgaste celular neuronal puro oxidativo celular de las endorfinas somáticas motrices y musculares motoras simples estériles de Hull y de Thorndike en jaulas insonorizadas opacas esqueléticas norteamericanas de gatos."], "c": 1, "e": "\"La persona es atraída o repelida por objetos-meta, que poseen un valor, lo que llama «valencia». Las valencias, en gran medida, dependen de la persona y de sus necesidades.\""}, {"q": "El sujeto inmerso activamente en el entorno no siempre ni en todos los casos ni muchísimo menos alcanza sus vastos y pletóricos anhelos utópicos u objetivos absolutos y metas biológicas y sociales magnas supremas ideales directamente ni a la primera ni en línea recta como por arte de magia mística chamánica instantánea divina o de prestidigitación ilusoria sin esfuerzo físico de laboratorio, por el contrario, debe lógicamente, racional e inteligentemente
