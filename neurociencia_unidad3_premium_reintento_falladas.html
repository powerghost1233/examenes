<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurociencia Unidad 3 Premium | DAVID MILÁN STUDIO</title>
<style>
:root{--bg:#05070d;--bg2:#0b1323;--gold:#d4af37;--gold2:#f3d98b;--white:#f8f4e8;--muted:#aab3c5;--green:#33d17a;--red:#ff6b6b;--blue:#4da3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at top left,rgba(212,175,55,.22),transparent 34%),radial-gradient(circle at bottom right,rgba(30,90,180,.28),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2),#05070d);color:var(--white);display:flex;justify-content:center;align-items:center;padding:35px 18px}
.quiz-container{width:100%;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(212,175,55,.28);border-radius:30px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);color:var(--gold2);letter-spacing:3px;font-weight:800;font-size:13px;margin-bottom:18px;background:rgba(255,255,255,.04)}
h1{font-size:clamp(30px,5vw,54px);line-height:1;margin-bottom:10px;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{font-size:17px;color:var(--muted);font-weight:400;margin-bottom:26px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.stat{padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:800}
.progress-wrap{height:10px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin-bottom:24px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:.35s ease}
.question-card{background:rgba(4,8,16,.55);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px}
.question{font-size:21px;font-weight:800;line-height:1.45;margin-bottom:22px}
.options{display:grid;gap:13px}
.option-btn{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));color:var(--white);font-size:16px;text-align:left;cursor:pointer;transition:.25s ease}
.option-btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(212,175,55,.65);box-shadow:0 12px 30px rgba(212,175,55,.12)}
.option-btn:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.16)!important;border-color:var(--green)!important;color:#dfffea!important}
.incorrect{background:rgba(255,107,107,.16)!important;border-color:var(--red)!important;color:#ffe0e0!important}
.feedback{display:none;margin-top:22px;padding:20px;border-radius:20px;line-height:1.65;font-size:15px}
.feedback.show{display:block}.feedback-correct{background:rgba(51,209,122,.12);border-left:5px solid var(--green)}.feedback-incorrect{background:rgba(255,107,107,.12);border-left:5px solid var(--red)}
.feedback strong{font-size:18px}.solution-label{display:block;margin-top:12px;color:var(--gold2);font-weight:900}
.controls{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:16px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;transition:.25s ease}.btn:hover{transform:translateY(-2px)}
.next-btn{display:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080b12}.secondary-btn{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.14)}
.score-container{display:none;text-align:center;padding:24px}.score-text{font-size:30px;font-weight:900;color:var(--gold2);margin-bottom:18px}.result-message{color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:24px}
.medal{display:inline-block;margin:14px 0 10px;padding:12px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.10);color:var(--gold2);font-weight:900}
.missed-box{text-align:left;margin:24px 0;padding:20px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}.missed-box h3{color:var(--gold2);margin-bottom:12px}.missed-box ul{padding-left:20px;color:#dbe2f2;line-height:1.6}
.mode-label{color:var(--blue);font-weight:900}
@media(max-width:650px){.quiz-container{padding:22px}.question-card{padding:20px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="quiz-container">
  <div class="brand">DAVID MILÁN STUDIO</div>
  <h1>Mega-Test Premium</h1>
  <h2>Unidad 3 · Organización del Sistema Nervioso I</h2>
  <div id="quiz-screen">
    <div class="topbar">
      <div class="stat" id="progress-text">Pregunta 1 de 80</div>
      <div class="stat" id="score-tracker">Puntuación: 0</div>
      <div class="stat" id="mode-text">Modo completo</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="question-card">
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div id="feedback-container" class="feedback"></div>
      <div class="controls">
        <button class="btn secondary-btn" onclick="restartQuiz()">Reiniciar test</button>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Siguiente pregunta</button>
      </div>
    </div>
  </div>
  <div id="result-screen" class="score-container">
    <div class="score-text" id="final-score"></div>
    <div class="medal" id="medal-text"></div>
    <div class="result-message" id="final-message"></div>
    <div id="missed-summary" class="missed-box"></div>
    <div class="controls" style="justify-content:center;">
      <button class="btn secondary-btn" onclick="restartQuiz()">Volver a intentar todo</button>
      <button class="btn next-btn" id="retry-missed-btn" onclick="retryMissed()">Reintentar preguntas falladas</button>
    </div>
  </div>
</div>
<script>
const originalQuestions = [

        // Coordenadas y Orientación
        { q: "En el sistema tridimensional de coordenadas del sistema nervioso, ¿qué eje va de la parte frontal a la parte occipital?", o: ["Eje anteroposterior.", "Eje dorsoventral.", "Eje mediolateral."], c: 0, e: "El eje anteroposterior va de la parte anterior (frontal) a la parte posterior (occipital)." },
        { q: "¿Qué particularidad presenta el eje dorsoventral en el cerebro humano en comparación con la médula espinal?", o: ["Desaparece por completo en la médula.", "Cambia de orientación en el encéfalo respecto a la médula por el ángulo del neuroeje.", "Es exactamente idéntico y paralelo en ambas estructuras sin ninguna variación."], c: 1, e: "En el cerebro humano, por el ángulo del neuroeje, el eje dorsoventral cambia de orientación en el encéfalo respecto a la médula espinal." },
        { q: "¿Qué plano anatómico divide el cerebro en una mitad izquierda y una mitad derecha?", o: ["Plano sagital.", "Plano coronal o frontal.", "Plano axial."], c: 0, e: "El plano sagital divide el cerebro en izquierda y derecha. El plano sagital medio pasa por la línea media." },
        { q: "Si realizamos un corte que divide al cerebro en una parte anterior y otra posterior, estamos usando el plano:", o: ["Plano sagital.", "Plano horizontal.", "Plano coronal o frontal."], c: 2, e: "El plano coronal o frontal divide el cerebro en una parte anterior y otra posterior." },
        { q: "El plano axial, horizontal o transversal divide el sistema nervioso en:", o: ["Parte izquierda y derecha.", "Parte anterior y posterior.", "Parte superior e inferior."], c: 2, e: "El plano axial, horizontal o transversal divide en una parte superior y otra inferior." },
        { q: "En terminología direccional, el término 'Rostral' es sinónimo de:", o: ["Anterior (delante).", "Posterior (detrás).", "Ventral (abajo)."], c: 0, e: "Anterior o rostral hace referencia a la parte de 'delante'." },
        { q: "Si dos estructuras se encuentran en la misma mitad o lado del cuerpo, se dice que son:", o: ["Contralaterales.", "Ipsilaterales.", "Mediales."], c: 1, e: "Ipsilateral hace referencia a estructuras que están en la misma mitad o lado del cuerpo." },
        
        // Divisiones Generales del SN
        { q: "¿Qué partes del Sistema Nervioso se incluyen dentro del Sistema Nervioso Central (SNC) por encontrarse dentro de una cavidad ósea?", o: ["Los nervios espinales y ganglios autónomos.", "El cerebro y la médula espinal.", "El sistema simpático y parasimpático."], c: 1, e: "El SNC incluye las partes dentro de una cavidad ósea: cerebro y médula espinal." },
        { q: "El Sistema Nervioso Periférico (SNP) comprende a su vez dos sistemas. ¿Cuáles son?", o: ["El cerebro y el cerebelo.", "El encéfalo y la médula espinal.", "El Sistema Nervioso Somático y el Sistema Nervioso Autónomo."], c: 2, e: "El SNP comprende el Sistema Nervioso Somático (SNS) y el Sistema Nervioso Autónomo (SNA)." },
        { q: "¿Cómo se llaman las proyecciones axónicas que interrelacionan diferentes partes cuando están ubicadas DENTRO del sistema nervioso central?", o: ["Nervios.", "Haces o tractos.", "Ganglios."], c: 1, e: "Se llaman haces o tractos si están ubicados en el SNC, y nervios si forman parte del SNP." },
        { q: "¿A qué sistema pertenece el procesamiento de información inconsciente encargado de la función visceral, corazón y musculatura lisa?", o: ["Al Sistema Nervioso Somático.", "Al Sistema Nervioso Autónomo (SNA).", "A la vía columna dorsal-lemniscal."], c: 1, e: "El SNA es el encargado de la función visceral y forma parte del procesamiento de la información inconsciente." },

        // Sistema Nervioso Somático (Sensitivo)
        { q: "Dentro del Sistema Nervioso Somático, ¿qué detecta el subsistema mecanosensitivo?", o: ["Estímulos dolorosos y cambios de temperatura.", "Estímulos mecánicos como tacto ligero, vibración y presión.", "El grado de contracción de la musculatura lisa visceral."], c: 1, e: "El subsistema mecanosensitivo detecta estímulos mecánicos como tacto ligero, vibración y presión." },
        { q: "¿Dónde se localizan los propioceptores que controlan las fuerzas mecánicas generadas internamente?", o: ["En la superficie de la epidermis.", "En músculos, articulaciones y otras estructuras profundas.", "En las paredes de los vasos sanguíneos."], c: 1, e: "Los propioceptores están localizados en músculos, articulaciones y otras estructuras profundas." },
        { q: "¿En qué región de la corteza cerebral culminan las vías sensitivas ascendentes para su interpretación final?", o: ["En la corteza somatosensorial primaria (lóbulo parietal).", "En la corteza motora primaria (lóbulo frontal).", "En el tectum mesencefálico."], c: 0, e: "La información sensitiva asciende hasta alcanzar la corteza somatosensorial primaria (circunvolución poscentral del lóbulo parietal)." },
        { q: "¿Qué tipo de información transporta la vía 'columna dorsal-lemniscal medial'?", o: ["Tacto y propiocepción.", "Dolor y temperatura.", "Órdenes motoras para músculos esqueléticos."], c: 0, e: "La vía columna dorsal-lemniscal medial transporta información sobre tacto y propiocepción." },
        { q: "¿En qué punto anatómico decusan (cruzan al lado opuesto) los axones de segundo orden de la vía columna dorsal-lemniscal?", o: ["Inmediatamente al entrar en la médula espinal.", "En los núcleos de la columna dorsal del bulbo raquídeo.", "En la corteza parietal."], c: 1, e: "En la vía dorsal-lemniscal, las neuronas ascienden ipsilateralmente y decusan en los núcleos de la columna dorsal del bulbo raquídeo." },
        { q: "¿Qué vía sensorial es la encargada de transmitir la información de dolor y temperatura?", o: ["El tracto corticospinal.", "La vía espinotalámica (anterolateral).", "La vía lemniscal medial."], c: 1, e: "La vía espinotalámica transporta la información de dolor y temperatura." },
        { q: "A diferencia de la vía del tacto, ¿dónde decusan los axones de la vía espinotalámica (dolor/temperatura)?", o: ["En el bulbo raquídeo.", "En el tálamo.", "Inmediatamente en la médula espinal antes de ascender."], c: 2, e: "En la vía espinotalámica, los axones decusan inmediatamente en la médula espinal y ascienden contralateralmente." },

        // Sistema Nervioso Somático (Motor)
        { q: "En el sistema motor somático, ¿dónde se localizan los cuerpos celulares de las 'neuronas motoras superiores'?", o: ["En las astas ventrales de la médula espinal.", "En la corteza cerebral o en el tronco encefálico.", "En los ganglios de la raíz dorsal."], c: 1, e: "Las neuronas motoras superiores tienen sus cuerpos celulares en la corteza cerebral o en el tronco encefálico." },
        { q: "Las vías motoras descendentes se dividen en laterales y ventromediales. ¿Cuál es la función principal de las vías laterales?", o: ["Controlar los movimientos voluntarios de la musculatura distal.", "Mantener la postura en bipedestación frente a la gravedad.", "Orientar la cabeza hacia estímulos visuales."], c: 0, e: "Las vías laterales controlan los movimientos voluntarios de la musculatura distal bajo control cortical directo." },
        { q: "¿Cuál es el tracto motor descendente más largo y ancho, originado en la corteza motora?", o: ["Tracto tectospinal.", "Tracto rubrospinal.", "Tracto corticospinal lateral (piramidal)."], c: 2, e: "El tracto corticospinal lateral (piramidal) es el más largo y ancho, originado en la corteza motora." },
        { q: "¿Dónde decusa (cruza) el tracto corticospinal lateral?", o: ["En la médula espinal lumbar.", "En las pirámides bulbares.", "En el núcleo rojo del mesencéfalo."], c: 1, e: "El tracto corticospinal desciende formando las pirámides bulbares, donde decusa para descender por la columna lateral." },
        { q: "¿Dónde se origina el tracto rubrospinal lateral?", o: ["En el colículo superior.", "En el núcleo rojo (rubro) del mesencéfalo.", "En la formación reticular bulbar."], c: 1, e: "El tracto rubrospinal lateral se origina en el núcleo rojo (rubro) del mesencéfalo." },
        { q: "¿Qué grupo de vías motoras participa principalmente en el mantenimiento de la postura y en movimientos reflejos?", o: ["Las vías laterales.", "Las vías ventromediales.", "Las vías aferentes espinotalámicas."], c: 1, e: "Las vías ventromediales participan principalmente en el mantenimiento de la postura y en movimientos reflejos." },
        { q: "¿Qué tracto ventromedial mantiene la cabeza equilibrada sobre los hombros mientras el cuerpo se mueve?", o: ["Tracto vestibulospinal.", "Tracto tectospinal.", "Tracto rubrospinal."], c: 0, e: "El tracto vestibulospinal mantiene la cabeza equilibrada sobre los hombros mientras el cuerpo se mueve." },
        { q: "Si giramos la cabeza y los ojos automáticamente hacia un nuevo estímulo visual, ¿qué tracto motor ventromedial está actuando?", o: ["Tracto corticospinal.", "Tracto reticulospinal pontino.", "Tracto tectospinal."], c: 2, e: "El tracto tectospinal permite orientar cabeza y ojos hacia nuevos estímulos; se origina en el colículo superior." },
        { q: "¿Qué tractos se originan en la formación reticular y permiten mantener la postura en bipedestación para resistir la gravedad?", o: ["Tractos reticulospinales (bulbares y pontinos).", "Tractos piramidales.", "Haces espinotalámicos."], c: 0, e: "Los tractos reticulospinales bulbares y pontinos se originan en la formación reticular y mantienen la postura frente a la gravedad." },

        // Sistema Nervioso Autónomo (SNA)
        { q: "El Sistema Nervioso Autónomo (SNA) controla las funciones involuntarias y consta de cadenas de conexión. ¿Cuántas neuronas componen estas cadenas desde el SNC hasta el órgano?", o: ["Una sola neurona larga.", "Cadenas de dos neuronas (preganglionar y posganglionar).", "Cadenas de tres neuronas que siempre pasan por el tálamo."], c: 1, e: "Ambas divisiones (simpática/parasimpática) constan de cadenas de dos neuronas que conectan el SNC con los músculos lisos o glándulas." },
        { q: "¿De dónde parten los axones preganglionares de la división simpática?", o: ["Del tronco encefálico y los segmentos sacros.", "Del tercio medio de la médula espinal (segmentos torácico y lumbar).", "Directamente del hipotálamo sin pasar por la médula."], c: 1, e: "Los axones preganglionares simpáticos parten del tercio medio de la médula espinal (torácico y lumbar)." },
        { q: "¿De dónde parten los axones preganglionares de la división parasimpática?", o: ["Segmentos torácico y lumbar.", "Tronco encefálico y segmentos sacros de la médula espinal.", "De los ganglios de la raíz dorsal."], c: 1, e: "Parten del tronco encefálico y segmentos sacros de la médula espinal." },
        { q: "¿Dónde se ubican los ganglios autónomos de la división simpática?", o: ["Muy próximos o dentro de los órganos diana.", "En la corteza cerebral.", "Próximos a la médula espinal, formando la cadena simpática."], c: 2, e: "Los axones de la división simpática hacen sinapsis en ganglios próximos a la médula, formando la cadena simpática." },
        { q: "¿Cuál es la función principal de la división simpática del SNA?", o: ["Conservación de energía y digestión.", "Movilizar el cuerpo frente a emergencias a corto plazo ('lucha o huida').", "Regular el sueño y la vigilia cerebral."], c: 1, e: "Moviliza el cuerpo frente a emergencias a corto plazo ('lucha o huida')." },
        { q: "¿Qué división del SNA favorece procesos de mantenimiento y conservación a largo plazo, como la digestión y el crecimiento?", o: ["La división simpática.", "La división parasimpática.", "El subsistema nociceptivo."], c: 1, e: "La parasimpática favorece procesos de mantenimiento a largo plazo (digestión, crecimiento)." },
        { q: "En cuanto a la interacción entre el simpático y parasimpático, es cierto que:", o: ["Suelen activarse intensamente al mismo tiempo para potenciar el efecto.", "La actividad de una división inhibe la de la otra.", "No tienen ninguna relación entre sí."], c: 1, e: "Ambas divisiones no pueden activarse intensamente al mismo tiempo. La actividad de una división inhibe la de la otra." },
        { q: "¿Qué estructuras reciben INERVACIÓN EXCLUSIVA del sistema simpático (no tienen inervación parasimpática)?", o: ["Glándulas lagrimales.", "Estómago y páncreas.", "Vasos sanguíneos de la piel y glándulas sudoríparas."], c: 2, e: "Vasos sanguíneos de la piel y glándulas sudoríparas reciben solo inervación simpática." },
        { q: "¿Qué estructura es regulada exclusivamente por el sistema parasimpático?", o: ["Glándulas lagrimales.", "Médula suprarrenal.", "Folículos pilosos."], c: 0, e: "Las glándulas lagrimales reciben únicamente inervación parasimpática." },
        { q: "¿Qué división del SNA se localiza en las paredes del esófago, estómago, intestinos, páncreas y vesícula biliar?", o: ["División parasimpática.", "División simpática.", "División entérica."], c: 2, e: "La división entérica es un sistema neuronal localizado en las paredes del tracto gastrointestinal." },
        { q: "A nivel del SNC, ¿qué estructura es el 'principal regulador' de las neuronas preganglionares autónomas?", o: ["El cerebelo.", "El hipotálamo.", "La corteza somatosensorial."], c: 1, e: "El hipotálamo es el principal regulador de las neuronas preganglionares autónomas." },
        { q: "¿Qué núcleo del bulbo raquídeo integra la información sensorial de los órganos internos para coordinar el SNA?", o: ["El núcleo rojo.", "El núcleo caudado.", "El núcleo del tracto solitario."], c: 2, e: "El núcleo del tracto solitario (bulbo raquídeo) integra la información sensorial de los órganos internos." },
        { q: "Ante una emergencia, dilatar la pupila, acelerar el latido cardíaco y estimular la liberación de glucosa son funciones típicas de:", o: ["El sistema entérico.", "El sistema parasimpático.", "El sistema simpático."], c: 2, e: "Estas acciones (dilatar pupila, acelerar corazón, liberar glucosa) pertenecen al sistema simpático ('lucha o huida')." },
        { q: "Contraer las vías aéreas y estimular la digestión y la salivación son efectos fisiológicos del:", o: ["Sistema parasimpático.", "Sistema simpático.", "Sistema somatomotor."], c: 0, e: "El sistema parasimpático contrae vías aéreas, estimula digestión y salivación (estado de reposo y conservación)." },

        // Médula Espinal
        { q: "¿Desde qué vértebra hasta qué vértebra se extiende la médula espinal en un adulto?", o: ["Desde la primera cervical hasta el final del sacro.", "Desde la primera cervical hasta la duodécima torácica.", "Desde la quinta torácica hasta el cóccix."], c: 1, e: "En el adulto se extiende desde la primera vértebra cervical hasta la duodécima vértebra torácica." },
        { q: "¿Cuántos pares de nervios espinales surgen de la médula espinal?", o: ["12 pares.", "31 pares.", "43 pares."], c: 1, e: "De la médula espinal surgen 31 pares de nervios espinales segmentarios." },
        { q: "Cada nervio espinal se conecta a la médula mediante dos raíces. ¿Qué tipo de información transporta la RAÍZ DORSAL?", o: ["Información sensitiva hacia la médula.", "Órdenes motoras hacia los músculos.", "Información puramente simpática."], c: 0, e: "La raíz dorsal transmite información sensitiva hacia la médula." },
        { q: "¿Dónde se encuentran agrupados los cuerpos celulares de las neuronas sensoriales espinales?", o: ["Dentro del asta ventral de la médula.", "Fuera de la médula, en los ganglios de la raíz dorsal.", "En las pirámides bulbares."], c: 1, e: "Los cuerpos celulares de las neuronas sensoriales se encuentran agrupados fuera de la médula en los ganglios de la raíz dorsal." },
        { q: "¿Por qué se forma la 'cola de caballo' anatómica en la columna vertebral?", o: ["Porque los nervios lumbares y sacros deben descender varios centímetros antes de salir debido a que la médula es más corta que la columna.", "Porque la sustancia blanca se ramifica externamente en la zona cervical.", "Por una malformación común de los ganglios basales."], c: 0, e: "Dado que la médula espinal es más corta que la columna, los nervios lumbares y sacros descienden formando la cola de caballo." },
        { q: "La médula presenta un 'ensanchamiento cervical' (C5-T1). ¿Con qué función se relaciona esta zona más gruesa?", o: ["Con la inervación de las piernas.", "Con el control de esfínteres.", "Con el mayor número de células para inervar los brazos."], c: 2, e: "El ensanchamiento cervical (C5-T1) está relacionado con los nervios que inervan los brazos." },
        { q: "¿Qué estructura de la médula espinal está compuesta principalmente por cuerpos celulares de neuronas no mielinizadas y tiene forma de 'H'?", o: ["La sustancia blanca.", "Las meninges.", "La sustancia gris."], c: 2, e: "El núcleo central de sustancia gris tiene forma de 'H' y está compuesto por cuerpos celulares no mielinizados." },
        { q: "Dentro de la sustancia gris medular, ¿qué ramas envían órdenes motoras hacia los músculos y glándulas?", o: ["Las astas dorsales.", "Las astas ventrales.", "Los cordones laterales."], c: 1, e: "Las astas ventrales envían órdenes motoras hacia los músculos y glándulas." },

        { q: "¿Cuántos pares de nervios craneales se originan en el encéfalo/tronco encefálico para inervar la cabeza y órganos internos?", o: ["8 pares.", "12 pares.", "31 pares."], c: 1, e: "El tronco encefálico da origen a los 12 pares de nervios craneales." },
        { q: "El Par Craneal II (nervio óptico) que transmite información visual, ¿a qué división del sistema nervioso pertenece?", o: ["SNP somático.", "SNC.", "SNP autónomo."], c: 1, e: "El Par II (nervio óptico) pertenece al SNC y transmite información visual desde la retina." },

        { q: "¿Qué estructura se extiende por mesencéfalo, protuberancia y bulbo, y regula el sueño-vigilia, el estado de alerta y la conciencia?", o: ["Los ganglios basales.", "La formación reticular.", "El sistema límbico."], c: 1, e: "La formación reticular se extiende por todo el tronco y regula el sueño-vigilia, alerta y conciencia." },

        { q: "¿Cómo se llama la región central del cerebelo situada entre sus dos hemisferios?", o: ["Tectum.", "Fornix.", "Vermis."], c: 2, e: "El cerebelo posee dos hemisferios y una región central llamada vermis." },

let questions=[...originalQuestions],currentQuestion=0,score=0,answered=false,missedQuestions=[],retryMode=false;
const questionText=document.getElementById('question-text'),optionsContainer=document.getElementById('options-container'),feedbackContainer=document.getElementById('feedback-container'),nextBtn=document.getElementById('next-btn'),progressText=document.getElementById('progress-text'),scoreTracker=document.getElementById('score-tracker'),quizScreen=document.getElementById('quiz-screen'),resultScreen=document.getElementById('result-screen'),finalScore=document.getElementById('final-score'),finalMessage=document.getElementById('final-message'),progressBar=document.getElementById('progress-bar'),missedSummary=document.getElementById('missed-summary'),retryMissedBtn=document.getElementById('retry-missed-btn'),modeText=document.getElementById('mode-text'),medalText=document.getElementById('medal-text');
function loadQuestion(){answered=false;feedbackContainer.style.display='none';feedbackContainer.className='feedback';feedbackContainer.innerHTML='';nextBtn.style.display='none';const q=questions[currentQuestion],total=questions.length,percent=Math.round((currentQuestion/total)*100);progressText.innerText=`Pregunta ${currentQuestion+1} de ${total}`;progressBar.style.width=`${percent}%`;modeText.innerHTML=retryMode?'<span class="mode-label">Modo repaso: falladas</span>':'Modo completo';questionText.innerText=`${currentQuestion+1}. ${q.q}`;optionsContainer.innerHTML='';q.o.forEach((opt,index)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerText=opt;btn.onclick=()=>selectOption(index,btn);optionsContainer.appendChild(btn);});}
function selectOption(index,btn){if(answered)return;answered=true;const q=questions[currentQuestion],allBtns=optionsContainer.querySelectorAll('.option-btn');allBtns.forEach(b=>b.disabled=true);const correctText=q.o[q.c];if(index===q.c){btn.classList.add('correct');score++;scoreTracker.innerText=`Puntuación: ${score}`;feedbackContainer.classList.add('show','feedback-correct');feedbackContainer.innerHTML=`<strong>Correcto.</strong><span class="solution-label">Por qué es correcto:</span>${q.e}`;}else{btn.classList.add('incorrect');allBtns[q.c].classList.add('correct');if(!missedQuestions.some(item=>item.q===q.q)){missedQuestions.push(q)}feedbackContainer.classList.add('show','feedback-incorrect');feedbackContainer.innerHTML=`<strong>Respuesta equivocada.</strong><br>Has marcado: <b>${q.o[index]}</b><br>La solución correcta es: <b>${correctText}</b><span class="solution-label">Por qué esa es la solución correcta:</span>${q.e}`;}nextBtn.style.display='block';nextBtn.innerText=currentQuestion===questions.length-1?'Ver resultados':'Siguiente pregunta';}
function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){loadQuestion()}else{showResults()}}
function showResults(){quizScreen.style.display='none';resultScreen.style.display='block';progressBar.style.width='100%';const percentage=Math.round((score/questions.length)*100);finalScore.innerHTML=`Has acertado ${score} de ${questions.length} preguntas (${percentage}%)`;if(percentage>=90)medalText.innerText='🏆 Medalla de Oro · Dominio excelente';else if(percentage>=75)medalText.innerText='🥈 Medalla de Plata · Muy buen nivel';else if(percentage>=60)medalText.innerText='🥉 Medalla de Bronce · Base aprobada';else medalText.innerText='📚 Modo refuerzo · Conviene repasar';let message='';if(percentage>=90)message='Extraordinario. Dominas ejes, planos, divisiones del sistema nervioso, vías sensitivas, motoras y estructuras principales.';else if(percentage>=70)message='Buen resultado. Repasa las preguntas falladas para consolidar médula, tronco, cerebelo, SNA y vías somáticas.';else message='Conviene repasar la organización general del sistema nervioso, los tractos ascendentes y descendentes, y las estructuras del tronco encefálico.';finalMessage.innerText=message;if(missedQuestions.length>0){missedSummary.style.display='block';missedSummary.innerHTML=`<h3>Preguntas falladas: ${missedQuestions.length}</h3><ul>${missedQuestions.map((q,i)=>`<li>${i+1}. ${q.q}</li>`).join('')}</ul>`;retryMissedBtn.style.display='inline-block';}else{missedSummary.style.display='block';missedSummary.innerHTML='<h3>No has fallado ninguna pregunta.</h3><p>Resultado perfecto. No hay preguntas que reintentar.</p>';retryMissedBtn.style.display='none';}}
function retryMissed(){if(missedQuestions.length===0)return;questions=[...missedQuestions];missedQuestions=[];currentQuestion=0;score=0;retryMode=true;scoreTracker.innerText='Puntuación: 0';resultScreen.style.display='none';quizScreen.style.display='block';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
function restartQuiz(){questions=[...originalQuestions];currentQuestion=0;score=0;answered=false;missedQuestions=[];retryMode=false;scoreTracker.innerText='Puntuación: 0';quizScreen.style.display='block';resultScreen.style.display='none';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
loadQuestion();

</script>
