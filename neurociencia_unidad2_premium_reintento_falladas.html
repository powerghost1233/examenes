<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurociencia Premium | DAVID MILÁN STUDIO</title>
<style>
:root{--bg:#05070d;--bg2:#0b1323;--gold:#d4af37;--gold2:#f3d98b;--white:#f8f4e8;--muted:#aab3c5;--green:#33d17a;--red:#ff6b6b;--blue:#4da3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at top left,rgba(212,175,55,.22),transparent 34%),radial-gradient(circle at bottom right,rgba(30,90,180,.28),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2),#05070d);color:var(--white);display:flex;justify-content:center;align-items:center;padding:35px 18px}
.quiz-container{width:100%;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(212,175,55,.28);border-radius:30px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);color:var(--gold2);letter-spacing:3px;font-weight:800;font-size:13px;margin-bottom:18px;background:rgba(255,255,255,.04)}
h1{font-size:clamp(30px,5vw,54px);line-height:1;margin-bottom:10px;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{font-size:17px;color:var(--muted);font-weight:400;margin-bottom:26px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.stat{padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:800}
.progress-wrap{height:10px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin-bottom:24px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:.35s ease}
.question-card{background:rgba(4,8,16,.55);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px}
.question{font-size:21px;font-weight:800;line-height:1.45;margin-bottom:22px}
.options{display:grid;gap:13px}
.option-btn{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));color:var(--white);font-size:16px;text-align:left;cursor:pointer;transition:.25s ease}
.option-btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(212,175,55,.65);box-shadow:0 12px 30px rgba(212,175,55,.12)}
.option-btn:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.16)!important;border-color:var(--green)!important;color:#dfffea!important}
.incorrect{background:rgba(255,107,107,.16)!important;border-color:var(--red)!important;color:#ffe0e0!important}
.feedback{display:none;margin-top:22px;padding:20px;border-radius:20px;line-height:1.65;font-size:15px}
.feedback.show{display:block}.feedback-correct{background:rgba(51,209,122,.12);border-left:5px solid var(--green)}.feedback-incorrect{background:rgba(255,107,107,.12);border-left:5px solid var(--red)}
.feedback strong{font-size:18px}.solution-label{display:block;margin-top:12px;color:var(--gold2);font-weight:900}
.controls{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:16px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;transition:.25s ease}.btn:hover{transform:translateY(-2px)}
.next-btn{display:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080b12}.secondary-btn{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.14)}
.score-container{display:none;text-align:center;padding:24px}.score-text{font-size:30px;font-weight:900;color:var(--gold2);margin-bottom:18px}.result-message{color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:24px}
.medal{display:inline-block;margin:14px 0 10px;padding:12px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.10);color:var(--gold2);font-weight:900}
.missed-box{text-align:left;margin:24px 0;padding:20px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}.missed-box h3{color:var(--gold2);margin-bottom:12px}.missed-box ul{padding-left:20px;color:#dbe2f2;line-height:1.6}
.mode-label{color:var(--blue);font-weight:900}
@media(max-width:650px){.quiz-container{padding:22px}.question-card{padding:20px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="quiz-container">
  <div class="brand">DAVID MILÁN STUDIO</div>
  <h1>Mega-Test Premium</h1>
  <h2>Unidad 2 · Células nerviosas y comunicación neuronal</h2>
  <div id="quiz-screen">
    <div class="topbar">
      <div class="stat" id="progress-text">Pregunta 1 de 80</div>
      <div class="stat" id="score-tracker">Puntuación: 0</div>
      <div class="stat" id="mode-text">Modo completo</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="question-card">
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div id="feedback-container" class="feedback"></div>
      <div class="controls">
        <button class="btn secondary-btn" onclick="restartQuiz()">Reiniciar test</button>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Siguiente pregunta</button>
      </div>
    </div>
  </div>
  <div id="result-screen" class="score-container">
    <div class="score-text" id="final-score"></div>
    <div class="medal" id="medal-text"></div>
    <div class="result-message" id="final-message"></div>
    <div id="missed-summary" class="missed-box"></div>
    <div class="controls" style="justify-content:center;">
      <button class="btn secondary-btn" onclick="restartQuiz()">Volver a intentar todo</button>
      <button class="btn next-btn" id="retry-missed-btn" onclick="retryMissed()">Reintentar preguntas falladas</button>
    </div>
  </div>
</div>
<script>
const originalQuestions = [

        // La Célula y Orgánulos
        { q: "¿En qué estructura de la célula nerviosa se halla el ADN (ácido desoxirribonucleico)?", o: ["En el citoplasma.", "En el núcleo de la célula.", "En el aparato de Golgi."], c: 1, e: "En el núcleo de la célula se halla el ADN, que es la información genética formada por genes y cromosomas." },
        { q: "¿Cómo se denomina a la estructura formada por lípidos que aísla a la neurona del medio extracelular?", o: ["Membrana citoplasmática (bicapa lipídica).", "Retículo endoplasmático liso.", "Vaina de mielina."], c: 0, e: "La membrana externa se denomina membrana citoplasmática y está formada por lípidos, formando una bicapa lipídica aislante." },
        { q: "¿Qué líquido compone el interior de la célula en el cual hay iones disueltos?", o: ["Líquido cefalorraquídeo.", "Citosol.", "Plasma sanguíneo."], c: 1, e: "El líquido interno de la célula se denomina citosol. La suma del citosol y los orgánulos componen el citoplasma." },
        { q: "¿Qué orgánulo es el encargado directo de sintetizar ('leer' el ARN-mensajero) y producir las proteínas?", o: ["Los lisosomas.", "Los neurofilamentos.", "Los ribosomas."], c: 2, e: "Los ribosomas, situados en el RER, son los encargados de leer el ARN-mensajero y producir proteínas (proceso de traducción)." },
        { q: "El proceso mediante el cual se hacen copias de fragmentos del ADN dentro del núcleo se llama:", o: ["Transducción.", "Transcripción.", "Traducción."], c: 1, e: "A este proceso de copia de fragmentos del ADN en ARN-mensajero se le llama transcripción." },
        { q: "¿En qué orgánulo concluye la proteína su configuración y estructura tridimensional final?", o: ["Retículo endoplasmático liso (REL).", "Lisosomas.", "Aparato de Golgi."], c: 0, e: "En el REL (retículo endoplasmático liso), que no posee ribosomas, la proteína va a configurar y concluir su estructura final." },
        { q: "¿Qué orgánulo proporciona energía a la célula generando ATP a partir de ácido pirúvico y oxígeno?", o: ["El lisosoma.", "La mitocondria.", "El aparato de Golgi."], c: 1, e: "Las mitocondrias son los orgánulos que proporcionan energía a la célula, generando 17 moléculas de ATP por cada molécula de ácido pirúvico." },
        { q: "En el interior de la neurona, ¿cómo se denomina al transporte de sustancias que va desde el soma hasta el axón?", o: ["Transporte retrógrado.", "Transporte anterógrado.", "Difusión facilitada."], c: 1, e: "Al desplazamiento de sustancias a lo largo de los neurofilamentos desde el soma al axón se le denomina anterógrado." },

        // Morfología y Función de las Neuronas
        { q: "¿Cómo se denominan los pequeños bultitos especializados en la recepción de información ubicados en las dendritas?", o: ["Botones terminales.", "Espinas dendríticas.", "Nódulos de Ranvier."], c: 1, e: "Las dendritas poseen unos bultitos muy especializados en la recepción denominados espinas dendríticas." },
        { q: "Las neuronas que solo poseen una prolongación que hace de axón y ramas receptoras, típicas del sistema somatosensorial (tacto, dolor), son:", o: ["Multipolares.", "Unipolares.", "Bipolares."], c: 1, e: "Las neuronas unipolares (sin dendritas directas al soma) tienen una sola prolongación y predominan en los sistemas somatosensoriales." },
        { q: "El tipo de neurona más común en el sistema nervioso de los vertebrados (de la que salen un axón y varias ramificaciones dendríticas) es:", o: ["La neurona unipolar.", "La neurona bipolar.", "La neurona multipolar."], c: 2, e: "Las neuronas multipolares son el tipo más común en el SN de los vertebrados." },
        { q: "Según su función, ¿qué neuronas conducen la información desde la periferia hasta el SNC (fibras aferentes)?", o: ["Neuronas sensoriales.", "Neuronas motoras.", "Interneuronas."], c: 0, e: "Las neuronas sensoriales conducen información desde la periferia al SNC (fibras aferentes)." },
        { q: "¿Qué tipo de neuronas según la clasificación de longitud axonal tienen un axón largo, como las células piramidales de la corteza?", o: ["Tipo Golgi II.", "Tipo Golgi I.", "Interneuronas locales."], c: 1, e: "Las de Tipo Golgi I tienen axón largo e incluyen las células piramidales de la corteza y las de Purkinje." },

        // Células Gliales
        { q: "¿Cuál es la proporción aproximada de células gliales con respecto a las neuronas en el SNC de los vertebrados?", o: ["Hay 10 a 50 veces más neuronas que células gliales.", "La proporción es exacta de 1 a 1.", "Hay de 10 a 50 veces más células gliales que neuronas."], c: 2, e: "En el SNC hay de 10 a 50 veces más células gliales que neuronas, conformando la neuroglía." },
        { q: "¿Qué tipo de glía tiene forma estrellada, suministra nutrientes, aísla la sinapsis y absorbe el exceso de neurotransmisores?", o: ["Microglía.", "Oligodendrocito.", "Astrocito."], c: 2, e: "Los astrocitos son las células gliales más abundantes y desarrollan funciones de soporte, nutrición, limpieza de neurotransmisores y aislamiento." },
        { q: "En caso de accidente o lesión cerebral, ¿qué células gliales fagocitan restos, protegen de microorganismos y forman una cicatriz (gliosis)?", o: ["Astrocitos y microglía.", "Células de Schwann.", "Oligodendrocitos exclusivos."], c: 0, e: "Los astrocitos y la microglía (que fagocita restos) tienen un papel clave en daños, formando una cicatriz (gliosis reactiva)." },
        { q: "¿Qué célula glial se encarga de formar las vainas de mielina en los axones del Sistema Nervioso Central (SNC)?", o: ["La célula de Schwann.", "La microglía.", "El oligodendrocito."], c: 2, e: "Los oligodendrocitos tienen la misión fundamental de formar capas de mielina en el SNC. Un mismo oligodendrocito puede formar más de una capa." },
        { q: "¿Cómo se denominan los espacios del axón que quedan sin recubrimiento de mielina?", o: ["Espinas dendríticas.", "Nódulos de Ranvier.", "Conos axónicos."], c: 1, e: "La vaina de mielina no es continua, dejando espacios sin mielina denominados nódulos de Ranvier." },
        { q: "¿Qué células realizan exactamente las mismas funciones que la glía (incluyendo formar mielina) pero ubicadas en el Sistema Nervioso Periférico (SNP)?", o: ["Células de Schwann.", "Oligodendrocitos periféricos.", "Células de Purkinje."], c: 0, e: "En el SNP sólo hay un tipo de glía: las células de Schwann, que fagocitan, sostienen y mielinizan axones periféricos." },

        // Potencial de Membrana
        { q: "Los canales iónicos de la membrana que cambian su permeabilidad únicamente cuando ocurren variaciones en el potencial eléctrico son los:", o: ["Canales pasivos.", "Canales dependientes de ligando.", "Canales dependientes de voltaje."], c: 2, e: "Los canales dependientes de voltaje varían su permeabilidad en función de los cambios en el potencial de membrana." },
        { q: "¿Cuál es el valor aproximado del potencial de reposo en una neurona inactiva?", o: ["De +40 a +50 mV.", "De 0 a -10 mV.", "De -60 a -70 mV."], c: 2, e: "El potencial de reposo oscila entre -60 y -70 mV, siendo el interior celular negativo respecto al exterior." },
        { q: "La fuerza que hace que las partículas con el mismo tipo de carga se repelan y las de distinta carga se atraigan es:", o: ["La fuerza de difusión.", "La presión electrostática.", "La fuerza osmótica."], c: 1, e: "La presión electrostática indica que cargas iguales se repelen y cargas opuestas se atraen." },
        { q: "¿Qué tipo de ion se encuentra EXCLUSIVAMENTE en el fluido intracelular y no en el extracelular?", o: ["Iones de Cloro (Cl-).", "Aniones orgánicos (A-).", "Iones de Potasio (K+)."], c: 1, e: "Sólo encontraremos los aniones orgánicos (A-) en el fluido intracelular." },
        { q: "En estado de reposo, ¿qué ión es el más concentrado en el interior (fluido intracelular) y al que la membrana es muy permeable?", o: ["El Potasio (K+).", "El Sodio (Na+).", "El Calcio (Ca2+)."], c: 0, e: "El K+ se encuentra principalmente en el fluido intracelular y la membrana en reposo es muy permeable a él." },
        { q: "¿Qué mecanismo activo gasta energía para expulsar 3 iones de Sodio e introducir 2 de Potasio, manteniendo el potencial de reposo?", o: ["La bomba sodio-potasio.", "Los canales pasivos de fuga.", "La difusión facilitada dependiente de ligando."], c: 0, e: "La bomba de sodio-potasio expulsa 3 iones de Na+ hacia fuera y empuja 2 iones de K+ hacia dentro con energía mitocondrial." },

        // Potenciales locales y Potencial de Acción
        { q: "Un pequeño cambio en el potencial de membrana que se conduce de manera pasiva y pierde intensidad a medida que se propaga es:", o: ["Un potencial de acción.", "Un periodo refractario.", "Un potencial local."], c: 2, e: "El potencial local consiste en un pequeño cambio que se conduce de manera pasiva con pérdida de intensidad (estímulos débiles)." },
        { q: "Si el interior de la célula pasa de -70 mV a un valor menos negativo, como -55 mV, está ocurriendo una...", o: ["Despolarización.", "Hiperpolarización.", "Repolarización."], c: 0, e: "La despolarización se produce cuando el potencial de membrana tiene un valor menos negativo que el reposo." },
        { q: "Al alcanzarse el umbral de excitación para producir un potencial de acción, ¿qué canales se abren provocando que el interior suba hasta +40 mV?", o: ["Los canales de Cl- dependientes de ligando.", "Los canales de K+ pasivos.", "Los canales de Na+ dependientes de voltaje."], c: 2, e: "En el umbral, los canales de Na+ regulados por voltaje se abren, el sodio entra y despolariza la neurona hasta +40 mV." },
        { q: "¿Qué ocurre biológicamente durante el periodo refractario absoluto del potencial de acción?", o: ["Los canales de Na+ se inactivan, por lo que es imposible generar otro potencial de acción sea cual sea la intensidad del estímulo.", "La bomba sodio-potasio se detiene y la célula muere.", "La membrana permite la entrada infinita de calcio sin resistencia."], c: 0, e: "En el periodo refractario absoluto, los canales de Na+ se inactivan. Por muy alta que sea la intensidad, no se produce un nuevo potencial de acción." },
        { q: "Para que un potencial de acción se genere durante el 'periodo refractario relativo', el nuevo estímulo debe ser:", o: ["Más débil que el original.", "Eléctricamente negativo.", "Lo suficientemente intenso (por encima del estímulo umbral normal)."], c: 2, e: "En el periodo refractario relativo, se necesita una estimulación más intensa porque la membrana está algo hiperpolarizada." },
        { q: "La ley biológica que dicta que 'el potencial de acción o se desencadena o no se desencadena' sin medias tintas es:", o: ["La ley de la tasa.", "La ley del todo o nada.", "La ley de la conducción saltatoria."], c: 1, e: "La Ley del todo o nada indica que el potencial de acción o se desencadena completamente o no se desencadena." },
        { q: "¿Cuál es el principal beneficio fisiológico de la 'conducción saltatoria' que tiene lugar en los axones mielinizados?", o: ["Transformar la señal eléctrica en acústica.", "Permitir que el impulso viaje más rápido y ahorrar energía al evitar el uso masivo de bombas sodio-potasio.", "Frenar el impulso para que no dañe la sinapsis."], c: 1, e: "La conducción saltatoria (de nódulo en nódulo de Ranvier) permite que la conducción sea muy rápida y permite ahorrar energía." },
        
        // Sinapsis y Exocitosis
        { q: "Para que las vesículas del botón terminal liberen sus neurotransmisores al espacio sináptico (exocitosis), es imprescindible la entrada de:", o: ["Potasio (K+).", "Calcio (Ca2+).", "Cloro (Cl-)."], c: 1, e: "La exocitosis necesita, además del potencial de acción, la entrada de Ca2+ a través de canales dependientes de voltaje." },
        { q: "Un Potencial Excitador Postsináptico (PEP) consiste en una despolarización local (hasta unos -10 mV máximo) originada principalmente por la apertura de canales de:", o: ["Na+ y K+.", "Cl- (Cloro).", "Proteínas G."], c: 0, e: "Los PEP se originan por la apertura simultánea de canales que permiten el paso de iones de Na+ y K+ controlados por ligando." },
        { q: "Un Potencial Inhibidor Postsináptico (PIP) provoca hiperpolarización (alejando del umbral el potencial), usualmente abriendo canales de:", o: ["Calcio (Ca2+).", "Sodio (Na+).", "Cloro (Cl-) o Potasio (K+)."], c: 2, e: "Los PIP se producen fundamentalmente por la apertura de canales de Cl- (que entran) o canales de K+ (que salen)." },
        { q: "¿Dónde se realiza la 'integración sináptica' (la suma espacial y temporal de todos los PEPs y PIPs que recibe la neurona) para decidir si dispara el potencial?", o: ["En las espinas dendríticas periféricas.", "En el segmento inicial del axón (cono axónico).", "En el aparato de Golgi."], c: 1, e: "Los PEP y PIP se conducen pasivamente hasta el segmento inicial (o cono axónico), donde se integran y determinan si hay potencial de acción." },
        { q: "Si la transmisión sináptica ocurre entre el axón de una neurona presináptica y el cuerpo celular de la postsináptica, se le denomina:", o: ["Sinapsis axosomática.", "Sinapsis axodendrítica.", "Sinapsis axoaxónica."], c: 0, e: "Las sinapsis axosomáticas son aquellas donde el axón hace sinapsis sobre el soma de la neurona postsináptica. Suelen ser inhibidoras." },
        { q: "¿Cuál es una característica diferencial clave de las 'sinapsis eléctricas' frente a las químicas?", o: ["Son las más frecuentes y lentas en el humano.", "Emplean vesículas masivas de dopamina.", "La transmisión es por corrientes locales a través de 'uniones en hendidura' (gap junctions) y es extraordinariamente rápida."], c: 2, e: "Las sinapsis eléctricas conectan citoplasmas por canales especiales (gap junctions). Son menos frecuentes, pero extraordinariamente rápidas e inmediatas." },
        { q: "En la tipología estructural, las sinapsis Tipo Gray I, que suelen ser excitadoras y axodendríticas, presentan una membrana postsináptica...", o: ["Simétrica respecto a la presináptica.", "Más densa que el lado presináptico (Asimétricas).", "Ausente."], c: 1, e: "Sinapsis tipo Gray I (SNC): la diferenciación postsináptica es más densa, por lo que se denominan asimétricas. Suelen ser excitadoras." },

        // Receptores
        { q: "Los receptores que están directamente asociados a canales iónicos y originan potenciales rápidos e inmediatos se denominan:", o: ["Receptores metabotrópicos.", "Autorreceptores.", "Receptores ionotrópicos."], c: 2, e: "El receptor ionotrópico actúa de forma rápida porque al fijarse el NT, el canal asociado se abre inmediatamente." },
        { q: "Los receptores metabotrópicos (que son más lentos y difusos) están siempre vinculados intracelularmente a...", o: ["Una proteína G y sistemas de segundos mensajeros.", "Las mitocondrias.", "Canales de fuga de calcio exclusivos."], c: 0, e: "Los receptores metabotrópicos están vinculados a una proteína de señal y a una proteína G que puede desencadenar segundos mensajeros." },
        { q: "¿Cuál es la función principal de los autorreceptores (localizados en la membrana presináptica)?", o: ["Crear nuevos potenciales de acción masivos.", "Controlar el número de moléculas de neurotransmisor y frenar su liberación si los niveles son altos.", "Atraer a las células gliales para fagocitosis."], c: 1, e: "Los autorreceptores controlan la cantidad de NT en la sinapsis: reducen su liberación posterior si es alta." },
        
        // NT: Conceptos y síntesis
        { q: "¿Qué criterio es OBLIGATORIO para que una sustancia química sea considerada neurotransmisor?", o: ["Debe inhibir siempre a la neurona siguiente.", "Debe ser capaz de cruzar la barrera hematoencefálica desde la sangre.", "Debe sintetizarse en la neurona y tener un mecanismo específico de eliminación de la hendidura sináptica."], c: 2, e: "Criterios para ser NT: sintetizado en la neurona, liberar con Ca2+, mimetizar exógenamente, y tener mecanismo de eliminación." },
        { q: "A nivel de transporte y velocidad, ¿en qué se especializan los neurotransmisores de molécula pequeña frente a los peptídicos?", o: ["Son lentos, difusos y de larga duración.", "Son rápidos, breves y se liberan en sinapsis específicas.", "Se liberan únicamente mediante uniones eléctricas gap."], c: 1, e: "Los NT de molécula pequeña se especializan en transmitir señales rápidas, breves y localizadas, frente a las lentas de los péptidos." },
        { q: "¿Dónde y en qué tipo de vesículas se empaquetan principalmente los neurotransmisores de molécula pequeña?", o: ["En el cuerpo celular, en vesículas de centro denso.", "En la terminación presináptica, en vesículas pequeñas de centro claro.", "En el aparato de Golgi exclusivamente."], c: 1, e: "La síntesis y empaquetamiento de las moléculas pequeñas ocurre localmente en la terminación presináptica, dentro de vesículas pequeñas de centro claro." },
        { q: "La síntesis de los neurotransmisores peptídicos (neuropéptidos) ocurre a partir de polipéptidos en...", o: ["El botón terminal del axón de manera inmediata.", "El cuerpo celular (Retículo endoplasmático rugoso y aparato de Golgi).", "Las dendritas y la glía radial."], c: 1, e: "La síntesis de los péptidos comienza en el cuerpo celular (RER y Golgi) y luego viajan por transporte axónico rápido." },
        { q: "¿Cuáles son los dos mecanismos fisiológicos para evitar que un neurotransmisor obstrúya la sinapsis tras ser liberado?", o: ["Apoptosis y necrosis.", "Recaptación y degradación enzimática.", "Pinocitosis y lisis glial."], c: 1, e: "Hay dos mecanismos que finalizan el mensaje: la recaptación (hacia el botón presináptico) y la degradación enzimática." },

        // Acetilcolina
        { q: "La primera sustancia reconocida como neurotransmisor por Otto Loewi, vital para el movimiento muscular y disminuida en la enfermedad de Alzheimer, es:", o: ["La Acetilcolina (ACh).", "El Glutamato.", "La Serotonina."], c: 0, e: "La Acetilcolina (ACh) fue la primera en ser reconocida, inerva la unión neuromuscular y su déficit es patente en el Alzheimer." },
        { q: "¿Cómo se clasifican los dos tipos de receptores colinérgicos (para la Acetilcolina)?", o: ["AMPA y NMDA.", "Alfa y Beta.", "Nicotínicos y Muscarínicos."], c: 2, e: "Los receptores colinérgicos son nicotínicos (ionotrópicos) y muscarínicos (metabotrópicos)." },
        { q: "¿Qué enzima se encarga de inactivar a la Acetilcolina degradándola rápidamente en la membrana postsináptica?", o: ["La Monoaminooxidasa (MAO).", "La Acetilcolinesterasa (AChE).", "La Tirosina hidroxilasa."], c: 1, e: "Tras su liberación, la ACh es inactivada por la enzima acetilcolinesterasa (AChE)." },

        // Catecolaminas
        { q: "¿Cuáles son los tres neurotransmisores pertenecientes al grupo de las catecolaminas?", o: ["Acetilcolina, Serotonina y Melatonina.", "Glutamato, GABA e Histamina.", "Dopamina, Noradrenalina y Adrenalina."], c: 2, e: "Los neurotransmisores catecolaminérgicos son tres: dopamina, noradrenalina y adrenalina." },
        { q: "Las catecolaminas se sintetizan todas a partir del mismo aminoácido precursor esencial de la dieta. ¿Cuál es?", o: ["El Triptófano.", "La Tirosina.", "El Ácido Glutámico."], c: 1, e: "Las catecolaminas se sintetizan a partir del aminoácido esencial tirosina a través de una cadena enzimática." },
        { q: "¿Qué enzima degrada intracelularmente las catecolaminas que no están almacenadas en vesículas?", o: ["La AChE.", "La MAO (Monoaminooxidasa).", "La COMT exógena."], c: 1, e: "La degradación enzimática de catecolaminas no empaquetadas ocurre mediante la enzima citoplasmática MAO." },
        { q: "¿Cuántas familias principales de receptores adrenérgicos (para noradrenalina y adrenalina) existen, siendo todos ellos metabotrópicos?", o: ["2 (AMPA y NMDA).", "3 (Alfa 1, Alfa 2 y Beta).", "4 (D1, D2, D3, D4)."], c: 1, e: "Hay tres familias de receptores adrenérgicos: alfa-1, alfa-2 y beta. Todos metabotrópicos." },
        { q: "Los somas dopaminérgicos del 'Sistema Nigroestriado' se encuentran en la Sustancia Negra e intervienen en el control motor. Su degeneración causa:", o: ["Enfermedad de Alzheimer.", "Enfermedad de Parkinson.", "Depresión clínica severa."], c: 1, e: "El sistema nigroestriado controla la función motora. En la enfermedad de Parkinson las neuronas de la sustancia negra degeneran." },
        { q: "El Sistema Mesolímbico de la dopamina, cuyos somas están en el área tegmental ventral, es fundamental para:", o: ["La regulación del sueño y dolor espinal.", "La planificación visual cortical.", "La regulación de las emociones y el placer."], c: 2, e: "El sistema dopaminérgico mesolímbico está asociado a la regulación de las emociones y del placer." },

        // Serotonina y Melatonina
        { q: "¿A partir de qué aminoácido dietético se sintetiza la Serotonina (5-HT)?", o: ["Tirosina.", "Triptófano.", "Histidina."], c: 1, e: "La serotonina (5-HT) se sintetiza a partir del aminoácido triptófano, obtenido en la dieta." },
        { q: "¿Dónde se ubican los cuerpos neuronales (somas) del sistema serotoninérgico en el sistema nervioso central?", o: ["En la sustancia negra.", "En los ganglios basales periféricos.", "En los núcleos del rafe del tronco del encéfalo."], c: 2, e: "Las neuronas serotoninérgicas tienen sus somas en una estructura troncoencefálica conocida como núcleos del rafe." },
        { q: "¿Qué tipo de fármacos muy utilizados en los trastornos mentales actúan inhibiendo la recaptación de serotonina?", o: ["Antipsicóticos dopaminérgicos clásicos.", "Antidepresivos clásicos (como fluoxetina/Prozac).", "Ansiolíticos benzodiacepínicos."], c: 1, e: "Los fármacos que inhiben la recaptación de serotonina (como la fluoxetina o Prozac) son clave en el tratamiento de la depresión." },
        { q: "¿Qué hormona/neurotransmisor, sintetizado a partir de la serotonina en la glándula pineal, regula el ciclo sueño-vigilia según la luz ambiental?", o: ["Adrenalina.", "Melatonina.", "Endorfina."], c: 1, e: "La melatonina se sintetiza en la glándula pineal a partir de serotonina, regulando ritmos biológicos según la luminosidad." },

        // Aminoácidos
        { q: "La Histamina, cuya vía actúa en el hipotálamo controlando la vigilia, el metabolismo y respuestas alérgicas, se inactiva por:", o: ["Recaptación celular masiva por los astrocitos.", "Exclusivamente degradación enzimática en la glía circundante.", "Expulsión del cerebro mediante líquido cefalorraquídeo."], c: 1, e: "Su inactivación sólo depende de la degradación enzimática en la glía circundante a la neurona que la ha liberado." },
        { q: "¿Cuál es el neurotransmisor excitatorio más abundante y principal en el encéfalo y la médula espinal?", o: ["GABA.", "Glutamato.", "Dopamina."], c: 1, e: "El glutamato es la principal sustancia transmisora excitatoria del encéfalo y la médula espinal." },
        { q: "El Glutamato posee 3 receptores ionotrópicos conocidos. Uno es AMPA, el otro es Kainato. ¿Cuál es el tercero, vital para el aprendizaje?", o: ["NMDA.", "GABAA.", "D2."], c: 0, e: "Los tres tipos de receptores ionotrópicos de glutamato son AMPA, Kainato y NMDA." },
        { q: "El receptor NMDA del glutamato presenta una particularidad, en estado de reposo se encuentra bloqueado por un ión de:", o: ["Calcio.", "Magnesio.", "Potasio."], c: 1, e: "El NMDA se encuentra normalmente bloqueado por iones de magnesio, que son desplazados por la despolarización inicial del AMPA." },
        { q: "¿Qué mecanismo sináptico asociado al receptor NMDA es considerado uno de los correlatos biológicos esenciales de la formación de la memoria?", o: ["Potenciación a Largo Plazo (LTP).", "Inhibición Presináptica Recíproca.", "Periodo Refractario Absoluto."], c: 0, e: "La entrada de Ca2+ por el NMDA prolonga los potenciales postsinápticos (LTP, Potenciación a Largo Plazo), clave para la memoria." },
        { q: "Si el glutamato es el principal excitador, ¿cuál es el principal neurotransmisor inhibidor del sistema nervioso central?", o: ["GABA.", "Noradrenalina.", "Histamina."], c: 0, e: "El GABA es la principal sustancia transmisora inhibitoria del encéfalo y la médula espinal." },
        { q: "¿A partir de qué molécula se sintetiza el GABA en los terminales sinápticos mediante la enzima GAD?", o: ["Del propio Glutamato.", "De la Glucosa libre directa.", "De la Acetil coenzima A."], c: 0, e: "El GABA se sintetiza, a partir de su precursor que es el glutamato, por la acción de la enzima GAD." },
        { q: "La enfermedad neurodegenerativa caracterizada por movimientos incontrolados y daño severo cognitivo debido a la muerte de neuronas gabaérgicas en el estriado se llama:", o: ["Esquizofrenia catatónica.", "Enfermedad de Alzheimer.", "Corea de Huntington."], c: 2, e: "La degeneración de las neuronas gabaérgicas del estriado causa la Corea de Huntington (movimientos incontrolados y deterioro cognitivo)." },
        { q: "¿Qué célula se encarga de la 'recaptación' de los neurotransmisores aminoácidos (tanto glutamato como GABA) de la sinapsis?", o: ["Las células gliales que rodean la sinapsis.", "La microglía exclusivamente fagocitadora.", "Los propios receptores postsinápticos que los engullen."], c: 0, e: "En el caso de los neurotransmisores aminoácidos, la recaptación es llevada a cabo por las células gliales que rodean la sinapsis." },

        // Neuropéptidos y Opioides
        { q: "En la secreción de neuropéptidos, ¿qué característica diferencial encontramos en el botón sináptico respecto a su eliminación?", o: ["Son inactivados únicamente por recaptación.", "No existe mecanismo de recaptación y reciclaje; son inactivados por enzimas extracelulares no específicas.", "Vuelven solos al aparato de Golgi."], c: 1, e: "Para los neuropéptidos no existe mecanismo de recaptación y reciclaje. Son inactivados por degradación enzimática extracelular." },
        { q: "Los neuropéptidos conocidos como 'opioides endógenos' (dinorfinas, encefalinas, endorfinas) actúan sobre receptores (mu, delta, kappa) provocando habitualmente...", o: ["Efectos inhibitorios al abrir canales de K+.", "Efectos ultra-excitatorios al abrir canales de Ca2+.", "Inflamación periférica de los tejidos dañados."], c: 0, e: "Los receptores de opioides son metabotrópicos y actúan principalmente abriendo canales de K+, teniendo un efecto inhibidor." },
        { q: "¿Cuál de estas opciones NO es una función fisiológica natural mediada por los opioides endógenos en el ser humano?", o: ["Analgesia (inhibición del dolor).", "Aumento brutal e incontrolado del estrés y estado de alerta motora.", "Efectos reforzantes (sensación de tranquilidad, bienestar, potencial adictivo)."], c: 1, e: "Los opioides generan analgesia, sedación (inhibiendo el arousal reticular) y potentes efectos reforzantes placenteros, nunca un alerta incontrolado." },
        { q: "Si un paciente llega a urgencias con una sobredosis por heroína u opiáceos externos, los médicos administrarán fármacos como la Naloxona. ¿Qué es la Naloxona?", o: ["Un poderoso agonista dopaminérgico.", "Un antagonista de los receptores opiáceos que bloquea su efecto.", "Un inhibidor de la MAO."], c: 1, e: "La naloxona y naltrexona son potentes antagonistas de los receptores opiáceos utilizados para revertir sus efectos tóxicos." },

        // Extra details and deep physiology checks
        { q: "¿En qué etapa del potencial de acción se produce la apertura masiva de los canales de Potasio (K+) para sacar carga positiva e iniciar la repolarización?", o: ["Cuando el potencial ronda los +40mV, justo tras cerrarse los de Sodio.", "En el mismo instante del umbral de -55mV simultáneamente al sodio.", "Cuando la célula hiperpolariza por debajo de -90mV."], c: 0, e: "A los 40mV, el sodio se inactiva, y el potasio sigue saliendo (que abrieron un poco más tarde) permitiendo que el potencial vuelva a nivel de reposo (repolarización)." },
        { q: "¿Qué ley del potencial de acción explica que la 'intensidad' de un estímulo mental o sensorial NO depende del tamaño del potencial eléctrico sino del número de veces que se repite?", o: ["La ley del todo o nada.", "La ley de la tasa (o tasa de descarga).", "La ley de Dale y Ohm."], c: 1, e: "Ley de la tasa: la tasa de descarga (número de potenciales provocados) es la unidad de información, codificando la intensidad del estímulo." },
        { q: "La estructura final que recubre el espesor donde se colocan los receptores neuronales al otro lado de la sinapsis recibe el nombre funcional de:", o: ["Zona activa presináptica.", "Nódulo de anclaje de Ranvier.", "Densidad postsináptica."], c: 2, e: "A la zona postsináptica ocupada por el empaquetamiento masivo de receptores proteicos se la denomina densidad postsináptica." },
        { q: "Las sinapsis neuromusculares (Neurona - Músculo) en vertebrados presentan en su diana muscular una estructura especializada de recepción denominada:", o: ["Placa motriz.", "Corteza límbica periférica.", "Cono eferente."], c: 0, e: "En la unión neuromuscular, la membrana postsináptica especializada que inerva la fibra muscular se denomina placa motriz." }
    
];

let questions=[...originalQuestions],currentQuestion=0,score=0,answered=false,missedQuestions=[],retryMode=false;
const questionText=document.getElementById('question-text'),optionsContainer=document.getElementById('options-container'),feedbackContainer=document.getElementById('feedback-container'),nextBtn=document.getElementById('next-btn'),progressText=document.getElementById('progress-text'),scoreTracker=document.getElementById('score-tracker'),quizScreen=document.getElementById('quiz-screen'),resultScreen=document.getElementById('result-screen'),finalScore=document.getElementById('final-score'),finalMessage=document.getElementById('final-message'),progressBar=document.getElementById('progress-bar'),missedSummary=document.getElementById('missed-summary'),retryMissedBtn=document.getElementById('retry-missed-btn'),modeText=document.getElementById('mode-text'),medalText=document.getElementById('medal-text');
function loadQuestion(){answered=false;feedbackContainer.style.display='none';feedbackContainer.className='feedback';feedbackContainer.innerHTML='';nextBtn.style.display='none';const q=questions[currentQuestion],total=questions.length,percent=Math.round((currentQuestion/total)*100);progressText.innerText=`Pregunta ${currentQuestion+1} de ${total}`;progressBar.style.width=`${percent}%`;modeText.innerHTML=retryMode?'<span class="mode-label">Modo repaso: falladas</span>':'Modo completo';questionText.innerText=`${currentQuestion+1}. ${q.q}`;optionsContainer.innerHTML='';q.o.forEach((opt,index)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerText=opt;btn.onclick=()=>selectOption(index,btn);optionsContainer.appendChild(btn);});}
function selectOption(index,btn){if(answered)return;answered=true;const q=questions[currentQuestion],allBtns=optionsContainer.querySelectorAll('.option-btn');allBtns.forEach(b=>b.disabled=true);const correctText=q.o[q.c];if(index===q.c){btn.classList.add('correct');score++;scoreTracker.innerText=`Puntuación: ${score}`;feedbackContainer.classList.add('show','feedback-correct');feedbackContainer.innerHTML=`<strong>Correcto.</strong><span class="solution-label">Por qué es correcto:</span>${q.e}`;}else{btn.classList.add('incorrect');allBtns[q.c].classList.add('correct');if(!missedQuestions.some(item=>item.q===q.q)){missedQuestions.push(q)}feedbackContainer.classList.add('show','feedback-incorrect');feedbackContainer.innerHTML=`<strong>Respuesta equivocada.</strong><br>Has marcado: <b>${q.o[index]}</b><br>La solución correcta es: <b>${correctText}</b><span class="solution-label">Por qué esa es la solución correcta:</span>${q.e}`;}nextBtn.style.display='block';nextBtn.innerText=currentQuestion===questions.length-1?'Ver resultados':'Siguiente pregunta';}
function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){loadQuestion()}else{showResults()}}
function showResults(){quizScreen.style.display='none';resultScreen.style.display='block';progressBar.style.width='100%';const percentage=Math.round((score/questions.length)*100);finalScore.innerHTML=`Has acertado ${score} de ${questions.length} preguntas (${percentage}%)`;if(percentage>=90)medalText.innerText='🏆 Medalla de Oro · Dominio excelente';else if(percentage>=75)medalText.innerText='🥈 Medalla de Plata · Muy buen nivel';else if(percentage>=60)medalText.innerText='🥉 Medalla de Bronce · Base aprobada';else medalText.innerText='📚 Modo refuerzo · Conviene repasar';let message='';if(percentage>=90)message='Extraordinario. Dominas los conceptos celulares, electroquímicos y sinápticos de la unidad.';else if(percentage>=70)message='Buen resultado. Repasa las preguntas falladas para consolidar canales iónicos, potenciales y neurotransmisores.';else message='Es recomendable repasar células gliales, potencial de membrana, sinapsis y rutas de neurotransmisores. Usa el modo de reintento para mejorar.';finalMessage.innerText=message;if(missedQuestions.length>0){missedSummary.style.display='block';missedSummary.innerHTML=`<h3>Preguntas falladas: ${missedQuestions.length}</h3><ul>${missedQuestions.map((q,i)=>`<li>${i+1}. ${q.q}</li>`).join('')}</ul>`;retryMissedBtn.style.display='inline-block';}else{missedSummary.style.display='block';missedSummary.innerHTML='<h3>No has fallado ninguna pregunta.</h3><p>Resultado perfecto. No hay preguntas que reintentar.</p>';retryMissedBtn.style.display='none';}}
function retryMissed(){if(missedQuestions.length===0)return;questions=[...missedQuestions];missedQuestions=[];currentQuestion=0;score=0;retryMode=true;scoreTracker.innerText='Puntuación: 0';resultScreen.style.display='none';quizScreen.style.display='block';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
function restartQuiz(){questions=[...originalQuestions];currentQuestion=0;score=0;answered=false;missedQuestions=[];retryMode=false;scoreTracker.innerText='Puntuación: 0';quizScreen.style.display='block';resultScreen.style.display='none';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
loadQuestion();

</script>
