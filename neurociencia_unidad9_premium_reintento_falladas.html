<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurociencia Unidad 9 Premium | DAVID MILÁN STUDIO</title>
<style>
:root{--bg:#05070d;--bg2:#0b1323;--gold:#d4af37;--gold2:#f3d98b;--white:#f8f4e8;--muted:#aab3c5;--green:#33d17a;--red:#ff6b6b;--blue:#4da3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at top left,rgba(212,175,55,.22),transparent 34%),radial-gradient(circle at bottom right,rgba(30,90,180,.28),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2),#05070d);color:var(--white);display:flex;justify-content:center;align-items:center;padding:35px 18px}
.quiz-container{width:100%;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(212,175,55,.28);border-radius:30px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);color:var(--gold2);letter-spacing:3px;font-weight:800;font-size:13px;margin-bottom:18px;background:rgba(255,255,255,.04)}
h1{font-size:clamp(30px,5vw,54px);line-height:1;margin-bottom:10px;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{font-size:17px;color:var(--muted);font-weight:400;margin-bottom:26px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.stat{padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:800}
.progress-wrap{height:10px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin-bottom:24px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:.35s ease}
.question-card{background:rgba(4,8,16,.55);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px}
.question{font-size:21px;font-weight:800;line-height:1.45;margin-bottom:22px}
.options{display:grid;gap:13px}
.option-btn{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));color:var(--white);font-size:16px;text-align:left;cursor:pointer;transition:.25s ease}
.option-btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(212,175,55,.65);box-shadow:0 12px 30px rgba(212,175,55,.12)}
.option-btn:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.16)!important;border-color:var(--green)!important;color:#dfffea!important}
.incorrect{background:rgba(255,107,107,.16)!important;border-color:var(--red)!important;color:#ffe0e0!important}
.feedback{display:none;margin-top:22px;padding:20px;border-radius:20px;line-height:1.65;font-size:15px}
.feedback.show{display:block}.feedback-correct{background:rgba(51,209,122,.12);border-left:5px solid var(--green)}.feedback-incorrect{background:rgba(255,107,107,.12);border-left:5px solid var(--red)}
.feedback strong{font-size:18px}.solution-label{display:block;margin-top:12px;color:var(--gold2);font-weight:900}
.controls{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:16px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;transition:.25s ease}.btn:hover{transform:translateY(-2px)}
.next-btn{display:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080b12}.secondary-btn{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.14)}
.score-container{display:none;text-align:center;padding:24px}.score-text{font-size:30px;font-weight:900;color:var(--gold2);margin-bottom:18px}.result-message{color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:24px}
.medal{display:inline-block;margin:14px 0 10px;padding:12px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.10);color:var(--gold2);font-weight:900}
.missed-box{text-align:left;margin:24px 0;padding:20px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}.missed-box h3{color:var(--gold2);margin-bottom:12px}.missed-box ul{padding-left:20px;color:#dbe2f2;line-height:1.6}
.mode-label{color:var(--blue);font-weight:900}
@media(max-width:650px){.quiz-container{padding:22px}.question-card{padding:20px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="quiz-container">
  <div class="brand">DAVID MILÁN STUDIO</div>
  <h1>Mega-Test Premium</h1>
  <h2>Unidad 9 · Sensación y procesamiento sensorial II</h2>
  <div id="quiz-screen">
    <div class="topbar">
      <div class="stat" id="progress-text">Pregunta 1 de 80</div>
      <div class="stat" id="score-tracker">Puntuación: 0</div>
      <div class="stat" id="mode-text">Modo completo</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="question-card">
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div id="feedback-container" class="feedback"></div>
      <div class="controls">
        <button class="btn secondary-btn" onclick="restartQuiz()">Reiniciar test</button>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Siguiente pregunta</button>
      </div>
    </div>
  </div>
  <div id="result-screen" class="score-container">
    <div class="score-text" id="final-score"></div>
    <div class="medal" id="medal-text"></div>
    <div class="result-message" id="final-message"></div>
    <div id="missed-summary" class="missed-box"></div>
    <div class="controls" style="justify-content:center;">
      <button class="btn secondary-btn" onclick="restartQuiz()">Volver a intentar todo</button>
      <button class="btn next-btn" id="retry-missed-btn" onclick="retryMissed()">Reintentar preguntas falladas</button>
    </div>
  </div>
</div>
<script>
const originalQuestions = [

        // INTRODUCCIÓN Y PIEL
        { q: "El sistema somatosensitivo nos permite percibir, interpretar y responder a diferentes estímulos. ¿Qué información NO recibe principalmente este sistema según el texto?", o: ["Tacto, presión y vibración.", "Temperatura y dolor.", "Información puramente visual y auditiva."], c: 2, e: "A través de él, recibimos información táctil, de presión, temperatura, dolor, vibración y posición de las partes del cuerpo (propiocepción)." },
        { q: "¿Cuál es la capa más externa de la piel compuesta principalmente por queratinocitos?", o: ["Dermis.", "Epidermis.", "Hipodermis."], c: 1, e: "La epidermis es la capa más externa, compuesta principalmente por queratinocitos." },
        { q: "A medida que se produce la renovación celular en la epidermis, las células más superficiales mueren y se acumulan formando una barrera física llamada:", o: ["Estrato córneo.", "Tejido conectivo profundo.", "Mielina periférica."], c: 0, e: "Las células más superficiales mueren y se acumulan formando el estrato córneo, que actúa como barrera física y aislante." },
        { q: "¿En qué capa de la piel se localiza la mayoría de los receptores cutáneos que captan la información sensorial?", o: ["En la epidermis.", "En el estrato córneo.", "En la dermis."], c: 2, e: "En la dermis se localiza la mayoría de los receptores cutáneos que captan información sensorial." },
        
        // MECANORRECEPTORES
        { q: "¿Qué corpúsculos están ubicados en la dermis superficial, adaptan rápidamente y detectan texturas finas y vibraciones de baja frecuencia (~30 Hz)?", o: ["Corpúsculos de Pacini.", "Corpúsculos de Meissner.", "Discos de Merkel."], c: 1, e: "Los corpúsculos de Meissner se ubican en la dermis superficial, adaptan rápidamente y detectan texturas finas y vibraciones de baja frecuencia (~30 Hz)." },
        { q: "Los discos de Merkel son mecanorreceptores de adaptación lenta con campos pequeños. ¿Para qué están especializados?", o: ["Para percibir la forma y el contorno de los objetos (presión estática).", "Para detectar vibraciones de alta frecuencia.", "Para detectar cambios térmicos extremos."], c: 0, e: "Los discos de Merkel responden a la presión estática y permiten percibir la forma y el contorno de los objetos." },
        { q: "¿Qué receptores están localizados más profundamente en disposición paralela a la superficie y son sensibles al estiramiento de la piel?", o: ["Terminaciones de Ruffini.", "Corpúsculos de Meissner.", "Células ciliadas."], c: 0, e: "Las Terminaciones de Ruffini están localizadas profundamente en disposición paralela y son sensibles al estiramiento de la piel y a la deformación prolongada." },
        { q: "Los corpúsculos de Pacini son grandes estructuras encapsuladas en la dermis profunda. ¿A qué responden mejor?", o: ["A la presión sostenida y estática.", "A vibraciones de alta frecuencia (~250 Hz) y cambios bruscos de presión.", "A la temperatura corporal baja."], c: 1, e: "Los corpúsculos de Pacini presentan adaptación rápida y responden mejor a vibraciones de alta frecuencia (~250 Hz) y a cambios bruscos de presión." },
        { q: "Las terminaciones nerviosas libres son estructuras no especializadas morfológicamente. ¿De qué son responsables principalmente?", o: ["Detección del dolor (nociceptores) y cambios de temperatura.", "Detección exclusiva de la presión arterial.", "Detección del color visual."], c: 0, e: "Las terminaciones nerviosas libres son responsables de la detección del dolor (nociceptores), de los cambios de temperatura (termorreceptores) y de ciertos estímulos táctiles ligeros." },
        
        // MODELO DE 4 CANALES Y CAMPOS
        { q: "Según el modelo de los cuatro canales de Balinowski, el Canal P está asociado a:", o: ["Corpúsculos de Meissner.", "Terminaciones de Ruffini.", "Corpúsculos de Pacini."], c: 2, e: "El Canal P está asociado a corpúsculos de Pacini y responde a vibraciones de alta frecuencia." },
        { q: "En el modelo de los cuatro canales, ¿a qué receptor está asociado el Canal NP I, sensible a vibraciones bajas?", o: ["Corpúsculos de Meissner.", "Discos de Merkel.", "Terminaciones de Ruffini."], c: 0, e: "El Canal NP I está asociado a corpúsculos de Meissner, con campos receptivos pequeños y sensibles a vibraciones bajas." },
        { q: "Según el modelo de cuatro canales, el Canal NP II está asociado a las terminaciones de Ruffini, siendo sensible a:", o: ["Vibración de alta frecuencia.", "El estiramiento cutáneo.", "La temperatura bajo cero."], c: 1, e: "El Canal NP II está asociado a terminaciones de Ruffini, sensible al estiramiento cutáneo." },
        { q: "En el modelo de los cuatro canales, el Canal NP III está especializado en la detección de presión sostenida y se asocia a:", o: ["Corpúsculos de Pacini.", "Terminaciones de Ruffini.", "Discos de Merkel."], c: 2, e: "El Canal NP III está asociado a discos de Merkel, especializado en la detección de presión sostenida." },
        { q: "Los receptores que, una vez producido el potencial de acción, se adaptan a la estimulación y dejan de responder se denominan:", o: ["Receptores tónicos.", "Receptores fásicos.", "Receptores nociceptivos crónicos."], c: 1, e: "Receptores fásicos: Se caracterizan porque una vez que se ha dado el potencial de acción, el receptor se adapta a la estimulación y deja de responder." },
        { q: "Los receptores que siguen produciendo potenciales de acción mientras la estimulación esté presente (no se adaptan), imprescindibles para el dolor, se llaman:", o: ["Receptores fásicos.", "Receptores de adaptación rápida.", "Receptores tónicos."], c: 2, e: "Receptores tónicos: Aunque la estimulación esté presente, el receptor sigue produciendo potenciales de acción, no se adapta. Imprescindibles para el dolor." },
        
        // PROPIOCEPCIÓN
        { q: "¿Cómo se denomina la capacidad del sistema nervioso para detectar la posición y el estado mecánico del cuerpo sin necesidad de información visual?", o: ["Interocepción.", "Exterocepción.", "Propiocepción."], c: 2, e: "La propiocepción es la capacidad para detectar y procesar información sobre la posición, el movimiento y el estado mecánico del cuerpo sin necesidad de información visual." },
        { q: "Los husos musculares, localizados en el interior de los músculos esqueléticos, detectan:", o: ["Cambios en la longitud del músculo y la velocidad del estiramiento.", "Exclusivamente la temperatura interna del músculo.", "La presencia de ácido láctico en sangre."], c: 0, e: "Los husos musculares detectan cambios en la longitud del músculo y la velocidad del estiramiento." },
        { q: "¿Qué mecanorreceptor propioceptivo participa en reflejos como el miotático (de estiramiento) para mantener la postura y evitar lesiones?", o: ["El órgano tendinoso de Golgi.", "El receptor articular.", "El huso muscular."], c: 2, e: "Los husos musculares participan en reflejos como el reflejo miotático (de estiramiento), crucial para mantener la postura." },
        { q: "¿Qué propioceptor contribuye a la regulación de la fuerza muscular y protege contra sobrecargas mediante reflejos inhibitorios?", o: ["Los receptores articulares.", "Los órganos tendinosos de Golgi.", "Los husos musculares."], c: 1, e: "Los órganos tendinosos de Golgi miden la tensión desarrollada en el tendón y protegen contra sobrecargas excesivas mediante reflejos inhibitorios." },
        { q: "¿Qué estructuras propioceptivas informan sobre la posición angular de las articulaciones y los movimientos extremos o lesivos?", o: ["Órganos tendinosos de Golgi.", "Discos de Merkel.", "Receptores articulares."], c: 2, e: "Los receptores articulares informan sobre la posición angular de las articulaciones, así como sobre movimientos extremos o lesivos." },
        
        // TRANSDUCCIÓN Y CANALES PIEZO
        { q: "En la transducción somatosensorial, el estímulo activa canales catiónicos generando una despolarización proporcional al estímulo llamada:", o: ["Potencial de reposo.", "Potencial de receptor o generador.", "Potencial de hiperpolarización."], c: 1, e: "Esta activación genera un potencial de receptor o potencial generador, una despolarización local proporcional a la magnitud del estímulo." },
        { q: "¿Cómo se llama el proceso por el cual la intensidad del estímulo se codifica mediante una mayor frecuencia de potenciales de acción?", o: ["Codificación por frecuencia.", "Codificación de amplitud magnética.", "Codificación por inhibición lateral."], c: 0, e: "A mayor intensidad, mayor es la frecuencia de potenciales de acción, proceso conocido como codificación por frecuencia." },
        { q: "En el tacto y la propiocepción, el proceso de transducción mecánica depende especialmente de una familia de canales iónicos descubiertos recientemente. ¿Cuáles?", o: ["Canales TRP.", "Canales Piezo.", "Canales de sodio voltaje-dependientes exclusivos."], c: 1, e: "Este proceso depende de una familia especializada de canales iónicos mecanosensibles, siendo especialmente relevantes los canales Piezo." },
        { q: "¿Qué ocurre biológicamente en los canales Piezo1 y Piezo2 al activarse por estímulos mecánicos?", o: ["Permiten el ingreso de iones positivos, generando el potencial de receptor.", "Expulsan iones negativos destruyendo la célula.", "Se cristalizan bloqueando la neurotransmisión."], c: 0, e: "Al activarse por estímulos mecánicos, estos canales permiten el ingreso de iones positivos, generando así el potencial de receptor." },
        { q: "¿Cuál es la función central del canal mecanosensible Piezo2?", o: ["Regulación de la presión vascular sanguínea.", "Detección del tacto ligero y la propiocepción inconsciente.", "Detección del calor por encima de 45ºC."], c: 1, e: "Piezo2 juega un papel central en la detección del tacto ligero y en la propiocepción (percepción inconsciente del cuerpo)." },
        { q: "A diferencia de Piezo2, el canal Piezo1 está más involucrado en procesos internos como:", o: ["La regulación del flujo sanguíneo y la presión vascular.", "La propiocepción muscular exclusiva.", "El control de las emociones viscerales."], c: 0, e: "Piezo1 está más involucrado en procesos internos como la regulación del flujo sanguíneo y la presión vascular." },
        
        // VÍAS CENTRALES
        { q: "La principal vía responsable de transmitir información táctil fina, vibratoria y propioceptiva CONSCIENTE hacia la corteza es:", o: ["Vía espinocerebelosa dorsal.", "Vía del lemnisco medial (columna dorsal).", "Vía anterolateral espinotalámica."], c: 1, e: "Vía del lemnisco medial (columna dorsal-lemnisco medial). Esta vía es la principal responsable de transmitir información táctil fina, vibratoria y propioceptiva consciente." },
        { q: "En la vía del lemnisco medial, los axones aferentes primarios que transmiten la información del tacto son fibras mielinizadas y rápidas denominadas:", o: ["Fibras C.", "Fibras Aδ.", "Fibras Aβ."], c: 2, e: "Los axones aferentes primarios son de gran diámetro y mielinizados: fibras Aβ para el tacto (y Aα para propiocepción)." },
        { q: "En la vía del lemnisco medial, los axones de los miembros INFERIORES ascienden por la médula sin hacer sinapsis a través del:", o: ["Fascículo cuneiforme.", "Tracto espinotalámico lateral.", "Fascículo grácil."], c: 2, e: "Ascienden por el fascículo grácil para miembros inferiores." },
        { q: "En la vía del lemnisco medial, los axones de los miembros SUPERIORES ascienden a través del:", o: ["Fascículo grácil.", "Fascículo cuneiforme.", "Vía corticoespinal."], c: 1, e: "Ascienden por el fascículo cuneiforme para miembros superiores." },
        { q: "¿En qué lugar anatómico hacen sinapsis con las neuronas de segundo orden los fascículos grácil y cuneiforme?", o: ["En el bulbo raquídeo.", "En el mesencéfalo.", "En las astas dorsales de la médula lumbar."], c: 0, e: "En el bulbo raquídeo, hacen sinapsis con neuronas de segundo orden en los núcleos grácil y cuneiforme." },
        { q: "Tras hacer sinapsis en los núcleos grácil y cuneiforme, ¿qué hacen los axones de segundo orden de la vía del lemnisco medial?", o: ["Ascienden por el mismo lado hasta el cerebelo.", "Cruzan la línea media (decusan) y ascienden hasta el tálamo.", "Terminan directamente en la corteza motora primaria."], c: 1, e: "Los axones de estas neuronas cruzan la línea media (decusación del lemnisco medial) y ascienden hasta el tálamo." },
        { q: "¿En qué núcleo del tálamo hacen sinapsis las fibras del lemnisco medial antes de proyectar a la corteza?", o: ["Núcleo geniculado medial.", "Núcleo dorsal de Clarke.", "Núcleo ventral posterolateral (VPL)."], c: 2, e: "Ascienden como el lemnisco medial hasta el tálamo, donde hacen sinapsis en el núcleo ventral posterolateral (VPL)." },
        { q: "Las vías espinocerebelosas transmiten información propioceptiva INCONSCIENTE. ¿Hacia qué estructura se dirigen principalmente?", o: ["El cerebelo.", "La corteza somatosensorial primaria (S1).", "El bulbo raquídeo rostral."], c: 0, e: "Estas vías transmiten información propioceptiva inconsciente al cerebelo... no alcanzan la corteza cerebral." },
        { q: "¿Qué vía propioceptiva inconsciente transporta información de miembros inferiores/tronco y hace su primera sinapsis en el núcleo dorsal de Clarke?", o: ["Vía espinocerebelosa ventral.", "Vía espinocerebelosa dorsal.", "Vía cuneocerebelosa."], c: 1, e: "Vía espinocerebelosa dorsal: Transporta información propioceptiva de miembros inferiores y tronco. La sinapsis ocurre en el núcleo dorsal de Clarke." },
        { q: "¿Por qué pedúnculo entra al cerebelo la vía espinocerebelosa dorsal?", o: ["Pedúnculo cerebeloso superior.", "Pedúnculo cerebeloso medio.", "Pedúnculo cerebeloso inferior."], c: 2, e: "Asciende ipsilateralmente y entra en el cerebelo por el pedúnculo cerebeloso inferior." },
        { q: "La vía espinocerebelosa VENTRAL es particular porque transmite información del 'estado motor' e interneuronas y además:", o: ["Cruza la línea media dos veces (en médula y en cerebelo).", "Nunca cruza la línea media.", "Se origina exclusivamente en los miembros superiores."], c: 0, e: "La Vía espinocerebelosa ventral cruza la línea media dos veces: primero en la médula y luego en el cerebelo." },
        { q: "La vía propioceptiva inconsciente equivalente a la vía espinocerebelosa dorsal, pero exclusiva para los miembros SUPERIORES, se denomina:", o: ["Vía cuneocerebelosa.", "Vía anterolateral.", "Fascículo grácil."], c: 0, e: "Vía cuneocerebelosa: Equivalente a la vía espinocerebelosa dorsal, pero para miembros superiores." },
        { q: "¿Dónde hace sinapsis la vía cuneocerebelosa antes de entrar al cerebelo?", o: ["Núcleo ventral posterolateral.", "Núcleo cuneiforme accesorio del bulbo.", "Ganglio trigeminal."], c: 1, e: "Hace sinapsis en el núcleo cuneiforme accesorio del bulbo y entra al cerebelo por el pedúnculo cerebeloso inferior." },
        
        // IMPLICACIONES CLÍNICAS (TACTO)
        { q: "Los trastornos somatosensoriales que implican incapacidad de reconocimiento sin que exista lesión en nervios periféricos ni en órganos sensoriales se denominan:", o: ["Agnosias somatosensoriales.", "Neuropatías periféricas diabéticas.", "Ataxias medulares."], c: 0, e: "A menudo se agrupan bajo el término de agnosias somatosensoriales, ya que implican una incapacidad de reconocimiento sin que exista una lesión periférica." },
        { q: "Una lesión en la corteza somatosensorial primaria (Área S1) provoca fundamentalmente:", o: ["Alteración de umbrales sensoriales y pérdida de la capacidad para discriminar dos puntos.", "Agnosia digital exclusiva.", "Somatoagnosia del esquema corporal completo."], c: 0, e: "Alteración de los umbrales sensoriales (Área S1): disminución de la sensibilidad táctil y pérdida de capacidad para discriminar dos puntos." },
        { q: "La incapacidad para reconocer partes del propio cuerpo o ubicarlas correctamente (afectando el esquema corporal) se denomina:", o: ["Astereognosia.", "Somatoagnosia.", "Alodinia."], c: 1, e: "Somatoagnosias: Incapacidad para reconocer partes del propio cuerpo o ubicarlas correctamente en el espacio." },
        { q: "La incapacidad para identificar y nombrar correctamente los dedos de la mano, interfiriendo con habilidades manuales finas, se llama:", o: ["Agnosia digital.", "Astereognosia táctil.", "Grafestesia inversa."], c: 0, e: "La forma más incapacitante de somatoagnosia es la agnosia digital, que impide identificar y nombrar correctamente los dedos." },
        { q: "La incapacidad para reconocer objetos por el tacto a pesar de tener funciones sensoriales intactas (no poder identificar forma, tamaño o textura) es la:", o: ["Somatoagnosia.", "Hiperalgesia.", "Astereognosia."], c: 2, e: "Astereognosia: Incapacidad para reconocer objetos por el tacto a pesar de tener funciones sensoriales básicas intactas." },
        { q: "¿Cómo se llama la incapacidad para reconocer trazados simples realizados sobre la piel?", o: ["Grafestesia.", "Acalculia táctil.", "Anestesia cutánea."], c: 0, e: "Astereognosia también puede incluir incapacidad para reconocer trazados simples en la piel (grafestesia)." },
        { q: "Los trastornos somatoespaciales (desorientación espacial, torpeza motriz al manipular) se vinculan con alteraciones en:", o: ["La vía táctil dorsal (análoga a la magnocelular visual).", "La vía del tracto espinotalámico anterior.", "El núcleo dorsal de Clarke."], c: 0, e: "Se vincula con alteraciones en la vía dorsal del procesamiento somatosensorial, análoga a la vía magnocelular visual." },
        { q: "El Síndrome de Gerstmann se produce por lesiones focales en el hemisferio izquierdo e incluye agnosia digital, desorientación derecha-izquierda, y además:", o: ["Sordera cortical y ceguera para los colores.", "Acalculia y agrafia.", "Hemiplejía y afasia de Broca."], c: 1, e: "Los síntomas clásicos del Síndrome de Gerstmann son: Agnosia digital, Desorientación derecha-izquierda, Acalculia y Agrafia." },
        { q: "Anatómicamente, las lesiones que producen el síndrome de Gerstmann suelen ubicarse en:", o: ["La circunvolución angular del córtex parietal inferior izquierdo.", "El lóbulo occipital derecho.", "El puente troncoencefálico."], c: 0, e: "Debido a lesiones focales en la circunvolución angular del hemisferio izquierdo." },
        
        // DOLOR
        { q: "Según la IASP, el dolor es una experiencia sensorial desagradable que actúa como alerta. ¿Cuál NO es uno de los 3 grupos de estímulos nocivos?", o: ["Mecánicos (presión, traumatismo).", "Fotoeléctricos (exposición lumínica retiniana).", "Químicos (cambios de pH, bradicinina)."], c: 1, e: "Los estímulos nocivos se clasifican en mecánicos, térmicos y químicos." },
        { q: "¿Qué tejido del organismo carece completamente de nociceptores (receptores del dolor)?", o: ["El tejido dérmico.", "El tejido cerebral propiamente dicho.", "El revestimiento del estómago."], c: 1, e: "Están ampliamente distribuidos en el organismo, con la excepción del tejido cerebral propiamente dicho, que carece de estos receptores." },
        { q: "¿Qué sustancias químicas liberadas en el espacio extracelular tras daño tisular sensibilizan o activan los nociceptores?", o: ["Endorfinas y dopamina.", "Prostaglandinas, serotonina, histamina, bradicinina e iones de potasio.", "Solamente iones de calcio libre."], c: 1, e: "Liberación de mediadores químicos en el espacio extracelular, como las prostaglandinas, serotonina, histamina, bradicinina e iones de potasio." },
        { q: "¿Qué tipo de fibras conducen el dolor agudo, bien localizado y de corta duración de manera rápida?", o: ["Fibras Aβ.", "Fibras C.", "Fibras Aδ."], c: 2, e: "Fibras Aδ: mielinizadas, de conducción rápida, relacionadas con una sensación de dolor agudo y bien localizado." },
        { q: "¿Qué tipo de fibras, amielínicas y lentas, son responsables del dolor sordo, difuso y persistente?", o: ["Fibras C.", "Fibras Aα.", "Fibras Aδ."], c: 0, e: "Fibras C: amielínicas, de conducción lenta, responsables del dolor sordo, difuso y persistente." },
        { q: "¿Por qué vía de la médula espinal ascienden ambas fibras del dolor (Aδ y C) hacia el tálamo?", o: ["Por la vía del lemnisco medial.", "Por la vía espinocerebelosa dorsal.", "Por la vía anterolateral."], c: 2, e: "Ambos tipos de fibras ascienden por la vía anterolateral de la médula espinal hacia el núcleo ventral posterolateral del tálamo." },
        
        // MODULACIÓN DEL DOLOR
        { q: "El masaje sobre una zona lesionada puede disminuir la sensación dolorosa. Esto se explica por la Teoría del Control de Puerta (Melzack y Wall), que postula:", o: ["La activación simultánea de fibras mecanorreceptoras (Aβ) estimula interneuronas inhibitorias que disminuyen la transmisión nociceptiva.", "El masaje paraliza físicamente a las fibras C.", "La fricción elimina la bradicinina de la sangre inmediatamente."], c: 0, e: "La activación simultánea de fibras mecanorreceptoras (Aβ) estimula interneuronas inhibitorias que disminuyen la transmisión nociceptiva, 'cerrando la puerta'." },
        { q: "En la modulación descendente del dolor, ¿qué estructura clave del mesencéfalo inhibe la transmisión enviando proyecciones inhibitorias hacia la médula?", o: ["El núcleo grácil.", "La sustancia gris periacueductal (SGPA).", "El ganglio trigeminal."], c: 1, e: "Uno de los centros clave en esta regulación descendente es la sustancia gris periacueductal (SGPA) del mesencéfalo." },
        { q: "Las vías descendentes que bloquean la transmisión nociceptiva utilizan péptidos opiáceos endógenos como:", o: ["Las endorfinas.", "La histamina.", "La acetilcolina."], c: 0, e: "Utilizan neurotransmisores como la serotonina, la noradrenalina y péptidos opiáceos endógenos como las endorfinas." },
        { q: "El dolor que se origina en los órganos internos (estómago, corazón) se caracteriza por ser:", o: ["Muy bien localizado y agudo superficial.", "Difuso, mal localizado y profundo, acompañado a veces de síntomas autonómicos.", "Puramente somático y sin afectación emocional de ningún tipo."], c: 1, e: "El dolor visceral es típicamente difuso, mal localizado y profundo, y suele acompañarse de síntomas autonómicos (náuseas, sudoración)." },
        { q: "¿Cómo se llama el fenómeno en el que el dolor de una víscera (ej. corazón) converge en la médula con fibras somáticas y se percibe en una zona superficial (ej. brazo izquierdo)?", o: ["Alodinia visceral.", "Dolor en miembro fantasma.", "Dolor referido."], c: 2, e: "El cerebro interpreta el dolor visceral como superficial (ej. dolor de infarto en el brazo) debido a la convergencia espinal, fenómeno conocido como dolor referido." },
        { q: "¿Qué patología suele presentar dolor referido localizado en el hipocondrio derecho que puede irradiar al hombro derecho?", o: ["Cólico renal.", "Colecistitis.", "Úlcera gástrica."], c: 1, e: "Colecistitis: Dolor en hipocondrio derecho, que puede irradiar al hombro derecho." },
        
        // PATOLOGÍAS DEL DOLOR
        { q: "La respuesta aumentada al dolor ante un estímulo que normalmente sería doloroso (ej. rozar una leve quemadura y sentir mucho dolor) se denomina:", o: ["Alodinia.", "Anestesia facial.", "Hiperalgesia."], c: 2, e: "Hiperalgesia: Respuesta aumentada al dolor ante un estímulo que normalmente sería doloroso." },
        { q: "La percepción de dolor ante estímulos que normalmente NO son dolorosos (como el roce de la ropa en fibromialgia) se denomina:", o: ["Parestesia.", "Alodinia.", "Hiperalgesia."], c: 1, e: "Alodinia: Percepción de dolor ante estímulos que normalmente no son dolorosos, como el roce suave de la piel o una caricia." },
        { q: "La alodinia suele estar relacionada con una reorganización sináptica en el asta dorsal, donde:", o: ["Las fibras táctiles (Aβ) empiezan a activar neuronas de dolor.", "Los husos musculares se transforman en nociceptores.", "El cerebelo inhibe la percepción térmica por completo."], c: 0, e: "Relacionada con reorganización sináptica en el asta dorsal: fibras táctiles (Aβ) pueden empezar a activar neuronas de dolor." },
        { q: "El dolor que persiste por más de 3 meses, más allá del tiempo normal de curación, y que puede volverse una enfermedad en sí misma se denomina:", o: ["Dolor somático agudo.", "Neuralgia transitoria.", "Dolor crónico."], c: 2, e: "Dolor crónico. Dolor que persiste por más de 3 meses... El dolor crónico puede volverse una enfermedad en sí misma." },
        { q: "¿En qué estado se produce una activación persistente de nociceptores, liberación excesiva de glutamato y activación de receptores NMDA, amplificando el dolor?", o: ["Anestesia periférica.", "Sensibilización central.", "Astereognosia profunda."], c: 1, e: "Sensibilización central: Estado de hiperexcitabilidad... liberación excesiva de glutamato y activación de receptores NMDA." },
        { q: "El dolor en el miembro fantasma ocurre en más del 80% de amputados. Uno de los mecanismos periféricos es la formación de tumores nerviosos benignos hiperexcitables llamados:", o: ["Lipomas.", "Neuromas.", "Astrocitomas."], c: 1, e: "Tras la amputación, los extremos de los nervios cortados pueden formar neuromas (tumores nerviosos benignos) hiperexcitables." },
        { q: "En el miembro fantasma, cuando estímulos de otra zona corporal se perciben como si vinieran de la mano amputada, es síntoma de:", o: ["Sensibilización espinal inhibidora.", "Reorganización cortical (plasticidad maladaptativa) en el mapa del cerebro.", "Regeneración completa del nervio mediano."], c: 1, e: "Reorganización cortical (plasticidad maladaptativa): Áreas vecinas del mapa corporal invaden la región del miembro amputado." },

        // TEMPERATURA
        { q: "Los termorreceptores activos aproximadamente entre 15 °C y 30 °C (responsables del frío) se denominan:", o: ["Corpúsculos de Ruffini.", "Discos de Merkel.", "Corpúsculos de Krause."], c: 2, e: "Receptores para el frío (corpúsculos de Krause), activos aproximadamente entre 15 °C y 30 °C." },
        { q: "Los termorreceptores que responden al calor (entre 30 °C y 45 °C) son los:", o: ["Corpúsculos de Ruffini.", "Corpúsculos de Meissner.", "Terminaciones pilosas."], c: 0, e: "Receptores para el calor (corpúsculos de Ruffini), que responden entre 30 °C y 45 °C." },
        { q: "¿Qué canal iónico de la familia TRP se activa ante el calor intenso y sustancias químicas como la capsaicina?", o: ["TRPM8.", "TRPV1.", "Piezo2."], c: 1, e: "El canal TRPV1 se activa ante calor intenso y sustancias como la capsaicina." },
        { q: "¿Qué canal iónico responde a los estímulos de frío y sustancias químicas como el mentol?", o: ["TRPM8.", "Piezo1.", "Canal P."], c: 0, e: "El canal TRPM8 responde al frío y al mentol." },
        { q: "En la vía de la temperatura, las señales termoceptivas ascienden hacia el tálamo a través de la vía:", o: ["Del lemnisco medial.", "Espinocerebelosa ventral.", "Espinotalámica lateral."], c: 2, e: "Desde ahí, las señales ascienden a través de la vía espinotalámica lateral, una parte del sistema anterolateral, hacia el tálamo." },
        { q: "Además de a la corteza somatosensorial primaria, la información térmica proyecta a la corteza insular y al sistema límbico para integrar:", o: ["La respuesta motora refleja.", "El componente afectivo y emocional de la experiencia térmica.", "La visión del entorno."], c: 1, e: "Proyecciones hacia la corteza insular y el sistema límbico, que integran el componente afectivo y emocional de la experiencia térmica." },

        // TRIGÉMINO (CARA)
        { q: "La inervación sensitiva de la cara (tacto, temperatura, dolor, propiocepción) está mediada principalmente por el nervio:", o: ["Trigémino.", "Facial.", "Vago."], c: 0, e: "La inervación sensitiva de la cara está mediada principalmente por el nervio trigémino." },
        { q: "La rama del nervio trigémino que inerva la frente, el cuero cabelludo anterior y el párpado superior es la:", o: ["Rama mandibular.", "Rama maxilar.", "Rama oftálmica."], c: 2, e: "Rama oftálmica. Inerva la frente, cuero cabelludo anterior, párpado superior..." },
        { q: "¿Qué rama del nervio trigémino inerva la mejilla, el labio superior y la mucosa nasal?", o: ["Rama maxilar.", "Rama oftálmica.", "Rama mandibular."], c: 0, e: "Rama maxilar. Inerva la mejilla, labio superior, mucosa nasal..." },
        { q: "¿Qué rama del nervio trigémino inerva el labio inferior, el mentón y la parte anterior de la lengua (sensibilidad general)?", o: ["Rama oftálmica.", "Rama maxilar.", "Rama mandibular."], c: 2, e: "Rama mandibular. Inerva la mandíbula, labio inferior, mentón y parte anterior de la lengua." },
        { q: "Los cuerpos celulares de las neuronas que conducen las señales cutáneas de la cara se encuentran agrupados en:", o: ["El asta dorsal lumbar.", "El ganglio del trigémino (ganglio de Gasser).", "El núcleo cuneiforme."], c: 1, e: "Se encuentran en el ganglio del trigémino (o ganglio de Gasser), ubicado en la base del cráneo." },
        { q: "¿A qué núcleo del tronco encefálico se dirigen las fibras del trigémino que transmiten el TACTO discriminativo y la presión?", o: ["Núcleo espinal del trigémino.", "Núcleo sensitivo principal del trigémino.", "Núcleo mesencefálico del trigémino."], c: 1, e: "Núcleo sensitivo principal del trigémino (tacto discriminativo y presión)." },
        { q: "Las fibras del nervio trigémino que transmiten información de DOLOR y TEMPERATURA se dirigen preferentemente al:", o: ["Núcleo espinal del trigémino.", "Núcleo sensitivo principal del trigémino.", "Núcleo de Clarke."], c: 0, e: "Núcleo espinal del trigémino (dolor y temperatura)." },
        { q: "Las fibras que transmiten PROPIOCEPCIÓN de la cara (músculos masticadores y articulación temporomandibular) se dirigen al:", o: ["Núcleo espinal del trigémino.", "Núcleo mesencefálico del trigémino.", "Núcleo grácil."], c: 1, e: "Núcleo mesencefálico del trigémino (propiocepción: particularmente de músculos masticadores y articulación)." },
        { q: "Desde los núcleos del tronco encefálico, las neuronas del trigémino cruzan al lado opuesto y ascienden hacia el tálamo mediante:", o: ["El lemnisco medial.", "El lemnisco trigeminal.", "El fascículo cuneiforme."], c: 1, e: "Las neuronas de segundo orden cruzan al lado opuesto y ascienden mediante el lemnisco trigeminal hacia el tálamo." },
        { q: "¿Cómo se llama la alteración caracterizada por un dolor súbito, intenso y punzante en una o más ramas faciales?", o: ["Neuralgia del trigémino.", "Alodinia somatoespacial.", "Ageusia trigeminal."], c: 0, e: "Neuralgia del trigémino: dolor súbito, intenso y punzante en una o más ramas del trigémino." },
        { q: "Las sensaciones anormales en la cara, como hormigueo o ardor continuo por alteración nerviosa, se denominan médicamente:", o: ["Parestesias.", "Astereognosia facial.", "Agnosia digital."], c: 0, e: "Parestesias: sensaciones anormales como hormigueo o ardor." },
        { q: "Según el esquema final de repaso, ¿qué órgano procesa la propiocepción inconsciente y la integra con señales vestibulares para ajustar los programas motores?", o: ["El tálamo ventral.", "El cerebelo.", "La corteza de asociación somatosensorial."], c: 1, e: "El esquema indica: 'Propiocepción inconsciente al cerebelo... Integración con señales vestibulares y visuales = Ajuste de programas motores'." },
        { q: "La pérdida total de sensibilidad en la cara por un daño nervioso o compresión recibe el nombre clínico de:", o: ["Anestesia facial.", "Hipoalgesia somática.", "Dolor referido maxilar."], c: 0, e: "Anestesia facial: pérdida de sensibilidad por daño nervioso o compresión." }
    
];

let questions=[...originalQuestions],currentQuestion=0,score=0,answered=false,missedQuestions=[],retryMode=false;
const questionText=document.getElementById('question-text'),optionsContainer=document.getElementById('options-container'),feedbackContainer=document.getElementById('feedback-container'),nextBtn=document.getElementById('next-btn'),progressText=document.getElementById('progress-text'),scoreTracker=document.getElementById('score-tracker'),quizScreen=document.getElementById('quiz-screen'),resultScreen=document.getElementById('result-screen'),finalScore=document.getElementById('final-score'),finalMessage=document.getElementById('final-message'),progressBar=document.getElementById('progress-bar'),missedSummary=document.getElementById('missed-summary'),retryMissedBtn=document.getElementById('retry-missed-btn'),modeText=document.getElementById('mode-text'),medalText=document.getElementById('medal-text');
function loadQuestion(){answered=false;feedbackContainer.style.display='none';feedbackContainer.className='feedback';feedbackContainer.innerHTML='';nextBtn.style.display='none';const q=questions[currentQuestion],total=questions.length,percent=Math.round((currentQuestion/total)*100);progressText.innerText=`Pregunta ${currentQuestion+1} de ${total}`;progressBar.style.width=`${percent}%`;modeText.innerHTML=retryMode?'<span class="mode-label">Modo repaso: falladas</span>':'Modo completo';questionText.innerText=`${currentQuestion+1}. ${q.q}`;optionsContainer.innerHTML='';q.o.forEach((opt,index)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerText=opt;btn.onclick=()=>selectOption(index,btn);optionsContainer.appendChild(btn);});}
function selectOption(index,btn){if(answered)return;answered=true;const q=questions[currentQuestion],allBtns=optionsContainer.querySelectorAll('.option-btn');allBtns.forEach(b=>b.disabled=true);const correctText=q.o[q.c];if(index===q.c){btn.classList.add('correct');score++;scoreTracker.innerText=`Puntuación: ${score}`;feedbackContainer.classList.add('show','feedback-correct');feedbackContainer.innerHTML=`<strong>Correcto.</strong><span class="solution-label">Por qué es correcto:</span>${q.e}`;}else{btn.classList.add('incorrect');allBtns[q.c].classList.add('correct');if(!missedQuestions.some(item=>item.q===q.q)){missedQuestions.push(q)}feedbackContainer.classList.add('show','feedback-incorrect');feedbackContainer.innerHTML=`<strong>Respuesta equivocada.</strong><br>Has marcado: <b>${q.o[index]}</b><br>La solución correcta es: <b>${correctText}</b><span class="solution-label">Por qué esa es la solución correcta:</span>${q.e}`;}nextBtn.style.display='block';nextBtn.innerText=currentQuestion===questions.length-1?'Ver resultados':'Siguiente pregunta';}
function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){loadQuestion()}else{showResults()}}
function showResults(){quizScreen.style.display='none';resultScreen.style.display='block';progressBar.style.width='100%';const percentage=Math.round((score/questions.length)*100);finalScore.innerHTML=`Has acertado ${score} de ${questions.length} preguntas (${percentage}%)`;if(percentage>=90)medalText.innerText='🏆 Medalla de Oro · Dominio excelente';else if(percentage>=75)medalText.innerText='🥈 Medalla de Plata · Muy buen nivel';else if(percentage>=60)medalText.innerText='🥉 Medalla de Bronce · Base aprobada';else medalText.innerText='📚 Modo refuerzo · Conviene repasar';let message='';if(percentage>=90)message='Extraordinario. Dominas sistema somatosensorial, propiocepción, dolor, temperatura y trigémino.';else if(percentage>=70)message='Buen resultado. Repasa las falladas para consolidar vías medulares, mecanorreceptores, nocicepción y clínica somatosensorial.';else message='Conviene repasar piel, mecanorreceptores, canales Piezo/TRP, vías lemniscales, dolor, temperatura y trigémino.';finalMessage.innerText=message;if(missedQuestions.length>0){missedSummary.style.display='block';missedSummary.innerHTML=`<h3>Preguntas falladas: ${missedQuestions.length}</h3><ul>${missedQuestions.map((q,i)=>`<li>${i+1}. ${q.q}</li>`).join('')}</ul>`;retryMissedBtn.style.display='inline-block';}else{missedSummary.style.display='block';missedSummary.innerHTML='<h3>No has fallado ninguna pregunta.</h3><p>Resultado perfecto. No hay preguntas que reintentar.</p>';retryMissedBtn.style.display='none';}}
function retryMissed(){if(missedQuestions.length===0)return;questions=[...missedQuestions];missedQuestions=[];currentQuestion=0;score=0;retryMode=true;scoreTracker.innerText='Puntuación: 0';resultScreen.style.display='none';quizScreen.style.display='block';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
function restartQuiz(){questions=[...originalQuestions];currentQuestion=0;score=0;answered=false;missedQuestions=[];retryMode=false;scoreTracker.innerText='Puntuación: 0';quizScreen.style.display='block';resultScreen.style.display='none';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
loadQuestion();

</script>
