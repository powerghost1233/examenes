<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Neurociencia Unidad 7 Premium | DAVID MILÁN STUDIO</title>
<style>
:root{--bg:#05070d;--bg2:#0b1323;--gold:#d4af37;--gold2:#f3d98b;--white:#f8f4e8;--muted:#aab3c5;--green:#33d17a;--red:#ff6b6b;--blue:#4da3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at top left,rgba(212,175,55,.22),transparent 34%),radial-gradient(circle at bottom right,rgba(30,90,180,.28),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2),#05070d);color:var(--white);display:flex;justify-content:center;align-items:center;padding:35px 18px}
.quiz-container{width:100%;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(212,175,55,.28);border-radius:30px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);color:var(--gold2);letter-spacing:3px;font-weight:800;font-size:13px;margin-bottom:18px;background:rgba(255,255,255,.04)}
h1{font-size:clamp(30px,5vw,54px);line-height:1;margin-bottom:10px;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{font-size:17px;color:var(--muted);font-weight:400;margin-bottom:26px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.stat{padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:800}
.progress-wrap{height:10px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin-bottom:24px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:.35s ease}
.question-card{background:rgba(4,8,16,.55);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px}
.question{font-size:21px;font-weight:800;line-height:1.45;margin-bottom:22px}
.options{display:grid;gap:13px}
.option-btn{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));color:var(--white);font-size:16px;text-align:left;cursor:pointer;transition:.25s ease}
.option-btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(212,175,55,.65);box-shadow:0 12px 30px rgba(212,175,55,.12)}
.option-btn:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.16)!important;border-color:var(--green)!important;color:#dfffea!important}
.incorrect{background:rgba(255,107,107,.16)!important;border-color:var(--red)!important;color:#ffe0e0!important}
.feedback{display:none;margin-top:22px;padding:20px;border-radius:20px;line-height:1.65;font-size:15px}
.feedback.show{display:block}.feedback-correct{background:rgba(51,209,122,.12);border-left:5px solid var(--green)}.feedback-incorrect{background:rgba(255,107,107,.12);border-left:5px solid var(--red)}
.feedback strong{font-size:18px}.solution-label{display:block;margin-top:12px;color:var(--gold2);font-weight:900}
.controls{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:16px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;transition:.25s ease}.btn:hover{transform:translateY(-2px)}
.next-btn{display:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080b12}.secondary-btn{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.14)}
.score-container{display:none;text-align:center;padding:24px}.score-text{font-size:30px;font-weight:900;color:var(--gold2);margin-bottom:18px}.result-message{color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:24px}
.medal{display:inline-block;margin:14px 0 10px;padding:12px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.10);color:var(--gold2);font-weight:900}
.missed-box{text-align:left;margin:24px 0;padding:20px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}.missed-box h3{color:var(--gold2);margin-bottom:12px}.missed-box ul{padding-left:20px;color:#dbe2f2;line-height:1.6}
.mode-label{color:var(--blue);font-weight:900}
@media(max-width:650px){.quiz-container{padding:22px}.question-card{padding:20px}.question{font-size:18px}}
</style>
</head>

<div class="quiz-container">
  <div class="brand">DAVID MILÁN STUDIO</div>

  <h2>Unidad 7 · Especialización Hemisférica</h2>
  <div id="quiz-screen">

    </div>
  </div>
</div>
<script>
const originalQuestions = [

        // HISTORIA Y CONCEPTOS BÁSICOS
        { q: "¿Qué nombre recibe el fenómeno por el cual los hemisferios difieren en estructura, funcionamiento y estilo de procesamiento?", o: ["Neuroplasticidad divergente.", "Especialización hemisférica o lateralización cerebral.", "Asimetría de la cisura longitudinal."], c: 1, e: "Este fenómeno recibe el nombre de especialización hemisférica o lateralización cerebral, determinando cómo se procesa la información." },
        { q: "El hecho de que cada hemisferio controle las sensaciones y los movimientos del lado opuesto del cuerpo obedece al principio de:", o: ["Control ipsilateral.", "Control contralateral.", "Control bilateral simétrico."], c: 1, e: "Cada hemisferio controla las sensaciones y los movimientos del lado opuesto del cuerpo, en virtud del principio de control contralateral." },
        { q: "En 1861, el médico Paul Broca presentó el caso del paciente 'Tan'. ¿Qué capacidad había perdido este paciente?", o: ["La capacidad de hablar, pese a conservar la comprensión.", "La capacidad de comprender el lenguaje hablado.", "La visión en el campo visual izquierdo."], c: 0, e: "El paciente Tan había perdido la capacidad de hablar pese a conservar la comprensión del lenguaje, revelando una lesión en el lóbulo frontal izquierdo." },
        { q: "¿En qué región descubrió Karl Wernicke (1874) que una lesión provocaba dificultades para comprender el lenguaje hablado y escrito?", o: ["En la parte anterior del lóbulo parietal derecho.", "En la parte posterior del lóbulo temporal izquierdo.", "En el opérculo frontal del hemisferio derecho."], c: 1, e: "Karl Wernicke identificó esta región en la parte posterior del lóbulo temporal izquierdo, asociándola con la comprensión del lenguaje." },
        { q: "¿Qué concepto introdujo el neurólogo inglés John Hughlings Jackson al señalar el predominio del hemisferio izquierdo en el lenguaje y pensamiento racional?", o: ["Dominancia hemisférica.", "Inhibición interhemisférica.", "Asimetría temporal."], c: 0, e: "Hughlings Jackson introdujo el concepto de dominancia hemisférica, señalando que el hemisferio izquierdo ejercía un predominio funcional." },
        { q: "Durante la primera mitad del siglo XX, la psicóloga Brenda Milner observó que lesiones en el hemisferio DERECHO producían alteraciones en...", o: ["La producción articulada del habla.", "La memoria espacial, la percepción y el reconocimiento de rostros.", "La capacidad de escribir gramaticalmente."], c: 1, e: "Brenda Milner observó que lesiones en el hemisferio derecho producían alteraciones en la memoria espacial, percepción y reconocimiento de rostros." },
        { q: "Los trabajos de Roger Sperry y Michael Gazzaniga en los años sesenta se realizaron con pacientes sometidos a:", o: ["Lobotomía prefrontal.", "Extracción del hipocampo.", "Comisurotomía (sección del cuerpo calloso)."], c: 2, e: "Sus estudios se realizaron con pacientes sometidos a comisurotomía (sección del cuerpo calloso), demostrando que cada hemisferio opera de manera casi independiente." },

        // MÉTODOS DE ESTUDIO
        { q: "En los pacientes con el 'cerebro dividido' (split-brain), ¿qué ocurre si un estímulo se presenta en el campo visual DERECHO?", o: ["Es procesado por el hemisferio izquierdo, que puede nombrarlo verbalmente.", "Es procesado por el hemisferio derecho, que puede dibujarlo pero no nombrarlo.", "Es procesado por ambos hemisferios simultáneamente mediante vías subcorticales."], c: 0, e: "Los estímulos en el campo visual derecho son procesados por el hemisferio izquierdo, el cual, al dominar el lenguaje, puede nombrarlos verbalmente." },
        { q: "En pacientes con el 'cerebro dividido', si un estímulo se muestra en el campo visual IZQUIERDO, el paciente...", o: ["Lo nombra verbalmente con facilidad.", "No puede nombrarlo, pero puede reconocerlo mediante el tacto o el dibujo.", "Sufre una crisis epiléptica al intentar procesarlo."], c: 1, e: "El hemisferio derecho procesa el campo visual izquierdo; aunque carece de lenguaje para nombrarlo, puede reconocerlo mediante el tacto o el dibujo." },
        { q: "El análisis de lesiones focales revela que los daños en el hemisferio DERECHO generan típicamente:", o: ["Afasias de producción.", "Afasias de comprensión.", "Déficits visuoespaciales, negligencia espacial y dificultades con la prosodia."], c: 2, e: "Lesiones en el hemisferio derecho generan déficits visuoespaciales, negligencia espacial y dificultades en la interpretación de la prosodia emocional." },
        { q: "¿En qué consiste el Test de Wada, clásico para determinar la lateralización lingüística?", o: ["En presentar palabras a gran velocidad en un solo ojo.", "En inyectar amobarbital sódico en una arteria carótida para 'dormir' temporalmente un hemisferio.", "En registrar los campos magnéticos del cerebro mientras el sujeto lee."], c: 1, e: "Consiste en inyectar amobarbital sódico en una de las arterias carótidas, durmiendo temporalmente un hemisferio para evaluar el activo." },
        { q: "Según los resultados del Test de Wada, ¿qué porcentaje de los sujetos diestros tiene dominancia izquierda para el lenguaje?", o: ["Alrededor del 50%.", "El 70%.", "El 95%."], c: 2, e: "Los resultados del test de Wada muestran que el 95% de los diestros tienen dominancia izquierda para el lenguaje." },
        { q: "Según los resultados del Test de Wada, en las personas zurdas la dominancia izquierda para el lenguaje se sitúa en:", o: ["Un escaso 10%.", "Alrededor del 70%.", "Exactamente el 100%."], c: 1, e: "En los zurdos, alrededor del 70% tienen dominancia izquierda para el lenguaje (y el resto en el derecho o bilateral)." },
        { q: "La técnica no invasiva que emite estímulos diferentes en cada oído, mostrando una ventaja del oído derecho para el lenguaje, se denomina:", o: ["Presentación dicótica.", "Palpación diáptica.", "Tarea de campo visual dividido."], c: 0, e: "La presentación dicótica emite estímulos diferentes en cada oído, revelando ventaja del oído derecho (conectado al HI) para el lenguaje." },
        { q: "¿Qué permite demostrar la técnica de 'palpación diáptica' cuando cada mano explora objetos sin ayuda visual?", o: ["La dominancia del hemisferio izquierdo en tareas táctiles.", "El predominio táctil del hemisferio derecho.", "La inutilidad del cuerpo calloso en el tacto."], c: 1, e: "La palpación diáptica (tacto) muestra el predominio táctil del hemisferio derecho." },
        
        // ASIMETRÍAS ANATÓMICAS (TABLAS Y TEXTO)
        { q: "A nivel anatómico general, el hemisferio derecho se caracteriza por ser...", o: ["Ligeramente más largo y pesado que el izquierdo.", "Más ligero y con una cisura lateral mucho más larga.", "Exactamente simétrico en peso al izquierdo."], c: 0, e: "El hemisferio derecho suele ser ligeramente más largo y pesado que el izquierdo." },
        { q: "¿Cuál de los dos hemisferios contiene, como norma general, una mayor proporción de sustancia gris?", o: ["El hemisferio derecho.", "El hemisferio izquierdo.", "Tienen exactamente la misma cantidad."], c: 1, e: "El hemisferio izquierdo contiene una mayor proporción de sustancia gris y una corteza más gruesa." },
        { q: "En el 'plano temporal', región asociada con la comprensión del lenguaje (área de Wernicke), la asimetría anatómica indica que:", o: ["Es generalmente más extensa en el hemisferio izquierdo.", "Es mucho más extensa en el hemisferio derecho.", "Es idéntica en ambos lados en el 100% de la población."], c: 0, e: "El plano temporal es generalmente más extenso en el hemisferio izquierdo." },
        { q: "El opérculo frontal, donde se ubica el área de Broca, muestra un mayor desarrollo cortical interno en el hemisferio:", o: ["Derecho.", "Izquierdo.", "Dorsal."], c: 1, e: "El opérculo frontal muestra mayor desarrollo cortical interno en el hemisferio izquierdo." },
        { q: "¿En qué hemisferio es MÁS PRONUNCIADA la pendiente de la cisura lateral, confiriendo mayor superficie a la región temporoparietal de ese lado?", o: ["En el hemisferio derecho.", "En el hemisferio izquierdo.", "En ninguno, la pendiente es paralela."], c: 0, e: "La pendiente de la cisura lateral es más pronunciada en el hemisferio derecho." },
        { q: "¿Qué lóbulo del hemisferio DERECHO es más voluminoso, reflejando su especialización visuoespacial?", o: ["El lóbulo frontal.", "El lóbulo temporal.", "El lóbulo occipital."], c: 1, e: "El lóbulo frontal del HD es más ancho, pero el texto especifica que 'el hemisferio derecho se proyecta más hacia adelante y su lóbulo occipital es más voluminoso'." }, // Aclaración: la tabla dice Lóbulo frontal más ancho, y el texto lóbulo occipital más voluminoso. Ajusto la pregunta para ser más precisa con el texto.
        { q: "Según la tabla de diferencias anatómicas, la 'cisura lateral más larga' es una característica del:", o: ["Hemisferio izquierdo.", "Hemisferio derecho.", "Cerebelo."], c: 0, e: "Según la tabla, la 'cisura lateral más larga' corresponde al hemisferio izquierdo." },
        { q: "Según la tabla de diferencias anatómicas, el 'cráneo interno más largo' es propio del:", o: ["Hemisferio izquierdo.", "Hemisferio derecho.", "Tronco encefálico."], c: 1, e: "El 'cráneo interno más largo' es una característica del hemisferio derecho según la tabla." },
        { q: "¿En qué hemisferio se encuentra la 'duplicación de la circunvolución de Heschl' según la tabla anatómica?", o: ["En el hemisferio izquierdo.", "En el hemisferio derecho.", "En ambos por igual."], c: 1, e: "La duplicación de la circunvolución de Heschl es característica del hemisferio derecho." },
        { q: "La 'duplicación de la circunvolución circular' se asocia anatómicamente con el:", o: ["Hemisferio derecho.", "Hemisferio izquierdo.", "Lóbulo parietal superior."], c: 1, e: "La duplicación de la circunvolución circular se encuentra en la columna del Hemisferio izquierdo en la tabla." },
        { q: "El 'núcleo geniculado medial mayor (tálamo)' se asocia al hemisferio:", o: ["Izquierdo.", "Derecho.", "Ventral."], c: 1, e: "El núcleo geniculado medial mayor (tálamo) corresponde al hemisferio derecho en la tabla." },
        { q: "El 'núcleo lateral posterior más largo (tálamo)' es una característica anatómica del:", o: ["Hemisferio izquierdo.", "Hemisferio derecho.", "Hipotálamo."], c: 0, e: "El núcleo lateral posterior más largo (tálamo) está en el hemisferio izquierdo." },
        { q: "¿Qué gen ha sido identificado por mostrar presencia desigual durante el desarrollo embrionario, contribuyendo a establecer la lateralización cerebral?", o: ["FOXP2.", "LMO4.", "BRCA1."], c: 1, e: "Investigaciones recientes han identificado variaciones en la expresión de ciertos genes, como LMO4, que podrían contribuir a la lateralización cerebral." },
        { q: "La 'íinsula más larga' se ubica, según las asimetrías anatómicas, en el:", o: ["Hemisferio derecho.", "Hemisferio izquierdo.", "Cuerpo calloso."], c: 1, e: "La ínsula más larga es característica del hemisferio izquierdo." },
        { q: "El 'área de convexidad del opérculo frontal más larga' se sitúa en el:", o: ["Hemisferio izquierdo.", "Hemisferio derecho.", "Lóbulo occipital."], c: 1, e: "El área de convexidad del opérculo frontal más larga pertenece al hemisferio derecho según la tabla." },

        // MODO DE PROCESAMIENTO
        { q: "¿Qué hemisferio tiende a procesar la información de manera analítica, secuencial y temporal (paso a paso)?", o: ["El hemisferio derecho.", "El hemisferio izquierdo.", "Ninguno, el procesamiento analítico es subcortical."], c: 1, e: "El hemisferio izquierdo tiende a procesar la información de manera analítica, secuencial y temporal." },
        { q: "¿Qué hemisferio procesa la información de forma global, simultánea y espacial, integrando los elementos en un conjunto coherente?", o: ["El hemisferio derecho.", "El hemisferio izquierdo.", "El cerebelo medial."], c: 0, e: "El hemisferio derecho procesa la información de forma global, simultánea y espacial." },
        { q: "Según la 'hipótesis de la frecuencia espacial', el hemisferio IZQUIERDO procesa preferentemente...", o: ["Frecuencias espaciales bajas, responsables del contexto.", "Frecuencias espaciales altas, relacionadas con los detalles finos y los contornos.", "Únicamente estímulos auditivos, bloqueando los visuales."], c: 1, e: "El hemisferio izquierdo procesa preferentemente frecuencias espaciales altas, relacionadas con los detalles finos y contornos." },
        { q: "Según la 'hipótesis de la frecuencia espacial', el hemisferio DERECHO se especializa en...", o: ["Frecuencias espaciales bajas, responsables de la percepción global o contextual.", "Frecuencias espaciales altas, analizando los bordes finos.", "El aislamiento auditivo de la prosodia."], c: 0, e: "El hemisferio derecho se especializa en frecuencias bajas, responsables de la percepción global o contextual de los estímulos visuales." },
        { q: "Si una persona sufre una lesión en el hemisferio DERECHO, al intentar reproducir una figura compleja, probablemente...", o: ["Dibujará el contorno global perfecto, pero sin ningún detalle interno.", "Reconocerá partes o detalles de la figura, pero no logrará reproducir su forma o estructura total.", "Quedará completamente ciega (ceguera cortical)."], c: 1, e: "Personas con lesiones en HD pueden reconocer partes de una figura (función del HI intacto), pero no su forma total o estructura general." },
        { q: "De acuerdo con la tabla de complementariedad, las 'Relaciones temporales de la información (episódica)' son procesadas preferentemente por el:", o: ["Hemisferio derecho.", "Hemisferio izquierdo.", "Ambos por igual y en paralelo estricto."], c: 1, e: "Las relaciones temporales de la información (episódica) corresponden al hemisferio izquierdo." },
        { q: "El 'Razonamiento lógico, cálculo y resolución de problemas' se asocia, según la tabla funcional, con el:", o: ["Hemisferio izquierdo.", "Hemisferio derecho.", "Vermis cerebeloso."], c: 0, e: "El razonamiento lógico, cálculo y resolución de problemas se asignan al hemisferio izquierdo." },
        { q: "La 'Abstracción y el pensamiento holístico' son funciones características del:", o: ["Hemisferio izquierdo.", "Hemisferio derecho.", "Cuerpo calloso."], c: 1, e: "La abstracción y el pensamiento holístico pertenecen a la columna del hemisferio derecho en la tabla." },
        
        // TIPO DE INFORMACIÓN PROCESADA (Atención, Memoria, Emoción, Lenguaje)
        { q: "¿Qué hemisferio posee un papel preponderante en la ATENCIÓN ESPACIAL y en la detección de estímulos novedosos?", o: ["El hemisferio izquierdo.", "El hemisferio derecho.", "Ninguno, es puramente frontal bilateral."], c: 1, e: "El hemisferio derecho posee un papel preponderante en la atención espacial y detección de estímulos novedosos." },
        { q: "El trastorno en el cual el paciente ignora el lado izquierdo del espacio o del cuerpo debido a una lesión parietal se denomina:", o: ["Afasia de Broca.", "Ataxia óptica.", "Negligencia espacial unilateral."], c: 2, e: "La negligencia espacial unilateral es un trastorno en el que el paciente ignora el lado contralateral (generalmente el izquierdo) por lesión parietal derecha." },
        { q: "En cuanto a la atención selectiva y la focalización de estímulos específicos, ¿qué hemisferio parece estar más implicado?", o: ["El hemisferio derecho.", "El hemisferio izquierdo.", "Ambos hemisferios funcionan de forma disjunta."], c: 1, e: "El hemisferio izquierdo parece más implicado en la atención selectiva y focalización de estímulos específicos." },
        { q: "Los estudios en pacientes con cerebro dividido demuestran que, respecto a la atención, ambos hemisferios...", o: ["Pueden mantener dos focos atencionales completamente independientes en simultáneo.", "Son incapaces de mantener focos atencionales independientes, confirmando una atención unifocal regulada interhemisféricamente.", "Apagan la atención visual para centrarse en la auditiva."], c: 1, e: "Son incapaces de mantener focos atencionales completamente independientes, confirmando una atención unifocal regulada de manera interhemisférica." },
        { q: "En el ámbito de la memoria, el hemisferio IZQUIERDO se asocia principalmente con la:", o: ["Memoria visuoespacial e imágenes visuales.", "Memoria olfativa.", "Memoria verbal y semántica (palabras, nombres, conceptos)."], c: 2, e: "El hemisferio izquierdo se asocia con la memoria verbal y semántica (palabras, nombres, conceptos)." },
        { q: "El hemisferio DERECHO interviene preferentemente en la memoria:", o: ["Verbal y lingüística.", "Visuoespacial y episódica (localización de objetos, rutas).", "Léxica pura."], c: 1, e: "El hemisferio derecho interviene en la memoria visuoespacial y episódica, como localización de objetos o rutas." },
        { q: "En el famoso estudio de Maguire y colaboradores sobre los taxistas londinenses, ¿qué estructura presentó un incremento de volumen tras años de navegación urbana?", o: ["El hipocampo posterior derecho.", "La corteza prefrontal izquierda.", "El cuerpo calloso anterior."], c: 0, e: "Presentaron un incremento del volumen del hipocampo posterior derecho, reforzando la implicación del HD en la memoria espacial." },

let questions=[...originalQuestions],currentQuestion=0,score=0,answered=false,missedQuestions=[],retryMode=false;
const questionText=document.getElementById('question-text'),optionsContainer=document.getElementById('options-container'),feedbackContainer=document.getElementById('feedback-container'),nextBtn=document.getElementById('next-btn'),progressText=document.getElementById('progress-text'),scoreTracker=document.getElementById('score-tracker'),quizScreen=document.getElementById('quiz-screen'),resultScreen=document.getElementById('result-screen'),finalScore=document.getElementById('final-score'),finalMessage=document.getElementById('final-message'),progressBar=document.getElementById('progress-bar'),missedSummary=document.getElementById('missed-summary'),retryMissedBtn=document.getElementById('retry-missed-btn'),modeText=document.getElementById('mode-text'),medalText=document.getElementById('medal-text');
function loadQuestion(){answered=false;feedbackContainer.style.display='none';feedbackContainer.className='feedback';feedbackContainer.innerHTML='';nextBtn.style.display='none';const q=questions[currentQuestion],total=questions.length,percent=Math.round((currentQuestion/total)*100);progressText.innerText=`Pregunta ${currentQuestion+1} de ${total}`;progressBar.style.width=`${percent}%`;modeText.innerHTML=retryMode?'<span class="mode-label">Modo repaso: falladas</span>':'Modo completo';questionText.innerText=`${currentQuestion+1}. ${q.q}`;optionsContainer.innerHTML='';q.o.forEach((opt,index)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerText=opt;btn.onclick=()=>selectOption(index,btn);optionsContainer.appendChild(btn);});}
function selectOption(index,btn){if(answered)return;answered=true;const q=questions[currentQuestion],allBtns=optionsContainer.querySelectorAll('.option-btn');allBtns.forEach(b=>b.disabled=true);const correctText=q.o[q.c];if(index===q.c){btn.classList.add('correct');score++;scoreTracker.innerText=`Puntuación: ${score}`;feedbackContainer.classList.add('show','feedback-correct');feedbackContainer.innerHTML=`<strong>Correcto.</strong><span class="solution-label">Por qué es correcto:</span>${q.e}`;}else{btn.classList.add('incorrect');allBtns[q.c].classList.add('correct');if(!missedQuestions.some(item=>item.q===q.q)){missedQuestions.push(q)}feedbackContainer.classList.add('show','feedback-incorrect');feedbackContainer.innerHTML=`<strong>Respuesta equivocada.</strong><br>Has marcado: <b>${q.o[index]}</b><br>La solución correcta es: <b>${correctText}</b><span class="solution-label">Por qué esa es la solución correcta:</span>${q.e}`;}nextBtn.style.display='block';nextBtn.innerText=currentQuestion===questions.length-1?'Ver resultados':'Siguiente pregunta';}
function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){loadQuestion()}else{showResults()}}
function showResults(){quizScreen.style.display='none';resultScreen.style.display='block';progressBar.style.width='100%';const percentage=Math.round((score/questions.length)*100);finalScore.innerHTML=`Has acertado ${score} de ${questions.length} preguntas (${percentage}%)`;if(percentage>=90)medalText.innerText='🏆 Medalla de Oro · Dominio excelente';else if(percentage>=75)medalText.innerText='🥈 Medalla de Plata · Muy buen nivel';else if(percentage>=60)medalText.innerText='🥉 Medalla de Bronce · Base aprobada';else medalText.innerText='📚 Modo refuerzo · Conviene repasar';let message='';if(percentage>=90)message='Extraordinario. Dominas la especialización hemisférica, lateralización, métodos de estudio y funciones diferenciales.';else if(percentage>=70)message='Buen resultado. Repasa las falladas para consolidar asimetrías anatómicas, lenguaje, atención, emoción y memoria.';else message='Conviene repasar dominancia hemisférica, pruebas de lateralización, tablas anatómicas y funciones del hemisferio derecho e izquierdo.';finalMessage.innerText=message;if(missedQuestions.length>0){missedSummary.style.display='block';missedSummary.innerHTML=`<h3>Preguntas falladas: ${missedQuestions.length}</h3><ul>${missedQuestions.map((q,i)=>`<li>${i+1}. ${q.q}</li>`).join('')}</ul>`;retryMissedBtn.style.display='inline-block';}else{missedSummary.style.display='block';missedSummary.innerHTML='<h3>No has fallado ninguna pregunta.</h3><p>Resultado perfecto. No hay preguntas que reintentar.</p>';retryMissedBtn.style.display='none';}}
function retryMissed(){if(missedQuestions.length===0)return;questions=[...missedQuestions];missedQuestions=[];currentQuestion=0;score=0;retryMode=true;scoreTracker.innerText='Puntuación: 0';resultScreen.style.display='none';quizScreen.style.display='block';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
function restartQuiz(){questions=[...originalQuestions];currentQuestion=0;score=0;answered=false;missedQuestions=[];retryMode=false;scoreTracker.innerText='Puntuación: 0';quizScreen.style.display='block';resultScreen.style.display='none';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
loadQuestion();

</script>
