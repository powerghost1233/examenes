<style>
:root{--gold:#d4af37;--gold2:#f3d98b;--bg:#05070d;--bg2:#0b1323;--txt:#f5f5f5;--muted:#aab3c5;--ok:#33d17a;--bad:#ff6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;min-height:100vh;background:
radial-gradient(circle at top left,rgba(212,175,55,.20),transparent 30%),
radial-gradient(circle at bottom right,rgba(50,90,180,.25),transparent 35%),
linear-gradient(135deg,var(--bg),var(--bg2),#05070d);
display:flex;justify-content:center;align-items:center;padding:30px;color:var(--txt)}
.container{width:100%;max-width:1000px;background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);border:1px solid rgba(212,175,55,.25);
border-radius:28px;padding:32px;box-shadow:0 25px 80px rgba(0,0,0,.45)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.4);color:var(--gold2);font-weight:800;letter-spacing:3px;margin-bottom:18px}
h1{font-size:52px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{margin:8px 0 25px;color:var(--muted);font-weight:400}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.stat{padding:12px 16px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:700}
.bar{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:20px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:.3s}
.card{padding:24px;border-radius:22px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08)}
.q{font-size:22px;font-weight:800;line-height:1.4;margin-bottom:20px}
.options{display:grid;gap:12px}
.opt{padding:15px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer;color:white;text-align:left;font-size:15px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
.opt:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.18)!important;border-color:var(--ok)!important}
.incorrect{background:rgba(255,107,107,.18)!important;border-color:var(--bad)!important}
.feedback{display:none;margin-top:18px;padding:18px;border-radius:16px;line-height:1.6}
.show{display:block}
.good{background:rgba(51,209,122,.12);border-left:5px solid var(--ok)}
.bad{background:rgba(255,107,107,.12);border-left:5px solid var(--bad)}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:14px 22px;border:none;border-radius:14px;font-weight:800;cursor:pointer}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111}
.dark{background:rgba(255,255,255,.08);color:white;border:1px solid rgba(255,255,255,.12)}
#results{display:none;text-align:center}
.medal{margin:15px auto;padding:12px 20px;border-radius:999px;border:1px solid rgba(212,175,55,.35);display:inline-block;color:var(--gold2)}
.missed{text-align:left;margin-top:20px;padding:18px;border-radius:16px;background:rgba(0,0,0,.2);line-height:1.55}
.missed h3{color:var(--gold2);margin-bottom:10px}
.missed ul{padding-left:20px}
@media(max-width:650px){.container{padding:22px}h1{font-size:36px}.q{font-size:18px}}

<script>
const originalQuestions=[{"q": "La psicología cognitiva supone la concepción del organismo fundamentalmente como:", "o": ["Un mero receptor pasivo de reflejos condicionados.", "Un sistema procesador de información que elabora representaciones y calcula funciones.", "Un campo de tensiones topológicas estáticas."], "c": 1, "e": "\"La psicología cognitiva... supone un organismo concebido como un sistema procesador de información, que obtiene información de su mundo y su propio organismo, elabora representaciones...\" [1]."}, {"q": "¿Qué concepto central, formalmente rechazado por la escuela conductista, fue recuperado por el nuevo modelo cognitivo?", "o": ["La glándula pineal.", "El arco reflejo.", "La idea de una «mente»."], "c": 2, "e": "\"El nuevo modelo representó un gran cambio respecto del conductismo, al recuperar la idea de una «mente», idea formalmente rechazada por aquella escuela.\" [1]."}, {"q": "Históricamente, el surgimiento de esta nueva orientación cognitiva se sitúa a finales de los años cincuenta del siglo XX en:", "o": ["EE. UU.", "Alemania.", "La Unión Soviética."], "c": 0, "e": "\"El surgimiento de esta nueva orientación se sitúa en EE. UU., a finales de los años cincuenta del siglo XX.\" [1]."}, {"q": "Uno de los factores críticos de la crisis del conductismo fue el problema del lenguaje. ¿Qué lingüista americano hizo una dura crítica a la teoría de Skinner expuesta en el libro \"Conducta verbal\"?", "o": ["Jerome Bruner.", "Noam Chomsky.", "George A. Miller."], "c": 1, "e": "\"El lingüista americano Chomsky (1928) hizo una crítica muy dura acerca de la teoría del lenguaje de Skinner, tal como está expuesta en el libro Conducta verbal...\" [2]."}, {"q": "Frente a la tesis de Skinner del aprendizaje por refuerzo, Chomsky defiende que todo sujeto humano posee de modo innato:", "o": ["Una red de memoria semántica autobiográfica estática.", "Un sistema de reglas y categorías (gramática universal).", "Un diccionario mental condicionado visceralmente."], "c": 1, "e": "\"...defiende que todo sujeto humano posee de modo innato un sistema de reglas y categorías (gramática universal) que le permiten generar frases y comprenderlas...\" [2]."}, {"q": "La «nueva lingüística» de Chomsky, que exigía suponer una «mente» para explicar comportamientos lingüísticos humanos, se articuló en su teoría de:", "o": ["La gramática generativa.", "El isomorfismo psicofisiológico.", "La topología léxica."], "c": 0, "e": "\"...gracias a la labor de Chomsky, con su teoría de la gramática generativa. Esta exigía suponer una «mente» en los sujetos para poder explicar... sus comportamientos lingüísticos...\" [3]."}, {"q": "El psicólogo Jerome Bruner presentó en su libro \"A Study of Thinking\" (1956) un estudio que requería admitir una mente con representaciones. ¿Sobre qué tema versaba?", "o": ["La formación de conceptos mediante preguntas, hipótesis y estrategias.", "La salivación condicionada en primates.", "El procesamiento automático de la cronometría mental."], "c": 0, "e": "\"...Jerome Bruner y sus colaboradores... presentaron un estudio sobre la formación de conceptos... Los sujetos solucionaban las demandas basados en el manejo de información, generación de hipótesis y elaboración de estrategias...\" [3, 4]."}, {"q": "¿Qué ciencia estudia los sistemas dinámicos que poseen mecanismos de autorregulación y que operan guiados por procesos de «retroalimentación» o feedback?", "o": ["La cibernética.", "La fenomenología.", "La biometría craneal."], "c": 0, "e": "\"...rápido desarrollo de la cibernética. Esta es la ciencia que estudia los sistemas dinámicos que poseen mecanismos de autorregulación y que operan guiados por la información del entorno... mediante procesos de «retroalimentación» o feedback\" [4]."}, {"q": "¿Qué científico, uno de los iniciadores de la cibernética, propuso aplicar tempranamente estas ideas (mecanismos de autocontrol y feedback) a los sujetos humanos?", "o": ["Norbert Wiener.", "Alan Turing.", "John R. Anderson."], "c": 0, "e": "\"Norbert Wiener (1894-1964), uno de sus iniciadores, ya propuso aplicar esas ideas a los sujetos humanos...\" [4]."}, {"q": "El libro clave de Miller, Galanter y Pribram \"Planes y estructura de la conducta\" (1960) vino a sustituir el modelo conductista de reflejo «S»-«R» por:", "o": ["El modelo de búsqueda serial ciega.", "El sistema de feedback (modelo TOTE).", "El reflejo incondicionado de Pavlov."], "c": 1, "e": "\"...un libro clave fue el de G. A. Miller, E. Galanter y K. Pribram, Planes y estructura de la conducta (1960). En él el sistema de feedback viene a sustituir el modelo del reflejo «S»-«R»...\" [4]."}, {"q": "De acuerdo con el modelo TOTE de Miller, Galanter y Pribram, ¿qué significan sus siglas que representan la unidad de acción controlada por feedback?", "o": ["Tiempo - Organización - Tarea - Efecto.", "Test - Operación - Test - Salida (exit).", "Topología - Observación - Totalidad - Evolución."], "c": 1, "e": "\"La unidad de acción aquí no es el «reflejo \"S\"-\"R\"», sino la unidad «test-operación-test-salida (exit)», unidad que suele ser denominada TOTE.\" [5]."}, {"q": "En la metáfora general utilizada por el cognitivismo, el humano es comparado con una máquina que procesa información en serie o paralelo. Esta máquina es:", "o": ["El estroboscopio.", "El computador.", "El cinematógrafo."], "c": 1, "e": "\"...sobre la psicología ha ejercido un enorme influjo el desarrollo de los computadores. El computador es una máquina que recibe y procesa información... El sistema opera «serialmente»... o en paralelo...\" [6]."}, {"q": "El matemático inglés que formuló el modelo de una máquina teórica capaz de resolver cualquier razonamiento y propuso un \"test\" de indistinguibilidad entre humano y máquina fue:", "o": ["Claude E. Shannon.", "Alan Turing.", "Herbert Simon."], "c": 1, "e": "\"...un matemático inglés, Alan Turing (1912-1954), formuló el modelo de una máquina que podría resolver cualquier problema... llegó a establecer que... sería posible realizar un test... en el que no habría diferencias en la respuesta...\" [7, 8]."}, {"q": "Para muchos autores, el momento de \"nacimiento\" oficial del cognitivismo se sitúa en 1956 tras una importante reunión científica sobre teoría de la información celebrada en:", "o": ["El Instituto Jean Jacques Rousseau de Ginebra.", "La Universidad de Frankfurt.", "El Instituto Tecnológico de Massachusetts (MIT)."], "c": 2, "e": "\"...el momento de nacimiento del cognitivismo debe situarse en 1956, año en que tuvo lugar una reunión científica muy importante en el Instituto Tecnológico de Massachusetts sobre teoría de la información.\" [8]."}, {"q": "Aunque el conductismo desterró la mente, figuras clave la mantuvieron. Uno de los mayores teóricos rusos que estudió el origen social de la mente y dejó la obra \"Pensamiento y lenguaje\" fue:", "o": ["Lev Vygotski.", "Alexander Luria.", "Ivan Pavlov."], "c": 0, "e": "\"Lev Vygotski... Vygotski falleció en 1934... dejando una obra muy importante, en la que destaca su libro sobre Pensamiento y lenguaje.\" [9, 10]."}, {"q": "Vygotski combinó la psicología con el marxismo, sosteniendo que los procesos mentales superiores (conciencia y pensamiento) están determinados principalmente por:", "o": ["La condición histórica y social del individuo.", "La genética puramente hereditaria y ciega.", "El volumen craneal y la frenología biométrica."], "c": 0, "e": "\"Vygotski combinó la psicología con el marxismo... Esto querría decir que los procesos mentales superiores... estarían condicionados por la condición histórica y social del individuo, más que por sus facultades psicobiológicas.\" [11]."}, {"q": "Según sintetiza su discípulo A. Luria, las funciones psíquicas superiores del hombre hunden sus raíces en:", "o": ["El exterior de su organismo biológico, en un proceso de formación social.", "El inconsciente colectivo heredado en los tótems.", "El cerebro medio límbico de los chimpancés."], "c": 0, "e": "\"«Las funciones psíquicas superiores del hombre hunden sus raíces en el exterior de su organismo biológico, en las condiciones objetivas de su existencia social; se desarrollan por un proceso de formación social»\" [12]."}, {"q": "Vygotski usaba el ejemplo de \"hacer un nudo para recordar algo\" para ilustrar cómo la conciencia interpreta el mundo y rige la conducta humana a través del uso de:", "o": ["El lenguaje, los signos y los instrumentos.", "La segregación puramente digestiva.", "Variables moleculares del cerebelo."], "c": 0, "e": "\"En particular, Vygotski pensó que el lenguaje, los signos y los instrumentos hacen posible la operación de la conciencia... Un ejemplo... es el del nudo... El signo (el nudo) nos hace conscientes de aquella tarea...\" [13]."}, {"q": "Para Vygotski, el desarrollo de las funciones psíquicas (como el uso del lenguaje regulador) transcurre desde una fase «inter-personal» (niño-adulto) hacia una función «intra-personal» mediante un proceso de:", "o": ["Condicionamiento operante aversivo.", "Internalización (o subjetivación de la regulación).", "Ensayo y error ciego."], "c": 1, "e": "\"Dicha regulación es un proceso que comienza siendo «inter-personal»... y luego se termina convirtiendo en una función «intrapersonal»... Las funciones psíquicas superiores, por tanto, se vendrían a desarrollar mediante ese proceso de «internalización»...\" [14]."}, {"q": "Vygotski acuñó un concepto para delimitar el círculo de las posibles realizaciones que un individuo puede alcanzar \"con ayuda de los adultos\" en el diálogo interactivo social. Se conoce como campo de:", "o": ["Desarrollo potencial.", "Espacio vital topológico.", "Cuasinecesidades."], "c": 0, "e": "\"...y en esa relación aparece un campo que él llama de «desarrollo potencial», que marca el círculo de las posibles realizaciones del sujeto «con ayuda de los adultos».\" [14]."}, {"q": "El pensador suizo interesado en la evolución del pensamiento racional, que fundó el Centro Internacional de Epistemología Genética en Ginebra, fue:", "o": ["Jean Piaget.", "Lev Vygotski.", "Kurt Lewin."], "c": 0, "e": "\"Jean Piaget (1896-1980)... pronto entró como investigador en el Instituto Jean Jacques Rousseau, de Ginebra... hasta fundar el Centro Internacional de Epistemología Genética...\" [15]."}, {"q": "Piaget concibe el conocimiento humano como una actividad que busca el «equilibrio» con el entorno. La inteligencia infantil arranca primero con operaciones puramente motrices (ej. chupeteo) llamadas:", "o": ["Operaciones formales.", "Operaciones sensomotrices.", "Operaciones concretas."], "c": 1, "e": "\"...comienzan siendo puras operaciones sensomotrices –por ejemplo, el chupeteo, la agitación de objetos para explorarlos, etc.–...\" [16]."}, {"q": "Según los estadios del desarrollo de Piaget, las operaciones lógicas de tipo abstracto que fundamentan el pensamiento científico y se consolidan hacia los 11 a 15 años reciben el nombre de:", "o": ["Operaciones formales.", "Operaciones concretas preoperacionales.", "Etapas sensomotrices primarias."], "c": 0, "e": "\"...y al fin dan paso a las operaciones mentales de tipo lógico-matemático, lo que llamó operaciones formales (que se van consolidando de los once a los quince años)...\" [16]."}, {"q": "En los primeros meses de vida, el niño asimila que un objeto sigue existiendo aunque sea tapado por un paño y ya no sea visible. A esta crucial adquisición cognitiva Piaget la llamó:", "o": ["Punto de unicidad material.", "Permanencia del objeto.", "Imaginabilidad léxica."], "c": 1, "e": "\"...antes de terminar el primer año llega a adquirir la noción de «permanencia del objeto» (por ejemplo... seguirá buscándolo aunque se haya tapado el objeto con un paño, lo que indica que ya cree que el objeto permanece allí).\" [17]."}, {"q": "Piaget estudió cómo los niños que juegan y hablan solos emplean un lenguaje para ordenar su mundo antes de socializarlo. A este lenguaje inicial lo denominó:", "o": ["Lenguaje egocéntrico.", "Lenguaje intra-personal vygotskiano formal.", "Lenguaje procedimental operativo."], "c": 0, "e": "\"...el lenguaje que el niño aprende... lo hace primero hablando para sí mismo; lo llamó lenguaje egocéntrico, que hallamos en niños jugando y hablando solos...\" [17]."}, {"q": "En los conceptos básicos, Piaget define la asimilación y la acomodación como las funciones de la adaptación. ¿Qué es la \"asimilación\"?", "o": ["La capacidad para remodelar o reajustar la actividad mental a las condiciones exclusivas impuestas por el medio.", "La capacidad para incorporar elementos externos/situacionales a la propia acción, haciéndolos propios de las estructuras orgánicas.", "La simple memorización a corto plazo de dígitos sin significado."], "c": 1, "e": "\"Por asimilación entiende la capacidad para incorporar elementos objetivos, externos, situacionales, a la propia acción... haciendo propias las cualidades y posibilidades de los elementos incorporados.\" [18]."}, {"q": "Por el contrario, cuando la actividad cognitiva del sujeto se \"remodela, reajusta o modifica para que se adapte y ajuste a las condiciones del medio\", hablamos de:", "o": ["Extinción intermitente.", "Simulación cibernética.", "Acomodación."], "c": 2, "e": "\"Por acomodación, en cambio, entiende aquella actividad que se remodela, reajusta o modifica para que se adapte, acomode y ajuste a las condiciones del medio.\" [19]."}, {"q": "Robert Sternberg (1949) desarrolló una de las teorías que más aceptación ha logrado al evidenciar la complejidad de la inteligencia, proponiendo la:", "o": ["Teoría triárquica de la inteligencia.", "Teoría del Logogén.", "Teoría de los climas sociales autoritarios."], "c": 0, "e": "\"Una de las teorías que ha logrado mayor aceptación es la teoría triárquica de la inteligencia, de Robert Sternberg (1949).\" [20]."}, {"q": "Según la teoría triárquica de Sternberg, existen tres dimensiones. El componente cognitivo procesual, la dimensión contextual, y una dimensión que enriquece la acción con experiencias previas favoreciendo la creatividad, llamada dimensión:", "o": ["Declarativa.", "Sensomotriz.", "Experiencial."], "c": 2, "e": "\"Hay, luego, una dimensión «experiencial», que permite enriquecer la acción con experiencias previas, y que favorece en muchos casos la acción creativa, original.\" [20]."}, {"q": "Howard Gardner abogó por evitar identificar la inteligencia únicamente con el formato lógico-formal y formuló una concepción plural conocida como:", "o": ["El solucionador general de problemas (GPS).", "La teoría de las ocho inteligencias (múltiples).", "La gramática universal bilingüe."], "c": 1, "e": "\"Un ejemplo de ello es la teoría de las ocho inteligencias, de Howard Gardner (inteligencias lingüística, espacial, lógico-matemática, musical, corporal-kinestésica, naturalista, intrapersonal y interpersonal).\" [21]."}, {"q": "El sujeto cognitivo regula su acción mediante representaciones de la realidad. Cuando estas representaciones consisten en imágenes concretas que guardan semejanza, se dice que el sujeto usa:", "o": ["Representaciones icónicas (o analógicas).", "Representaciones semánticas.", "Metarrepresentaciones sintácticas."], "c": 0, "e": "\"...unas veces son imágenes concretas (representaciones icónicas)... Admite en ellas distintos formatos: unas son representaciones analógicas (cuya estructura guarda alguna semejanza o parecido con lo representado, como ocurre con las imágenes...)\" [22, 23]."}, {"q": "La analogía principal que compara al cerebro con una máquina que recibe inputs, posee programas, memorias, símbolos y arroja un output, es conocida en psicología como:", "o": ["La caja de Skinner.", "La metáfora del ordenador.", "El insight de Köhler."], "c": 1, "e": "\"El análisis de esos procesos se ha concebido... tomando como base la «metáfora del ordenador». Esta compara al cerebro con un ordenador, y considera a este como un modelo... El ordenador recibe inputs y procesa información... posee memorias... output.\" [24]."}, {"q": "En ciencia cognitiva, el intento de producir programas informáticos cuyos outputs se asemejen y reproduzcan conductas humanas reales con el fin de entender las posibles estructuras operativas se denomina:", "o": ["Cronometría mental.", "Feedback biológico.", "Simulación."], "c": 2, "e": "\"Una línea de investigación ampliamente desarrollada ha buscado producir una «simulación» de procesos... Se busca entonces que el ordenador reproduzca, en sus outputs, resultados que se asemejen a conductas humanas...\" [25]."}, {"q": "La hipótesis de que la mente posee subrutinas o estructuras subordinadas operativas definidas, independientes y sumativas (módulos), fue formulada por el psicolingüista americano:", "o": ["Jerry Fodor.", "Lev Vygotski.", "Jean Piaget."], "c": 0, "e": "\"Esta hipótesis es la de la «modularidad de la mente», formulada por el psicolingüista americano Jerry Fodor (1935).\" [26]."}, {"q": "Para medir la duración de las operaciones mentales combinadas y descomponerlas basándose en tiempos de reacción, se aplica la metodología impulsada por Michael Posner, conocida como:", "o": ["Cronometría mental.", "Escucha dicótica.", "Registro acumulativo."], "c": 0, "e": "\"3.4. CRONOMETRÍA MENTAL. La duración de las operaciones mentales ha sido sometida a medida... basados en el modelo de la medición de los «tiempos de reacción»... Uno de los más destacados investigadores en cronometría mental es Michael Posner...\" [27]."}, {"q": "Uno de los primeros y más influyentes modelos de memoria (1968), concebido como un modelo de flujos y múltiples almacenes temporales, fue propuesto por:", "o": ["Craik y Lockhart.", "Atkinson y Shiffrin.", "Miller, Galanter y Pribram."], "c": 1, "e": "\"Uno de los primeros modelos de memoria lo propusieron en 1968 Richard Atkinson y Richard Shiffrin. En el mismo se han distinguido... memoria a corto plazo... memoria a largo plazo.\" [28]."}, {"q": "En el esquema clásico multialmacén de Atkinson y Shiffrin, los tres almacenes principales del flujo de procesamiento son:", "o": ["Memoria episódica, semántica y procedimental.", "Memorias sensoriales, memoria a corto plazo, y memoria a largo plazo.", "Memoria icónica, ecoica y háptica exclusiva."], "c": 1, "e": "\"...han distinguido una serie de memorias sensoriales... una memoria que conserva sus materiales unos breves segundos (memoria a corto plazo) y otra que los alberga durante un tiempo casi ilimitado (memoria a largo plazo)... un modelo multialmacén.\" [28, 29]."}, {"q": "La evolución de los modelos de memoria propuso distinguir dentro de la memoria a largo plazo aquellos recuerdos referidos a \"vivencias y acontecimientos biográficos\" del sujeto. Esto se conoce como:", "o": ["Memoria procedimental.", "Memoria episódica.", "Memoria a corto plazo."], "c": 1, "e": "\"...se han ido incorporando conceptos como los de «memoria episódica» (que conserva vivencias de acontecimientos)...\" [29]."}, {"q": "¿Cómo se denomina al tipo de memoria que retiene los conocimientos generales conceptuales y relativos al lenguaje (diccionario mental abstracto)?", "o": ["Memoria semántica.", "Memoria de trabajo.", "Memoria declarativa visual."], "c": 0, "e": "\"...«memoria semántica» (de conceptos y de lenguaje)...\" [29]."}, {"q": "El psicólogo Alan Baddeley reformuló el almacén a corto plazo viéndolo como un proceso activo con un \"ejecutivo central\". A este constructo se le llama:", "o": ["Memoria operativa (o de trabajo).", "Memoria procedimental.", "Atención dicótica central."], "c": 0, "e": "\"...«memoria operativa» (análoga a la memoria a corto plazo, en cuanto interviene en procesos activos del sujeto, pero especialmente conectada con el sistema atencional, al que se denomina ahí el «ejecutivo central» (el inglés Alan Baddeley ha sido uno de sus defensores).\" [29]."}, {"q": "John R. Anderson postuló una división de la memoria a largo plazo entre \"declarativa\" (explícita) y aquella otra que conserva rutinas, habilidades operativas o secuencias motoras que hacemos casi sin pensar. Esta última es la:", "o": ["Memoria procedimental.", "Memoria fotográfica icónica.", "Memoria episódica."], "c": 0, "e": "\"...John R. Anderson (1976) habla de dos tipos de memoria a largo plazo, una «memoria procedimental», que conservaría las rutinas operativas, frente a la «memoria declarativa»...\" [29]."}, {"q": "Fergus Craik y Robert S. Lockhart formularon una teoría donde postulan que la retención en la memoria no depende de un almacén temporal fijo, sino de la atención y la profundidad con que se elabore el material. Es la teoría de:", "o": ["Las inteligencias múltiples experienciales.", "Los niveles de procesamiento.", "La modularidad incondicional de Fodor."], "c": 1, "e": "\"...proceso de memoria depende de la atención y de la elaboración que el sujeto presta a los materiales... A esta teoría se la conoce como la teoría de los «niveles de procesamiento», y la propusieron Fergus Craik... y Robert S. Lockhart...\" [30]."}, {"q": "¿Qué función mental vital realiza las tareas de selección de la información entrante para maximizar su presencia en la experiencia consciente debido a la capacidad limitada de nuestros canales?", "o": ["La atención.", "La asimilación motora de Piaget.", "El procesamiento procedimental automático ciego."], "c": 0, "e": "\"5. EL PROCESO ATENCIONAL. Esta función realiza tareas de selección de información, de manera que se maximiza su presencia en la experiencia consciente...\" [30]."}, {"q": "El investigador Donald Broadbent (1958) ideó una teoría de la atención concibiéndola como un \"filtro\" que descarta canales. ¿Qué famoso método experimental auditivo usó para sus estudios pidiendo al sujeto repetir series numéricas distintas en cada oreja?", "o": ["Escucha estroboscópica.", "Escucha dicótica.", "Resonancia magnética de fotones."], "c": 1, "e": "\"En sus experimentos, los sujetos oían series numéricas de modo separado, una por cada oído, mediante un método que se conoce como «escucha dicótica»... opera un filtro, que selecciona...\" [31]."}, {"q": "Frente al modelo de filtro de Broadbent, Daniel Kahneman supuso que la energía del procesamiento es limitada y que un procesador central administra recursos evaluando la novedad y el valor biológico. A esta idea la denominó:", "o": ["Política de distribución (de recursos limitados).", "Cronometría atencional de Posner paralela.", "Descentramiento egocéntrico."], "c": 0, "e": "\"Daniel Kahneman (1934)... supuso que hay en el sujeto una «política de distribución» donde intervienen factores como la novedad, el valor biológico de los estímulos o las instrucciones...\" [32]."}, {"q": "Al analizar las bases neuronales de la atención, ¿qué investigador es destacado por distinguir experimentalmente entre los centros de control de la atención voluntaria y la atención refleja/involuntaria?", "o": ["Michael I. Posner.", "George A. Miller.", "John R. Anderson."], "c": 0, "e": "\"Destacan aquí... los estudios realizados por el norteamericano Michael I. Posner (1936), quien parece haber hallado centros diferenciados... de atención voluntaria [y de] atención involuntaria o refleja...\" [33]."}, {"q": "Si una persona realiza una tarea empleando reglas mnemotécnicas conscientes o formando intencionalmente versos para estudiar un examen y retenerlo voluntariamente, está empleando un:", "o": ["Procesamiento automático incondicionado.", "Procesamiento controlado.", "Flujo de memoria icónica subliminal."], "c": 1, "e": "\"...operando consciente y voluntariamente, fijando la atención... ampliando nuestra memoria empleando distintos métodos mnemotécnicos... A esto se le llama procesamiento controlado.\" [34]."}, {"q": "Por contraposición, los mecanismos cognitivos muy consolidados (y la memoria implícita) que operan velozmente y sin control ni esfuerzo voluntario consciente de la persona representan el:", "o": ["Procesamiento serial algorítmico profundo.", "Procesamiento automático.", "Desarrollo potencial de Vygotski."], "c": 1, "e": "\"...otros mecanismos operan sin ese control consciente, y entonces el procesamiento se denomina automático. También se distingue... una memoria implícita, no consciente, automática.\" [34]."}, {"q": "En 1956, George A. Miller publicó un clásico texto que definía el margen u amplitud de nuestro almacén a corto plazo. ¿Cuál es ese límite de elementos independientes que podemos retener \"de un golpe\"?", "o": ["12 ítems, más o menos 3.", "El número mágico 7 más menos 2.", "Infinita capacidad en la memoria operativa inmediata."], "c": 1, "e": "\"...George A. Miller publicó un trabajo... El número mágico 7 más menos 2. En él afirma que la memoria tiene un margen de unos 7 ítems, más o menos 2, para retener de un golpe la información...\" [35]."}, {"q": "En el trabajo de G. A. Miller, la estrategia crucial sugerida para multiplicar dramáticamente la retención (por ejemplo, poder recordar no solo 7 letras, sino 7 palabras que contienen muchas más letras) recae operativamente sobre:", "o": ["El abandono y extinción del feedback biológico innato temporal.", "La organización o \"codificación\" de los ítems agrupándolos (chunking).", "El tiempo de reacción cronométrico puro periférico."], "c": 1, "e": "\"...pero si las agrupamos formando palabras, podríamos retener unas 7 palabras... la clave estaría en la organización que imponemos al material, o lo que es igual, en el modo como lo codificamos.\" [35]."}, {"q": "La psicología cognitiva asume que la mente opera con distintos \"formatos\" de representación interna simbólica. Las representaciones que usan \"estructuras simbólicas semejantes a las del lenguaje\" o términos verbales son:", "o": ["Representaciones analógicas.", "Representaciones proposicionales.", "Esquemas TOTE."], "c": 1, "e": "\"...y otras son representaciones proposicionales, mediante estructuras simbólicas semejantes a las del lenguaje.\" [23]."}, {"q": "El modelo \"ACT\" (Control Adaptativo de Pensamiento), que asume la existencia de una red global conectando nodos concretos con atributos, orden o categorías, fue propuesto por:", "o": ["John R. Anderson.", "Noam Chomsky.", "George A. Miller."], "c": 0, "e": "\"John R. Anderson, entre otros, ha propuesto un modelo llamado de «control adaptativo de pensamiento» (ACT...)\" [36]."}, {"q": "¿Cómo se denominan a las estructuras experimentales en las que se cronometra la distancia temporal y latencia al evocar e inferir dependencias de categorías lógicas como («jilguero» - «ave» - «vertebrado»)?", "o": ["Redes semánticas.", "Módulos sintácticos universales fodorianos puros.", "Cibernéticas termostáticas."], "c": 0, "e": "\"Los estudios de redes semánticas permiten medir «distancias», en función del tiempo mayor o menor que se tarda en evocar o asociar dos términos («ave», «vertebrado», «jilguero», etc.)...\" [37]."}, {"q": "Algunos autores como Schank, Abelson y Minsky propusieron que almacenamos vivencias rutinarias secuenciales en bloques de información (ej. cómo actuar o qué pasará si vas a un \"restaurante\"). Esto se conoce como:", "o": ["Esquema sensomotriz procedimental reflejo espinal periférico ciego atómico atávico puro reflejo pavloviano.", "Guion (script).", "Punto de unicidad fonológica."], "c": 1, "e": "\"Las situaciones que un sujeto vive se representan mediante bloques de información que reúnen a sujetos, objetos y acciones, al modo como lo hace un guion de cine (script). Algunos autores como Schank, Abelson o Minsky han explorado...\" [37]."}, {"q": "¿Qué histórico modelo computacional algorítmico, ideado por Newell, Simon y Shaw, era capaz de simular la solución de problemas mediante la aplicación de transformaciones lógicas para ir de un \"estado inicial (E)\" a un \"estado meta (M)\"?", "o": ["El General Problem Solver (GPS).", "El modelo de simulación de Positrones Lógicos Múltiples de Vygotski.", "La máquina incondicionada del reflejo canino."], "c": 0, "e": "\"Allen Newell, Herbert Simon y J. C. Shaw construyeron un modelo de «solucionador general de problemas», conocido como GPS (General Problem Solver)... de manera que a partir de un estado inicial «E»... se llegue a un estado final de meta «M»...\" [38]."}, {"q": "El programa GPS resulta de gran interés teórico; sin embargo, en la vida real humana muestra sus severas limitaciones o pierde su interés pragmático primordialmente porque:", "o": ["La vida real está plagada de elementos borrosos, ambiguos y mal definidos, no exactos matemáticamente.", "Consume tanta energía biológica humana visceral que agotaría irremediablemente los núcleos neurales del bulbo raquídeo periférico.", "Los humanos jamás operan desde estados iniciales \"E\" buscando una carencia de solución \"M\" concreta."], "c": 0, "e": "\"Eso no le resta valor teórico... pero reduce su interés en la vida real, donde casi todas las situaciones cuestionables contienen elementos mal definidos, borrosos o ambiguos.\" [38]."}, {"q": "Para la psicología cognitiva, el lenguaje es un sistema de signos, significados y reglas para construir oraciones admisibles, gobernadas por la:", "o": ["Asimilación pura pragmática refleja incondicionada pavloviana silente motora.", "Sintaxis.", "Termodinámica estática cuántica de campos abstractos matemáticos formales asilados sin humanos en vacío celular."], "c": 1, "e": "\"El lenguaje es un sistema de signos... y regulados por reglas que establecen cuáles son las construcciones admisibles con sentido (sintaxis).\" [39]."}, {"q": "En sus investigaciones de psicolingüística, autores como Kintsch, Mehler y Morton destacaron que una de las variables que impacta fuertemente en la comprensión léxica es su uso mayor o menor en la sociedad hablante, conocido como:", "o": ["Latencia del cronometrador silente.", "Frecuencia léxica.", "Topología egocéntrica del chivo expiatorio de Lewin."], "c": 1, "e": "\"...han investigado la comprensión de textos, y han visto que en ella juegan un papel importante variables como la frecuencia léxica (mayor o menor uso generalizado de las palabras)...\" [40]."}, {"q": "El poderoso efecto positivo facilitador de activación y anticipación que una palabra genera mentalmente sobre el rápido reconocimiento de otra posterior afín o parecida (o un contexto semántico propicio) es denominado técnicamente en psicología cognitiva:", "o": ["Feedback autorregulador TOTE homeostático en negativo térmico y biológico neuronal pasivo letárgico mudo atómico puro periférico.", "Priming.", "Modo de simulación de computadora Turing."], "c": 1, "e": "\"...el peso del contexto, incluido el efecto positivo o facilitador (usualmente conocido como priming) que una palabra tiene sobre otra posterior, de significación parecida...\" [40]."}, {"q": "Las investigaciones lingüísticas evolutivas sobre el desarrollo del cerebro y el idioma materno confirman biológicamente que desde su etapa tempranísima vital el bebé lactante:", "o": ["No discrimina ningún lenguaje al ser todo ruido indistinto de un mosaico acústico genérico hasta los once años que asimila las operaciones formales y sintácticas innatas.", "Muestra un temprano reconocimiento preferencial hacia la voz materna y la lengua materna frente a idiomas foráneos, moldeando así la organización de su mundo con ella de forma rápida innata instintiva.", "Entiende pasivamente todas las lenguas universales silentes simultáneamente con un módulo mental procedimental fotográfico pero se resiste obstinadamente a hablar rebelde hasta los tres años."], "c": 1, "e": "\"Desde una fase muy temprana, los bebés muestran un particular reconocimiento a la voz y las palabras de sus madres, y enseguida adquieren una preferencia hacia la lengua materna en comparación con otras extrañas.\" [41]."}, {"q": "El advenimiento e innegable impacto de la ciencia de la \"mente\" determinó que los problemas y disfunciones psicológicas dejaran de enfocarse sólo en la alteración muscular periférica Watsoniana pasando a ser entendidos formal y clínicamente en psicoterapia como patologías de carácter:", "o": ["«Cognitivo-conductuales» (exigiendo en consecuencia prioritariamente y centralmente forjar \"cambios cognitivos\" que transformen creencias y rectifiquen valoraciones).", "De mera represión sexual edípica del ello reprimido místico chamánico o en el superego punitivo arcano ciego irresoluble instintivo animal primitivo en fase onírica hipnótica esotérica y oculta freudiana pura.", "Químico exclusivas y crónicas letales irreversibles sin tratamiento verbal operante."], "c": 0, "e": "\"Los problemas conductuales han venido a ser interpretados como patologías «cognitivo-conductuales», y su modificación terapéutica exigirá no solo «cambios de conducta», sino ante todo y principalmente «cambios cognitivos»...\" [42]."}, {"q": "Entre los mayores pioneros de la terapia cognitivo-conductual se encuentra Albert Ellis, creador de una psicoterapia que combate el arraigo de las valoraciones de minusvalía o creencias erróneas disfuncionales o tóxicas de la persona. ¿Cómo la denominó?", "o": ["Terapia de aceptación chamánica pasiva letárgica irreal.", "Terapia racional-emotiva conductual.", "Modificación de conducta respondente visceral en cámara de vacío aislada opaca y sin retorno operante lúdico."], "c": 1, "e": "\"Uno de los primeros promotores de las «terapias cognitivo-conductuales» ha sido el americano Albert Ellis (1913-2007), creador de la llamada terapia racional-emotiva conductual...\" [43]."}, {"q": "¿En qué consiste, según el modelo terapéutico cognitivo que preconiza Ellis, la \"reestructuración cognitiva\" en un paciente?", "o": ["Aislar quirúrgicamente los lóbulos frontales del encéfalo extirpándolos mediante lobotomía para cortar en seco el bucle irracional límbico motor y el temor visceral periférico al futuro.", "Aplicarle un condicionamiento aversivo eléctrico en laboratorio ciego sin mediar palabra alguna con él como paciente humano libre.", "Cambiar las interpretaciones y la filosofía personal del sujeto, eliminando \"creencias irracionales\" para que perciba e identifique el abanico vital real de las posibilidades positivas y pragmáticas de acción libre frente al trauma."], "c": 2, "e": "\"Las creencias «irracionales» y la minusvaloración de sí mismo obstaculizan la ejecución de una respuesta efectiva. La terapia ha de llevar a cabo una «reestructuración cognitiva», cambiando la «filosofía» de la persona...\" [43]."}, {"q": "El ilustre investigador norteamericano, Aaron T. Beck, forjó un revolucionario enfoque y estudio aplicado identificando en la psique una perniciosa \"tríada\" destructiva de los temidos pensamientos deformados o falsos de carácter absolutamente pesimista (negativos irracionalmente referidos asimilativamente e insistentes contra sí mismo, contra sus prójimos externos, y fatalistas de oscuridad cínica hacia el propio destino futuro). ¿Con qué dolorosa dolencia y frecuente patología humana trabajó Beck este descubrimiento crucial y sistemático en clínica?", "o": ["Trastorno de identidad disociativa múltiple severa.", "La depresión.", "El sonambulismo letárgico."], "c": 1, "e": "\"Aaron T. Beck (1921) ha realizado una amplia investigación en el campo de la depresión, que en la raíz de sus aspectos emocionales tiene, según él, una serie de pensamientos negativos (hacia sí mismo, hacia otros, hacia el futuro)...\" [44]."}, {"q": "Donald Meichenbaum es otro reconocido autor del campo clínico que se distinguió proponiendo una particular y estructurada técnica terapéutica de enfoque directivo u «educativa» preparando al individuo con herramientas cognitivas para blindarle preventiva y eficazmente a la hora de hacer frente asertiva u operativamente y confrontar a las situaciones apremiantes u hostiles del devenir cotidiano laboral existencial. A esta herramienta pragmática profiláctica suya se la designó formalmente bajo el nombre médico o metafórico de:", "o": ["Técnica de inoculación de estrés.", "Terapia psicodramática topológica geométrica del espacio vital y de vector numérico ciego.", "Reflexología aversiva pavloviana de extinción masiva retardada canina siberiana de tercer grado visceral asimilativa profunda letárgica."], "c": 0, "e": "\"Donald Meichenbaum también ha propuesto un terapia «educativa» que enseña a los pacientes a afrontar los temas y situaciones que les producen estrés (mediante lo que llama una «técnica de inoculación de estrés»).\" [44]."}, {"q": "El importantísimo concepto de *«appraisal»*, entendido teóricamente como la ineludible y fundamental activa \"evaluación cognitiva personal subyacente y previa\" que un individuo elabora internamente analizando las exigencias inminentes o peligros ambientales, sopesando lógicamente sus expectativas y midiendo sus propios recursos defensivos antes de generar e insuflar emocionalmente y vitalmente toda su vida y estrés ante ello, fue extensamente desarrollado defendido en su influyente tratado de la emoción humana por el doctor psicólogo pionero investigador autor:", "o": ["Richard S. Lazarus.", "Hans Berger.", "Alan Turing."], "c": 0, "e": "\"...la visión cognitiva de los procesos emocionales, que defendió ampliamente Richard S. Lazarus. Para este, la vida psíquica y en particular la emoción está continuamente afectada por una evaluación cognitiva (appraisal)...\" [45]."}, {"q": "El portentoso desarrollo del cognitivismo contemporáneo, impulsando su fusión hacia especialidades afines del campo de las neurociencias biológicas empíricas, ha dependido de sobremanera incalculable e irrefutable de la masiva aparición contemporánea instrumental tecnológica objetiva física, inmensa revolución basada centralmente en una prodigiosa serie de novedosísimas técnicas tecnológicas capaces asombrosamente por vez primera en la historia médica mundial moderna de poder obtener nítidas, limpias y reveladoras:", "o": ["Radiografías topológicas del subconsciente onírico oculto puro irracional chamánico prehumano sin necesidad de cráneo óseo biológico radiado en las tinieblas de los sueños atávicos de trance hipnótico sugestivo histérico animal letárgico.", "«Neuroimágenes» que muestran visiblemente las diferentes áreas cerebrales orgánicas en funcionamiento y activación según cada tarea y situación psíquica en vivo u operando resolutiva pragmáticamente in situ real empírica médica funcionalmente activa en monitor claro asimilado analítico físico humano.", "Cronometrías acústicas de eco silente en campana de Pavlov para animales mudos midiendo el peso inorgánico del calcio puro cerebral."], "c": 1, "e": "\"Uno de los factores que más han influido en su rápido desarrollo ha sido la aparición de una serie de técnicas de exploración del cerebro que han hecho posible la utilización de «neuroimágenes» de muchas operaciones psicológicas en las que se hacen visibles las diferentes áreas activadas...\" [46]."}, {"q": "En la prehistoria inicial de la tecnología clínica aplicada al cerebro (en los incipientes y pioneros años veinte del siglo asimilado), el investigador de origen francés Hans Berger logró ingeniar el método de aplicar electrodos al cuero cabelludo del paciente logrando registrar, trazar y leer el ritmo de las diferencias del flujo y potencial eléctrico interno cortical. El inventor bautizó universal e inmortalmente su asombrosa máquina tecnológica diagnóstica clave neurológica médica como el:", "o": ["Cinematógrafo atómico inanimado.", "Electroencefalograma.", "Logogén visual fotométrico espectral mudo."], "c": 1, "e": "\"...con la aplicación de electrodos al cráneo, de modo que se pudieran registrar diferencias de potencial eléctrico... El francés Hans Berger inventó esa técnica de registro, llamada electroencefalograma.\" [46]."}, {"q": "Con la utilización masiva del electroencefalograma de Berger, la ciencia logró asombrosamente iniciar la rigurosa lectura de unos importantes y utilísimos trazados cronométricos u alteraciones del pico biológico de actividad neurológica y eléctrica del cerebro que responden clara y correlativamente de forma correlacionada e instantánea o de latencia física a un peculiar y específico estímulo introducido experimental y voluntariamente por el observador al examinado. Estos registros neurológicos analíticos asombrosos empíricos exactos del pico de atención o de onda P-300 del sujeto en reacción temporal atencional real son ampliamente designados con la nomenclatura técnica experta médica universal de campo como:", "o": ["Potenciales evocados.", "Acomodaciones topológicas de asimilación piagetiana puras ciegas abstractas de geometría silente esférica y vacía irracional de valencia nula de masa infinita letal inoperante.", "Trazados esotéricos astrológicos astrales."], "c": 0, "e": "\"Esto abrió el campo de estudio de los «potenciales evocados», que analizan los cambios de trazado correlativos a una modificación experimental producida por el investigador.\" [47]."}, {"q": "Hay una técnica muy avanzada, introducida masivamente desde los ochenta o finales del asimilativo siglo biológico empírico que sitúa asombrosa y pacíficamente pero de modo enormemente exacto magnético y asimilativo a todo un sujeto completo y en su conjunto la cabeza entera orgánica humana dentro e interiorizado profunda e inmerso físicamente asombrosa en las ondas y entrañas potentes y magnéticas absolutas físicas y medibles formidables medulares sin dañar en el de todo un potente y masivo y descomunal \"campo magnético forzado y creado instrumental e intencionadamente fuerte experimentalmente en la clínica\" al paciente rodeándolo en el túnel tecnológico ciego magnético, permitiendo por este método observar y estudiar la actividad interna asombrosa sin operar con bisturí de base. Esta metodología pura que usa detectores de magnetismo extremo y no radiación electromagnética u magnética para rastrear la señal de la sangre viva oxigenada asimilada del ser cortical vivo empírico, se nomina a nivel de manual y cátedra biomédica y hospitalaria del saber puro físico analítico y matemático como el aparato de:", "o": ["Estroboscopio atómico primitivo mecánico de piñones decimonónicos en madera asilar gótica y oscura puramente silente de polea inanimada letárgica.", "Magnetoencefalografía.", "GPS cibernético Turing analógico binario puro ciego."], "c": 1, "e": "\"Magnetoencefalografía. Mucho más recientemente se han podido detectar y registrar los cambios cerebrales que alteran los registros trazados por detectores en un campo magnético creado experimentalmente, y en el seno del cual se introduce el cerebro del sujeto...\" [47]."}, {"q": "La prueba médica conocida formalmente por las siglas \"TAC\", la cual maravilla obteniendo suculentas representaciones u imágenes sucesivas cortadas espaciales radiadas del cerebro humano físico basándose ciegamente de modo analítico estático físico midiendo el grado topográfico fotográfico en blanco y negro exacto milimétrico puramente inorgánico y físico matemático real del asombroso diverso grado y resistencia molecular u absorción diferencial pura radiológica dura que ofrecen o plantean al ser atravesados sin compasión u analíticamente por fotones duros a la radiación invasiva los múltiples tejidos humanos en el cráneo cortical óseo se refiere estrictamente sin ningún atisbo de duda semántica en el manual cognitivo universitario español oficial a:", "o": ["La Tomografía Axial Computerizada (realizada escaneando al paciente analíticamente con rayos X).", "La Terapia Aversiva Condicionada (realizada torturando visceral operante en castigo con electrochoque).", "La Tópica Analítica Constructiva de Asimilación pura psíquica teológica medieval eclesial asilar silente chamánica mística esotérica y muerta sin radiación ni fotón."], "c": 0, "e": "\"Tomografía axial computerizada. Desde los años setenta se halló el modo de escanear mediante rayos X el organismo en funcionamiento... midiendo... los distintos grados de absorción o resistencia al paso de los rayos X que presentan los diferentes tejidos...\" [47]."}, {"q": "Empleando técnicas como la del escáner radiológico anterior (TAC) unida astutamente a la inyección intravenosa invasiva innegable e incolora biológica o forzada clínica e inofensiva leve en el paciente un factor exógeno o asimilativo para medir y evidenciar de forma asombrosa, empírica e irrebatible u biológica el aumento y el flujo exacto de actividad biológica hiperactiva sanguínea cerebral (y la temperatura de las neuronas focalizadas metabólicamente ávidas en una zona). Para hacer este truco biológico visible y fosforescente al detector mecánico sin el cual no funcionaría ni se distinguiría radiológicamente o radiactivamente en absoluto el trazado sanguíneo, el sanitario necesita vitalmente usar o inyectar introducir en la circulación venosa o arterial en sangre asimilativa un asombroso químico radiológico incoloro trazador denominado en el argot técnico puro cognitivo médico u físico biométrico hospitalario mundial clínico del texto explícito como el:", "o": ["Fluido místico ectoplásmico animal esotérico instintivo silente irracional del chamán de la tribu pura atávica darwiniana lejana pre humana de lodo espeso esotérico adivinatorio cartomántico puro mágico atómico irreal pasivo y mudo.", "Marcador radiactivo (que asombrosamente permite rastrear en directo y delatar radiactivamente a medida y al ser escaneado por las áreas de asombrosa actividad neurológica metabólica y flujo activo cerebral in situ el paso activo en vivo de la persona al aumentar ahí en la zona focal cortical su radiactividad analítica radiológica pura biológica visible real empírica empíricamente medible innegable).", "Cromo visual del estroboscopio fodoriano universal silente mecanicista algorítmico computacional serial binario vacío frío puro atómico inerte asilar somático y mudo letárgico irresoluto e irracional biológico muerto gástrico periférico motor y amnésico profundo catártico vienés en trance y sugestivo."], "c": 1, "e": "\"Con esa técnica, asociada a la introducción de un marcador radiactivo en sangre, se han logrado imágenes del cerebro en funcionamiento... la activación de una zona va acompañada de un aumento del flujo sanguíneo... y la radiactividad del área.\" [48]."}, {"q": "Para lograr imágenes de alta resolución no invasivas de \"resonancia magnética\" propiamente dicha sin inyectar reactivos perjudiciales u fotones, la máquina médica se centra con inmensa eficacia y asombrosa exactitud empírica física en utilizar campos magnéticos gigantescos que alinean y someten bajo su fuerza unificadora atómica para leer o detectar biométricamente in situ y exprimir biológicamente en la célula orgánica a las partículas de la materia de los tejidos humanos como, por ejemplo destacable y explícitamente mencionado para el estudiante analítico universitario médico en la literatura psicosocial y clínica y manual a nivel de partículas de los átomos o:", "o": ["Isomorfismos gestálticos fenomenológicos irreales o tensiones dinámicas topológicas abstractas en dibujos vectoriales y flechas cualitativas de Lewin pasivas asimiladas mudas irracionales de geometría en folio mudo y sordo.", "Protones, o átomos de carbono o sodio.", "Reflejos espinales ciegos parasimpáticos viscerales puros molares e incondicionados salivares estériles mecánicos biológicos y amnésicos irracionales sin inteligencia ni consciencia u mente analítica computacional asimilativa."], "c": 1, "e": "\"También se han podido utilizar como marcadores partículas físicas (protones, átomos de carbono o sodio, entre otros) sometidas a la acción de un campo magnético. Así se logran imágenes por resonancia magnética.\" [48]."}, {"q": "El texto indica que hay tecnologías médicas analíticas asombrosas puras muy complejas de radiología que logran usar exógenamente marcadores de radiaciones muy exóticos y radiactivos atómicos subcelulares. Aquella técnica clínica médica o tomográfica pura y hospitalaria asombrosa de altísima gama radiactiva médica nuclear moderna y técnica analítica que evalúa empleando un detector en anillo capaz de registrar asombrosa biológica empíricamente fotones liberados u y rastreando la estela radiactiva emitida empírica real biométrica y de radiación al inyectar usar y emitirse asombrosas «partículas de masa similares asimilativas analíticas al electrón atómico negativo tradicional, pero dotadas u poseyendo sorpresivamente una asombrosa y diferencial y opuesta y extraña característica física polar de poseer en sí mismas su propia carga biológica, cuántica u química eléctrica de valencia \"positiva\"», se denomina en la literatura científica y universalmente por la sanidad oncológica e investigadora del saber occidental oficial con el acrónimo o la terminología científica exacta y unívoca radiológica asombrosa y pura médica formal atómica física pura como prueba de:", "o": ["La topología cuántica lewiniana de vacío y magnetismo animal esotérico y espiritual asilar ciego decimonónica frenológica asilar criminal y anatómico cerebral muerta fósil muerta inoperante irracional estéril pasiva y cadavérica muerta e inerte e invisible.", "El electroencefalograma canino pavloviano ruso de cronometría atómica periférica y de extinción lenta asimilativa animal y motora pura silente y abúlica parasimpática simple o mecánica ciega repetitiva.", "La tomografía por emisión de positrones (los mal llamados o extraños electrones gemelos puros, pero inversamente polarizados empírica u electromagnéticamente y de forma física asombrosamente cargados innegablemente con valencia analítica eléctrica pura de carácter positivo atómico antimaterial)."], "c": 2, "e": "\"...o de «positrones», partículas semejantes al electrón, pero de carga positiva (tomografía por emisión de positrones).\" [48]."}, {"q": "En el apartado de \"Conceptos Básicos\", se estipula que, en esencia, la adquisición fundamental, el mantenimiento y almacenamiento memorístico, seguido de la transformación y ulterior recuperación para luego el empleo y utilización directiva asimilada útil o de la información en el ser humano que nos permite y viabiliza o capacita posibilitando a todas luces el empleo asombroso de representaciones internas e interiorizadas para realizar acciones útiles y adaptativas asimiladas a los problemas y hechos objetivos que vivimos, se le condensa y resume a nivel de terminología base genérica psicológica y purista universitaria oficial del documento y manual en la grandísima, abarcadora e insustituible inmensa definición biológica base teórica e intelectiva general como la abstracta:", "o": ["Modularidad fodoriana ciega sintáctica universal o gramática no representacional estática muerta pura y biológica anatómica estructural mística inerte puramente irracional pasiva prehumana asimilativa primitiva y darwiniana.", "Cognición.", "Estadística biométrica correlacional atávica criminalista forense y somática craneal estructural de peso y frenología muerta fósil sorda o asilar de alienación onírica esotérica medieval astrológica puramente esotérica u eclesiástica decadente irracionalista atómica sin sentido e inoperante pasiva en laberintos ciegos periféricos moleculares irracionales en jaulas góticas vacías místicas puras incoloras."], "c": 1, "e": "\"Cognición. Se entiende por cognición la actividad mental consistente en la adquisición, almacenamiento, transformación, recuperación y empleo de la información, mediante el uso de representaciones internas...\" [49]."}, {"q": "El marco teórico de la ciencia cognitiva y del \"Procesamiento de información\" da por hecho lógicamente que la extraordinaria y evolucionada posesión natural del intrincadísimo sistema asimilativo humano biológico y mental tan útil y capaz a nivel de cálculo de evaluar e procesar asombrosa sistemática de la información ambiental del exterior, goza de su raíz indiscutible o viabilidad u ontología vital y pervivencia orgánica humana fundamental u biológica y que este aparato ha logrado sobrevivir triunfante al paso brutal histórico e implacable atroz atávico del transcurrir de las infinitas milenarias eras primitivas geológicas remotas e implacables incesantes del desgaste mortal sin fin y ha persistido incólume o perfeccionándose adaptativamente a tenor de las duras hostilidades incesantes mortíferas ambientales hostiles asimilativas de nuestro remoto pre pasado e historia terrestre y no siendo exterminados en la selección por puros idiotas gracias fundamental e innegable de forma lógica y biológica o evolutivamente hablando biológica, genética y formalmente a la asombrosa empírica teórica del sistema directriz orgánico universal u marco teórico asimilado biológico del:", "o": ["Sistema mágico del chamán aborigen tribal onírico esotérico y de telequinesia y ocultismo místico asombrosamente religioso parapsicológico londinense y ectoplasma adivinador puro adivinatorio esotérico astral e insustancial mudo sordo supersticioso puro irreal de lectura astral zoológica babilónica irracional de la Edad Oscura asombrosamente.", "Sistema de selección natural darwinista (puesto o admitiendo lógica biológica innegable sin fisuras que si por casualidad dicho sistema cerebral procesador innegablemente hubiera resultado ser trágicamente ineficaz ciego e inadaptativo u fatal letal en sus dictámenes de output operante motor somático y cálculos fatales atávicos esto hubiera terminado o arrastrado y supuesto innegablemente o abocado lógicamente y sentenciado el cruel ciego o fúnebre exterminio u muerte final letárgica pasiva extinta e innegociable final del hombre y de la variedad y la especie como fracaso y borrado fósil muerto).", "Sistema termodinámico magnético cuántico del vacío inorgánico absoluto cósmico radiactivo pasivo sordo helado atómico molecular que dicta y decreta esotéricamente al margen y lejos sin interactuar y del organismo material orgánico vivo el destino teológico mudo predestinado pasivo determinista e inexorable ciego e inmóvil inanimado irracional sin propósito u objetivo o intencionalidad alguna animal empírica material cerebral de supervivencia del mono en selva alguna."], "c": 1, "e": "\"El procesamiento de información resulta adaptativo a través del sistema de selección natural darwinista. La posesión de un sistema de procesamiento que resultara ineficaz o inadaptativo terminaría con la muerte del organismo y la desaparición de la especie...\" [50]."}, {"q": "Según el test de autocomprobación final acerca del modelo de acción humana cibernética de retroalimentación TOTE asimilativo y adaptativo pragmático asimilativo impulsado en EEUU (unidad de Miller, Galanter y Pribram), ¿qué enorme diferencia analítica principal teórica lo separa abrumadoramente o lo distancia estructural y conceptualmente sin posibilidad ni atisbo de vuelta atrás reconciliable de manera fundamental irreconciliable u total del modelo antiguo de S-R pasivo o reflejo canino mudo siberiano u de la periferia visceral o Watsoniano sordo de arco espinal en laberintos ciegos?", "o": ["En que el modelo de TOTE presupone ciegamente y exige obligatoriamente creer en la reencarnación y en ectoplasmas y quiromancia irracionalista victoriana parapsicológica astrológica y mística astral decimonónica u superstición ciega de la edad media esotérica mágica.", "En que el TOTE elimina la física para abrazar el conductismo aversivo visceral espinal atópico pasivo puro letal sin conciencia de castigo fúnebre animal estático onírico sin mente o cerebro medio analítico representacional abstracto orgánico analítico.", "En que mientras el modelo reflejo (S-R) es simple o lineal, ciego mecánico pasivo o lineal de estímulo-excitación-respuesta irracional, el modelo «TOTE», contrariamente y revolucionariamente como unidad analítica u cibernética, siempre «compara o evalúa internamente y de forma incesante todo el asombroso input en contraste comparativo activo constante guiándose a base de contrastarlo internamente en bucle constante bajo y frente a \"reglas o normas y propósitos internos orgánicos prefijados de la mente\" y solo con esta retroalimentación evalúa y ajusta su acción»."], "c": 2, "e": "\"Mientras que el modelo del reflejo supone que hay un mecanismo que lleva la excitación del estímulo a la producción de la respuesta, en forma lineal... el modelo TOTE, en cambio, opera solo mediante procesos de comparación entre estímulos y «normas» o «reglas», y evalúa la acción de sus operaciones para redirigirlas...\" [51]."}, {"q": "Según aclara con toda exactitud la solución 2 al repasar históricamente y filosóficamente las posturas y conceptos basales y asimilativos y raíces o genes y orígenes puristas de las tesis biológicas o del marxismo aplicados por Lev Vygotski sobre \"la dimensión social de la conciencia humana asimilativa y lingüística de su pensamiento y de su ontogénesis mental\", ¿cómo el niño va adquiriendo e incorporando interiormente en sí la tremenda asombrosa capacidad de gobernar sus funciones cognitivas lógicas regulativas voluntarias en su desarrollo superior y complejo biológico sano en la infancia al crecer?:", "o": ["La adquiere u incorpora al heredarla en bloque genética y ciegamente en pasividad u a priori de nacimiento preformada de manera absoluta pre madurada como arquetipo o mito animal instintivo freudiano incondicionado.", "El niño la adquiere \"interiorizando y asimilando internamente a través de un proceso de guía social del lenguaje, absorbiendo como suyas la regulación o normas en su inicio interpersonales que otra persona (su madre/adulto guiándole) primero le aplicaba interactiva asimilativamente desde fuera exteriormente e inicialmente de manera social y dialogada y luego convirtiendo eso él internamente en regulación intrapersonal individual propia\".", "El niño nace siendo un experto sintáctico universal gramatical pero con el tiempo va perdiendo y aniquilando amnésicamente e idiotizándose y atrofiándose su cerebro de manera involutiva asimilativa degenerativa a los cinco años por neurosis experimental profunda aversiva o choque fóbico irracional inmovilizado letárgico asimilado en cámara silente."], "c": 1, "e": "\"...tiene su origen en la actividad del individuo dirigida y regulada desde fuera, mediante la intervención de otra persona... De esta suerte, inicialmente la acción incorpora como elemento esencial al «otro»... en un proceso que termina por absorber e incorporar al propio sujeto aquel «otro» inicial...\" [52, 53]."}, {"q": "(Autocomprobación 3): De manera sintética, asimilativa e irrefutable, cuando el genial psicolingüista de las filas cognitivas estadounidenses de MIT y Harvard u de Norteamérica, el insigne o célebre estudioso de origen americano Fodor, plantea, defiende o exige para la arquitectura abstracta inmaterial interior del procesamiento o de la \"Mente\" su famosa tesis ineludible y fundamental de la llamada \"Modularidad\", nos está postulando biológica u orgánicamente que las actividades humanas o nuestra mente es asombrosamente operativa ya que es el grandioso, sistemático, asombroso resultado asimilado, complejo o analítico del funcionamiento combinado y del diseño biológico general interconectado u de la asombrosa operación sistemática de unos sistemas independientes que en su argot él denomina formalmente y exactamente referenciando a la computación bajo el término o apelativo exacto y biológico formal científico como la suma combinada y operación general interconectada o red general unificadora asombrosa biológica de un sistema sumativo base constituido u orquestado con:", "o": ["Glándulas digestivas salivales moleculares exclusivamente periféricas simpáticas pasivas sin intelecto irracional puramente vegetativo y mudo de secreción ciega y simple automática refleja motora pasiva de espasmo puro animal de digestión y latido.", "Módulos (elementos operacionales cerrados, subrutinas componentes operativas específicas donde cada uno aporta de modo independiente su peculiar procesado específico y ciego a la acción total en red).", "Campos estroboscópicos ilusorios fenomenológicos puros visuales y vacíos existenciales irracionalistas y chamánicos místico adivinatorios de topología cuántica inorgánica e inmaterial astrológica victoriana parapsicológica inactiva muda esotérica abstracta decimonónica asilar eclesiástica clerical aislada pasiva sin aplicación pragmática analítica material y biológica demostrable experimental objetiva de peso alguno."], "c": 1, "e": "\"Esta teoría supone que la actividad de la mente... es siempre el resultado de la operación de unos «módulos» o elementos componenciales operativos, de modo que cada uno de estos, operando de modo cerrado, aporta su peculiar dimensión... a la acción total...\" [53, 54]."}, {"q": "El documento \"La ciencia cognitiva\", a la hora de detallar su extensísima e interesantísima bibliografía o bibliografía recomendada clave a nivel universitario en la última parte final para sus estudiosos, señala que el famosísimo e influyente tomo \"Cognitive Psychology\" (referencia básica del campo en lengua inglesa, en su 3ª edición, Boston: Allyn and Bacon, año 1991) pertenece a la autoría fundamental o pluma inmortal del erudito y gran referenciado analista del texto u autor:", "o": ["R. L. Solso.", "J. Piaget.", "L. Vygotski."], "c": 0, "e": "\"Solso, R. L. (1991). Cognitive Psychology. (3.ª ed.). Boston: Allyn and Bacon.\" [55]."}];
let questions=[...originalQuestions],current=0,score=0,missed=[],retryMode=false;

function loadQuestion(){
let q=questions[current];
document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='Ciencia Cognitiva: mente, procesamiento de información, Vygotski, Piaget, memoria, atención, lenguaje, psicopatología y neuroimagen.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}
loadQuestion();
</script>
