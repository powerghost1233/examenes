<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurociencia Unidad 8 Premium | DAVID MILÁN STUDIO</title>
<style>
:root{--bg:#05070d;--bg2:#0b1323;--gold:#d4af37;--gold2:#f3d98b;--white:#f8f4e8;--muted:#aab3c5;--green:#33d17a;--red:#ff6b6b;--blue:#4da3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at top left,rgba(212,175,55,.22),transparent 34%),radial-gradient(circle at bottom right,rgba(30,90,180,.28),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2),#05070d);color:var(--white);display:flex;justify-content:center;align-items:center;padding:35px 18px}
.quiz-container{width:100%;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(212,175,55,.28);border-radius:30px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);color:var(--gold2);letter-spacing:3px;font-weight:800;font-size:13px;margin-bottom:18px;background:rgba(255,255,255,.04)}
h1{font-size:clamp(30px,5vw,54px);line-height:1;margin-bottom:10px;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{font-size:17px;color:var(--muted);font-weight:400;margin-bottom:26px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.stat{padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:800}
.progress-wrap{height:10px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin-bottom:24px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:.35s ease}
.question-card{background:rgba(4,8,16,.55);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px}
.question{font-size:21px;font-weight:800;line-height:1.45;margin-bottom:22px}
.options{display:grid;gap:13px}
.option-btn{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));color:var(--white);font-size:16px;text-align:left;cursor:pointer;transition:.25s ease}
.option-btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(212,175,55,.65);box-shadow:0 12px 30px rgba(212,175,55,.12)}
.option-btn:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.16)!important;border-color:var(--green)!important;color:#dfffea!important}
.incorrect{background:rgba(255,107,107,.16)!important;border-color:var(--red)!important;color:#ffe0e0!important}
.feedback{display:none;margin-top:22px;padding:20px;border-radius:20px;line-height:1.65;font-size:15px}
.feedback.show{display:block}.feedback-correct{background:rgba(51,209,122,.12);border-left:5px solid var(--green)}.feedback-incorrect{background:rgba(255,107,107,.12);border-left:5px solid var(--red)}
.feedback strong{font-size:18px}.solution-label{display:block;margin-top:12px;color:var(--gold2);font-weight:900}
.controls{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:16px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;transition:.25s ease}.btn:hover{transform:translateY(-2px)}
.next-btn{display:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080b12}.secondary-btn{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.14)}
.score-container{display:none;text-align:center;padding:24px}.score-text{font-size:30px;font-weight:900;color:var(--gold2);margin-bottom:18px}.result-message{color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:24px}
.medal{display:inline-block;margin:14px 0 10px;padding:12px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.10);color:var(--gold2);font-weight:900}
.missed-box{text-align:left;margin:24px 0;padding:20px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}.missed-box h3{color:var(--gold2);margin-bottom:12px}.missed-box ul{padding-left:20px;color:#dbe2f2;line-height:1.6}
.mode-label{color:var(--blue);font-weight:900}
@media(max-width:650px){.quiz-container{padding:22px}.question-card{padding:20px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="quiz-container">
  <div class="brand">DAVID MILÁN STUDIO</div>
  <h1>Mega-Test Premium</h1>
  <h2>Unidad 8 · Sensación y procesamiento sensorial I</h2>
  <div id="quiz-screen">
    <div class="topbar">
      <div class="stat" id="progress-text">Pregunta 1 de 80</div>
      <div class="stat" id="score-tracker">Puntuación: 0</div>
      <div class="stat" id="mode-text">Modo completo</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="question-card">
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div id="feedback-container" class="feedback"></div>
      <div class="controls">
        <button class="btn secondary-btn" onclick="restartQuiz()">Reiniciar test</button>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Siguiente pregunta</button>
      </div>
    </div>
  </div>
  <div id="result-screen" class="score-container">
    <div class="score-text" id="final-score"></div>
    <div class="medal" id="medal-text"></div>
    <div class="result-message" id="final-message"></div>
    <div id="missed-summary" class="missed-box"></div>
    <div class="controls" style="justify-content:center;">
      <button class="btn secondary-btn" onclick="restartQuiz()">Volver a intentar todo</button>
      <button class="btn next-btn" id="retry-missed-btn" onclick="retryMissed()">Reintentar preguntas falladas</button>
    </div>
  </div>
</div>
<script>
const originalQuestions = [

        // Principios Generales y Componentes
        { q: "¿Qué estructura clave actúa como estación de relevo entre el mundo exterior y la corteza cerebral para todos los sistemas sensoriales, a excepción del olfato?", o: ["El bulbo raquídeo.", "El tálamo.", "El hipocampo."], c: 1, e: "Todos los sistemas sensoriales, con excepción del olfato, establecen conexiones a nivel subcortical con el tálamo, que actúa como estación de relevo." },
        { q: "¿Qué término se utiliza cuando la información sensorial son datos físicos puros que aún se encuentran fuera de la corteza cerebral?", o: ["Percepción.", "Sensación.", "Transducción secundaria."], c: 1, e: "Mientras la información sensorial se encuentra aún fuera de la corteza, se habla de sensación, ya que se refiere a datos físicos puros." },
        { q: "Cuando diferentes aspectos de un mismo estímulo (como el color, la forma y la ubicación espacial de un objeto) son analizados simultáneamente por distintas vías, estamos ante un procesamiento:", o: ["En paralelo.", "Secuencial puro.", "Jerárquico descendente."], c: 0, e: "Además del procesamiento secuencial, los sistemas operan en paralelo, analizando simultáneamente distintos aspectos (color, forma, ubicación)." },
        { q: "¿Cuáles son los tres componentes fundamentales que conforman todo sistema sensorial?", o: ["Receptores sensoriales, vías nerviosas aferentes y áreas de proyección cortical.", "Receptores sensoriales, interneuronas medulares y tractos motores descendentes.", "Órganos periféricos, glándulas endocrinas y sistema límbico."], c: 0, e: "Cada sistema sensorial se compone de tres elementos fundamentales: receptores sensoriales, vías nerviosas aferentes y áreas de proyección cortical." },
        { q: "Según su estructura, los receptores formados por una célula especializada que transmite la información mediante una sinapsis a la neurona sensorial se denominan:", o: ["Receptores primarios.", "Receptores secundarios.", "Receptores protopáticos."], c: 1, e: "Receptores secundarios: compuestos por una célula especializada que transmite la información mediante una sinapsis a la neurona sensorial." },
        { q: "¿Cómo se llama el proceso físico y fisiológico mediante el cual la energía de un estímulo se convierte en señales eléctricas (potenciales de acción)?", o: ["Decusación.", "Transducción.", "Inhibición lateral."], c: 1, e: "La transducción es el proceso mediante el cual la energía generada por un estímulo se convierte en señales eléctricas (lenguaje funcional del SN)." },
        { q: "Los receptores que se adaptan rápidamente al estímulo se denominan:", o: ["Fásicos.", "Tónicos.", "Epicríticos."], c: 0, e: "Algunos receptores se adaptan rápidamente y se denominan fásicos, mientras que otros (tónicos) responden de manera sostenida." },
        { q: "Las vías aferentes presentan una organización contralateral. Esto significa que:", o: ["El estímulo sube y baja por la misma médula antes de llegar al cerebro.", "La información de ambos ojos se anula mutuamente en el quiasma.", "La información recogida en un lado del cuerpo generalmente se proyecta hacia el hemisferio cerebral opuesto."], c: 2, e: "Organización contralateral: la información recogida en un lado del cuerpo generalmente se proyecta hacia el hemisferio cerebral opuesto." },
        { q: "Dentro de la organización cortical funcional, la información 'protopática' (de carácter general y difuso) se procesa principalmente en:", o: ["Las áreas de proyección primaria.", "Las pirámides bulbares.", "Las áreas de proyección secundaria y de asociación."], c: 2, e: "La información protopática (general y difusa) se interpreta en las áreas secundarias y de asociación para una integración más amplia." },

        // Clasificación de los sistemas
        { q: "¿Qué sistema sensorial detecta las variaciones en la tensión muscular y la posición de las articulaciones?", o: ["Sistema exteroceptivo.", "Sistema interoceptivo.", "Sistema propioceptivo (cinestésico)."], c: 2, e: "El sistema cinestésico (propioceptivo) proporciona información sobre la posición, el movimiento y la estructura del cuerpo desde músculos y articulaciones." },
        { q: "¿Qué estructura interoceptiva lleva la información visceral al hipotálamo, vinculándose a la regulación emocional?", o: ["El tracto archiespinotalámico o sistema visceral.", "El sistema lemniscal somático.", "El haz espinotalámico anterior."], c: 0, e: "El tracto archiespinotalámico o sistema visceral lleva información al diencéfalo (hipotálamo) y se vincula a funciones viscerales y emocionales." },
        { q: "¿Qué ocurre en la corteza somatosensorial con áreas de la piel densamente pobladas de receptores táctiles, como las yemas de los dedos?", o: ["Tienen una representación cortical proporcional a la densidad de receptores (más amplia).", "No tienen representación cortical directa, se procesan en el tronco encefálico.", "Su representación se anula frente a los estímulos visuales."], c: 0, e: "En la corteza somatosensorial, cada zona del cuerpo tiene una representación proporcional a la densidad de receptores (ej. yemas de los dedos tienen mucha densidad)." },
        
        // Sistema Visual
        { q: "El ojo humano solo detecta una franja estrecha de ondas electromagnéticas, el espectro visible, que abarca longitudes de onda entre:", o: ["100 y 300 nanómetros.", "380 y 750 nanómetros.", "800 y 1500 nanómetros."], c: 1, e: "El espectro visible para nuestra especie está comprendido por longitudes de onda entre los 380 y los 750 nanómetros." },
        { q: "¿Qué estructura del ojo humano es una lente flexible que modifica su curvatura (acomodación) para enfocar objetos a distintas distancias?", o: ["La córnea.", "El cristalino.", "El iris."], c: 1, e: "El cristalino, una lente flexible situada tras la pupila, modifica su curvatura (acomodación) para permitir el enfoque." },
        { q: "Cuando observamos un objeto cercano, ¿qué le ocurre físicamente al cristalino en el proceso de acomodación?", o: ["Se pone más grueso y redondeado con mayor poder refractivo.", "Se queda en su forma más delgada y plana.", "Se invierte hacia la parte anterior de la córnea."], c: 0, e: "Para observar un objeto cercano se produce la acomodación: contracción del músculo ciliar, el cristalino aumenta su curvatura y se pone más grueso y redondeado." },
        { q: "¿Qué región del ojo contiene de manera exclusiva conos y es la responsable de la mayor agudeza visual?", o: ["El punto ciego.", "La fóvea.", "El epitelio pigmentario."], c: 1, e: "La fóvea, localizada en el centro de la retina, es una depresión que contiene exclusivamente conos, siendo la región de mayor agudeza visual." },
        { q: "En la organización celular de la retina, ¿qué capa aloja a las células ganglionares cuyos axones conforman el nervio óptico?", o: ["Capa nuclear externa.", "Capa plexiforme interna.", "Capa de fibras de la coroides."], c: 1, e: "Las células ganglionares se sitúan en la capa plexiforme interna y sus axones conforman el nervio óptico." },
        { q: "¿Qué les ocurre biológicamente a los fotorreceptores cuando están en absoluta OSCURIDAD?", o: ["El nivel de GMPc es alto, los canales de sodio están abiertos y la célula se despolariza.", "El GMPc disminuye a cero, cerrando los canales de sodio y paralizando la célula.", "Se hiperpolarizan y dejan de liberar neurotransmisores de inmediato."], c: 0, e: "En la oscuridad, los niveles de GMPc son altos, se une a los canales de sodio, los mantiene abiertos y la célula se despolariza." },
        { q: "En la transducción visual, cuando la LUZ incide en los fotorreceptores, el nivel de GMPc se reduce. ¿Qué consecuencia iónica tiene esto?", o: ["Se abren masivamente los canales de potasio.", "Se cierran los canales de sodio, produciendo la hiperpolarización del receptor.", "La rodopsina expulsa al calcio extracelular."], c: 1, e: "Con la luz, la absorción de fotones disminuye los niveles de GMPc, cerrándose los canales de sodio y produciendo la hiperpolarización del receptor." },
        { q: "¿Qué mecanismo retinal mejora la percepción de bordes y contrastes mediante la inhibición de la actividad de células vecinas?", o: ["Interacción o inhibición lateral (mediada por células horizontales y amacrinas).", "Acomodación ciliar.", "La segregación magnocelular."], c: 0, e: "La inhibición lateral, mediada por células horizontales y amacrinas, inhibe la respuesta de receptores cercanos, acentuando contrastes y bordes." },
        { q: "¿Cómo se llama la ilusión óptica (cuadrícula blanca sobre fondo negro) donde vemos manchas grises en los cruces debido a la inhibición lateral?", o: ["Cubo de Necker.", "Rejilla de Hermann.", "Ilusión de Müller-Lyer."], c: 1, e: "El ejemplo claro es la rejilla de Hermann, una ilusión óptica generada por la inhibición lateral en la visión periférica." },
        { q: "Existen células ganglionares Y (magnocelulares) especializadas. ¿A qué responden preferentemente?", o: ["A los detalles finos y estáticos.", "Al color rojo y azul.", "De forma rápida a estímulos en movimiento y campos visuales grandes."], c: 2, e: "Las células Y o magnocelulares presentan campos más grandes y responden de forma rápida a estímulos en movimiento." },
        { q: "Al llegar al quiasma óptico, ¿qué fibras axonales cruzan al hemisferio cerebral opuesto (decusan)?", o: ["Las de las hemirretinas temporales.", "Las de las hemirretinas nasales.", "Todas las fibras decusan al 100%."], c: 1, e: "En el quiasma se cruzan parcialmente: los axones de las hemirretinas nasales se decusan hacia el hemisferio opuesto." },
        { q: "La Vía Visual Ventral (parvocelular) que proyecta hacia la corteza temporal inferior responde a la pregunta de '¿qué es?'. Su función es:", o: ["Reconocimiento de objetos, formas y colores.", "Determinar la profundidad estereoscópica de los abismos.", "Localización espacial rápida e inconsciente de los objetos."], c: 0, e: "Vía ventral (parvocelular): V1 -> V4 -> Corteza temporal inferior. Su función es el reconocimiento de objetos, formas y colores ('¿qué es?')." },
        { q: "La percepción consciente del COLOR, independientemente de la longitud de onda, se alcanza específicamente en:", o: ["El área V1.", "El área V4.", "El colículo superior."], c: 1, e: "En V4 se logra la percepción consciente del color, independiente de la longitud de onda." },
        { q: "La Vía Visual Dorsal (magnocelular), que responde a '¿dónde está?', procesa la dirección y velocidad del movimiento integrándolo en:", o: ["El giro fusiforme.", "El área V5/MT y la corteza parietal posterior.", "La corteza piriforme."], c: 1, e: "La Vía dorsal (magnocelular): V1 -> V5/MT -> corteza parietal posterior. Procesa la localización espacial, movimiento y profundidad." },
        { q: "¿Qué sistema visual secundario implica al colículo superior y permite respuestas rápidas/inconscientes demostradas en la 'visión ciega'?", o: ["Sistema genículo-estriado.", "Sistema tectopulvinar.", "Sistema lemniscal visual."], c: 1, e: "El sistema tectopulvinar proyecta al colículo superior y núcleo pulvinar, implicado en respuestas rápidas no conscientes (visión ciega)." },
        { q: "El hemisferio DERECHO presenta una especialización funcional más eficaz para:", o: ["Reconocimiento de letras y números.", "Tareas analíticas verbales.", "Percepción global (gestalt), discriminación figura-fondo y reconocimiento facial."], c: 2, e: "Hemisferio derecho (HD): Especializado en percepción global, gestalt, discriminación figura-fondo, reconocimiento facial y espacial." },
        { q: "Si se interrumpe o corta el nervio óptico justo ANTES del quiasma óptico, el paciente sufrirá:", o: ["Ceguera cortical total.", "Hemianopsia homónima contralateral.", "Hemianopsia unilateral (pérdida de visión en todo el campo visual de un solo ojo)."], c: 2, e: "Hemianopsia unilateral: interrupción del nervio óptico antes del quiasma, provoca pérdida de la visión en todo el campo visual de un solo ojo." },
        { q: "La agnosia aperceptiva se caracteriza porque el paciente:", o: ["Reconoce el significado, pero es ciego de nacimiento.", "Puede copiar dibujos sin saber qué son.", "Identifica elementos individuales (líneas), pero no puede integrarlos en un todo coherente."], c: 2, e: "En la agnosia aperceptiva, el paciente identifica líneas o formas individuales pero no puede integrarlas en un todo coherente por daño occipitotemporal." },
        { q: "La incapacidad neuropsicológica para reconocer ROSTROS (incluso los familiares) debida a una lesión en el giro fusiforme del hemisferio derecho es:", o: ["Acinetopsia.", "Acromatopsia cerebral.", "Prosopagnosia."], c: 2, e: "Prosopagnosia: incapacidad para reconocer rostros, asociado con daño en el giro fusiforme del hemisferio derecho." },
        { q: "El Síndrome de Balint es una grave afectación de la vía dorsal parietal que incluye simultagnosia, ataxia óptica y...", o: ["Apraxia ocular.", "Sordera verbal pura.", "Anosmia específica."], c: 0, e: "El Síndrome de Balint (lesión parietal posterior) incluye ataxia óptica, apraxia ocular y simultagnosia." },
        { q: "Si un paciente con daño en el lóbulo parietal derecho ignora todos los estímulos que aparecen en la mitad izquierda del espacio, padece:", o: ["Disgeusia espacial.", "Negligencia espacial unilateral (heminegligencia).", "Agnosia aperceptiva severa."], c: 1, e: "Negligencia espacial unilateral: ocurre tras daño parietal derecho, el paciente ignora los estímulos del lado izquierdo." },

        // Sistema Auditivo
        { q: "¿En qué unidades físicas se mide la 'intensidad o volumen' de una onda sonora, cuya exposición prolongada por encima de 100 resulta dañina?", o: ["Hercios (Hz).", "Decibelios (dB).", "Voltios (mV)."], c: 1, e: "La intensidad o volumen corresponde a la amplitud de la onda y se mide en decibelios (dB)." },
        { q: "¿Qué propiedad de la onda sonora se refiere al número de ciclos por segundo (tono grave/agudo) y se mide en Hercios (Hz)?", o: ["El timbre.", "La frecuencia.", "La fase acústica."], c: 1, e: "La frecuencia, relacionada con el tono, es el número de ciclos en un tiempo y se mide en hercios (Hz)." },
        { q: "En la transmisión del sonido, el Oído Medio adapta la impedancia entre el aire y el líquido del oído interno a través de:", o: ["El pabellón auricular y la concha.", "La endolinfa del órgano de Corti.", "La cadena de huesecillos (martillo, yunque y estribo)."], c: 2, e: "El oído medio, con su cadena de huesecillos, cumple el rol esencial de adaptación de impedancia entre el aire y la endolinfa." },
        { q: "¿Qué líquido, esencial para generar la transducción acústica por su alta concentración de potasio, llena el conducto coclear (rampa media)?", o: ["Perilinfa.", "Humor vítreo.", "Endolinfa."], c: 0, e: "El conducto coclear está lleno de endolinfa, líquido rico en potasio vital para la transducción electroquímica." },
        { q: "La estructura neurosensorial primaria que descansa sobre la membrana basilar y contiene a las células ciliadas auditivas es:", o: ["El órgano de Corti.", "El ganglio de Gasser.", "El núcleo pulvinar."], c: 0, e: "Sobre la membrana basilar se encuentra el órgano de Corti, estructura neurosensorial primaria con células ciliadas." },
        { q: "En la transducción auditiva, cuando el movimiento abre mecánicamente los canales en los estereocilios de las células ciliadas, ¿qué ión fluye despolarizando la célula?", o: ["El sodio (Na+).", "El potasio (K+).", "El magnesio (Mg2+)."], c: 1, e: "Los esterocilios se desvían abriendo canales iónicos permitiendo que el potasio (K+) fluya, despolarizando la célula ciliada." },
        { q: "¿Qué nombre recibe la organización estructural de la membrana basilar en la que las frecuencias altas excitan la base y las frecuencias bajas el ápice de la cóclea?", o: ["Lateralidad de banda.", "Tonotopía coclear.", "Holoaudición perimetral."], c: 1, e: "La organización donde frecuencias altas excitan la base y bajas el ápice se conoce como tonotopía coclear." },
        { q: "En la vía auditiva ascendente en el tronco encefálico, ¿qué estructura realiza la localización espacial del sonido comparando tiempo e intensidad interaural?", o: ["Núcleo olivar superior.", "Colículo inferior.", "Núcleo geniculado medial."], c: 0, e: "Las señales se proyectan al núcleo olivar superior, donde se realiza la localización espacial del sonido por comparación interaural." },
        { q: "¿Qué estructura talámica actúa como centro de relevo antes de enviar la información a la corteza auditiva?", o: ["El núcleo geniculado lateral (NGL).", "El núcleo geniculado medial (NGM).", "El hipotálamo anterior."], c: 1, e: "La señal alcanza el núcleo geniculado medial del tálamo, actuando como relevo hacia la corteza auditiva." },
        { q: "Por norma general en la especialización auditiva hemisférica, ¿dónde se procesan prioritariamente los sonidos musicales y ambientales (no lingüísticos)?", o: ["En el cerebelo.", "En el hemisferio derecho.", "En el área de Wernicke del hemisferio izquierdo."], c: 1, e: "Los sonidos musicales y ambientales se procesan prioritariamente en el hemisferio derecho." },
        { q: "Un paciente que debido a una infección severa o tapón de cera sufre una alteración en la que el sonido no puede llegar a una cóclea que sí está sana, padece de:", o: ["Sordera central.", "Sordera de conducción (hipoacusia conductiva).", "Agnosia acústica total."], c: 1, e: "La sordera de conducción se produce cuando el sonido no se transmite de forma física eficaz (obstrucciones, tapones) hacia una cóclea sana." },

        { q: "¿Cómo se llama el trastorno de sordera central donde el paciente oye perfectamente ruidos y campanas, pero no puede identificar como palabras los fonemas del lenguaje humano?", o: ["Sordera de tonos puros.", "Prosopagnosia auditiva.", "Sordera verbal pura (agnosia verbal)."], c: 2, e: "Sordera verbal pura: no puede reconocer los sonidos del lenguaje hablado, aunque puede oír bien sonidos no verbales." },

        // Sistema Olfatorio
        { q: "Evolutivamente, un olor natural suele estar compuesto de una mezcla compleja de múltiples odorantes. ¿Al menos cuántos, típicamente?", o: ["Solo uno o dos como máximo.", "Al menos seis.", "Cientos de miles."], c: 1, e: "En general, un olor es una mezcla compleja de múltiples odorantes, al menos seis, con diferentes concentraciones." },
        { q: "Dentro del epitelio olfatorio, además de las neuronas y las células de soporte, existen células basales encargadas de:", o: ["Atrapar partículas de polvo gigantes.", "Actuar como células madre para reemplazar a las neuronas receptoras dañadas de forma continua.", "Producir melanina nasal."], c: 1, e: "Células basales: actúan como células madre para reemplazar neuronas dañadas. El epitelio se renueva a lo largo de la vida." },

        { q: "¿Cuál es el principal destino cortical del tracto olfatorio en los humanos, el cual procesa la información mediante patrones combinatorios?", o: ["La corteza piriforme.", "El córtex motor primario.", "La ínsula posterior."], c: 0, e: "El principal destino en humanos es la corteza piriforme, situada en la cara ventromedial del lóbulo temporal." },
        { q: "Un ejemplo humano muy sólido de conducta guiada por el olfato, similar a las feromonas animales, es:", o: ["La fobia a las arañas.", "El reconocimiento olfatorio entre madre e hijo recién nacido.", "La aversión natural al sabor dulce."], c: 1, e: "En humanos, uno de los ejemplos más sólidos es el reconocimiento olfatorio entre madre e hijo recién nacido." },
        { q: "Al envejecer, la capacidad olfativa humana disminuye drásticamente. ¿Qué porcentaje aproximado de personas entre 50 y 70 años logra identificar correctamente los olores comunes?", o: ["Alrededor del 90 %.", "Alrededor del 30 % al 45 %.", "Un 5 % como máximo."], c: 1, e: "Mientras que entre 20 y 40 años aciertan el 50-75%, en el rango de 50 a 70 años la cifra cae al 30 % - 45 %." },

        // Sistema Gustativo y Multimodal
        { q: "¿Qué gusto primario ha sido identificado más recientemente, está asociado al glutamato monosódico y señala la presencia de proteínas/aminoácidos?", o: ["Alcalino.", "Umami.", "Metálico."], c: 1, e: "El quinto gusto primario es el umami, asociado al glutamato monosódico y otros aminoácidos libres." },
        { q: "¿Qué papilas gustativas tienen forma de copa, forman dos arcos en la parte posterior de la lengua y contienen cientos de corpúsculos?", o: ["Papilas fungiformes.", "Papilas filiformes.", "Papilas calciformes (circunvaladas)."], c: 2, e: "Papilas calciformes (circunvaladas): tienen forma de copa, forman dos arcos en la parte posterior de la lengua y tienen mayor densidad de receptores." },

        { q: "Las células Tipo II (Claras) detectan sabores dulces, amargos y umami. Para la transducción de señales, utilizan:", o: ["Solo canales iónicos directos para sodio.", "Receptores de presión estática.", "Receptores acoplados a proteínas G (T1R y T2R) y cascada de segundos mensajeros."], c: 2, e: "Estos sabores complejos son detectados por receptores acoplados a proteínas G (GPCRs), utilizando la proteína gustducina." },
        { q: "En la transducción del gusto para sabores SALADOS, la célula se activa mediante:", o: ["Un bloqueo masivo de ATP.", "La entrada de iones de sodio (Na+) a través de canales iónicos sensibles directos.", "La liberación de glutamato mediada por proteína G."], c: 1, e: "En el caso de las sales, los iones de sodio (Na+) ingresan a través de canales iónicos sensibles, generando una despolarización directa." },
        { q: "La rama de la cuerda del tímpano, que transporta impulsos gustativos de los dos tercios anteriores de la lengua, pertenece al nervio:", o: ["Trigémino.", "Vago.", "Facial."], c: 2, e: "Nervio facial: La rama más relevante es la cuerda del tímpano, que transporta impulsos de los dos tercios anteriores." },
        { q: "El nervio glosofaríngeo es especialmente importante para detectar sabores en el tercio posterior de la lengua. ¿Qué gusto vital para advertir toxicidad predomina allí?", o: ["Dulce.", "Umami.", "Amargo."], c: 2, e: "Nervio glosofaríngeo: tercio posterior de la lengua, especialmente importante en la detección de sabores amargos (potencialmente tóxicos)." },
        { q: "Las fibras gustativas aferentes hacen su primera sinapsis (de primer orden) en una estructura del bulbo raquídeo llamada:", o: ["Núcleo geniculado medial.", "Núcleo del tracto solitario (NTS).", "Locus Coeruleus."], c: 1, e: "Las fibras aferentes hacen sinapsis de primer orden en el núcleo del tracto solitario (NTS), situado en el bulbo raquídeo." },
        { q: "La vía gustativa talámica-cortical termina proyectando a la corteza gustativa primaria, que es responsable de la percepción consciente del sabor y se ubica en:", o: ["La ínsula y la corteza opercular frontal.", "El lóbulo occipital inferior.", "El área motora suplementaria."], c: 0, e: "La señal se dirige a la corteza gustativa primaria ubicada en la ínsula y la corteza opercular frontal." },
        { q: "¿Qué teoría de codificación neural del gusto sugiere que el sabor percibido surge del patrón combinado de actividad de múltiples fibras que responden a varios estímulos a la vez?", o: ["Modelo de línea etiquetada.", "Modelo de patrón distribuido.", "Modelo del canal único estricto."], c: 1, e: "Modelo de patrón distribuido: sostiene que cada fibra nerviosa puede responder a más de un sabor y la percepción surge del patrón combinado." },
        { q: "La integración central del gusto, olfato retronasal y señales somatosensoriales, que origina la percepción final y compleja del 'sabor', converge en el cerebro en la:", o: ["Corteza orbitofrontal.", "Corteza visual primaria.", "Protuberancia anular."], c: 0, e: "La convergencia ocurre en áreas cerebrales como la corteza orbitofrontal, donde el cerebro unifica inputs para generar la experiencia del sabor." },
        { q: "Durante la pandemia de COVID-19, muchos pacientes sufrieron la pérdida combinada de olfato y gusto, demostrando la integración sensorial. La pérdida total de la capacidad para percibir sabores en la lengua se conoce médicamente como:", o: ["Ageusia.", "Anosmia aislada.", "Hiperalgesia."], c: 0, e: "Ageusia: pérdida total de la capacidad para percibir los sabores (mientras que anosmia es la pérdida del olfato y disgeusia es la distorsión del gusto)." },
        
        // Final Specific Details
        { q: "¿A qué neurotransmisor liberan las células gustativas Tipo II (que no forman sinapsis clásicas) hacia las fibras nerviosas cercanas cuando se activan ante lo dulce o umami?", o: ["Serotonina.", "Dopamina.", "ATP."], c: 2, e: "Las células gustativas tipo II no forman sinapsis clásicas, sino que liberan ATP como neurotransmisor." },
        { q: "A nivel olfatorio, los receptores olfativos se comunican a través del hueso hacia el bulbo olfatorio atravesando específicamente:", o: ["La lámina cribosa del hueso etmoides.", "El esfenoides occipital.", "El maxilar superior."], c: 0, e: "Los fascículos atraviesan la lámina cribosa del hueso etmoides, una delgada región perforada." },
        { q: "En la audición, ¿cuál es el daño neurosensorial principal que origina la patología llamada presbiacusia (pérdida relacionada con la edad)?", o: ["Calcificación exclusiva del yunque y el estribo.", "Acumulación de líquido endolinfático en el oído externo.", "Daño aterosclerótico de la microvasculatura del oído interno y pérdida de células ciliadas."], c: 2, e: "La presbiacusia es debida al daño aterosclerótico de la microvasculatura fina del oído interno (deterioro de células ciliadas neurosensoriales)." },
        { q: "En la jerarquía visual de la corteza, ¿qué células descubiertas por Hubel y Wiesel son sensibles a patrones más elaborados como 'ángulos y bordes'?", o: ["Células de Schwann.", "Células simples.", "Células hipercomplejas."], c: 2, e: "Células hipercomplejas: sensibles a patrones más elaborados, como ángulos y bordes." }
    
];

let questions=[...originalQuestions],currentQuestion=0,score=0,answered=false,missedQuestions=[],retryMode=false;
const questionText=document.getElementById('question-text'),optionsContainer=document.getElementById('options-container'),feedbackContainer=document.getElementById('feedback-container'),nextBtn=document.getElementById('next-btn'),progressText=document.getElementById('progress-text'),scoreTracker=document.getElementById('score-tracker'),quizScreen=document.getElementById('quiz-screen'),resultScreen=document.getElementById('result-screen'),finalScore=document.getElementById('final-score'),finalMessage=document.getElementById('final-message'),progressBar=document.getElementById('progress-bar'),missedSummary=document.getElementById('missed-summary'),retryMissedBtn=document.getElementById('retry-missed-btn'),modeText=document.getElementById('mode-text'),medalText=document.getElementById('medal-text');
function loadQuestion(){answered=false;feedbackContainer.style.display='none';feedbackContainer.className='feedback';feedbackContainer.innerHTML='';nextBtn.style.display='none';const q=questions[currentQuestion],total=questions.length,percent=Math.round((currentQuestion/total)*100);progressText.innerText=`Pregunta ${currentQuestion+1} de ${total}`;progressBar.style.width=`${percent}%`;modeText.innerHTML=retryMode?'<span class="mode-label">Modo repaso: falladas</span>':'Modo completo';questionText.innerText=`${currentQuestion+1}. ${q.q}`;optionsContainer.innerHTML='';q.o.forEach((opt,index)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerText=opt;btn.onclick=()=>selectOption(index,btn);optionsContainer.appendChild(btn);});}
function selectOption(index,btn){if(answered)return;answered=true;const q=questions[currentQuestion],allBtns=optionsContainer.querySelectorAll('.option-btn');allBtns.forEach(b=>b.disabled=true);const correctText=q.o[q.c];if(index===q.c){btn.classList.add('correct');score++;scoreTracker.innerText=`Puntuación: ${score}`;feedbackContainer.classList.add('show','feedback-correct');feedbackContainer.innerHTML=`<strong>Correcto.</strong><span class="solution-label">Por qué es correcto:</span>${q.e}`;}else{btn.classList.add('incorrect');allBtns[q.c].classList.add('correct');if(!missedQuestions.some(item=>item.q===q.q)){missedQuestions.push(q)}feedbackContainer.classList.add('show','feedback-incorrect');feedbackContainer.innerHTML=`<strong>Respuesta equivocada.</strong><br>Has marcado: <b>${q.o[index]}</b><br>La solución correcta es: <b>${correctText}</b><span class="solution-label">Por qué esa es la solución correcta:</span>${q.e}`;}nextBtn.style.display='block';nextBtn.innerText=currentQuestion===questions.length-1?'Ver resultados':'Siguiente pregunta';}
function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){loadQuestion()}else{showResults()}}
function showResults(){quizScreen.style.display='none';resultScreen.style.display='block';progressBar.style.width='100%';const percentage=Math.round((score/questions.length)*100);finalScore.innerHTML=`Has acertado ${score} de ${questions.length} preguntas (${percentage}%)`;if(percentage>=90)medalText.innerText='🏆 Medalla de Oro · Dominio excelente';else if(percentage>=75)medalText.innerText='🥈 Medalla de Plata · Muy buen nivel';else if(percentage>=60)medalText.innerText='🥉 Medalla de Bronce · Base aprobada';else medalText.innerText='📚 Modo refuerzo · Conviene repasar';let message='';if(percentage>=90)message='Brillante. Dominas visión, audición, olfato, gusto y procesamiento sensorial multimodal.';else if(percentage>=70)message='Buen resultado. Repasa las falladas para consolidar transducción visual, auditiva, olfatoria y gustativa.';else message='Conviene repasar receptores sensoriales, vías aferentes, retina, cóclea, bulbo olfatorio y sistema gustativo.';finalMessage.innerText=message;if(missedQuestions.length>0){missedSummary.style.display='block';missedSummary.innerHTML=`<h3>Preguntas falladas: ${missedQuestions.length}</h3><ul>${missedQuestions.map((q,i)=>`<li>${i+1}. ${q.q}</li>`).join('')}</ul>`;retryMissedBtn.style.display='inline-block';}else{missedSummary.style.display='block';missedSummary.innerHTML='<h3>No has fallado ninguna pregunta.</h3><p>Resultado perfecto. No hay preguntas que reintentar.</p>';retryMissedBtn.style.display='none';}}
function retryMissed(){if(missedQuestions.length===0)return;questions=[...missedQuestions];missedQuestions=[];currentQuestion=0;score=0;retryMode=true;scoreTracker.innerText='Puntuación: 0';resultScreen.style.display='none';quizScreen.style.display='block';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
function restartQuiz(){questions=[...originalQuestions];currentQuestion=0;score=0;answered=false;missedQuestions=[];retryMode=false;scoreTracker.innerText='Puntuación: 0';quizScreen.style.display='block';resultScreen.style.display='none';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
loadQuestion();

</script>
