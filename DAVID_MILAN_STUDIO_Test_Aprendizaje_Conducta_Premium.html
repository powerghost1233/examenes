<script>
const originalQuestions=[{"q": "Según el texto, la psicología surgida tras el impacto del evolucionismo concedió la mayor importancia a los procesos de:", "o": ["Reflexión consciente mediante introspección estricta.", "Adaptación de cada organismo a su medio para lograr su automantenimiento.", "Memorización puramente verbal de listados sin sentido."], "c": 1, "e": "\"La psicología surgida tras el impacto del evolucionismo concedió la mayor importancia a los procesos de adaptación de cada organismo a su medio.\""}, {"q": "En el marco de la adaptación, se distinguen dos modos de respuesta. ¿Cómo se denomina a la respuesta estereotipada que se dispara automáticamente y es heredada por la especie?", "o": ["Respuesta instintiva.", "Respuesta condicionada secundaria.", "Respuesta individual por ensayo."], "c": 0, "e": "\"la respuesta estereotipada y específica, que sería la propia de los «instintos» de cada especie... Es señal de que su herencia le da un tipo de reacción definida\"."}, {"q": "Frente al instinto, las especies superiores poseen la capacidad de repetir respuestas que les han sido útiles adquiriendo \"experiencia\". Cuando esta experiencia mejora su adaptación, se dice que han adquirido:", "o": ["Una neurosis.", "Un aprendizaje.", "Un arco reflejo espinal."], "c": 1, "e": "\"adquieren así una «experiencia» que les capacita para responder con más rapidez y eficacia... En tal caso se afirma que los organismos han adquirido un «aprendizaje».\""}, {"q": "Formalmente, ¿cómo define el texto el concepto de \"aprendizaje\"?", "o": ["Aquel cambio en el modo de responder de un organismo que suponemos se debe a las experiencias previas y las huellas dejadas.", "Cualquier alteración orgánica producida exclusivamente por lesiones cerebrales.", "El conocimiento pasivo transmitido únicamente por la herencia genética."], "c": 0, "e": "\"Se entiende por aprendizaje aquel cambio en el modo de responder de un organismo ante una situación, que suponemos que se debe a las experiencias previas... y a las huellas que estas han dejado en él.\""}, {"q": "¿Qué psicólogo mencionado en el texto relacionó estrechamente el aprendizaje con la facultad de \"memoria\" para estudiar su funcionamiento?", "o": ["Ivan Pavlov.", "Ebbinghaus.", "William James."], "c": 1, "e": "\"Ebbinghaus, como ya vimos, relacionó el aprendizaje con la facultad de «memoria» y estudió su funcionamiento.\""}, {"q": "¿Qué destacado psicólogo funcionalista mantuvo \"con toda energía\" que las asociaciones del aprendizaje se trataban de cambios en los procesos nerviosos del cerebro?", "o": ["Charles Sherrington.", "Claude Bernard.", "James (William)."], "c": 2, "e": "\"James mantuvo con toda energía que se trataba de cambios en los procesos nerviosos que tienen lugar en el cerebro.\""}, {"q": "Formulada por Bell (1811) y Magendie (1822), la ley que establece que en la médula espinal las astas posteriores tienen función sensorial y las anteriores función motora se llama:", "o": ["Ley de Bell-Magendie.", "Ley de la energía específica.", "Principio de homeóstasis espinal."], "c": 0, "e": "\"las astas o ramas posteriores de los nervios tienen una función sensorial y las astas anteriores... motora. Esta es la llamada «Ley de Bell-Magendie»\"."}, {"q": "En 1850, Hermann Helmholtz realizó un descubrimiento clave para aceptar que los fenómenos nerviosos son cambios físicos medibles en tiempo y espacio. ¿Qué logró medir?", "o": ["El umbral absoluto de la conciencia.", "La velocidad del impulso nervioso (entre 25 y 40 metros por segundo).", "El tiempo de sueño profundo."], "c": 1, "e": "\"Hermann Helmholtz (1821-1894) midió la velocidad del impulso nervioso en un nervio –entre 25 y 40 metros por segundo–; así quedó definitivamente aceptado que los fenómenos nerviosos son cambios físicos perfectamente medibles\"."}, {"q": "La doctrina que postula que el nervio de cada sentido tiene su peculiar \"energía\" se conoce como la Ley de la energía específica de los sentidos. ¿Quién es su autor?", "o": ["Johannes Müller.", "Paul Broca.", "Eduard Hitzig."], "c": 0, "e": "\"la «Ley de Johannes Müller» (1801-1868) o de «energía específica de los sentidos» (1826)\"."}, {"q": "En el recuadro \"Ley de la energía específica de los sentidos\", se extrae que la sensación es el resultado de conocer ciertas cualidades o condiciones de:", "o": ["Los cuerpos externos directamente sin alterar.", "El alma inmaterial humana.", "Los nervios sensoriales mismos."], "c": 2, "e": "\"conocimiento de ciertas cualidades o condiciones, no de los cuerpos externos, sino de los nervios sensoriales mismos\"."}, {"q": "El médico francés Paul Broca hizo en 1861 un hallazgo fundamental para la historia del cerebro, descubriendo al hacer una autopsia:", "o": ["El centro de la visión en el lóbulo occipital.", "El centro cerebral del lenguaje hablado en el área frontal izquierda.", "La existencia de las sinapsis dendríticas."], "c": 1, "e": "\"Paul Broca... hizo un descubrimiento fundamental: el del centro cerebral del lenguaje hablado... descubrió que se había producido la destrucción de una zona del área frontal izquierda\"."}, {"q": "Siguiendo a Broca, Carl Wernicke (1874) localizó otro centro lingüístico esencial en la zona temporal del cerebro. ¿A qué función estaba destinado?", "o": ["Al centro de comprensión del lenguaje oído.", "Al centro motor de la articulación facial.", "Al control del nervio vago visceral."], "c": 0, "e": "\"Carl Wernicke (1848-1905), quien en 1874 localizó en la zona temporal del cerebro el centro de comprensión del lenguaje oído\"."}, {"q": "Fritsch y Hitzig lograron aislar en 1870 centros cerebrales responsables de la motricidad. Lo descubrieron en el cerebro de un:", "o": ["Mono.", "Perro.", "Ser humano."], "c": 1, "e": "\"Gustav Fritsch... y Eduard Hitzig... descubrieron en 1870 en el cerebro de un perro la zona cuya estimulación producía la contracción de sus patas\"."}, {"q": "¿Qué científico sintetizó ampliamente estos conocimientos neurológicos publicando en 1876 el libro \"Las funciones del cerebro\"?", "o": ["Carl Wernicke.", "Santiago Ramón y Cajal.", "David Ferrier."], "c": 2, "e": "\"David Ferrier sintetizó ampliamente esos conocimientos en su libro Las funciones del cerebro (1876).\""}, {"q": "En 1888, la neurociencia dio un salto de gigante al descubrirse la existencia de las células nerviosas, las neuronas. ¿Quién fue el autor de este hallazgo?", "o": ["Charles Sherrington.", "Santiago Ramón y Cajal.", "Ivan Pavlov."], "c": 1, "e": "\"Ese año Santiago Ramón y Cajal (1852-1934) descubre la existencia de las células nerviosas, las neuronas...\"."}, {"q": "¿Quién mostró en 1905 la importancia de la zona de conexión entre neuronas (sinapsis) y el funcionamiento integrativo del sistema nervioso?", "o": ["Claude Bernard.", "Ivan Sechenov.", "Sir Charles Sherrington."], "c": 2, "e": "\"Sir Charles Sherrington (1859-1952) muestra luego la importancia de la sinapsis... y el funcionamiento «integrativo», unificador, del sistema nervioso (1905).\""}, {"q": "Edward L. Thorndike, investigador norteamericano, comenzó estudiando la capacidad de animales (pollos, gatos) para recorrer un:", "o": ["Círculo y una elipse.", "Laberinto y salir de él.", "Tubo de cristal opaco."], "c": 1, "e": "\"Comenzó investigando la capacidad de algunos animales –pollos, perros, gatos– para aprender a recorrer un laberinto y salir de él\"."}, {"q": "Para el estudio del aprendizaje, Thorndike ideó un aparato específico (problem box) que consistía en:", "o": ["Un metrónomo atado a un dispensador de carne seca.", "Un laberinto de agua electrificado.", "Un cajón con barrotes y una palanca interior que al presionarla abría la puerta para escapar."], "c": 2, "e": "\"Creó a tal fin lo que se ha llamado una caja-problema (problem box), un cajón donde se encierra entre barrotes un animal... con una palanca dentro, que al ser presionada abre la puerta\"."}, {"q": "¿Cuál era el incentivo biológico que Thorndike ponía fuera de la jaula para que el animal experimentara y quisiera salir?", "o": ["Un animal del sexo opuesto.", "Un plato con alimento (estando el animal hambriento).", "Libertad para volver a la naturaleza salvaje."], "c": 1, "e": "\"ideó colocar allí un animal experimental hambriento... capaz de ver fuera de la jaula un plato con alimento y, cuando por azar el animal apretaba la palanca, podía escapar y comer.\""}, {"q": "Al cronometrar el tiempo de permanencia en la caja en las sucesivas sesiones, Thorndike fue capaz de trazar:", "o": ["Una curva de la neurosis.", "Una curva de aprendizaje.", "El arco reflejo incondicionado."], "c": 1, "e": "\"La situación experimental permitía cronometrar el tiempo de estancia en la caja... y, con ello, trazar una curva de aprendizaje relacionando el número de sesiones ejecutadas y el tiempo de permanencia\"."}, {"q": "En su estudio \"Inteligencia animal\" (1898), Thorndike concluyó que sus gatos y perros NO resolvían el problema de modo inteligente racional ni instintivo. ¿Qué método usaban?", "o": ["Un mecanismo puro de intuición y comprensión súbita (insight).", "Un procedimiento de \"ensayo y error\" donde por azar tropezaban con la solución.", "La imitación directa del investigador."], "c": 1, "e": "\"Su conclusión... fue que los animales... no resolvían el problema de modo inteligente y tampoco de modo instintivo. Su procedimiento implicaba un método de «ensayo y error»\"."}, {"q": "¿En qué consiste fundamentalmente el proceso dinámico del \"ensayo y error\" de Thorndike con el paso de las pruebas?", "o": ["El animal va eliminando los movimientos superfluos y concentra su actividad en torno a la palanca.", "El animal abandona el intento por fatiga muscular al tercer día.", "El animal llora hasta que el investigador abre la puerta por compasión."], "c": 0, "e": "\"en las sucesivas pruebas, el animal eliminaba los movimientos superfluos y poco a poco iba concentrando su actividad en torno a la palanca\"."}, {"q": "Desde el punto de vista teórico, Thorndike dedujo que en el sistema nervioso se formaba un enlace entre la percepción de la situación (S) y el origen de las respuestas (R). Esta doctrina se llama:", "o": ["Reflejología cognitiva.", "Asociacionismo platónico.", "Conexionismo."], "c": 2, "e": "\"había una conexión nerviosa entre el centro nervioso que percibía la situación «S» y aquel otro en que se originaban las respuestas «R»... Esta doctrina se ha llamado, por eso, conexionismo.\""}, {"q": "Según Thorndike, en el aprendizaje existe un doble proceso de \"selección\" que varía la probabilidad de las respuestas. ¿En qué consiste?", "o": ["Se inhiben las respuestas incorrectas y se conserva y consolida (refuerza) la correcta.", "Se generaliza el estímulo incondicionado hacia todo el laboratorio.", "El sistema parasimpático agota el metabolismo calórico por completo."], "c": 0, "e": "\"un doble proceso: uno que iba inhibiendo o eliminando las respuestas incorrectas, y otro que iba conservando y consolidando la conexión entre la situación y la respuesta correcta.\""}, {"q": "Al preguntarse por la causa de este refuerzo selectivo de la respuesta correcta, Thorndike postuló que la conexión se fortalecía porque:", "o": ["Esa respuesta requería un menor gasto de energía calórica.", "Iba seguida de un efecto agradable o placentero (ingerir alimento/escapar).", "Estaba programada biológicamente de forma innata."], "c": 1, "e": "\"Sugirió que la conexión entre la respuesta correcta y la situación se fortalecía porque aquella iba seguida de un efecto agradable o placentero –ingerir el alimento que estaba fuera de la jaula–\"."}, {"q": "La ley que afirma que aquellas respuestas que van acompañadas de \"satisfacción\" se conectan más firmemente a la situación, haciéndolas más probables, es:", "o": ["La Ley del Efecto.", "La Ley de Magendie.", "La Ley de Frecuencia."], "c": 0, "e": "\"El efecto –placer o desagrado– producido por la respuesta vendría a influir sobre la conexión... a esta ley se la ha llamado «ley del efecto».\""}, {"q": "Además de la anterior, Thorndike propuso una ley que mantiene que las respuestas \"más repetidas\" se van también consolidando. ¿Cómo se denomina?", "o": ["Ley de irradiación cortical.", "Ley del ejercicio.", "Ley del reflejo asociado."], "c": 1, "e": "\"formuló otra ley, la «ley del ejercicio». Esta mantiene que las respuestas más repetidas se van también consolidando\"."}, {"q": "Una consecuencia teórica revolucionaria de la ley del efecto es admitir que un acontecimiento \"posterior\" a la respuesta influye causalmente \"hacia atrás\" para fortalecer la conexión. Este mecanismo se conoce en cibernética como:", "o": ["Inducción electromagnética.", "Feedback o retroalimentación (causalidad retroactiva).", "Adaptación cruzada."], "c": 1, "e": "\"La ley del efecto puso ante los ojos uno de los primeros casos de feedback, o causalidad retroactiva, de que los organismos... están dotados.\""}, {"q": "Según la Ley del Efecto, ¿qué naturaleza tiene el factor central que causa la formación del aprendizaje, fortaleciendo o inhibiendo conexiones?", "o": ["Una naturaleza meramente lógica y silogística.", "Una naturaleza afectiva, hedónica o motivacional.", "Una naturaleza exclusiva del sistema simpático."], "c": 1, "e": "\"Si este es la satisfacción o la insatisfacción del efecto logrado, eso quiere decir que la adquisición de experiencia... están influidos por un factor afectivo, hedónico, placentero y... «motivacional».\""}, {"q": "A nivel educativo y conductual práctico, la doctrina hedonista del efecto de Thorndike implica que el aprendizaje se moldea mediante:", "o": ["Premios (fortalecen) y castigos (inhiben/eliminan).", "Descansos largos y sueño profundo.", "Asociaciones pasivas sin consecuencia alguna."], "c": 0, "e": "\"el aprendizaje se fortalece y mejora con los «premios», mientras que la eliminación de conductas se consolida mediante el uso de los «castigos». Premios y castigos son... dos tipos de «efectos»\"."}, {"q": "Con el paso de los años, en sus \"últimas consideraciones\", Thorndike matizó la simetría entre premio y castigo, indicando que:", "o": ["El premio y el castigo tienen exactamente la misma potencia para modificar el cerebro a largo plazo.", "El placer consolida, pero el castigo a menudo NO elimina la conexión, solo la inhibe temporalmente mientras existe amenaza.", "El castigo es la única herramienta funcional verdadera de la pedagogía moderna."], "c": 1, "e": "\"llegó con el tiempo a admitir que la influencia del placer y del dolor... no eran simétricos... el castigo, en muchas ocasiones, no elimina la conexión situación-respuesta, sino que inhibe la ejecución\"."}, {"q": "La ley del efecto de Thorndike ha tenido un vasto recorrido en el siglo XX, siendo reelaborada en el seno de la escuela conductista por obra de las investigaciones de:", "o": ["Ebbinghaus.", "William James.", "B. F. Skinner."], "c": 2, "e": "\"La ley del efecto ha tenido una larga carrera... siendo reelaborada por obra de las investigaciones de B. F. Skinner\"."}, {"q": "Ivan Pavlov (1849-1936), investigador que llegó a la psicología casi por azar, recibió el Premio Nobel en 1904. ¿Por qué estudios lo recibió originalmente?", "o": ["Estudios sobre los hemisferios cerebrales y la memoria.", "Estudios sobre la fisiología de la digestión.", "Estudios sobre las células piramidales."], "c": 1, "e": "\"En 1904 recibió el Premio Nobel de medicina por sus estudios sobre la digestión.\""}, {"q": "En la formación del pensamiento mecanicista de Pavlov tuvo gran influencia el libro \"Los reflejos del cerebro\" (1863), escrito por un fisiólogo ruso llamado:", "o": ["Lev Vygotsky.", "Ivan Sechenov.", "Alexander Luria."], "c": 1, "e": "\"la obra de un fisiólogo ruso anterior a él, Ivan Sechenov (1829-1905), autor de una obra particularmente notable Los reflejos del cerebro (1863), que en cierto modo preludia la obra de Pavlov.\""}, {"q": "Sechenov interpretaba el organismo de modo materialista, como un sistema mecánico estable con sistemas reflejos reequilibradores. Este concepto biológico de \"estado igual\" ya lo había determinado Claude Bernard, bajo el nombre de sistema:", "o": ["Epigenético.", "Homeostático.", "Simpático excitable."], "c": 1, "e": "\"un sistema mecánico estable, de tipo homeostático (homoios, igual; stasis, estado), como había ya determinado el fisiólogo Claude Bernard\"."}, {"q": "Frente a la opinión general de los fisiólogos que limitaban los reflejos a la médula y consideraban el cerebro libre, ¿cuál fue la \"herejía\" teórica de Sechenov?", "o": ["Defender que los nervios sensoriales no operaban en el hombre.", "Proclamar que también eran reflejos los mecanismos cerebrales, eliminando la idea de control voluntario y generalizando el determinismo.", "Negar rotundamente la existencia de un cerebro y abogar por una mente pura sin extensión."], "c": 1, "e": "\"Sechenov proclamó, contra la opinión general, que también eran reflejos los mecanismos cerebrales, hasta entonces considerados por los fisiólogos como movimientos de control voluntario y libre.\""}, {"q": "Si la voluntad no existe y todo es reflejo (Sechenov), ¿cómo explicaba la demora temporal que a veces hay entre un estímulo y un comportamiento \"aparentemente voluntario\"?", "o": ["El alma libre actúa como freno en la sinapsis y detiene el estímulo.", "El proceso mediador entre estímulo y respuesta se halla \"reverberando\" o el estímulo está operando encubiertamente en el cerebro.", "Se pierde la señal nerviosa debido al calor metabólico interno del sujeto."], "c": 1, "e": "\"que el proceso mediador... estuviera reverberando, manteniéndose activo sin terminar de responder... o, que hubiera en el organismo algún estímulo operando encubiertamente... En este último caso parecería una respuesta voluntaria\"."}, {"q": "Pavlov adoptó plenamente la doctrina de Sechenov. De hecho, escribió que admiraba el poder de la fisiología que considera al organismo puramente como:", "o": ["Una entidad espiritual libre y creadora.", "Un sistema caótico aleatorio impulsado por humores místicos.", "Una máquina perfecta, sometida a leyes naturales inevitables."], "c": 2, "e": "\"admiraba el poder de una ciencia como la fisiología, «que considera el organismo como una máquina»... sometido como todos a las leyes naturales inevitables\"."}, {"q": "En sus iniciales trabajos gástricos, cuando introducía la comida (estímulo) en la boca del perro para que el gusto ordenara segregar saliva (respuesta innata constante), Pavlov hablaba de un:", "o": ["Condicionamiento retroactivo.", "Reflejo condicionado de orden superior.", "Reflejo «absoluto» (incondicionado)."], "c": 2, "e": "\"un reflejo «absoluto», innato, constante, en el que el alimento (estímulo incondicionado, «EI») desencadena la salivación (respuesta incondicionada, «RI»)\"."}, {"q": "El hallazgo revolucionario que obligó a Pavlov a replantear sus teorías fue advertir que, con el tiempo, los animales salivaban de forma \"adquirida\" ante otra señal, como:", "o": ["El descenso de temperatura nocturno.", "Los pasos del mozo de laboratorio que traía el alimento.", "El sonido del latido del corazón del animal."], "c": 1, "e": "\"los perros ya habituados a esos experimentos segregaban la saliva al oír los pasos del mozo de laboratorio que traía el alimento.\""}, {"q": "Según Pavlov, la salivación ante estímulos como un sonido de pasos (o una campana) es regulada por el cerebro (hemisferios mayores) para procesar una \"señal\". Como este reflejo requiere experiencia, se trata de un:", "o": ["Mecanismo instintivo filogenético invariable.", "Reflejo condicionado.", "Trastorno de neurosis digestiva compulsiva."], "c": 1, "e": "\"Eran «reflejos» («S»-«R») que se procesaban en el cerebro... y que no eran innatos, sino adquiridos o aprendidos... un reflejo que el animal adquiría o aprendía (reflejo condicionado)\"."}, {"q": "En el esquema básico pavloviano, el factor que biológicamente tiene el poder universal de desencadenar la reacción biológica (como la comida para originar salivación), se designa con la sigla:", "o": ["EC (Estímulo Controlado).", "EI (Estímulo Incondicionado).", "EN (Estímulo Neutro)."], "c": 1, "e": "\"alimento (estímulo incondicionado, «EI») desencadena la salivación\"."}, {"q": "El estímulo ambiental sin trascendencia biológica que en principio NO genera ninguna respuesta salival en el animal (como el sonido seco de una campana antes del adiestramiento) se llama:", "o": ["RI (Respuesta Incondicionada).", "EC (Estímulo Confirmador).", "EN (Estímulo Neutro)."], "c": 2, "e": "\"un estímulo neutro, «EN», que no evoca respuesta en el organismo, con aquel «EI», que desencadena siempre la RI.\""}, {"q": "Cuando finalmente el perro logra aprender que la campana precede a la comida y el animal comienza a salivar solo al oír la campana, esa \"saliva\" final producida al sonido se denomina:", "o": ["Reflejo espinal estático.", "Respuesta Condicionada (RC).", "Señal inhibitoria profunda."], "c": 1, "e": "\"El que era «EN», pasa a ser ahora un estímulo condicionado «EC»... y la saliva, que antes era una «RI» al alimento, es ahora una respuesta condicionada «RC».\""}, {"q": "La propia campana, una vez que domina e instiga el comportamiento aprendido de la salivación en el animal, ha perdido su neutralidad y ha pasado a denominarse:", "o": ["Respuesta Incondicionada (RI).", "Reforzador Generalizado Oculto (RGO).", "Estímulo Condicionado (EC)."], "c": 2, "e": "\"El que era «EN», pasa a ser ahora un estímulo condicionado «EC», en nuestro ejemplo, un estímulo controlador de la saliva.\""}, {"q": "Según Pavlov, la utilidad y el inmenso valor biológico-adaptativo de los reflejos condicionados radica en que permiten al organismo:", "o": ["No gastar saliva para poder guardarla orgánicamente.", "Reaccionar a \"señales\" que predicen la llegada del Estímulo Incondicionado, preparando e iniciando la respuesta ajustada \"antes\" de que llegue el evento.", "Olvidar todos sus traumas tempranos suprimiendo los nervios aferentes."], "c": 1, "e": "\"reaccionar a ciertas «señales» (el «EC») que predicen la llegada del «EI»... y que permiten al organismo empezar a responder antes de que el «EI» haya llegado... preparándose para su llegada\"."}, {"q": "Estructuralmente, en la anatomía del sistema biológico, ¿qué estructura subyace a todo acto reflejo para interconectar sensibilidad y movimiento motor?", "o": ["El hipocampo denervado.", "El arco reflejo (neurona sensitiva conectada a motora, con posibles interneuronas).", "El neocórtex asociativo de lenguaje."], "c": 1, "e": "\"En la base de un acto reflejo se halla una estructura anatómica que se denomina arco reflejo. Se trata de una organización neural... contiene una «neurona sensitiva»... conectada a una neurona motora\"."}, {"q": "A nivel procedimental en el laboratorio, la etapa temporal donde se van presentando juntos repetidamente el \"EC\" (campana) y el \"EI\" (comida) hasta lograr el aprendizaje estabilizado, es la fase de:", "o": ["Adquisición.", "Causalidad retroactiva de recuperación.", "Extinción temprana."], "c": 0, "e": "\"Una primera es la de adquisición. En esta se presentan juntos repetidas veces el «EC» y el «EI». Consiguientemente, la «RC» va siendo cada vez más fuerte...\"."}, {"q": "Si por el contrario al animal que aprendió la asociación \"campana -> comida\" se le empieza a tocar la campana múltiples veces (EC) *sin* darle el alimento, ¿qué sucede con la saliva y cómo se llama esta fase?", "o": ["El perro saliva ininterrumpidamente hasta morir; fase catatónica.", "La Respuesta Condicionada disminuye casi hasta desaparecer; fase de Extinción.", "La respuesta se multiplica de modo exponencial; fase de Super-Generalización."], "c": 1, "e": "\"Otra fase es la de extinción. Si se elimina de modo permanente toda aparición del «EI» después del «EC»... la respuesta «RC» disminuye casi hasta desaparecer. Esto representa la «extinción»\"."}, {"q": "Pavlov evidenció un extraño fenómeno. Tras finalizar la extinción, al cabo del tiempo probaban al perro un día más y repentinamente la Respuesta Condicionada (RC) reaparecía brevemente con inmensa fuerza. ¿Qué nombre recibe?", "o": ["Recuperación espontánea.", "Inhibición reactiva.", "Retroalimentación afectiva."], "c": 0, "e": "\"al volver a examinar al animal en una sesión posterior, la «RC» reaparecía con una fuerza muy superior a la que poseía al final de la etapa precedente. Llamó «recuperación espontánea» a este singular fenómeno\"."}, {"q": "Como explicación psicofísica del aprendizaje, Pavlov teorizó que en el encéfalo cerebral conviven atrayéndose y repeliéndose dos grandes y opuestas fuerzas biológicas:", "o": ["Excitación e inhibición nerviosas.", "Memoria a corto plazo y memoria a largo plazo.", "Pensamiento y voluntad abstracta."], "c": 0, "e": "\"Pavlov pensó que en el cerebro había dos fuerzas que allí operan y que son opuestas la una a la otra: la excitación y la inhibición nerviosas.\""}, {"q": "Según Pavlov, la conexión o \"facilitación temporal\" se logra porque la fuerte \"excitación\" incondicionada provocada por la carne produce un efecto físico neurológico sobre el centro receptor del estímulo sonoro (campana). Este efecto físico cerebral consiste en que el centro de la carne:", "o": ["Quema la materia blanca cerebral en el proceso limitando la circulación.", "\"Atrae\" a la del Estímulo Neutro, abriendo una vía temporal de conexión de un punto al otro.", "Extirpa el centro temporal auditivo generando sordera condicional selectiva."], "c": 1, "e": "\"entonces la excitación incondicionada «atrae» a la del «EN» y, al cabo de una serie de pruebas, se termina por abrir una vía de conexión entre esos dos puntos. Como consecuencia... pasará por la vía de aquella conexión...\"."}, {"q": "Como el estímulo de la campana empieza a predecir y sustituir enteramente al efecto de la propia carne a nivel de respuestas orgánicas, este modelo asume que ocurre un proceso general llamado de:", "o": ["Ensayo y error motor.", "Generalización de estímulos absolutos.", "Sustitución de estímulos."], "c": 2, "e": "\"Es un proceso en el que el «EC» ha «sustituido» al «EI», y de este modo se está ya respondiendo al EC como si hubiera llegado el «EI»... un proceso que se ha llamado de sustitución de estímulos.\""}, {"q": "A la hora de emparejar, Pavlov advirtió que no da igual qué estímulo se coloque primero. El condicionamiento es mucho más eficaz, por regla general, cuando:", "o": ["El «EC» (campana) precede de modo breve al «EI» (comida).", "El «EI» (comida) se entrega 5 minutos antes de hacer sonar al «EC».", "Ambos ocurren con exactamente media hora de desajuste temporal de ida y de vuelta."], "c": 0, "e": "\"Las distintas posiciones que puede adoptar el «EC» con respecto al «EI». El condicionamiento es más eficaz cuando el «EC» precede al «EI»\"."}, {"q": "Si a un perro ya condicionado (Campana -> Saliva), le presento ahora de manera previa la luz de una linterna (señal 2), de forma que Luz -> Campana -> Saliva; y al final solo la luz evoca saliva, hemos creado (aunque sea débilmente) un fenómeno llamado:", "o": ["Irradiación inhibitoria profunda.", "Condicionamiento de segundo orden.", "Neurosis experimental transitoria."], "c": 1, "e": "\"Estaríamos en el caso de una señal de otra señal. Desde luego, en tales casos, que se conocen como condicionamiento de segundo orden...\"."}, {"q": "Cuando adiestro al perro para salivar ante un tono agudo (1000 Hz), pero noto que el perro también saliva un poco al escuchar tonos levemente diferentes (1100 Hz, 900 Hz), asisto a un fenómeno de asimilación llamado:", "o": ["Generalización.", "Neurosis experimental paralizante.", "Conexionismo catatónico."], "c": 0, "e": "\"Generalización es el proceso por el que un grupo de estímulos, más o menos similares al estímulo... son capaces de evocar una RC similar, aunque generalmente con menor intensidad.\""}, {"q": "Para evitar que el perro se confunda con estímulos semejantes (discriminarlos), el experimentador presentaba el sonido original acompañado de comida (\"EI\"), mientras que los sonidos parecidos:", "o": ["Los acompañaba con un castigo eléctrico en la cola obligatoriamente.", "Nunca iban acompañados del \"EI\", logrando que su respuesta se inhibiera con el tiempo (Discriminación o diferenciación).", "Eran operados quirúrgicamente del tímpano del animal."], "c": 1, "e": "\"Por el contrario, una diferenciación supone un proceso por el cual se inhibe la respuesta... Eso se logra... mientras que en las mismas sesiones se presenta el otro estímulo... de modo que «nunca» aparezca relacionado con «EI».\""}, {"q": "En uno de los experimentos más famosos, condicionaron positivamente un círculo (salivación) e inhibieron negativamente una elipse. Al modificar la elipse haciéndola cada vez más circular y parecida al primero, el animal sufrió una alteración colosal, conocida mundialmente como:", "o": ["Extinción silente y letárgica.", "Psicopatología esquizoafectiva hereditaria.", "Neurosis experimental."], "c": 2, "e": "\"los animales presentaron una tremenda excitación, mostrándose incapaces de soportar la situación... La reacción emocional y desordenada... hizo pensar en una reacción semejante a la de la «neurosis»... Por eso se ha llamado a este fenómeno neurosis experimental.\""}, {"q": "¿Por qué razón teórica colapsa el cerebro del perro sufriendo esa \"neurosis experimental\" pavloviana?", "o": ["Porque el animal experimentó demasiada hambre (privación biológica letal).", "Porque la excitación y la inhibición cerebrales habrían entrado en un conflicto imposible de superar al no poder discriminar las señales.", "Por falta de oxígeno derivada de la excesiva contención en las correas de laboratorio."], "c": 1, "e": "\"La explicación que se ha dado es que habría llegado un punto en que, en el cerebro... la excitación y la inhibición cerebrales habrían entrado en un conflicto imposible de superar, al no poder ya discriminar\"."}, {"q": "El éxito de explicar emociones desorganizadas mediante los choques entre excitación e inhibición de estímulos pavlovianos permitió abrir en el siglo XX la vía para una ciencia clínica conductual, apoyada por autores como Wolpe y Lindsley. Hablamos de la:", "o": ["Psiquiatría mística freudiana (psicoanálisis).", "Psicopatología experimental.", "Neurología de la lobotomía prefrontal pura."], "c": 1, "e": "\"Se abrió el camino a una posible «psicopatología experimental».\" (Se cita expresamente a Gantt, Lindsley y Wolpe)."}, {"q": "Al aplicar su dinámica biológica de energías cerebrales, Pavlov supuso que durante el sueño en el individuo normal ocurre que:", "o": ["La corteza se apaga térmicamente y deja de bombear sangre.", "El alma viaja fuera de los límites espaciales corpóreos hacia los arquetipos de Jung.", "La fuerza de la inhibición se ha extendido (\"irradiado\") por todo el córtex suprimiendo toda excitación general."], "c": 2, "e": "\"durante el sueño, la segunda [la inhibición] se habrá extendido por el córtex, y de ahí la falta de respuesta que tiene siempre el animal dormido.\""}, {"q": "Del mismo modo, el fenómeno sugestivo de la \"hipnosis\" fue caracterizado como un estado asimilable a:", "o": ["Un sueño parcial en el que sobrevive activo únicamente el foco cerebral de excitación ligado a la orden del hipnotizador.", "Una patología incurable propia de animales débiles e inferiores incapaces de concentrarse.", "Una mentira actoral sin rastro fisiológico medible en la corteza."], "c": 0, "e": "\"En el caso de la hipnosis, junto a una irradiación de la inhibición... se daría también un mantenimiento activo del foco cerebral... correspondiente a la orden del hipnotizador... caso de un sueño parcial\"."}, {"q": "Cuando los sujetos giran la cabeza y tensan los sentidos ante un ruido imprevisto o cualquier estímulo que resulta \"nuevo\", Pavlov indicó que estábamos presenciando:", "o": ["Un condicionamiento retroactivo diferido.", "El reflejo de orientación.", "La neurosis experimental inhibitoria."], "c": 1, "e": "\"estudió un cierto «reflejo», que llamó reflejo de orientación. Este representa una respuesta que se activa no ante un estímulo determinado... sino ante un estímulo «nuevo»\"."}, {"q": "Este \"reflejo de orientación\" guarda una profunda y capital correlación base con qué función cognitiva básica del psiquismo:", "o": ["La memoria episódica a largo plazo.", "La atención.", "La creatividad divergente."], "c": 1, "e": "\"Semejante respuesta estaría directamente relacionada con el fenómeno de la «atención», base de los procesos cognitivos. La atención prepara al organismo para captar mejor...\"."}, {"q": "En la fascinante teoría pavloviana del comportamiento inteligente humano, se afirma que los estímulos básicos o ECs concretos del entorno natural constituyen para el sujeto un:", "o": ["Primer sistema de señales.", "Logogén semántico silente.", "Sistema parasimpático puro abstracto."], "c": 0, "e": "\"Consideró que, en general, todos los «EC»... son «signos» que integrarían un «primer sistema de señales». Estas señalarían a los «EI»\"."}, {"q": "A partir del anterior \"primer sistema\", la biología nos permite usar las palabras. ¿Cómo conceptualizó Pavlov nuestro lenguaje humano articulado hablado?", "o": ["Como un segundo sistema de señales.", "Como una tara biológica en el ensayo y error de animales ciegos.", "Como pura fantasía mística y no como hecho orgánico cortical empírico."], "c": 0, "e": "\"denominó entonces al lenguaje humano como «segundo sistema de señales». Este estaría formado por señales, las palabras, mediante las cuales el hombre puede referirse a cualidades\"."}, {"q": "Según esta teoría pavloviana del lenguaje, ¿por qué constituye un \"segundo\" nivel el lenguaje?", "o": ["Porque las palabras aparecen históricamente cronológicamente en segundo lugar evolutivo tras nacer en la pubertad.", "Porque solo operan si el experimentador da dos campanadas breves.", "Porque las palabras generalizan unificando (son \"señales de señales\") al referirse indirectamente a los datos sensoriales y visuales de las primeras señales."], "c": 2, "e": "\"las palabras se refieren a una gran variedad de estímulos, es decir, son señales «generales» que se refieren a las señales del primer sistema... estamos empleando «señales de señales»\"."}, {"q": "Constatando la gran variedad comportamental de perros experimentales a su cargo, el laboratorio de Pavlov formuló una tipología biológica de reactividad de los sujetos. Esta tipología pavloviana retomaba en última instancia los esquemas de:", "o": ["La astrología de Mesopotamia (Babilonia).", "La vieja clasificación de los médicos griegos hipocráticos (sanguíneos, melancólicos...).", "Los fenotipos darwinianos puros (pinzones picofinos, picogordos...)."], "c": 1, "e": "\"Su sistema vino a retomar la vieja clasificación de los médicos griegos hipocráticos... los animales podrían ser «coléricos», «flemáticos», «melancólicos» o «sanguíneos».\""}, {"q": "Para fundamentar biológicamente esta tipología (y no humores), Pavlov y su equipo propusieron tres factores o propiedades neurofisiológicas del cerebro para definirlos. ¿Cuáles son?", "o": ["Peso del cerebro, color de las venas y cantidad del pulso arterial.", "Fuerza del sistema nervioso, su equilibrio orgánico entre excitación/inhibición y su labilidad (facilidad de alternancia).", "Inclinación corporal a huir, luchar o paralizarse ciegamente ante el experimentador."], "c": 1, "e": "\"Para determinar esos distintos tipos tuvo en cuenta lo que llamó fuerza del sistema nervioso... el equilibrio en el cerebro entre esas dos fuerzas y su labilidad o facilidad mayor o menor para pasar...\"."}, {"q": "Pese a haber dado a luz uno de los modelos psicológicos más formidables, ¿cuál era la consideración que el propio Pavlov se profesaba en vida sobre su campo?", "o": ["Nunca quiso ser tenido por psicólogo; mantenía su estatus biológico de fisiólogo puramente mecanicista y estudioso de la \"actividad nerviosa superior\".", "Se autoproclamó presidente en el exilio de la Asociación Americana de Psicoanálisis Filosófico.", "Afirmaba en todos sus manuales ser el único e indiscutible creador purista del neoconductismo social y rechazar a fisiólogos médicos como Ramón y Cajal por ignorantes."], "c": 0, "e": "\"Curiosamente, nunca quiso ser tenido por psicólogo. Mantuvo con toda energía su condición de fisiólogo y su campo de investigación consideró que lo formaba lo que llamó la «actividad nerviosa superior», no la mente...\"."}, {"q": "A fines del siglo XX, investigadores como el norteamericano Robert A. Rescorla propusieron reelaborar la interpretación mecanicista estricta. ¿Qué elemento postuló Rescorla como la verdadera \"clave\" en el condicionamiento?", "o": ["La simple contigüidad ciega emparejada de dos estímulos unidos por repetición.", "La fuerza o el \"valor predictivo\" con el que el Estímulo Condicionado es capaz de pronosticar que va a llegar el Incondicionado.", "La repetición en series de mil elementos antes de ofrecer un minúsculo descanso."], "c": 1, "e": "\"Rescorla llegó al convencimiento de que la clave del proceso no radicaba en la contigüidad o emparejamiento... lo que importa... es la fuerza, mayor o menor, con que el «EC» «predice» la aparición del «EI»\"."}, {"q": "Al asumir que un estímulo es válido por ser \"informativo\" y predictivo (procesando la asociación de expectativas y relaciones múltiples previas), la óptica de Rescorla pavimentó la vía histórica a una interpretación del condicionamiento de corte:", "o": ["Materialista-Reduccionista extrema y ortomolecular.", "Cognitiva.", "Positivista sociológica marxista del comportamiento agrario estricto."], "c": 1, "e": "\"Al suponer que es esencial en el «EC» su valor predictivo... se está abriendo el camino a una interpretación cognitiva del condicionamiento clásico.\""}, {"q": "Para Rescorla, ¿es correcto afirmar que el condicionamiento es el lazo simplista inalterable entre dos únicos estímulos en el cerebro (A y B)?", "o": ["No, porque postula que intervienen e influyen variables como familiaridad previas formándose lazos o representaciones de acontecimientos \"múltiples\".", "Sí, en 1988 demostró sin rastro de fisura que Pavlov siempre había poseído el 100% de la razón asociacionista reduccionista de dos puntos limitados.", "Sí, y en el ensayo y error Thorndike también propugnó exactamente eso."], "c": 0, "e": "\"tampoco parece correcta la idea de que se trata tan solo de la asociación entre un «EC» y un «EI»... porque «las asociaciones se forman entre representaciones de acontecimientos múltiples» (Rescorla, 1988)... variables, como la complejidad o la familiaridad... tienen influencia\"."}, {"q": "Clásicamente se solía creer (por Pavlov) que la Respuesta Condicionada (saliva) era idéntica a la Incondicionada original de la comida. Rescorla demostró con roedores usando shocks eléctricos dolorosos que a menudo ambas respuestas en el sujeto eran:", "o": ["Perfectamente idénticas matemáticamente al milímetro con variaciones nulas y despreciables empíricamente en laboratorio de campo abierto.", "Totalmente indistinguibles entre sí de un individuo al siguiente.", "Diferentes u opuestas (ej: la descarga EI generaba salto activo en ratas; pero el tono EC reducía y paralizaba fuertemente la actividad ratonil)."], "c": 2, "e": "\"evidenciado que esas respuestas, «RI», «RC», pueden ser diferentes. Incluso en algún caso... el shock como «EI», se produce un aumento de actividad... mientras que la aparición del «EC» (tono)... reduce muy fuertemente su actividad\"."}, {"q": "Según la sección \"Conceptos Básicos\", se considera un cambio en la conducta producido por \"aprendizaje\" de una experiencia, \"EXCEPTO\" cuando el cambio en la respuesta del animal ha estado originado debido a:", "o": ["Adquisición de información semántica en laboratorio con un operario.", "Adaptación con valor negativo o perjudicial para el individuo.", "Un caso de fatiga extrema, intoxicación o alteración de deterioro biológico-orgánico."], "c": 2, "e": "\"Aprendizaje. Cambio relativamente permanente de la conducta... que no se debe a fatiga, ni alteración o deterioro orgánico, sino que aparece como proceso que depende de la experiencia\"."}, {"q": "¿A qué otro término del bloque de Conceptos Básicos se le describe explícitamente como \"un proceso determinante de causalidad retroactiva en el que los resultados influyen y modulan las condiciones de encendido/operativas\" (ej: calefacción / termostato)?", "o": ["Reflejo condicionado pavloviano transitorio puro.", "Feedback o retroalimentación.", "Extinción secundaria diferida."], "c": 1, "e": "\"Feedback. Es un proceso determinante en una serie causal, en el que los resultados del proceso causal son reintroducidos en el mecanismo operativo, y modula o influye modificando las condiciones... Por ejemplo, el termostato\"."}, {"q": "Según \"Conceptos Básicos\", al proceso que conlleva a la supresión y eliminación conductual de una respuesta previamente lograda por faltar en el entorno aquellas circunstancias primordiales que reforzaban la conexión original, se le nombra:", "o": ["Extinción.", "Catarsis instintiva temporal pura.", "Adquisición general."], "c": 0, "e": "\"Extinción. La extinción de un aprendizaje es un proceso contrario al de adquisición... representa aquel cambio que entraña la supresión de una respuesta aprendida, en la medida en que faltan ya aquellas circunstancias que condicionaban o influían\"."}, {"q": "Según la sección de \"Actividades de autocomprobación\", ¿cuáles son los caracteres genéticos y definitorios principales del instinto natural en las bestias en un entorno salvaje?", "o": ["Su capacidad ilimitada plástica de moldear un ensayo de inteligencia abstracto.", "Ser una respuesta de origen heredado biológicamente en toda la especie (específica) y que se dispara de forma estereotipada, teniendo normalmente un fin de utilidad biológico.", "Poder condicionarse instantáneamente y erradicarse permanentemente si se emplea el segundo sistema de señales en un perro sin que la genética se resista."], "c": 1, "e": "\"Solución 1: Es una respuesta estereotipada, propia de los individuos de una especie... Su origen es hereditario y es, normalmente, una respuesta con utilidad o valor biológico (es teleológica).\""}, {"q": "(Autocomprobación) ¿Cuál es la diferencia fundamental estipulada en el manual que separa a la \"ley del efecto\" de la \"ley del ejercicio\" formuladas por Edward Thorndike para su uso teórico?", "o": ["La primera depende del número de repeticiones sin descanso de la actividad neurológica de fatiga, y la segunda de las consecuencias (castigos) genéticos.", "Ambas significan absolutamente lo mismo formuladas para animales diferentes.", "La ley del efecto atañe a las consecuencias que de ella se siguen (placer o desagrado tras hacer la acción); la ley del ejercicio vincula el fortalecimiento a la mera frecuencia o número repetitivo al ejecutar dicha acción en el tiempo."], "c": 2, "e": "\"Solución 2: ...la del efecto está relacionada con las consecuencias positivas o negativas que tiene una cierta conducta... la del ejercicio depende del número de veces que el organismo ha realizado una cierta respuesta\"."}, {"q": "(Autocomprobación) A diferencia de un reflejo de carácter \"condicionado\" adquirido (que necesita formarse al asociarse), el reflejo original \"incondicionado o absoluto\" posee la singular característica de:", "o": ["Aparecer exclusivamente tras mil iteraciones seguidas en sujetos extenuados en la caja problema de ensayo de inteligencia canino de Yale de 1898.", "Desarrollarse únicamente a nivel cognitivo con herramientas y estímulos lingüísticos verbalizados a modo de lenguaje articulado en la adolescencia tardía del ser.", "Surgir de forma completamente innata porque la organización de los instintos biológicos predeterminada heredada (hardware) de todo el organismo desencadena siempre de modo automático, inexorable e inevitable de por vida, el arco respuesta ante el contacto natural específico."], "c": 2, "e": "\"Solución 3: El reflejo absoluto es aquel en el que la respuesta sigue siempre al estímulo que lo desencadena. La organización biológica heredada por el organismo es responsable... No es adquirido, sino «heredado»... El reflejo absoluto es innato; el reflejo condicionado es aprendido.\""}];
let questions=[...originalQuestions],current=0,score=0,missed=[],retryMode=false;

function loadQuestion(){
let q=questions[current];
document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='Aprendizaje de la Conducta: adaptación, psicofisiología, Thorndike, Pavlov, condicionamiento clásico, reflejos y Rescorla.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}
loadQuestion();
</script>
