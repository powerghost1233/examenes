<script>
const originalQuestions=[{"q": "La psicología iniciada por Wundt y James en el siglo XIX pretendía aclarar fundamentalmente el sentido y funcionamiento de:", "o": ["Los reflejos medulares espinales.", "La conciencia humana.", "El inconsciente colectivo."], "c": 1, "e": "\"La psicología iniciada por Wundt, James y otros autores del siglo XIX pretendía aclarar el sentido y funcionamiento de la conciencia humana\"."}, {"q": "Frente a la psicología de la conciencia, el conductismo decidió concentrar todos los esfuerzos empíricos en:", "o": ["La instrospección de la mente.", "El análisis científico del comportamiento o conducta.", "La medición de humores gástricos puramente químicos."], "c": 1, "e": "\"El conductismo... decidió abandonar el estudio de la conciencia, para concentrar todos los esfuerzos en el análisis científico del comportamiento o conducta\"."}, {"q": "¿Qué destacado psicobiólogo denominó al surgimiento del conductismo como «la revolución americana»?", "o": ["John B. Watson.", "Clark L. Hull.", "Donald Hebb."], "c": 2, "e": "\"Ese cambio ha sido visto por muchos autores como una «revolución»; el psicobiólogo Donald Hebb lo llamó en cierta ocasión «la revolución americana»\"."}, {"q": "El origen del término \"behaviorista\" o \"behaviorismo\" procede de la palabra inglesa \"behavior\", que significa:", "o": ["Estímulo antecedente.", "Conducta o comportamiento.", "Caja negra."], "c": 1, "e": "\"Behaviorista procede del término inglés behavior, que significa «conducta» o «comportamiento».\""}, {"q": "Según el texto, la evolución del conductismo presenta al menos tres periodos diferentes. ¿Cómo se denomina al periodo que abarca de 1925 a 1940 (con autores como Tolman y Hull)?", "o": ["Conductismo inicial.", "Neoconductismo.", "Neoneoconductismo."], "c": 1, "e": "\"El neoconductismo, de Edward C. Tolman, Clark Leonard Hull y otros; 1925-1940.\""}, {"q": "El iniciador y fundador del movimiento conductista, quien publicó en 1913 un artículo que sirvió de verdadero manifiesto a favor del estudio de la conducta, fue:", "o": ["Edward B. Titchener.", "Burrhus F. Skinner.", "John B. Watson."], "c": 2, "e": "\"El iniciador del movimiento fue el investigador americano John B. Watson... En 1913 publicó un artículo que fue un verdadero manifiesto\"."}, {"q": "En 1925, Watson publicó la síntesis sistemática de su pensamiento en un libro titulado:", "o": ["Walden Dos.", "El conductismo.", "Conducta verbal."], "c": 1, "e": "\"Ofreció una visión sistemática de su doctrina en su libro El conductismo (1925), síntesis de su pensamiento.\""}, {"q": "El conductismo watsoniano define formalmente la \"conducta\" como:", "o": ["El proceso privado de razonamiento interno de la voluntad.", "La actividad del organismo mediante la cual se relaciona y controla su medio ambiente, siendo una actividad adaptativa.", "El instinto ciego animal sin ninguna influencia externa."], "c": 1, "e": "\"Entiende por conducta la actividad del organismo mediante la cual se relaciona y controla su medio ambiente. Es una actividad adaptativa...\"."}, {"q": "¿Cómo define Watson al \"estímulo\" («S») en la formulación de la conducta?", "o": ["Un cambio energético en el medio (externo o interno) resultado de procesos materiales, físicos o químicos que afecta a los receptores.", "Una secreción glandular voluntaria.", "Una representación cognitiva en la memoria a largo plazo."], "c": 0, "e": "\"Estímulo, «S», es un cambio energético en el medio –externo o interno– en que el organismo está situado. Afecta a los receptores sensoriales...\"."}, {"q": "De acuerdo con el determinismo de Watson, el organismo es concebido como:", "o": ["Un ser libre y autodeterminado por su alma.", "Una máquina, donde toda respuesta «R» presupone un estímulo anterior «S».", "Un campo de energía gestáltica flotante."], "c": 1, "e": "\"El organismo es concebido como una máquina. Toda respuesta, «R», presupone un estímulo anterior, «S».\""}, {"q": "El \"conductismo radical\" (a diferencia del meramente metodológico) sostiene frente a la \"conciencia\" humana que:", "o": ["Sí existe una realidad consciente, pero no puede estudiarse en el laboratorio.", "Se negará que haya una «realidad» que sea la pretendida conciencia como tal, admitiéndose solo respuestas ante situaciones.", "La conciencia es el único campo de estudio del conductismo avanzado."], "c": 1, "e": "\"En el segundo [conductismo radical], se negará que haya una «realidad» que sea la pretendida conciencia como tal, admitiéndose solo distintos tipos de respuesta...\"."}, {"q": "Al estudiar los tipos de respuesta, Watson diferenció fundamentalmente cuatro tipos, cruzando si eran innatas/aprendidas y si eran:", "o": ["Conscientes o Inconscientes.", "Voluntarias o Reflejas.", "Explícitas (manifiestas) o Implícitas (encubiertas/difíciles de detectar)."], "c": 2, "e": "\"una respuesta puede ser de dos tipos: «innata» (heredada), o «adquirida» (aprendida). Además... puede tratarse de una respuesta «explícita» (o manifiesta), o «implícita» (encubierta...)\"."}, {"q": "Dentro del campo de las respuestas innatas, Watson situó tres \"emociones\" básicas. ¿Cuáles son?", "o": ["Alegría, tristeza y asco.", "Amor, temor e ira.", "Sorpresa, desprecio y vergüenza."], "c": 1, "e": "\"En el campo de las respuestas innatas, situó las «emociones» básicas, que eran en un principio tres: amor, temor e ira.\""}, {"q": "Según el esquema de Watson, ¿cuál es el estímulo natural innato que desencadena la respuesta emocional de \"ira\" en un bebé?", "o": ["La pérdida de sustentación (que lo dejen caer).", "La caricia física.", "La prensión que aprisiona y limita sus movimientos."], "c": 2, "e": "\"La ira, [responde] a la prensión que aprisiona y limita los movimientos.\""}, {"q": "Para Watson, las reacciones emocionales viscerales no verbalizables y difíciles de explicar con palabras para el sujeto constituían en realidad:", "o": ["Un error de medición biológica.", "El verdadero campo del inconsciente humano (en lugar del que defendía el psicoanálisis).", "El mapa cognitivo latente."], "c": 1, "e": "\"Watson pensó que tales reacciones no verbalizables constituían el verdadero campo del inconsciente, en lugar de aquel otro que defiende el psicoanálisis.\""}, {"q": "Las respuestas adquiridas (el aprendizaje) en la teoría de Watson estaban formadas fundamentalmente por los reflejos condicionados de Pavlov y por:", "o": ["El discernimiento gestáltico (insight).", "Los hábitos formados por repetición.", "La sublimación freudiana."], "c": 1, "e": "\"El mundo de las respuestas adquiridas... está formado fundamentalmente por las «respuestas condicionadas»... y los «hábitos» formados por repetición.\""}, {"q": "¿Aceptó Watson la \"ley del efecto\" propuesta por Thorndike (la idea de que la satisfacción o refuerzo influye en la conexión)?", "o": ["Sí, la consideraba la piedra angular de su sistema.", "No, rechazó la idea de que los refuerzos pudieran reobrar e influir sobre la conexión «S»-«R».", "Sí, pero solo para aplicarla al lenguaje."], "c": 1, "e": "\"Watson no admitió la idea de que los refuerzos... pudieran reobrar e influir sobre la conexión «S»-«R»... Rechazó, así, la «ley del efecto» de Thorndike.\""}, {"q": "Watson distinguía tres tipos de hábitos aprendidos: los motores, los viscerales (emocionales) y un tercer grupo que explicaba el lenguaje y el pensamiento. ¿Cómo llamó a estos últimos?", "o": ["Hábitos de engrama central.", "Hábitos corticales.", "Hábitos laríngeos."], "c": 2, "e": "\"y los «laríngeos» –que explicarían el lenguaje y el pensamiento–, como ahora veremos.\""}, {"q": "Al carecer de mente y representaciones abstractas conscientes, Watson propuso que el \"pensar\" no es más que:", "o": ["Un espejismo místico indetectable por la ciencia.", "Manejar de manera encubierta (con los labios cerrados) el lenguaje o movimientos laríngeos silenciosos.", "Un impulso eléctrico del cerebelo hacia la médula espinal pura."], "c": 1, "e": "\"Watson piensa que, cuando se hacen estos movimientos con los labios cerrados, entonces tendríamos el «pensar», porque estaríamos manejando de una manera encubierta... aquellos signos\"."}, {"q": "La afirmación \"Man is built, not born\" (\"el hombre no nace, se hace\") refleja la concepción watsoniana de que la personalidad es:", "o": ["Exclusivamente dictada por la raza y la genética de los padres biológicos.", "Una estructura astrológica invariable.", "Un sistema de respuestas aprendido, formado en cada individuo por el ambiente mediante condicionamiento."], "c": 2, "e": "\"Man is built, not born... vino a ser una de sus máximas características. Mediante aprendizaje, principalmente mediante condicionamiento, se forma en cada individuo el sistema de respuestas propio, que constituye su personalidad. La personalidad será, por tanto, aprendida.\""}, {"q": "En uno de los experimentos más célebres de la psicopatología conductista, Watson creó experimentalmente una fobia condicionando aversivamente a:", "o": ["Un mono Rhesus (caso \"Little Peter\").", "Un bebé de nueve meses (el caso del niño Albert) frente a un conejo blanco.", "Una rata de laboratorio frente a una luz roja."], "c": 1, "e": "\"presentó el caso de un bebé de nueve meses, Albert, cuyas reacciones emocionales pudo modificar... Luego lo condicionó aversivamente a un conejo blanco\"."}, {"q": "En el caso de Albert, el ruido fuerte a su espalda actuaba en el condicionamiento como:", "o": ["Un Estímulo Neutro (EN).", "Un Estímulo Incondicionado (EI) que producía temor natural.", "Una Variable Interviniente cognitiva (VI)."], "c": 1, "e": "\"hacía sonar un ruido fuerte a su espalda («EI», que producía una respuesta de temor, con lloros y huida)\"."}, {"q": "En el experimento de Albert, el niño no solo lloró ante el conejo blanco, sino que empezó a huir de otros animales parecidos y hasta de toallas blancas. A este proceso se le denomina:", "o": ["Extinción.", "Discriminación selectiva.", "Generalización."], "c": 2, "e": "\"Además, por un proceso de generalización, enseguida huyó de otros animales parecidos, y hasta de pieles o toallas blancas.\""}, {"q": "Años después (1924), una discípula de Watson llamada Mary Cover Jones realizó con éxito la tarea inversa (descondicionar una fobia a las ratas y conejos) en un niño de tres años llamado Peter. ¿Qué método usó?", "o": ["Le explicó racionalmente que el conejo no muerde hasta convencerlo cognitivamente.", "Le presentaba el conejo (aversivo) al tiempo que el niño tomaba la comida (estímulo reforzador satisfactorio), acercando la jaula poco a poco en sucesivas sesiones.", "Usó terapia de electroshock para borrar la memoria de Peter."], "c": 1, "e": "\"pudo ser curado y «descondicionado» presentándole un conejo en una jaula al tiempo que tomaba la comida de mediodía. El conejo era... aversivo, pero el alimento era un estímulo reforzador... Poco a poco... le fueron aproximado la jaula\"."}, {"q": "El periodo conocido como \"neoconductismo\" (1925-1940) se caracterizó por estar profundamente influido teóricamente tras la publicación del libro de qué gran investigador ruso:", "o": ["Lev Vygotsky.", "Ivan Pavlov (Los reflejos condicionados, 1929).", "Vladimir Bekhterev."], "c": 1, "e": "\"Todos ellos [los neoconductistas] iban a tener un conocimiento mucho más detallado y completo del condicionamiento clásico, tras publicarse el libro de Pavlov, Los reflejos condicionados (Pavlov, 1929).\""}, {"q": "¿Qué otro movimiento alemán forzó a los neoconductistas a tener en cuenta sus hallazgos en la década de 1930 mediante autores como Köhler y Koffka?", "o": ["La frenología de Gall.", "El estructuralismo de Titchener.", "La Escuela de la Gestalt."], "c": 2, "e": "\"Además, también es importante la huella de los trabajos de los psicólogos alemanes de la Escuela de la Gestalt... forzaron a los investigadores, incluidos los conductistas, a tener en cuenta sus puntos de vista\"."}, {"q": "Para explicar la conducta compleja, los neoconductistas encontraron necesario incluir (junto al S y la R) un tercer tipo de entidades que mediarían entre las observables, abriendo la puerta al concepto de mente. ¿Cómo las llamaron?", "o": ["Pulsiones espirituales.", "Variables intervinientes o constructos hipotéticos.", "Arcos reflejos puros."], "c": 1, "e": "\"encontraron necesario incluir, junto a las variables de estímulos y respuestas, un tercer tipo de variables, usualmente llamadas «variables intervinientes» o «constructos hipotéticos», que mediarían o intermediarían entre las otras dos observables\"."}, {"q": "A diferencia de Watson (que veía la conducta como meras contracciones musculares \"moleculares\"), los neoconductistas propusieron estudiar actos de relación adaptativa entre organismo y medio, prefiriendo un nivel de análisis:", "o": ["General o global, denominado concepción \"molar\".", "Subatómico biológico.", "Extremadamente microscópico."], "c": 0, "e": "\"la conceptuación watsoniana, más fisiológica, fue considerada en exceso «molecular», o «microscópica», mientras que ahora se vino a preferir un nivel más general o global de fenómenos, esto es, una concepción «molar» de los mismos.\""}, {"q": "El gran neoconductista Clark L. Hull (Universidad de Yale) puso todo su empeño en construir su teoría psicológica de manera fuertemente matematizada, siguiendo un modelo:", "o": ["Introspectivo literario y filosófico libre.", "Deductivo, con postulados, axiomas y corolarios, al «modo geométrico» de Spinoza.", "Exclusivamente hermenéutico-descriptivo."], "c": 1, "e": "\"Puso todo su empeño en construir su teoría psicológica en forma deductiva, con postulados, axiomas y corolarios, al «modo geométrico» como está organizada la Ética de Spinoza.\""}, {"q": "En la teoría de Hull, en caso de aprendizaje, el organismo emite una \"familia\" de respuestas y selecciona la más satisfactoria, consolidándola e inhibiendo las demás. Esta asunción indica que Hull (a diferencia de Watson):", "o": ["No creía en el condicionamiento.", "Recoge y admite de nuevo la «ley del efecto» formulada por Thorndike.", "Pensaba que todas las respuestas de una familia son instintos fijos."], "c": 1, "e": "\"Esta será «reforzada», mientras que las demás se van inhibiendo, eliminando. Aquí se recoge y se admite de nuevo la «ley del efecto» que ya conocemos, y que formulara Thorndike.\""}, {"q": "Según el teorema matemático central de la conducta de Hull (E = H × D × K), la letra «E» designa:", "o": ["El error aleatorio ambiental.", "La emoción básica innata.", "La energía o potencial excitatorio para vencer la resistencia a la respuesta."], "c": 2, "e": "\"hará falta que tenga una cierta intensidad, o «potencial excitatorio», «E». Esa fuerza es necesaria para vencer la inercia o resistencia al movimiento...\"."}, {"q": "En la ecuación de Hull (E = H × D × K), la variable «D» (drive) hace referencia a:", "o": ["La dirección del viento en el laberinto.", "La intensidad de la necesidad que experimenta el organismo (el impulso).", "El determinismo genético fijo de la especie."], "c": 1, "e": "\"Con la intensidad de la necesidad que experimenta el organismo, y que genera un impulso al que llama «D» (drive).\""}, {"q": "En la ecuación de Hull (E = H × D × K), la variable «H» representa:", "o": ["El hambre biológica del sujeto de estudio.", "La mayor o menor consolidación del hábito aprendido (conexión S-R).", "El hemisferio cerebral dominante en la tarea."], "c": 1, "e": "\"Con la mayor o menor consolidación del hábito aprendido de que se trate (lo designa como «H», o conexión adquirida «S»-«R»)\"."}, {"q": "En la ecuación de Hull (E = H × D × K), la variable «K» corresponde a:", "o": ["El valor del premio o refuerzo (incentivo) que el organismo espera recibir.", "Una constante cinética gravitacional.", "El Karma acumulado por los antepasados del animal."], "c": 0, "e": "\"También influye el valor del premio o refuerzo (incentivo), que el organismo espera recibir al realizar la respuesta. Lo designa con la letra «K».\""}, {"q": "De acuerdo a la fórmula matemática de Hull, ¿qué ocurre con el potencial excitatorio (E) si, por ejemplo, el animal no tiene ningún impulso (D=0)?", "o": ["Se multiplica al infinito y el animal actúa frenéticamente.", "No habrá respuesta, puesto que si una de las variables es cero, el producto da cero.", "La respuesta se vuelve totalmente innata."], "c": 1, "e": "\"Y, por supuesto, si una de esas variables es igual a cero, no habrá respuesta.\""}, {"q": "Para explicar sin salir del conductismo el hecho de que un animal corra más rápido al acercarse a una meta apetecible (como si tuviera una representación mental del \"propósito\"), Hull postuló que se trataba de:", "o": ["Un alma mística insertada en los roedores.", "Un pequeño núcleo S-R o \"fracción de la conducta a realizar en la meta\" que se anticipa e independiza del resto por condicionamiento.", "Una alucinación óptica en la retina."], "c": 1, "e": "\"supuso que habría un pequeño núcleo «S»-«R», que sería una fracción de la conducta a realizar en la meta... que podría llegar a hallarse en el organismo antes de que este iniciara el movimiento. Así cumpliría con su papel de «propósito»\"."}, {"q": "En su clásico experimento de 1920 sobre \"formación de conceptos\", Hull presentó a los sujetos series de pictogramas chinos. ¿Cuál era el objetivo final de la tarea de aprendizaje para el sujeto?", "o": ["Traducir literalmente poesía china antigua mediante la gramática generativa.", "Aprender a asociar correctamente un sonido (sílaba) común a todos los caracteres (pictogramas) que compartían un mismo trazo radical o \"concepto\" subyacente.", "Memorizar la fecha exacta de invención de cada pictograma."], "c": 1, "e": "\"Nombraba cada «familia» con una cierta sílaba (que se correspondería con los trazos básicos... y luego trataba de que los sujetos llegaran a asociar correctamente esa sílaba con todos los pictogramas de la misma familia.\""}, {"q": "El experimento de Hull de los caracteres chinos evidenció que los sujetos podían abstraer los trazos comunes (\"formar un concepto\"):", "o": ["Únicamente si leían un manual de instrucciones gramaticales conscientes primero.", "Mediante ensayo y error con refuerzos, sin que los sujetos tuvieran ninguna información consciente de la tarea que iban realizando.", "De manera innata sin entrenamiento de ninguna clase."], "c": 1, "e": "\"Hull trató de mostrar que se podía formar un concepto mediante un aprendizaje de ensayo y error, utilizando unos refuerzos, y sin que los sujetos tuvieran ninguna información consciente de la tarea que iban realizando.\""}, {"q": "El neoconductista Edward C. Tolman (Universidad de California en Berkeley) ha pasado a la historia por defender y desarrollar un:", "o": ["Conductismo radical molecular puro.", "Conductismo propositivo (o conductismo cognitivo).", "Psicoanálisis conductual existencialista."], "c": 1, "e": "\"Edward C. Tolman... defensor de lo que se ha llamado un «conductismo propositivo»... argumentando a favor de un cierto «conductismo cognitivo».\""}, {"q": "Tolman amplió la teoría asociativa. Además de enlaces S-R, defendía que los animales pueden aprender asociaciones Estímulo-Estímulo (S-S), llamadas también relaciones de \"signo-objeto\". ¿En qué consisten?", "o": ["En pulsar ciegamente palancas en una caja oscura.", "En que un elemento perceptivo (olor, color) nos hace captar e inferir la totalidad del objeto al que va ligado.", "En segregar saliva al ver un triángulo y detenerla al ver un cuadrado invariable."], "c": 1, "e": "\"conexiones estímulo-estímulo «S»-«S»... relaciones que llamó de «signo-objeto». En esos casos, un elemento (signo) –un olor, color, forma, etc.– nos hace captar la totalidad del objeto.\""}, {"q": "Asimismo, Tolman propuso aprendizajes complejos S-R-S (estímulo-respuesta-estímulo), en los que el sujeto asocia la ruta, la respuesta y la meta a conseguir. ¿Cómo bautizó a estos aprendizajes representacionales del entorno?", "o": ["Reflejos espinales incondicionados.", "Cadenas viscerales lineales.", "Mapas cognitivos."], "c": 2, "e": "\"Este es un aprendizaje que incluye las relaciones entre una necesidad, un medio o camino, y una cierta meta... A estos aprendizajes los llamó mapas cognitivos.\""}, {"q": "Como prueba empírica de los mapas cognitivos, Tolman evidenció en sus laberintos que, si a unas ratas que habían aprendido un recorrido corriendo se les llenaba el recinto de agua:", "o": ["Se ahogaban por no tener el hábito muscular \"molecular\" de nadar en ese pasillo.", "Seguían sabiendo por dónde ir, nadando; habían aprendido la representación del camino, con independencia del movimiento exacto usado.", "Comenzaban a salivar histéricamente sin moverse por \"neurosis experimental\"."], "c": 1, "e": "\"si habían aprendido a ir a la meta corriendo y luego si el laberinto se llenaba con agua, las ratas seguían sabiendo por dónde tenían que ir... habían aprendido un camino, con independencia de si lo recorrían con movimientos de correr o de nadar.\""}, {"q": "En un famoso experimento del círculo de Tolman, un mono era entrenado a ejecutar una tarea esperando un trozo de plátano como refuerzo. ¿Qué ocurría si el experimentador lo manipulaba secretamente y le ponía una hoja de lechuga en lugar del plátano?", "o": ["El mono se comía la lechuga feliz porque todo refuerzo primario vale biológicamente lo mismo (Tesis de Watson).", "El mono reaccionaba con gran agitación emocional de rechazo y frustración, revelando que tenía una «expectativa» mental precisa del premio.", "El mono hablaba laríngeamente con el experimentador pidiéndole perdón."], "c": 1, "e": "\"cuando lo que encontraba era una hoja de lechuga... entonces reaccionaba con gran agitación emocional de rechazo (frustración). Ello indicaba claramente que el mono tenía una expectativa bien definida del tipo de refuerzo que trataba de obtener\"."}, {"q": "De forma ciertamente provocadora, Tolman llegó a postular la existencia de \"estados de conciencia\" en las ratas. Con ello no pretendía atribuirles instrospección filosófica, sino referirse conductualmente a:", "o": ["Sus fases de sueño REM o movimiento ocular rápido.", "Momentos en que la rata, en un punto de alternativa, se detenía, vacilaba y miraba a un lado y a otro, activando un proceso de \"ajuste conductual\" antes de elegir.", "El estado alterado provocado por la ingestión forzosa de cocaína."], "c": 1, "e": "\"Con esa expresión se refería a aquellas situaciones en que la rata, al llegar a un cierto punto de alternativa... se detenía, vacilaba, iba a un lado y al otro, como si comparara los diversos datos... antes de elegir un camino.\""}, {"q": "La culminación histórica del conductismo la marcó Burrhus F. Skinner, perteneciente a la etapa del:", "o": ["Psicoanálisis humanista de posguerra.", "Conductismo fundacional inicial pre-watsoniano.", "Neoneoconductismo (o análisis funcional de la conducta)."], "c": 2, "e": "\"4. EL NEONEOCONDUCTISMO: BURRHUS FREDERIC SKINNER... Su gran aportación ha sido el llamado análisis funcional de la conducta.\""}, {"q": "Epistemológicamente, ¿cómo conceptualiza Skinner el interior orgánico o mental del ser vivo al que estudia?", "o": ["Como un intrincado mapa cognitivo transparente que se debe descifrar analizando variables intervinientes.", "Como una «caja negra», cuyo contenido interno ni se analiza ni se describe, importando solo la relación ambiental observable de estímulos y respuestas.", "Como un almacén espiritual gobernado por arquetipos innatos inconscientes."], "c": 1, "e": "\"El organismo es aquí tratado como una «caja negra», cuyo contenido ni se analiza ni se describe. La conducta está determinada bien por estímulos antecedentes, bien por los estímulos consiguientes.\""}, {"q": "Skinner dividió la conducta refleja clásica de Pavlov y Watson (aquella donde el organismo reacciona pasivamente a un estímulo precedente, S-R) llamándola:", "o": ["Conducta operante espontánea.", "Conducta respondente.", "Conducta discriminativa silente."], "c": 1, "e": "\"El reflejo «S»-«R» (estímulo-respuesta) es aquel que ya había sido estudiado sistemáticamente por Pavlov y Watson. Constituye una conducta «respondente», porque ahí el organismo «responde» a la acción de un estímulo antecedente.\""}, {"q": "Por el contrario, ¿qué nombre recibe la inmensa mayoría de nuestro comportamiento voluntario según Skinner, caracterizado como un reflejo «R»-«S» donde el organismo actúa \"espontáneamente\" alterando su entorno y asumiendo sus consecuencias?", "o": ["Respuesta Incondicionada Fija.", "Emoción Laríngea.", "Respuesta (o conducta) operante."], "c": 2, "e": "\"el reflejo «R»-«S»... vendría a representar aquellas conductas en que un organismo «opera» o emite una respuesta (respuesta operante), tras la cual sigue un estímulo «S» que es resultado de aquella.\""}, {"q": "En el condicionamiento de Skinner, la modificación ambiental o el efecto (placentero o doloroso) que es \"consecuencia\" directa y depende de la acción previa del sujeto se conoce formalmente como:", "o": ["Estímulo antecedente incondicionado puro.", "Contingencia.", "Variables mediadoras inmutables."], "c": 1, "e": "\"Este puede ser satisfactorio o doloroso; en todo caso, es un efecto que es consecuencia de esa respuesta. Skinner considera que es una «contingencia», algo que sucede y que depende de la acción precedente.\""}, {"q": "En el marco del condicionamiento operante, el proceso de \"extinción\" sucede y el organismo deja de emitir la conducta cuando:", "o": ["Se le aplican terapias de electroshock forzosas de intensidad letal.", "La respuesta deja repetidamente de ir seguida de su refuerzo contingente habitual (se suprime la conexión respuesta-refuerzo).", "El organismo entra de manera voluntaria en fase REM de descanso."], "c": 1, "e": "\"Cuando se produce la extinción, el organismo deja de emitir esas «operantes condicionadas»... Para ello, se ha de dar que la respuesta no vaya seguida de un refuerzo, es decir, se ha de suprimir la conexión entre respuesta y refuerzo.\""}, {"q": "Como ejemplo de feedback y de causalidad retroactiva operativa, el animal incrementa las pulsaciones de una palanca si recibe comida tras pulsarlo. El espacio hermético experimental inventado por el autor para estudiar precisamente estas dinámicas de manera controlada e inequívoca se llama:", "o": ["Laberinto acrílico de Tolman.", "La campana salivar de Pavlov.", "La caja de Skinner."], "c": 2, "e": "\"Skinner ideó una caja experimental de su invención, la llamada «caja de Skinner», en que se crea un espacio bien definido donde se dan respuestas y estímulos muy simples\"."}, {"q": "¿Qué estímulo es aquel que precede temporalmente a una conducta y actúa directamente provocándola o \"generándola\" (típico del condicionamiento clásico o respondente pavloviano)?", "o": ["Estímulo discriminativo limitante.", "Estímulo emocional generalizado.", "Estímulo elicitante."], "c": 2, "e": "\"Elicitante. Aquel que precede y genera una respuesta. Esta será por ello una respuesta «respondente»... Este tipo de estímulo lo encontramos actuando en el condicionamiento clásico o pavloviano.\""}, {"q": "A diferencia del anterior, el estímulo fundamental del operante que siempre \"sigue\" a la conducta (es contingente) y altera las probabilidades futuras y la frecuencia de aparición de dicha conducta es el:", "o": ["Estímulo neutro sordo.", "Estímulo reforzante (Refuerzo).", "Estímulo elicitante somático."], "c": 1, "e": "\"Reforzante. Este sigue a la respuesta operante «R»-«S», es «contingente» a esta. Su aparición hace que cambie la frecuencia de esa respuesta.\""}, {"q": "Un alimento entregado a una rata hambrienta tiene de por sí la propiedad innata o biológica de satisfacer directamente su necesidad vital. Este tipo de estímulo es un:", "o": ["Reforzador secundario derivado.", "Reforzador primario.", "Refuerzo negativo condicional."], "c": 1, "e": "\"el alimento es un reforzador primario para un organismo hambriento; posee las propiedades que le permiten terminar o saciar la necesidad que experimenta el sujeto.\""}, {"q": "Por el contrario, cuando decimos a un niño \"¡Muy bien!\" y su conducta se fortalece motivacionalmente, estamos empleando un estímulo que originariamente no saciaba nada orgánico, pero que ha adquirido gran poder al asociarse a premios físicos en el pasado. Es un:", "o": ["Estímulo incondicionado visceral puro.", "Reforzador secundario.", "Castigo positivo."], "c": 1, "e": "\"el reforzador secundario es un estímulo que de suyo no produce efecto en relación con una respuesta, pero que llega a influir por haber estado asociado a un reforzador primario... Expresiones como «muy bien»... se vuelven reforzantes al haber estado asociadas a un premio\"."}, {"q": "El dinero o las palabras de elogio son casos específicos de reforzadores secundarios tan arraigados en nuestra sociedad que tienen el inmenso poder de fortalecer y moldear una infinidad de respuestas conductuales totalmente distintas en los sujetos. A estos se los categoriza como:", "o": ["Reforzadores generalizados.", "Mecanismos respondentes nulos.", "Mapas cognitivos de signo-objeto puros."], "c": 0, "e": "\"hay algunos reforzadores que fortalecen una gran variedad de respuestas en los sujetos; por ejemplo, las palabras... el dinero... pueden influir en muchos tipos distintos de conductas. Se llaman reforzadores generalizados.\""}, {"q": "Cuando una rata pulsa la palanca y aparece sorpresivamente una deseada bolita de comida en el comedero (aparición de un elemento), la rata tenderá a pulsarla más a menudo en el futuro. Este es un mecanismo de:", "o": ["Extinción progresiva intermitente.", "Reforzador positivo.", "Condicionamiento respondente pavloviano estricto."], "c": 1, "e": "\"Un estímulo reforzante se llama reforzador positivo, cuando al aparecer hace que se repita la respuesta y se haga más frecuente, (por ejemplo, una bolita de alimento tras apretar la palanca...).\""}, {"q": "En contraste, cuando usted se toma un medicamento para suprimir el fuerte dolor de cabeza que padecía y lo consigue, esa conducta (tomar la pastilla) ha erradicado algo aversivo o molesto (el dolor), quedando consolidada y reforzada para el futuro. Hablamos de un:", "o": ["Castigo positivo.", "Reforzador negativo.", "Condicionamiento de ensayo y error silente."], "c": 1, "e": "\"un reforzador negativo es aquel que refuerza y consolida aquella conducta que elimina un estímulo aversivo (por ejemplo, si tomando un medicamento eliminamos un fuerte dolor de cabeza, la conducta de tomar ese medicamento... se verá reforzada).\""}, {"q": "El animal dentro de la caja experimental aprende que la acción de empujar la palanca SOLO le reportará bolitas de comida \"si y solo si\" la bombilla verde está encendida. La luz verde actúa entonces como una simple \"señal\" semáforo para el animal, y se le llama:", "o": ["Estímulo discriminativo.", "Estímulo elicitante de segundo orden.", "Refuerzo primario estático visual."], "c": 0, "e": "\"Discriminativo. Es un estímulo que indica cuándo una respuesta irá seguida de un reforzador... la luz, que señale cuándo la respuesta que se haga será reforzada\"."}, {"q": "¿Qué clase de estímulo skinneriano describe aquel evento situacional que modifica abruptamente las tasas habituales de comportamiento al provocar en el sujeto ira, miedo o ansiedad visceral?", "o": ["Estímulo generalizado neutro.", "Estímulo emocional.", "Estímulo de intervalo puro."], "c": 1, "e": "\"Emocional. Es aquel que produce en el organismo una situación emocional (de ira, de temor, de ansiedad, etc.), modificando las tasas de las respuestas con que se ajusta a su entorno.\""}, {"q": "Si comparamos los diferentes regímenes de refuerzo en laboratorio, descubriremos que las conductas que han sido consolidadas bajo un esquema \"intermitente\" (donde a veces hay premio y a veces no) comparadas con el continuo (siempre hay premio) son:", "o": ["Mucho más endebles y se extinguen rápidamente al faltar el premio dos veces.", "Completamente idénticas y se borran con igual tasa matemática de velocidad.", "Extremadamente tenaces y muy resistentes a su extinción (ya que el sujeto no puede distinguir bien si el premio se ha cortado o solo tarda en llegar)."], "c": 2, "e": "\"Por ello, las conductas reforzadas de modo intermitente son muy resistentes a la extinción, mientras que las adquiridas con refuerzo continuo se extinguen enseguida, al suprimir el refuerzo.\""}, {"q": "Skinner dividió los planes \"intermitentes\" en dos familias. ¿Cómo se denominan aquellos donde el experimentador decide que el refuerzo esté disponible para el animal, por ejemplo, cada cierto ciclo o periodo cronológico (ej. cada 4 minutos)?", "o": ["Planes de razón.", "Planes de intervalo.", "Planes de extinción sumativa periódica."], "c": 1, "e": "\"los que ofrecen refuerzo al cabo de cierto tiempo (planes de intervalo)... Darlo cada cuatro minutos, es un plan de intervalo. En general, cuando el tiempo es el criterio, las respuestas del organismo se producen con un ritmo estable.\""}, {"q": "En contraste, ¿cómo se denominan aquellos planes donde lo único que importa es la producción y el desempeño, otorgando el refuerzo por ejemplo después de cada cinco pulsaciones ejecutadas sin importar el reloj?", "o": ["Planes de intervalo progresivo.", "Planes continuos aleatorios.", "Planes de razón."], "c": 2, "e": "\"los que lo dan al cabo de un cierto número de respuestas (planes de razón). Por ejemplo, dar un refuerzo cada cinco respuestas supone emplear un plan de razón... los organismos tienden a trabajar sin descanso\"."}, {"q": "Para leer y analizar metódicamente el ritmo y las pausas de las respuestas de los animales encerrados en la caja a lo largo de horas de pruebas sin vigilarlos a simple vista, Skinner acopló al dispositivo un rollo de papel giratorio que dibuja una línea perpendicular ascendente. Este gráfico se conoce como:", "o": ["Esquema de variables intervinientes S-R-S.", "Pictograma chino en cadena secuencial.", "Registro acumulativo."], "c": 2, "e": "\"salta de línea en dirección perpendicular al movimiento de avance. De este modo, se va trazando una curva con las sucesivas respuestas y las va acumulando. A estos registros se les conoce como registros acumulativos.\""}, {"q": "La tecnología educacional masiva basada explícitamente en el reforzamiento sistemático de respuestas correctas (informando de inmediato, y obligando a repasar sobre los errores cometidos al rellenar espacios verbales) ideada e impulsada comercialmente por Skinner, fue la:", "o": ["Enseñanza programada.", "Terapia humanista centrada en el niño.", "Técnica psicoanalítica de transferencia latente ortográfica."], "c": 0, "e": "\"También diseñó una tecnología que se conoce con el nombre de enseñanza programada, y que se basa en el sistema del reforzamiento de las respuestas correctas para asegurar el aprendizaje.\""}, {"q": "Cuando un ave condicionada aprende a picotear el panel única y exclusivamente frente a fotografías \"donde aparecen personas\", suprimiendo los picoteos inútiles frente a fotografías puramente abstractas o cosificadas por falta de refuerzo, asimiló un proceso cognitivo-conductual de:", "o": ["Reflejo condicionado visceral de ira pavloviana.", "Generalización irracional histérica.", "Discriminación (entre estímulos)."], "c": 2, "e": "\"Las palomas pueden aprender a picotear en una imagen... donde haya figuras de personas, y no en las partes... donde haya solo cosas; de este modo, «discriminan» entre diferentes estímulos... Si, por el contrario, solo el hexágono es reforzado... aprenderán a no picotear... Este será un proceso de discriminación.\""}, {"q": "Por el contrario, cuando la misma paloma es reforzada picoteando un polígono (ej. hexágono) y luego empieza a picotear también, sin entrenamiento directo, otros polígonos similares (heptágonos o pentágonos) por inducción asimilativa, se halla ante un proceso de:", "o": ["Formación de Mapas Cognitivos puros de Tolman en vuelo rasante.", "Generalización (de la respuesta).", "Neurosis operante traumática paralizante terminal."], "c": 1, "e": "\"luego tienden también a emitir respuesta ante un polígono con más o menos lados como resultado de un proceso de «generalización» de la respuesta... Será un caso de generalización.\""}, {"q": "Enseñar al niño pequeño las pautas complejas de manejar el tenedor en la mesa u obligar a un perro de circo a pedalear en bicicleta implica ir premiando progresivamente acercamientos o eslabones a la conducta meta mientras se extinguen los fallos. ¿Cómo se conoce esta técnica clínica/social de ingeniería conductual?", "o": ["Asociación libre psicoanalítica.", "Extirpación quirúrgica de los reflejos espinales viscerales.", "Moldeamiento (entrenamiento de eslabones sucesivos)."], "c": 2, "e": "\"Al principio se refuerzan sus respuestas toscas, luego solo las más correctas. (Por ejemplo, se refuerza primero que toque el tenedor; luego, que lo coja; más tarde solo se refuerza que lo coja y lo acerque al alimento... Cada vez que hay una respuesta más correcta que las anteriores, esta es reforzada y las otras no... Es un proceso de moldeamiento.\""}, {"q": "El conocido experimento que Estes y Skinner hicieron con ratas, donde introducían un sonido asociado irremediablemente a una descarga eléctrica aversiva minutos después, descubrió en las ratas un fenómeno donde los animales cesaban de apretar sus palancas y se inmovilizaban anticipadamente. Interpretaron esto como el efecto de una fuerte alteración emocional de:", "o": ["Ansiedad (temor a la llegada de un estímulo aversivo) que interfiere o debilita la conducta.", "Depresión catatónica irreversible de causa vírica en las motoneuronas cerebrales de la rata.", "Amor visceral platónico extremo hacia el experimentador que detiene su ritmo metabólico."], "c": 0, "e": "\"Atribuyen ese debilitamiento a una alteración emocional de «ansiedad» o temor a la llegada de un estímulo aversivo, como es el shock eléctrico. Ese estado emocional, pues, tendría el efecto de debilitar la conducta condicionada.\""}, {"q": "El conductismo skinneriano advierte severamente sobre las limitaciones del castigo o los estímulos punitivos y aversivos para reprimir conductas humanas y moldear (ej. el semáforo y el policía) demostrando experimentalmente que:", "o": ["Borran física y para siempre la tendencia instintiva central neurológica de desear cometer la falta desde el primer intento castigado duramente en laboratorio ciego.", "Generan meras conductas de evitación o escape provisorios temporales frente al estímulo físico, pero no suprimen ni extinguen causalmente la tendencia de cometer dicho acto proscrito si el castigador desaparece del entorno temporalmente.", "Son la única vía para forjar la inteligencia humana propositiva abstracta pura de Tolman para la civilización posmoderna global."], "c": 1, "e": "\"Los estímulos punitivos aversivos determinan la supresión de aquella conducta... Generan conductas de evitación o escape, pero no hacen que desaparezca la tendencia a dar ese tipo de respuesta castigada, de modo que, cuando no hay peligro... la conducta en cuestión tiende a reaparecer\"."}, {"q": "Skinner se aventuró y aplicó las leyes del moldeamiento y reforzamiento intermitente a una de las cimas de la \"mente\" humana publicando en 1957 una voluminosa e importante obra. Dicho campo fue:", "o": ["El subconsciente junguiano heredado por la tipología genética cruzada.", "La neurosis experimental pavloviana por conflicto cerebral visual inhibitorio puro estático de esferas y elipses de luz de laboratorio central.", "El lenguaje humano (\"Conducta verbal\"), analizándolo sin referencia mental, solo como operantes sociales funcionales en interacción y control."], "c": 2, "e": "\"Una de las contribuciones más importantes y más cuestionadas de Skinner ha sido su análisis del lenguaje humano, que estudia en su libro sobre Conducta verbal (1957). El lenguaje es aquí considerado como un conjunto de operantes... sin ninguna referencia a una dimensión mental.\""}, {"q": "Entre las categorías de su taxonomía lingüística verbal, Skinner definió aquella vocalización como «yo tomaré lenguado» por parte de un comensal en el restaurante, que provoca que otra persona en interacción (un oyente/camarero) traiga el refuerzo al instante. Esta importante respuesta fue bautizada como:", "o": ["Mando (Mand).", "Conducta operante autística silente insonora o laríngea reprimida.", "Pictograma de clase abierta de variable dependiente pura de Wundt."], "c": 0, "e": "\"Produce unos sonidos –por ejemplo, «yo tomaré lenguado»– en el contexto de un restaurante... y como resultado, este último le traerá un determinado plato... Esta conducta la llama Skinner mando. En ella el sujeto es reforzado por la intervención de un oyente.\""}, {"q": "Otra de las tipologías capitales del lenguaje en Skinner se refiere a aquellas oraciones que describen y nombran los estímulos presentes (ej. mirar y decir \"¡Un taxi!\" o \"¡Un perro!\"), evocadas simplemente por los objetos y que la comunidad refrenda y alaba en asentimiento confirmatorio. Skinner llamó a este fenómeno operante verbal:", "o": ["Constante kinestésica pura incondicional motora e intrínseca inactiva noegénica.", "Tacto (Tact).", "Mapa cognitivo semántico subyacente."], "c": 1, "e": "\"Ante un objeto... el sujeto produce una expresión que otros refuerzan con su asentimiento... dice: «¡ahí hay un taxi!». Esas operantes, a las que llama tactos, son evocadas por el objeto referenciado por el sujeto.\""}, {"q": "El análisis skinneriano de que las lenguas humanas se edifican simplemente mediante \"asociaciones condicionadas\" sin \"mentes\" ni reglas internas recibió en 1959 una crítica teórica devastadora y mundialmente histórica que apelaba al estudio y existencia empírica de \"sistemas o gramáticas generativas innatas\", obra de:", "o": ["Lev S. Vygotsky.", "Noam Chomsky.", "Ivan Pavlov."], "c": 1, "e": "\"La posición de Skinner en el tema del lenguaje fue sometida a una dura crítica por el lingüista Noam Chomsky (1959). Este combate la idea de que una lengua pueda quedar reducida a un sistema de respuestas u operantes... argumenta Chomsky, tienen unos sistemas o gramáticas generativas\"."}, {"q": "Para divulgar socialmente la visión científica total del mundo conductista, Skinner publicó en 1968 (orig. 1948) una famosísima novela acerca de una comunidad humana utópica e idílica gestionada eficientemente por refuerzos racionales puros (ingeniería de la conducta ambiental exenta de castigos inútiles y propagandas destructivas individualistas o competitivas), titulada:", "o": ["El mundo como voluntad y representación.", "1984.", "Walden Dos."], "c": 2, "e": "\"Skinner dejó plasmada su idea de una sociedad ideal, construida sobre los principios del condicionamiento operante, en una novela llamada Walden Dos (1968), una cierta utopía donde la vida de sus miembros está regida por refuerzos.\""}, {"q": "La utopía conductista de Skinner inspiró intentos reales de llevar a la práctica comunidades y cooperativas humanas cimentadas en estos principios sociológicos aplicados a la igualdad funcional comunitaria. La más conocida y referenciada, sita en Virginia (EE.UU.), fundada en los años 60 por Kat Kinkade es:", "o": ["La Comuna de Jonestown profunda de la Guayana de James.", "La Comunidad de Twin Oaks.", "La Base Silenciosa antártica rusa de Watson."], "c": 1, "e": "\"Estos principios se han llevado en alguna medida a la práctica en alguna pequeña comunidad americana. Una bien conocida es la comunidad de Twin Oaks, en Virginia (EE. UU.), fundada por Kat Kinkade...\"."}, {"q": "Una inmensa rama pragmática aplicada clínica y médica contemporánea deriva centralmente del conductismo como tecnología correctiva basada estrictamente en reorganizar mediante castigos lógicos o refuerzos programados los \"desajustes aprendidos perjudiciales\" y reconducir conductas patológicas hacia el desempeño normativo social ajustado y deseado del ser. Esta tecnología es generalmente citada a nivel profesional como:", "o": ["Modificación de conducta.", "Logoterapia existencial y humanista no-directiva clínica de Carl Rogers.", "Electroconvulsión orgánica y psicocirugía somática lobotomizadora cerebral forzada invasiva profunda clínica inespecífica."], "c": 0, "e": "\"Aquí se asientan las bases de una técnica terapéutica muy potente, que se ha desarrollado a partir de los principios del análisis del comportamiento, generalmente conocida como «modificación de conducta»... reorganizar el comportamiento a fin de ajustarlo mejor\"."}, {"q": "Según el apartado de \"Conceptos Básicos\", si analizamos el debate subyacente entre los conductistas, Watson y Skinner son clasificados como teóricos \"periferalistas\" absolutos (interesados solo en los estímulos externos medibles del medio e ignorando cajas negras ocultas), mientras que Hull y Tolman... :", "o": ["Eran espiritualistas puros místicos de esoterismo hermético oriental reencarnacionista y parapsicológicos ocultos empedernidos de ectoplasma experimental telepático.", "Asumían posturas cognitivas más complejas incluyendo y admitiendo estímulos y respuestas «internas» operativas no visibles directamente (o variables intervinientes centrales) que operaban bajo el papel asimilado de representaciones, mapas y expectativas mentales lógicas directrices y no son exclusivamente periferalistas.", "Rechazaban la propia física en su forma material de modo rotundo negando hasta los cuerpos de las ratas y abrazando el solipsismo virtual de las alucinaciones del psiquiatra en solitario por hipnosis autoinducida regresiva somnílocua clínica extrema letárgica."], "c": 1, "e": "\"Watson y Skinner son autores básicamente «periferalistas»... Hull y Tolman, en cambio, añadirán la idea de que hay estímulos y respuestas internas en el organismo (variables intervinientes), que hacen el papel de una «mente»... No son exclusivamente periferalistas, por tanto, sino que admiten una serie de procesos «centrales».\""}, {"q": "(Conceptos Básicos) ¿Por qué la escuela del conductismo norteamericano en bloque impuso un tajante rechazo a la histórica \"idea o concepto de conciencia\" como herramienta rectora de estudio del comportamiento general o causa biológica última motora en la academia?", "o": ["Al carecer de presupuesto gubernamental americano en las guerras mundiales para poder estudiarla a gran escala sociológica profunda real comparada europea alemana pura y verse forzados sin medios más que a analizar saliva y laberintos baratos con madera de pino y pienso canino simple para salir del paso metodológico inicial austero por fuerza coyuntural y de la miseria pura académica norteamericana.", "Porque están completamente persuadidos de que \"cualquier tipo de proceso subjetivo y consciente individual resulta estrictamente privado\" por su naturaleza y, por ende, es inobservable directa y públicamente y consecuentemente imposible de objetivar jamás para cimentar \"una ciencia rigurosa\".", "Porque los perros pavlovianos demostraron físicamente radiográficamente a inicios del S.XX con rayos X no tener lóbulos prefrontales en los hemisferios craneales corticales."], "c": 1, "e": "\"El rechazo general a la idea de conciencia está fundamentalmente debido a su convicción de que cualquier tipo de proceso subjetivo es estrictamente individual, no es susceptible de ser observado más que por el propio sujeto... y no es, por tanto, un «hecho objetivo» sobre el que quepa construir una ciencia rigurosa.\""}, {"q": "La crítica frontal articulada por Chomsky (y la dificultad general manifiesta endémica de las asunciones teóricas elementales para dar cuenta o asimilar y explicar los complejísimos e innegables procesos de las actividades de orden superior y creativo lógico-lingüísticas sintácticas) forzó históricamente una profunda crisis y revisión estructural del conductismo, cediendo su posición y abriendo la vía final ineludible en el s. XX hacia un nuevo paradigma fundamental hegemónico:", "o": ["La frenología biométrica estructuralista de Wundt purista sin alteraciones decimonónica reactivada y resucitada en bloque monolítico acrítico total por Titchener ex profeso en EE. UU. continental y Cornell pura y dura en inglés.", "La psicología cognitiva alternativa de procesamiento.", "El mesmerismo hipnótico magnético profundo orgánico freudiano clásico puro de transferencia de los fluidos analíticos viscerales arquetípicos innatos universales de las escuelas suizas alpinas."], "c": 1, "e": "\"La crítica a Skinner de Chomsky, a propósito del lenguaje, inició el proceso de crisis del conductismo... Su dificultad para dar cuenta de las actividades simbólicas, cognitivas y lingüísticas abrió la vía a una posición alternativa, la de la psicología cognitiva, desde la que se iba a criticar y reformar el conductismo.\""}];
let questions=[...originalQuestions],current=0,score=0,missed=[],retryMode=false;

function loadQuestion(){
let q=questions[current];
document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='Conductismo: Watson, neoconductismo, Hull, Tolman, Skinner, refuerzo, conducta verbal y tecnología conductual.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}
loadQuestion();
</script>

</html>
