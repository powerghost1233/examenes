<script>
const originalQuestions=[{"q": "Según el texto, ¿qué actitud trajo al mundo occidental el positivismo del siglo XIX?", "o": ["Un rechazo absoluto a la tecnología emergente.", "Una actitud de respeto y veneración por la ciencia.", "Un retorno a las ideas filosóficas de la Edad Media."], "c": 1, "e": "El texto indica literalmente: \"El positivismo del siglo XIX trajo al mundo occidental una actitud de respeto y veneración por la ciencia\"."}, {"q": "¿Quién reformó y modernizó la máquina de vapor en 1775, haciendo posible la primera revolución industrial?", "o": ["James Watt.", "Charles Darwin.", "Hermann Ebbinghaus."], "c": 0, "e": "El texto menciona: \"La máquina de vapor, reformada y modernizada por Watt en 1775, hizo posible la primera revolución industrial\"."}, {"q": "El rápido desarrollo del transporte y la industria inició una unificación del mundo que hoy conocemos como:", "o": ["El imperialismo global.", "La aldea global.", "El positivismo industrial."], "c": 1, "e": "Menciona que la comunicación rápida entre las partes del globo inició \"una unificación de este que en nuestro tiempo ha alcanzado a formar lo que se suele llamar «la aldea global»\"."}, {"q": "¿Qué nuevo conflicto social surgió a raíz del proceso productivo de la revolución industrial?", "o": ["El conflicto entre los distintos imperios por el monopolio del acero.", "El conflicto entre las diversas clases sociales por intereses contrapuestos.", "El conflicto entre la religión y la ciencia empírica."], "c": 1, "e": "Surgió \"el conflicto entre las diversas clases sociales... enfrentadas por intereses contrapuestos que generaron grandes movimientos sociales en los que se recurrió frecuentemente a la lucha de clases\"."}, {"q": "¿En qué años tuvo lugar la Primera Guerra Mundial, como conflagración que puso a prueba las capacidades técnicas de los contendientes?", "o": ["Entre 1898 y 1905.", "Entre 1914 y 1918.", "Entre 1939 y 1945."], "c": 1, "e": "El texto indica: \"tuvieron una expresión cabal en la Primera Guerra Mundial, entre 1914 y 1918\"."}, {"q": "Junto a la medicina y la antropología, ¿cómo fue concebida la psicología para beneficiarse de los nuevos intereses sociales?", "o": ["Como una ciencia empírica natural.", "Como una rama de la filosofía especulativa.", "Como una técnica mnemotécnica pura."], "c": 0, "e": "Afirma que \"La psicología, concebida como una ciencia empírica natural, se iba a beneficiar de los nuevos intereses sociales dominantes\"."}, {"q": "El nuevo espíritu inquisitivo de la ciencia natural estaba dominado por un afán central. ¿Cuál era?", "o": ["El afán de cualificar.", "El afán de medir.", "El afán de comprender intuitivamente."], "c": 1, "e": "Señala que \"El nuevo espíritu inquisitivo con el que el hombre se acercaba a la naturaleza estaba dominado por el afán de medir\"."}, {"q": "Para someter a estudio experimental las funciones mentales complejas, los investigadores tuvieron que superar las limitaciones impuestas previamente por:", "o": ["Wilhelm Wundt.", "Platón.", "Hermann Ebbinghaus."], "c": 0, "e": "\"Fue necesario superar las limitaciones que había marcado Wundt. Para este, las funciones superiores estaban influidas esencialmente por el lenguaje... y estimaba imposible su estudio experimental\"."}, {"q": "En la antigüedad, ¿quién basó en la memoria el conocimiento científico de las «ideas» originadas en una existencia previa?", "o": ["Simónides de Ceos.", "Aristóteles.", "Platón."], "c": 2, "e": "El texto menciona: \"Platón (s. V a. C.) basó en la memoria el conocimiento científico de las «ideas», que habría tenido su origen en una existencia previa\"."}, {"q": "¿Qué autor griego escribió el libro \"Sobre la memoria y el recuerdo\" en el siglo IV a. C.?", "o": ["Aristóteles.", "Platón.", "Teofrasto."], "c": 0, "e": "\"Entre los estudios científico-naturales de Aristóteles (s. IV a. C.), hay un libro Sobre la memoria y el recuerdo\"."}, {"q": "El método mnemotécnico de los «lugares» (loci), utilizado para identificar víctimas de un derrumbamiento, fue puesto en juego por:", "o": ["Santo Tomás de Aquino.", "Simónides de Ceos.", "Aristóteles."], "c": 1, "e": "En el siglo VI a. C., \"Simónides de Ceos... pudo identificar los cuerpos de un grupo de comensales... Puso así en juego un método llamado de los «lugares» (en latín, loci)\"."}, {"q": "¿Qué autor alemán realizó el primer trabajo rigurosamente experimental sobre la memoria en 1885?", "o": ["Hermann Ebbinghaus.", "Oswald Külpe.", "Karl Marbe."], "c": 0, "e": "Fue realizado \"por el alemán Hermann Ebbinghaus... autor de un estudio empírico Sobre la memoria [Über das Gedächtniss, 1885]\"."}, {"q": "Para evitar asociaciones extrañas en su material de estudio, Ebbinghaus inventó:", "o": ["El método de las imágenes proyectadas.", "Las «sílabas sin sentido».", "Las manchas de tinta estandarizadas."], "c": 1, "e": "\"Tratando de evitar todas las asociaciones extrañas... inventó una muy especial, las «sílabas sin sentido»\"."}, {"q": "¿Cuál era la estructura de las sílabas sin sentido utilizadas por Ebbinghaus?", "o": ["Vocal-Consonante-Vocal (ej. AZA).", "Consonante-Vocal-Consonante (ej. ZAX).", "Consonante-Consonante-Vocal (ej. PRA)."], "c": 1, "e": "Estaban \"hechas con la estructura de consonante-vocal-consonante; por ejemplo, ZAX, DIJ\"."}, {"q": "A la hora de depurar las sílabas, ¿por qué eliminó sílabas como \"saf\" o \"cil\"?", "o": ["Porque eran muy largas de pronunciar.", "Porque le evocaban alguna asociación o sentido.", "Porque no cumplían la regla fonética."], "c": 1, "e": "Las depuró \"eliminando todas aquellas que le evocaran alguna asociación (por ejemplo, saf, cil, etc.)\"."}, {"q": "¿Quién sirvió como sujeto experimental en las investigaciones de Ebbinghaus sobre la memoria?", "o": ["Estudiantes universitarios de Berlín.", "Él mismo.", "Reclutas del ejército alemán."], "c": 1, "e": "Planteó su estudio experimental y \"Se tomó a sí mismo como sujeto experimental\"."}, {"q": "¿Con qué instrumento regulaba Ebbinghaus la velocidad fija a la que leía y repetía las listas de sílabas?", "o": ["Un cronómetro de arena.", "Un metrónomo.", "Un reloj de bolsillo."], "c": 1, "e": "\"repitiéndolas siempre a una velocidad fija, regulada por un metrónomo, hasta que conseguía reproducirlas sin error\"."}, {"q": "Según la Tabla 1 de sus resultados, ¿cuántas lecturas requería aprender una lista de 7 sílabas?", "o": ["17 lecturas.", "1 lectura.", "44 lecturas."], "c": 1, "e": "En la tabla 1 se refleja: \"7 sílabas -> 1 lectura -> 3 seg de tiempo\"."}, {"q": "Según la Tabla 1, si la lista aumentaba de 12 a 24 sílabas (el doble), el tiempo medio por sílaba:", "o": ["Se mantenía exactamente igual.", "Casi se triplicaba (pasando de 6,8 a 17,6 segundos).", "Disminuía debido a la adaptación mental."], "c": 1, "e": "\"duplicar la lista (pasar de 12 a 24 sílabas) lleva a casi triplicar el tiempo por sílaba (que pasa de 6,8 a 17,6 segundos)\"."}, {"q": "Ebbinghaus descubrió que al alargar la lista, el esfuerzo necesario crecía de forma no lineal debido a las interferencias entre sílabas. A esto se le conoce como:", "o": ["Inhibición.", "Covariación.", "Noegénesis."], "c": 0, "e": "Las sílabas entran en una \"compleja red de enlaces... lo que traerá una serie de interferencias que dificultan ese aprendizaje («inhibición»)\"."}, {"q": "Para medir la bondad de un aprendizaje a partir del reaprendizaje, Ebbinghaus empleó:", "o": ["El método del ahorro.", "La correlación de Pearson.", "La introspección sistemática."], "c": 0, "e": "Idió \"medir la bondad de un aprendizaje a partir del reaprendizaje y del ahorro que aquel produce\", empleando el \"método del ahorro\"."}, {"q": "Según el método del ahorro, si aprender una lista costó 20 lecturas la primera vez y 5 lecturas la segunda vez, el ahorro conseguido es de:", "o": ["25%", "50%", "75%"], "c": 2, "e": "Nos ahorramos 15 repeticiones de 20. \"Ebbinghaus pensó que quedaba el equivalente de 15 repeticiones respecto de un total de 20; esto es, quedaría un 75 % del aprendizaje\"."}, {"q": "Ebbinghaus llamó «sobreaprendizaje» a la acción de:", "o": ["Aprender dos listas simultáneamente.", "Seguir repitiendo la lista incluso después de haberla reproducido una vez sin error.", "Aprender el material utilizando únicamente imágenes visuales."], "c": 1, "e": "Es \"aquel aprendizaje en el que se sigue repitiendo la lista a aprender incluso después de haberla reproducido una vez sin error, fortaleciendo su fijación\"."}, {"q": "En sus experimentos sobre la distribución del tiempo, Ebbinghaus comprobó que para conseguir aprendizajes duraderos:", "o": ["La práctica masiva (en una sola sesión) era superior a la distribuida.", "La práctica distribuida (en varias sesiones) era muy superior a la masiva.", "Ambas formas producían exactamente los mismos resultados."], "c": 1, "e": "\"comprobó en sus experimentos que era muy superior el efecto de la práctica distribuida (aquella que se hace en varias sesiones) al de la práctica masiva\"."}, {"q": "La gráfica que ilustra la evolución temporal de la retención y muestra una caída rápida al inicio seguida de una estabilización, se denomina:", "o": ["Curva del aprendizaje de Watt.", "Curva del olvido.", "Campana de Gauss."], "c": 1, "e": "Trazó \"una curva, que se conoce como la «curva del olvido». En ella, hay, al comienzo, una caída muy rápida, que luego tiende a estabilizarse\"."}, {"q": "En la curva del olvido, después de la caída rápida inicial, la retención del material sin sentido tiende a estabilizarse en torno a un:", "o": ["10%.", "30%.", "75%."], "c": 1, "e": "\"luego tiende a estabilizarse en torno a una retención de cerca de un 30 %\"."}, {"q": "Para comprobar el efecto de manejar materiales con sentido en contraposición a las sílabas sin sentido, Ebbinghaus memorizó:", "o": ["Fragmentos de la obra de Aristóteles.", "El poema Don Juan, de lord Byron.", "Las leyes de la física newtoniana."], "c": 1, "e": "\"Utilizó, por ejemplo, el poema Don Juan, de lord Byron, y aprendió una serie de estrofas\"."}, {"q": "Al comparar el aprendizaje del poema de lord Byron con el de sílabas sin sentido de igual volumen, Ebbinghaus concluyó que las sílabas requerían un esfuerzo:", "o": ["Igual, confirmando que el sentido no afecta a la memoria pura.", "10 veces mayor, probando que el significado facilita la retención.", "La mitad del esfuerzo, ya que las sílabas son más simples."], "c": 1, "e": "Determinó que \"para aprender un volumen semejante sin sentido se necesitaría un esfuerzo 10 veces mayor. Ello indicaba que la significación... facilitan mucho la retención\"."}, {"q": "¿Qué investigador británico, casi 30 años después, aportó un nuevo modelo de memoria basado en experiencias con sentido y significado?", "o": ["Frederic Bartlett.", "Charles Spearman.", "Henry Watt."], "c": 0, "e": "\"fue preciso esperar casi treinta años para que surgiera un nuevo modelo de memoria de experiencias con sentido... de la mano del inglés sir Frederic Bartlett (1886-1969)\"."}, {"q": "La idea del empirismo inglés acerca del pensamiento sostenía que este consistía fundamentalmente en:", "o": ["Un proceso inconsciente de instintos.", "Asociar o separar ideas, operando a la postre con imágenes.", "Medir el factor g mediante test."], "c": 1, "e": "El empirismo inglés proponía que \"Pensar sería asociar ideas o conceptos... Por tanto, el pensamiento sería a la postre un proceso que operaría con imágenes\"."}, {"q": "¿Quién lideró el grupo de investigadores en la Universidad de Wurzburgo interesados en el estudio del pensamiento entre 1900 y 1910?", "o": ["Oswald Külpe.", "Hermann Ebbinghaus.", "Edward L. Thorndike."], "c": 0, "e": "\"se reunió un grupo de investigadores en torno a Oswald Külpe (1862-1915), que centró su trabajo en aquel tema\"."}, {"q": "¿Cuál era la tesis central que defendió la Escuela de Wurzburgo acerca del pensamiento humano?", "o": ["Que el pensamiento es imposible de estudiar experimentalmente.", "Que existe un pensamiento «sin» imágenes.", "Que todo pensamiento es exclusivamente visual y fotográfico."], "c": 1, "e": "Todos ellos \"vinieron a defender la idea de que hay un pensamiento «sin» imágenes, aunque estas puedan en ocasiones acompañarlo\"."}, {"q": "Para analizar el pensamiento, los investigadores de Wurzburgo cronometraban tareas intelectuales complejas y pedían a los sujetos describir lo que pasaba por su mente. Este método se llama:", "o": ["Condicionamiento clásico.", "Introspección sistemática.", "Método de los lugares (loci)."], "c": 1, "e": "Pedían a los sujetos \"describir lo que hallaban presente en su conciencia, mientras se cronometraban sus respuestas. Es el método de «introspección sistemática»\"."}, {"q": "En los experimentos de Karl Bühler en Wurzburgo, cuando los sujetos resolvían preguntas como \"¿podemos captar la esencia del pensamiento?\", se evidenciaba:", "o": ["Una explosión de imágenes sensoriales coloridas.", "La notoria ausencia de imágenes e incluso de palabras en el proceso de comprensión.", "Un bloqueo mental total en el 100% de los sujetos."], "c": 1, "e": "\"los sujetos reflejaban la sucesión de ideas que les había llevado a comprender la frase; era notoria la ausencia de imágenes e incluso de palabras\"."}, {"q": "Cuando a Külpe se le preguntó qué es un \"ideal\", relató haber tenido \"una intuición formal rápida del sistema de Kant\". Bühler llamó a esto \"conciencia de relación\" o:", "o": ["Actividad noegénica.", "«Intenciones».", "Mecanismo de defensa."], "c": 1, "e": "\"otros actos los concibe como conciencia de relación, o como «intenciones» [por ejemplo, le preguntan a Külpe qué es un «ideal», y él responde que... tuvo «una intuición formal rápida del sistema de Kant»]\"."}, {"q": "El fenómeno descubierto por Messer que ocurre al comprender el sentido de conjunciones sin contenido sensible (como \"pero\" o \"hacia\") fue denominado:", "o": ["Imaginabilidad pura.", "Actitud de conciencia (bewusstseinslage).", "Fijación perceptiva."], "c": 1, "e": "\"Messer estudió un fenómeno que llamó «actitud de conciencia», bewusstseinslage. Es una vivencia que se presenta a veces al comprender términos como las conjunciones o las preposiciones\"."}, {"q": "Fuera de Wurzburgo, Alfred Binet llegó a conclusiones idénticas estudiando las respuestas de su propia hija sobre la persona \"F\", demostrando que:", "o": ["Su hija usaba imágenes fotográficas precisas.", "Había experimentado un pensamiento formado \"sin imágenes\" e \"incluso sin imágenes verbales\".", "El pensamiento infantil es puramente sensorial."], "c": 1, "e": "La hija contestó que pensó que F cambió de domicilio, y Binet concluye que la cadena \"es un pensamiento que se forma sin imágenes, e incluso sin imágenes verbales\"."}, {"q": "Paralelamente a los descubrimientos de Wurzburgo sobre eslabones de pensamiento \"ausentes\" de la conciencia, un autor vienés postuló que ciertas ideas mediadoras estaban en el «inconsciente». ¿De quién se trata?", "o": ["Cesare Lombroso.", "Sigmund Freud.", "Charles Spearman."], "c": 1, "e": "\"hallamos un paralelo importante a considerar en la obra de Sigmund Freud... resolvió colocarlos en el «inconsciente»\"."}, {"q": "Más adelante, los psicólogos americanos abandonaron la introspección del pensamiento de Wurzburgo y tendieron a transformar el tema en:", "o": ["Un estudio exclusivo del cerebro emocional.", "Una conducta de creación de conceptos y resolución de problemas.", "La búsqueda de las localizaciones cerebrales del alma."], "c": 1, "e": "\"los psicólogos americanos tenderán a transformar el tema del pensamiento en una conducta de creación de conceptos y de resolución de problemas, y se irá abandonando la vía introspectiva\"."}, {"q": "El psicólogo británico Charles Spearman se había formado en Alemania con Wundt y Külpe, pero le interesaba fuertemente:", "o": ["El psicoanálisis de los sueños.", "La investigación estadística hecha por Galton y Pearson en Inglaterra.", "La tipología corporal de Kretschmer."], "c": 1, "e": "\"Se había formado con Wundt, y también con Külpe... y además le interesaba la investigación estadística hecha por Galton y Pearson en Inglaterra\"."}, {"q": "Spearman consideraba la «capacidad cognoscitiva» humana o inteligencia fundamentalmente como:", "o": ["Un instrumento u organon al servicio de los deseos y acciones del individuo.", "Un mecanismo biológico inútil de retención de sílabas.", "Un reflejo medular condicionado invariable."], "c": 0, "e": "Spearman se interesó \"por el funcionamiento de la «capacidad cognoscitiva» humana o inteligencia, que consideraba como un instrumento u organon al servicio de los deseos\"."}, {"q": "En 1904, Spearman aplicó una batería de test a niños de escuelas en Berkshire para responder a una pregunta fundamental:", "o": ["¿Cuánto tiempo retienen sílabas sin sentido los niños?", "¿Es la mente una estructura unitaria, o un agregado de unidades autónomas?", "¿Qué proporción corporal determina su personalidad?"], "c": 1, "e": "\"se preguntó: ¿la mente, es una estructura unitaria, o es un agregado de unidades autónomas?\"."}, {"q": "Para analizar si las pruebas eran independientes, Spearman empleó un número estadístico que evalúa cómo los cambios de una variable van seguidos de cambios en otra. Este número es:", "o": ["El umbral absoluto.", "El coeficiente de correlación.", "El factor de ahorro."], "c": 1, "e": "\"Determinó coeficientes de correlación, «un número que indica la medida en que los cambios en una magnitud variable van seguidos de cambios correspondientes en otra»\"."}, {"q": "Spearman descubrió que los niños que obtenían buena puntuación en una prueba tendían a sacarla buena en las otras, lo que indicaba:", "o": ["Una correlación positiva entre unos test y otros.", "Que todas las pruebas medían capacidades totalmente autónomas.", "Un grave error en el metrónomo."], "c": 0, "e": "\"Encontró que... los niños que sacaban buena puntuación en una prueba tendían a sacarlas buenas en las otras. Había una correlación positiva entre unos test y otros\"."}, {"q": "Spearman observó que las puntuaciones de los test no son exactas como el análisis químico, por lo que asume que una pequeña parte de la medida es:", "o": ["Fraude.", "Error.", "Inconsciente."], "c": 1, "e": "\"hay que tener siempre en cuenta que en las puntuaciones que se obtienen en psicología hay una parte, más o menos pequeña, de la medida que ha de ser entendida como «error»\"."}, {"q": "La \"teoría de los dos factores\" de Spearman postula que en el desempeño intelectual intervienen:", "o": ["El factor herencia y el factor ambiente.", "Un factor general (g) y una serie de factores específicos (s).", "El factor verbal y el factor numérico exclusivamente."], "c": 1, "e": "\"Habría una habilidad general... «factor g»... Habría una serie de habilidades o factores específicos... Por eso se ha llamado esta la teoría de los «dos factores»\"."}, {"q": "Según Spearman, si un sujeto puntúa alto en vocabulario pero bajo en música, esto se debe a que:", "o": ["Tiene un factor \"g\" nulo.", "Aunque su factor \"g\" es alto, su factor específico (\"s\") para la música es nulo o casi nulo.", "La correlación de Pearson ha fallado."], "c": 1, "e": "Explicaría que un individuo \"puntuaría tal vez muy bajo en disposición musical, porque, aun siendo alto su factor g, su factor específico para la música fuera nulo o casi nulo\"."}, {"q": "Spearman supuso que su «factor g» era una especie de energía del sistema nervioso manifiesta en la creación de conocimiento intelectual abstracto, actividad que él bautizó como:", "o": ["Noegénesis abstracta.", "Apercepción temática.", "Asociación pasiva."], "c": 0, "e": "\"energía que aparecía en las actividades cognitivas, que él llama «noegénicas»... porque generan conocimiento, especialmente conocimiento abstracto («noegénesis abstracta»)\"."}, {"q": "La metodología cuantitativa nacida de estos estudios, que busca agrupar correlaciones para encontrar variables latentes hipotéticas determinantes de la puntuación, se conoce como:", "o": ["Introspección sistemática.", "Análisis factorial.", "Prueba proyectiva."], "c": 1, "e": "\"nació una metodología analítica cuantitativa... el método del análisis factorial. Esta es una técnica matemática que... trata de encontrar los «factores» hipotéticos\"."}, {"q": "Ofreciendo una alternativa a Spearman en 1902, Edward L. Thorndike propuso:", "o": ["Que solo existía un factor único de la inteligencia.", "Que la mente tenía una serie muy grande de factores relativamente independientes.", "Que la inteligencia dependía de los humores corporales."], "c": 1, "e": "\"Edward L. Thorndike... supuso, ya en 1902, que en la mente había una serie muy grande de factores relativamente independientes\"."}, {"q": "Situándose entre Spearman y Thorndike, el psicólogo estadounidense Louis L. Thurstone propuso estructurar la inteligencia en:", "o": ["Una teoría psicoanalítica.", "Un cierto número de grandes factores de grupo, llamados «habilidades mentales primarias».", "Una tipología corporal basada en 4 somatotipos."], "c": 1, "e": "\"Louis L. Thurstone... propondría un cierto número de grandes factores de grupo, a los que vino a llamar «habilidades mentales primarias»\"."}, {"q": "Históricamente, ¿qué discípulo de Aristóteles escribió en la antigua Grecia un tratado sobre \"Los caracteres\", describiendo figuras típicas como el vanidoso o el hipócrita?", "o": ["Hipócrates.", "Teofrasto.", "Galeno."], "c": 1, "e": "\"Teofrasto (370-287 a. C.), discípulo de Aristóteles, confeccionó un tratado sobre Los caracteres, en el que describía las figuras típicas\"."}, {"q": "A finales del siglo XIX, ¿quién defendió la existencia de un tipo de personalidad del \"criminal nato\", caracterizado por estigmas degenerativos corporales?", "o": ["Cesare Lombroso.", "Hermann Rorschach.", "Ernst Kretschmer."], "c": 0, "e": "\"el italiano Cesare Lombroso (1835-1909) defendió... un tipo de personalidad, propia del «criminal nato»... marcada por ciertos estigmas degenerativos\"."}, {"q": "A principios del siglo XX, el psiquiatra Ernst Kretschmer buscó establecer tipologías vinculadas al hábito corporal heredado. A esto lo llamó:", "o": ["Temperamento fluido.", "Constitución.", "Coeficiente de forma."], "c": 1, "e": "\"Llamó «constitución» al conjunto de cualidades individuales basadas en la herencia y reflejadas en un determinado hábito o tipo corporal\"."}, {"q": "¿Cuáles son los cuatro tipos corporales de la clasificación de Kretschmer?", "o": ["Sanguíneo, flemático, melancólico, colérico.", "Leptosómico, atlético, pícnico y displásico.", "Endomorfo, mesomorfo, ectomorfo, atípico."], "c": 1, "e": "\"Distinguió cuatro tipos, el leptosómico (asténico o leptosomático)... el atlético... el pícnico... y el displásico\"."}, {"q": "Según la tipología de Kretschmer, el tipo \"pícnico\" es el que presenta:", "o": ["Formas redondeadas y adiposidad.", "Formas alargadas y extrema delgadez.", "Desarrollo esquelético y muscular prominente."], "c": 0, "e": "\"el pícnico, de formas redondeadas y con adiposidad\"."}, {"q": "En sus estudios con enfermos mentales, Kretschmer encontró que los sujetos pícnicos estaban mucho más afectados por el trastorno:", "o": ["Esquizofrénico.", "Psicosis maniacodepresiva cíclica.", "Histeria de conversión."], "c": 1, "e": "\"los sujetos pícnicos aparecían mucho más afectados por la psicosis maniacodepresiva cíclica\"."}, {"q": "En contraste, ¿a qué trastorno mental patológico asoció Kretschmer el tipo corporal \"leptosomático\" o \"asténico\"?", "o": ["Trastorno de tipo esquizofrénico.", "Epilepsia.", "Psicosis ciclotímica."], "c": 0, "e": "\"mientras que el sujeto leptosomático o asténico presentaría más frecuentemente un trastorno de tipo esquizofrénico\"."}, {"q": "Derivado de sus correlaciones clínicas, Kretschmer diferenció dos perfiles de personalidad normales o tendencias caracteriales:", "o": ["Las personalidades ciclotímicas (extravertidas) y esquizotímicas (introvertidas).", "El factor \"g\" y los factores \"s\".", "Los teóricos y los empíricos."], "c": 0, "e": "\"A partir de ahí, Kretschmer distinguirá entre personalidades «ciclotímicas» extravertidas y personalidades «esquizotímicas», introvertidas e interiorizadas\"."}, {"q": "¿Cuál de las siguientes define mejor el concepto de \"test\" según la unidad estudiada?", "o": ["Una situación de laboratorio dedicada exclusivamente a medir umbrales auditivos.", "Una situación controlada, con estímulos o cuestiones estandarizadas, cuyas respuestas valoradas permiten clasificar sujetos en contraste con un criterio.", "Una técnica psicoanalítica de asociación libre puramente subjetiva sin normas de valoración."], "c": 1, "e": "\"El test... es una situación controlada, en el que se aplican al sujeto unos estímulos o se le formulan cuestiones que están estandarizadas, y en el que las respuestas pueden ser valoradas... y permiten ordenar y clasificar a los sujetos\"."}, {"q": "Creada en 1905, fue el primer instrumento utilizado para medir aptitudes de conocimiento (inteligencia) necesarias en tareas educativas:", "o": ["Escala Wechsler.", "Hoja de datos personales de Woodworth.", "Escala métrica de la inteligencia de Binet y Simon."], "c": 2, "e": "\"la escala métrica de la inteligencia de Binet y Simon, creada en 1905. Este fue el primer instrumento utilizado para medir aptitudes\"."}, {"q": "En la escala original de Binet y Simon, copiar un cuadrado y repetir una frase de 10 sílabas era una prueba esperada para niños de:", "o": ["3 años.", "5 años.", "8 años."], "c": 1, "e": "Los ejemplos citan: \"(Edad 5 años): copiar un cuadrado; repetir una frase de 10 sílabas\"."}, {"q": "Lewis Terman elaboró una importante revisión de la escala métrica de Binet en 1916. Esta revisión se conoce popularmente como:", "o": ["Batería WAIS.", "Stanford-Binet.", "Escala Army Alfa."], "c": 1, "e": "\"En 1916 hizo una importante revisión del test el americano Lewis Terman... en la Universidad americana de Stanford, (Stanford-Binet)\"."}, {"q": "Para sujetos adultos, David Wechsler ideó en 1939 una de las escalas más famosas, conocida por sus siglas:", "o": ["WAIS (Wechsler Adult Intelligence Scale).", "TAT (Test de Apercepción Temática).", "AGCT (Army General Classification Test)."], "c": 0, "e": "\"David Wechsler... hizo en 1939 una nueva escala... Se la conoce como WAIS (Wechsler Adult Intelligence Scale)\"."}, {"q": "En la escala WAIS, una inteligencia \"plenamente normal\" coincide con una puntuación de:", "o": ["85.", "100.", "115."], "c": 1, "e": "\"En su valoración, se hizo coincidir el punto medio, o inteligencia plenamente normal, con la puntuación 100\"."}, {"q": "El WAIS de Wechsler permitía facilitar tareas de orientación al evaluar separadamente dos grandes áreas:", "o": ["Memoria a corto plazo y memoria a largo plazo.", "Inteligencia verbal e inteligencia manipulativa (o ejecutiva).", "Capacidad auditiva y capacidad visual pura."], "c": 1, "e": "\"El test permite evaluar separadamente la inteligencia verbal y la manipulativa\"."}, {"q": "Durante la Primera Guerra Mundial (1917), el ejército estadounidense ideó una prueba colectiva de inteligencia para reclutas analfabetos o que no sabían leer. Se denominó:", "o": ["Army Alfa.", "Army Beta.", "Test de Laberintos."], "c": 1, "e": "\"Una está preparada para sujetos que sabían leer y otra para los que no leían. La primera se denominó Army Alfa... y la segunda, Army Beta (para no lectores)\"."}, {"q": "En la Segunda Guerra Mundial, el ejército de EE. UU. elaboró otra prueba colectiva para clasificar reclutas, conocida por las siglas:", "o": ["AGCT.", "MMPI.", "TAT."], "c": 0, "e": "\"con ocasión de la Segunda Guerra Mundial, se elaboraría otra prueba... que se conoce como AGCT (Army General Classification Test)\"."}, {"q": "Entre otros test de inteligencia y habilidades específicas mencionados en el texto que operan con estímulos visuales/figurativos se hallan:", "o": ["Los test de sílabas de Ebbinghaus y las manchas de Rorschach.", "El test de laberintos de Porteus, cubos de Kohs y matrices progresivas de Raven.", "El test de frases incompletas y el cuestionario de Woodworth."], "c": 1, "e": "\"Son muy conocidos el test de laberintos, de Porteus (1915), o el de cubos de Kohs (1915), el de matrices progresivas de Raven (1938)\"."}, {"q": "El primer cuestionario clínico estructurado (Hoja de datos personales), diseñado en 1918 para detectar inestabilidad emocional en soldados, fue obra de:", "o": ["Robert S. Woodworth.", "Henry A. Murray.", "David Wechsler."], "c": 0, "e": "\"El primer cuestionario que se ha empleado es una «Hoja de datos personales»... diseñada por el americano Robert S. Woodworth (1869-1962) en 1918\"."}, {"q": "¿En qué consisten los estímulos visuales del \"Psicodiagnóstico\" (1921) de Hermann Rorschach?", "o": ["Matrices geométricas progresivas.", "Láminas con manchas de tinta para interpretaciones proyectivas.", "Cubos con caras rojas y blancas para ensamblar."], "c": 1, "e": "\"Psicodiagnóstico (1921), consistente en unas láminas con manchas de tinta, que hace posible que el sujeto exprese o «proyecte» sus vivencias\"."}, {"q": "A diferencia de los test «psicométricos» de inteligencia, el test de Rorschach evalúa respuestas expresivas de la subjetividad individual, por lo que pertenece a la categoría de los test:", "o": ["Noegénicos.", "Proyectivos.", "Factoriales objetivos."], "c": 1, "e": "\"frente al modelo de medidas cuantitativas de los test de inteligencia... llamados usualmente «psicométricos», este es un «test proyectivo»\"."}, {"q": "En 1935, Henry A. Murray ideó el test TAT, en el cual el sujeto evaluado debe:", "o": ["Calcar un dibujo de un laberinto en el menor tiempo posible.", "Imaginar unas historias que se adapten al contenido de imágenes y escenas vagas en unas láminas.", "Repetir de memoria listas de sílabas al revés."], "c": 1, "e": "En el TAT \"el sujeto ha de imaginar unas historias que se adapten al contenido de imágenes de unas láminas, que presentan escenas vagas... revelen sus conflictos y tendencias profundas\"."}, {"q": "Creado en 1943 por Hathaway y McKinley, este es uno de los inventarios multifásicos de personalidad clínica con escalas ajustadas por comparación con pacientes psiquiátricos más usados a nivel mundial:", "o": ["El TAT (Test Apercepción Temática).", "El MMPI (Minnesota Multiphasic Personality Inventory).", "El WAIS clínico."], "c": 1, "e": "\"una de las pruebas más utilizadas en todo el mundo, el MMPI o Inventario Multifásico de Personalidad de Minnesota... creado en 1943 por los americanos Hathaway y McKinley\"."}, {"q": "El MMPI utiliza como pauta para evaluar posibles desórdenes y trastornos en las personas examinadas:", "o": ["Exclusivamente sus reflejos musculares y la fuerza de agarre manual.", "Los patrones de respuesta dados empíricamente por pacientes psiquiátricos, usados como esquema comparativo.", "La correlación de su tipo corporal atlético, pícnico o leptosómico."], "c": 1, "e": "\"se han comparado y ajustado los patrones de respuesta a los que dan pacientes psiquiátricos, de modo que las respuestas de estos sirven de esquema y pauta interpretativa\"."}, {"q": "El psicólogo matemático americano que habló de \"dos psicologías\" para referirse a la bifurcación metodológica (Experimental vs Correlacional) fue:", "o": ["E. L. Cronbach.", "Charles Spearman.", "Oswald Külpe."], "c": 0, "e": "\"Se trata, según algunos, de «dos psicologías»; así las llamó el gran psicólogo matemático americano E. L. Cronbach\"."}, {"q": "Según Cronbach, la \"psicología experimental\" aplicada por autores como Ebbinghaus se caracteriza primordialmente por buscar y analizar en una situación controlada:", "o": ["La covariación estática entre medidas de grupos naturales.", "Las relaciones e interdependencias funcionales entre variables dependientes e independientes manejadas por el experimentador.", "Los arquetipos ocultos tras test proyectivos con manchas de tinta."], "c": 1, "e": "\"psicología experimental, donde las medidas se aplican a las relaciones entre distintos procesos o variables que dependen funcionalmente unas de otras, y cuya conexión se busca mediante la situación controlada\"."}, {"q": "En cambio, la \"psicología correlacional\" utilizada por Spearman tiene como objetivo principal:", "o": ["Controlar experimentalmente las variables aislándolas del sujeto.", "Establecer la covariación entre grupos de medidas en series de variables en sujetos para explicar sus diferencias.", "Suprimir la medición cuantitativa y reemplazarla por la intuición filosófica aristotélica."], "c": 1, "e": "\"psicología correlacional. Aquí se busca establecer la covariación... entre grupos de medidas de una serie de variables que se presentan en distintos grupos de sujetos...\"."}, {"q": "La \"psicología correlacional\" se apoya esencialmente, para recabar y estructurar sus datos, en:", "o": ["La construcción y aplicación de test, medición de grupos y métodos estadísticos.", "Las lecturas reiteradas con un metrónomo y listas de sílabas.", "El método psicoanalítico de Freud y las interpretaciones de los sueños."], "c": 0, "e": "\"Esta psicología... Se apoya, desde luego, en la construcción y aplicación de test y de mediciones de grupos, analizado luego todo con metodología estadística\"."}, {"q": "El texto concluye indicando que, a pesar de usar lógicas diferentes de análisis, tanto los experimentalistas (Ebbinghaus, Külpe) como los correlacionistas (Spearman):", "o": ["Anularon mutuamente sus descubrimientos creando un caos científico sin resolver.", "Demostraron que la conciencia y la memoria son procesos sobrenaturales inmedibles.", "Fueron ensanchando el camino de la investigación psicológica en un progreso ininterrumpido desde inicios del s. XX."], "c": 2, "e": "\"Los experimentalistas... y los correlacionistas... fueron ensanchando con sus métodos y sus trabajos el camino de la investigación psicológica, en un progreso ininterrumpido\"."}];
let questions=[...originalQuestions],current=0,score=0,missed=[],retryMode=false;

function loadQuestion(){
let q=questions[current];
document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='Aplicaciones de la Psicología: revolución industrial, Ebbinghaus, Wurzburgo, Spearman, test psicológicos y psicología experimental/correlacional.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}
loadQuestion();
</script>
