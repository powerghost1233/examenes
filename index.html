<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAVID MILÁN STUDIO</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#05070d,#0b1323,#101c35);
    font-family:Segoe UI, sans-serif;
    color:white;
}

.container{
    width:90%;
    max-width:1200px;
    text-align:center;
}

h1{
    font-size:4rem;
    margin-bottom:10px;
    color:#d4af37;
    letter-spacing:3px;
}

p{
    color:#cfcfcf;
    margin-bottom:50px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.btn{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(212,175,55,0.4);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:30px;
    color:white;
    text-decoration:none;
    font-size:1.2rem;
    font-weight:600;
    transition:.3s;
    cursor:pointer;
}

.btn:hover{
    transform:translateY(-5px);
    background:#d4af37;
    color:#000;
    box-shadow:0 0 30px rgba(212,175,55,.4);
}
</style>
</head>

<body>

<div class="container">

    <h1>DAVID MILÁN STUDIO</h1>
    <p>Panel Académico 2025-2026</p>

    <div class="grid">

        <a class="btn" href="#">🧠 Neurociencia</a>

        <a class="btn" href="#">📋 Evaluación Psicológica</a>

        <a class="btn" href="#">💡 Psicología del Pensamiento y del Lenguaje</a>

        <a class="btn" href="#">🏥 Psicología Clínica</a>

        <a class="btn" href="#">📜 Historia de la Psicología</a>

        <a class="btn" href="#">🌍 Sociología General</a>

        <a class="btn" href="#">🧩 Psicología de la Memoria</a>

    </div>

</div>

</body>
</html>
