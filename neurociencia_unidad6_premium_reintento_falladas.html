<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurociencia Unidad 6 Premium | DAVID MILÁN STUDIO</title>
<style>
:root{--bg:#05070d;--bg2:#0b1323;--gold:#d4af37;--gold2:#f3d98b;--white:#f8f4e8;--muted:#aab3c5;--green:#33d17a;--red:#ff6b6b;--blue:#4da3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at top left,rgba(212,175,55,.22),transparent 34%),radial-gradient(circle at bottom right,rgba(30,90,180,.28),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2),#05070d);color:var(--white);display:flex;justify-content:center;align-items:center;padding:35px 18px}
.quiz-container{width:100%;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(212,175,55,.28);border-radius:30px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);color:var(--gold2);letter-spacing:3px;font-weight:800;font-size:13px;margin-bottom:18px;background:rgba(255,255,255,.04)}
h1{font-size:clamp(30px,5vw,54px);line-height:1;margin-bottom:10px;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{font-size:17px;color:var(--muted);font-weight:400;margin-bottom:26px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.stat{padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:800}
.progress-wrap{height:10px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin-bottom:24px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:.35s ease}
.question-card{background:rgba(4,8,16,.55);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px}
.question{font-size:21px;font-weight:800;line-height:1.45;margin-bottom:22px}
.options{display:grid;gap:13px}
.option-btn{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));color:var(--white);font-size:16px;text-align:left;cursor:pointer;transition:.25s ease}
.option-btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(212,175,55,.65);box-shadow:0 12px 30px rgba(212,175,55,.12)}
.option-btn:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.16)!important;border-color:var(--green)!important;color:#dfffea!important}
.incorrect{background:rgba(255,107,107,.16)!important;border-color:var(--red)!important;color:#ffe0e0!important}
.feedback{display:none;margin-top:22px;padding:20px;border-radius:20px;line-height:1.65;font-size:15px}
.feedback.show{display:block}.feedback-correct{background:rgba(51,209,122,.12);border-left:5px solid var(--green)}.feedback-incorrect{background:rgba(255,107,107,.12);border-left:5px solid var(--red)}
.feedback strong{font-size:18px}.solution-label{display:block;margin-top:12px;color:var(--gold2);font-weight:900}
.controls{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:16px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;transition:.25s ease}.btn:hover{transform:translateY(-2px)}
.next-btn{display:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080b12}.secondary-btn{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.14)}
.score-container{display:none;text-align:center;padding:24px}.score-text{font-size:30px;font-weight:900;color:var(--gold2);margin-bottom:18px}.result-message{color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:24px}
.medal{display:inline-block;margin:14px 0 10px;padding:12px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.10);color:var(--gold2);font-weight:900}
.missed-box{text-align:left;margin:24px 0;padding:20px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}.missed-box h3{color:var(--gold2);margin-bottom:12px}.missed-box ul{padding-left:20px;color:#dbe2f2;line-height:1.6}
.mode-label{color:var(--blue);font-weight:900}
@media(max-width:650px){.quiz-container{padding:22px}.question-card{padding:20px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="quiz-container">
  <div class="brand">DAVID MILÁN STUDIO</div>
  <h1>Mega-Test Premium</h1>
  <h2>Unidad 6 · Plasticidad cerebral. Daño cerebral</h2>
  <div id="quiz-screen">
    <div class="topbar">
      <div class="stat" id="progress-text">Pregunta 1 de 80</div>
      <div class="stat" id="score-tracker">Puntuación: 0</div>
      <div class="stat" id="mode-text">Modo completo</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="question-card">
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div id="feedback-container" class="feedback"></div>
      <div class="controls">
        <button class="btn secondary-btn" onclick="restartQuiz()">Reiniciar test</button>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Siguiente pregunta</button>
      </div>
    </div>
  </div>
  <div id="result-screen" class="score-container">
    <div class="score-text" id="final-score"></div>
    <div class="medal" id="medal-text"></div>
    <div class="result-message" id="final-message"></div>
    <div id="missed-summary" class="missed-box"></div>
    <div class="controls" style="justify-content:center;">
      <button class="btn secondary-btn" onclick="restartQuiz()">Volver a intentar todo</button>
      <button class="btn next-btn" id="retry-missed-btn" onclick="retryMissed()">Reintentar preguntas falladas</button>
    </div>
  </div>
</div>
<script>
const originalQuestions = [

        // INTRODUCCIÓN Y ESTRUCTURAS (1-12)
        { q: "¿Qué visión clásica del cerebro rompe el concepto de plasticidad cerebral?", o: ["Que el cerebro es una masa amorfa sin localización de funciones.", "Que el cerebro es una entidad fija e inmutable tras la maduración.", "Que el cerebro solo aprende durante los primeros cinco años de vida."], c: 1, e: "La plasticidad rompe con la visión clásica del cerebro como una entidad fija e inmutable tras la maduración, demostrando que se reorganiza a lo largo de toda la vida." },
        { q: "La plasticidad cerebral es fundamental clínicamente porque constituye la base de...", o: ["La medición del coeficiente intelectual exacto.", "La recuperación funcional tras un daño neurológico.", "El control de la temperatura basal corporativa."], c: 1, e: "Su relevancia clínica radica en que constituye la base de la recuperación funcional tras un daño neurológico y permite diseñar estrategias de rehabilitación." },
        { q: "Los cambios estructurales y funcionales en la plasticidad cerebral, ¿cómo se relacionan entre sí?", o: ["Son excluyentes: o hay cambio funcional o hay anatómico.", "Son independientes y ocurren en diferentes hemisferios.", "No son excluyentes, sino complementarios (los cambios estructurales sostienen los funcionales)."], c: 2, e: "Estas manifestaciones no son excluyentes, sino complementarias, ya que los cambios estructurales suelen sostener los procesos funcionales y viceversa." },
        { q: "En la corteza cerebral, tras la práctica intensiva de habilidades (como tocar un instrumento), ¿qué fenómeno se evidencia?", o: ["Cambios en la representación cortical.", "Pérdida irreversible de neuronas motoras.", "Aislamiento de la corteza respecto del cerebelo."], c: 0, e: "Estudios de neuroimagen demuestran que, tras la práctica intensiva de habilidades (como tocar un instrumento), se producen cambios en la representación cortical." },
        { q: "¿En qué estructura del cerebro adulto humano ocurre principalmente la 'neurogénesis' (generación de nuevas neuronas)?", o: ["En el cerebelo profundo.", "En el hipocampo (y zona subventricular).", "En el bulbo raquídeo."], c: 1, e: "El hipocampo es una de las pocas regiones del cerebro adulto donde ocurre neurogénesis, siendo vital para la memoria declarativa y espacial." },
        { q: "Aunque tradicionalmente vinculado al control motor, ¿en qué sinapsis se observa principalmente la plasticidad del cerebelo?", o: ["Entre las células de Schwann y los oligodendrocitos.", "Entre las fibras paralelas y las células de Purkinje.", "Entre el cuerpo calloso y el sistema límbico."], c: 1, e: "La plasticidad cerebelosa se observa principalmente en las sinapsis entre fibras paralelas y células de Purkinje, esenciales para adquirir nuevas habilidades motoras." },
        { q: "Si un paciente sufre ceguera congénita y su corteza visual es reclutada para procesar información auditiva o táctil, ¿qué tipo de plasticidad presenta?", o: ["Plasticidad intersensorial.", "Recuperación post-lesión motora.", "Atrofia selectiva funcional."], c: 0, e: "La plasticidad intersensorial permite que áreas (como la corteza visual en ciegos) sean reclutadas para tareas no visuales, optimizando recursos." },
        { q: "¿Cómo se denomina la capacidad del cerebro para reasignar las funciones de un área dañada por un accidente cerebrovascular hacia regiones adyacentes o contralaterales?", o: ["Plasticidad intersensorial cruzada.", "Recuperación tras lesión.", "Reorganización cortical por práctica."], c: 1, e: "Se conoce como Recuperación tras lesión: regiones adyacentes o contralaterales asumen las funciones de las áreas dañadas, explicando la mejoría post-rehabilitación." },
        
        // PROCESOS CELULARES Y MOLECULARES (LTP, LTD, Hebb) (13-25)
        { q: "¿Qué proceso celular se caracteriza por la formación de nuevas conexiones entre neuronas en respuesta al aprendizaje o estimulación?", o: ["Neurogénesis.", "Poda sináptica.", "Sinaptogénesis."], c: 2, e: "La sinaptogénesis consiste en la formación de nuevas conexiones sinápticas. Ocurre con intensidad en el desarrollo temprano y se mantiene en la adultez." },
        { q: "¿Cuál es el objetivo principal de la 'poda sináptica' durante el desarrollo?", o: ["Eliminar exclusivamente neuronas gliales infectadas.", "Eliminar conexiones redundantes o poco utilizadas para que las redes sean más eficientes y especializadas.", "Destruir la corteza prefrontal en exceso."], c: 1, e: "La poda sináptica elimina conexiones redundantes o poco utilizadas. Este 'afinamiento' asegura que las redes neuronales sean más eficientes." },
        { q: "¿Qué mecanismo celular es considerado el modelo más sólido para explicar el aprendizaje y la memoria mediante el fortalecimiento duradero de la sinapsis?", o: ["Poda axonal a largo plazo.", "Depresión a largo plazo (LTD).", "Potenciación a largo plazo (LTP)."], c: 2, e: "La Potenciación a largo plazo (LTP) es el fortalecimiento duradero de la eficacia sináptica tras una estimulación repetida, central para memoria y aprendizaje." },
        { q: "La Potenciación a largo plazo (LTP) depende principalmente de la entrada de un ion específico a través del receptor NMDA. ¿Cuál es?", o: ["Calcio.", "Magnesio.", "Cloro."], c: 0, e: "La LTP depende principalmente del glutamato y receptores NMDA, que permiten la entrada de calcio en la neurona postsináptica para reforzar la sinapsis." },
        { q: "¿Qué célebre neuropsicólogo propuso en 1949 que 'cuando una neurona A participa repetidamente en la activación de una neurona B, la conexión entre ambas se refuerza'?", o: ["Sigmund Freud.", "Donald Hebb.", "B. F. Skinner."], c: 1, e: "Donald Hebb propuso este postulado en 1949, principio conocido como 'aprendizaje hebbiano'." },
        { q: "Según el postulado de Hebb, ¿qué le ocurre gradualmente a aquellas sinapsis (aferencias) que NO se correlacionan con los patrones de salida de la célula postsináptica?", o: ["Se debilitan (pérdida de sinapsis impulsada por falta de correlación).", "Se calcifican formando placas.", "Se vuelven inmortales."], c: 0, e: "Según el principio de Hebb, las aferencias que no se repiten o no se correlacionan se debilitan de manera gradual o se pierden." },
        { q: "¿Qué proceso complementario a la LTP es esencial para evitar la sobresaturación de las conexiones y permitir la flexibilidad de las redes?", o: ["Apoptosis celular.", "Depresión a largo plazo (LTD).", "Neurogénesis inhibitoria."], c: 1, e: "La Depresión a largo plazo (LTD) disminuye sostenidamente la activación sináptica, evitando la sobresaturación de las conexiones." },

        // FACTORES NEUROQUÍMICOS (26-33)
        { q: "¿Cuál es el principal neurotransmisor excitador del SNC que resulta fundamental para la inducción de la LTP y la LTD?", o: ["GABA.", "Glutamato.", "Dopamina."], c: 1, e: "El Glutamato es el principal excitador; sus receptores NMDA y AMPA son fundamentales para regular la inducción de LTP y LTD." },
        { q: "¿Qué papel juega la Dopamina en la plasticidad cerebral?", o: ["Exclusivamente provocar el sueño profundo.", "Es un neuromodulador esencial que ajusta la fuerza sináptica en función de la relevancia de los estímulos (circuitos frontoestriatales).", "Actúa solo en la inhibición del daño celular."], c: 1, e: "La Dopamina va más allá de la recompensa: modula la plasticidad en circuitos frontoestriatales ajustando la fuerza sináptica según la relevancia estimular." },
        { q: "¿Qué factor de crecimiento es crucial para la supervivencia neuronal y está considerado uno de los principales mediadores moleculares de la plasticidad estructural?", o: ["Cortisol.", "Factor de necrosis tumoral.", "BDNF (Factor Neurotrófico Derivado del Cerebro)."], c: 2, e: "El BDNF es crucial para supervivencia, diferenciación y mantenimiento de sinapsis, facilitando tanto la LTP como la sinaptogénesis." },
        { q: "¿Cuál de estos neuromoduladores regula el equilibrio excitación-inhibición necesario para que los cambios plásticos no se descontrolen?", o: ["Acetilcolina.", "Serotonina.", "GABA."], c: 2, e: "El GABA, como neurotransmisor inhibidor, regula el equilibrio excitación-inhibición para que la plasticidad no se descontrole." },
        { q: "La Serotonina es un neuromodulador que está implicado principalmente en:", o: ["La modulación del estado de ánimo y en la plasticidad cortical.", "Facilitar la atención visual periférica.", "Inhibir el crecimiento del hipocampo."], c: 0, e: "La Serotonina está implicada en la modulación del estado de ánimo y en la plasticidad cortical." },

        // CICLO VITAL: INFANCIA Y ADOLESCENCIA (34-45)
        { q: "En el ciclo vital, ¿por qué el cerebro infantil tiene un número de sinapsis que excede ampliamente al del cerebro adulto?", o: ["Porque aún no se ha producido la poda sináptica, dada la intensa sinaptogénesis temprana.", "Porque los niños no aprenden nada y acumulan redes inútiles.", "Porque carecen de receptores de glutamato."], c: 0, e: "Durante la infancia hay una intensa sinaptogénesis que genera un pico de sinapsis, que luego se reducirán mediante la poda sináptica para lograr mayor eficiencia." },
        { q: "¿Cómo se denominan las ventanas de sensibilidad en la infancia donde ciertas experiencias son imprescindibles para desarrollar funciones (ej. visión binocular)?", o: ["Periodos refractarios.", "Periodos de reserva.", "Periodos críticos."], c: 2, e: "Los periodos críticos son ventanas de sensibilidad donde ciertas experiencias son imprescindibles. Si no hay estímulo (ej. visual), pueden generarse déficits irreversibles." },
        { q: "¿Quiénes evidenciaron en 1965 que si un ojo permanece privado de estímulos en el periodo crítico se generan déficits visuales irreversibles?", o: ["Stern y Cabeza.", "Hubel y Wiesel.", "Bliss y Lømo."], c: 1, e: "Clásicos experimentos de Hubel y Wiesel (1965) demostraron esto en relación al desarrollo de la visión binocular." },
        { q: "A nivel estructural, ¿qué proceso avanza notablemente durante la adolescencia incrementando la velocidad de transmisión de los impulsos eléctricos?", o: ["La generación masiva de nuevas neuronas en el lóbulo frontal.", "La mielinización.", "El desarrollo de placas de beta-amiloide."], c: 1, e: "En la adolescencia continúa la mielinización, que incrementa la velocidad de transmisión de los impulsos a través del sistema nervioso." },
        { q: "Durante la adolescencia, finaliza la maduración de una región clave para el desarrollo de las funciones ejecutivas y la regulación emocional. ¿Cuál es?", o: ["Corteza occipital.", "Corteza prefrontal.", "El cerebelo."], c: 1, e: "Durante este periodo finaliza la maduración de la corteza prefrontal, favoreciendo el desarrollo de funciones ejecutivas y regulación emocional." },
        { q: "¿Qué vulnerabilidad psicológica destaca en la adolescencia debido a la poda sináptica y las alteraciones en el equilibrio de neurotransmisores?", o: ["Riesgo nulo de sufrir estrés.", "Mayor riesgo de aparición de trastornos psiquiátricos (Selemon, 2013).", "Pérdida temporal de la visión periférica."], c: 1, e: "La vulnerabilidad es mayor, ya que la poda sináptica excesiva o alteraciones neuroquímicas contribuyen al riesgo de trastornos psiquiátricos." },

        // CICLO VITAL: ADULTO Y VEJEZ (46-55)
        { q: "En la adultez, aunque la plasticidad cerebral se estabiliza, persiste gracias a mecanismos como:", o: ["Mielinización acelerada continua.", "Mecanismos como la LTP y la LTD que modifican la fuerza de conexiones.", "Aumento exponencial del número de neuronas del lóbulo frontal."], c: 1, e: "La plasticidad sináptica persiste gracias a mecanismos como LTP y LTD, modificando las conexiones en función de la experiencia (Bliss & Lømo, 1973)." },
        { q: "En un adulto que sufre una lesión, como un accidente cerebrovascular, ¿qué papel adquiere la plasticidad funcional?", o: ["Papel destructivo total.", "Papel compensatorio (reorganización cortical postlesional).", "Papel de involución mielínica."], c: 1, e: "Adquiere un papel compensatorio: áreas perilesionales o contralaterales se reorganizan para recuperar funciones (reorganización cortical postlesional)." },
        { q: "Factores como el entrenamiento cognitivo, el estímulo social y la actividad física regular en la edad adulta promueven la liberación de:", o: ["Factores neurotróficos como el BDNF.", "Exclusivamente ácido láctico.", "GABA en exceso."], c: 0, e: "Estas experiencias promueven la liberación de factores neurotróficos como el BDNF, que favorecen la sinaptogénesis (Park & Bischof, 2013)." },
        { q: "En el envejecimiento, se observa un declive caracterizado por:", o: ["Aumento de sinapsis y neurogénesis descontrolada.", "Reducción de neurogénesis hipocampal, pérdida de sinapsis y atrofia cortical.", "Crecimiento estructural de la corteza prefrontal."], c: 1, e: "En la vejez, hay declive progresivo por reducción de neurogénesis en el hipocampo, pérdida de sinapsis y atrofia cortical." },
        { q: "Las personas mayores que participan en actividades estimulantes logran mejor preservación cognitiva. A esto se le denomina:", o: ["Reserva cognitiva (Stern, 2009).", "Demencia inversa.", "Potenciación muscular pasiva."], c: 0, e: "Se relaciona con la llamada reserva cognitiva (Stern, 2009), que permite compensar mejor el deterioro o daño mediante recursos alternativos." },
        { q: "¿Cómo se suele caracterizar la plasticidad funcional residual en la vejez en las pruebas de neuroimagen?", o: ["Por el 'apagado' total de ambos hemisferios.", "Por una mayor activación bilateral en tareas cognitivas como mecanismo de compensación.", "Por una extrema lateralización hacia el hemisferio derecho exclusivamente."], c: 1, e: "Se caracteriza por mecanismos de compensación funcional, como una mayor activación bilateral en tareas cognitivas para distribuir la carga (Cabeza et al., 2002)." },

        // CAUSAS DE DAÑO CEREBRAL (56-68)
        { q: "En un Traumatismo Craneoencefálico (TCE), ¿qué tipo de lesión se produce por fuerzas de aceleración y desaceleración que desgarran fibras nerviosas?", o: ["Hemorragia focal encapsulada.", "Lesión axonal difusa.", "Meningitis aguda."], c: 1, e: "Las fuerzas de aceleración y desaceleración interrumpen la conectividad generando daño difuso, conocido como 'lesión axonal difusa'." },
        { q: "Si un Accidente Cerebrovascular (ACV) es provocado por la ruptura de un vaso y la consiguiente extravasación sanguínea, se denomina:", o: ["ACV isquémico.", "ACV hemorrágico.", "Ataque metabólico."], c: 1, e: "Si ocurre por la ruptura de un vaso con extravasación sanguínea y compresión del tejido, se llama hemorrágico. El isquémico es por obstrucción." },
        { q: "Un infarto en la arteria cerebral media IZQUIERDA suele producir, por lo general:", o: ["Hemiplejía y afasia.", "Pérdida estricta de la visión del ojo derecho.", "Exclusivamente déficit de atención visoespacial."], c: 0, e: "Un infarto en la arteria cerebral media izquierda suele producir hemiplejía y afasia (el derecho conlleva dificultades visoespaciales y atención)." },
        { q: "¿Qué mecanismo de daño primario generan los tumores cerebrales debido a su crecimiento?", o: ["Destrucción exclusiva de las células de Schwann.", "Reducción de la presión en todo el neurocráneo.", "Efecto masa que comprime estructuras vecinas y eleva la presión intracraneal."], c: 2, e: "Su crecimiento ejerce un efecto masa que comprime estructuras y eleva la presión intracraneal, alterando la homeostasis cerebral." },
        { q: "La inflamación de las meninges que compromete la circulación de LCR y eleva la presión intracraneal se denomina:", o: ["Meningitis.", "Encefalitis viral.", "Esclerosis múltiple."], c: 0, e: "La meningitis, al inflamar las meninges, compromete la circulación de líquido cefalorraquídeo y eleva la presión intracraneal." },
        { q: "¿En qué enfermedad la etiología es autoinmune y provoca la desmielinización y degeneración axonal progresiva interrumpiendo impulsos nerviosos?", o: ["Esclerosis múltiple.", "Corea de Huntington.", "Parkinson."], c: 0, e: "En la esclerosis múltiple, la etiología es autoinmune: la desmielinización y degeneración axonal interrumpen la transmisión de impulsos." },
        { q: "Alteraciones metabólicas como la hipoxia desencadenan la liberación excesiva de glutamato. ¿Qué provoca este exceso en las neuronas?", o: ["Aumento de sinapsis sanas.", "Un fenómeno de excitotoxicidad responsable de la muerte neuronal.", "Poda sináptica beneficiosa."], c: 1, e: "La hipoxia y la hipoglucemia desencadenan fallos y liberación excesiva de glutamato, lo que conduce a un fenómeno de excitotoxicidad mortal." },
        { q: "¿Qué patología neurodegenerativa cursa con la acumulación de placas de beta-amiloide y ovillos neurofibrilares provocando atrofia de hipocampo?", o: ["Enfermedad de Parkinson.", "Enfermedad de Alzheimer.", "Esclerosis lateral amiotrófica (ELA)."], c: 1, e: "La enfermedad de Alzheimer se caracteriza por acumulación de placas beta-amiloide y proteína tau, provocando atrofia del hipocampo y deterioro de memoria episódica." },
        { q: "La enfermedad de Parkinson se origina clínicamente por:", o: ["Acumulación de glutamato intracortical.", "Degeneración de motoneuronas superiores en la médula.", "Pérdida de neuronas dopaminérgicas en la sustancia negra."], c: 2, e: "Originada por la pérdida de neuronas dopaminérgicas en la sustancia negra, afectando circuitos motores (temblor, rigidez)." },
        { q: "¿Qué enfermedad cursa específicamente con la degeneración progresiva de motoneuronas superiores e inferiores (debilidad y parálisis)?", o: ["Encefalitis.", "Esclerosis lateral amiotrófica (ELA).", "Esclerosis múltiple."], c: 1, e: "La esclerosis lateral amiotrófica (ELA) cursa con degeneración de motoneuronas superiores e inferiores." },

        // RESPUESTAS AL DAÑO (Degeneración, Regeneración, Reorganización) (69-79)
        { q: "¿Cuál es la primera respuesta observable en las neuronas tras un daño o sección nerviosa?", o: ["Multiplicación exponencial por mitosis.", "Degeneración neuronal.", "Migración radial masiva."], c: 1, e: "La primera respuesta observable tras un daño nervioso es la degeneración neuronal, manifestando el deterioro de su estructura." },
        { q: "Tras una axotomía (corte del axón), ¿cómo se llama el deterioro rápido del segmento distal separado del soma celular?", o: ["Degeneración transneuronal.", "Degeneración retrógrada.", "Degeneración anterógrada."], c: 2, e: "La degeneración anterógrada ocurre en el segmento distal (la parte del axón separada del centro metabólico), desarrollándose en horas." },
        { q: "Si la degeneración no se limita a la neurona dañada, sino que afecta a las neuronas que estaban unidas postsinápticamente a ella, hablamos de:", o: ["Degeneración transneuronal anterógrada.", "Degeneración transneuronal retrógrada.", "Regeneración colateral difusa."], c: 0, e: "La degeneración transneuronal anterógrada afecta a las neuronas postsinápticas que se comunicaban con la neurona lesionada." },
        { q: "En la regeneración neuronal de los mamíferos adultos, ¿por qué es clave el Sistema Nervioso Periférico (SNP)?", o: ["Porque carece de sinapsis complejas.", "Porque las células de Schwann liberan factores neurotróficos que estimulan y guían el rebrote axonal.", "Porque es el único con células madre totipotenciales sanguíneas."], c: 1, e: "En el SNP, las células de Schwann desempeñan un papel esencial estimulando el crecimiento axonal y guiando los axones con moléculas de adhesión." },
        { q: "¿Por qué en el Sistema Nervioso Central (SNC) la regeneración es prácticamente nula en mamíferos adultos?", o: ["Porque no hay sangre en el cerebro.", "Porque los oligodendrocitos liberan moléculas inhibidoras que bloquean activamente el rebrote axonal.", "Porque la temperatura inhibe el factor BDNF."], c: 1, e: "En el SNC, los oligodendrocitos no solo no facilitan, sino que liberan moléculas inhibidoras que bloquean activamente el rebrote axonal." },
        { q: "Según las figuras sobre modelos de regeneración (Pinel), si un nervio del SNP se lesiona PERO sus vainas de Schwann quedan intactas:", o: ["Los axones individuales suelen regenerarse hasta alcanzar su objetivo correcto.", "Se producen regeneraciones ciegas cruzadas que paralizan el miembro.", "Jamás hay regeneración."], c: 0, e: "Si la vaina de mielina permanece intacta (ej. aplastamiento), el axón puede regenerarse con relativa precisión hasta su objetivo." },
        { q: "¿A qué animales ha dirigido la ciencia gran interés porque presentan regeneración neuronal muy precisa tanto en SNP como en SNC?", o: ["Vertebrados inferiores como peces o anfibios.", "Mamíferos grandes como elefantes.", "Exclusivamente primates no humanos."], c: 0, e: "En vertebrados inferiores (peces, anfibios), la regeneración neuronal es mucho más precisa, lo que ha despertado gran interés científico." },
        { q: "En la reorganización neuronal cortical post-lesión (ej. sección de un nervio sensorial), los rápidos cambios iniciales se explican principalmente por:", o: ["El nacimiento inmediato de millones de neuronas nuevas en el área afectada.", "El fortalecimiento de conexiones preexistentes que antes estaban inhibidas.", "La reestructuración del cráneo óseo."], c: 1, e: "La rapidez sugiere que al inicio predominan ajustes y fortalecimiento de conexiones preexistentes (liberación de inhibición)." },
        { q: "A largo plazo, ¿mediante qué mecanismo estructural se forma nueva conectividad para la reorganización neuronal tras el daño?", o: ["Por el estiramiento de los ventrículos.", "Mediante la creación de nuevas sinapsis por brotes colaterales de axones intactos cercanos.", "Por calcificación neuronal inducida."], c: 1, e: "La reorganización a largo plazo probablemente dependa del crecimiento neuronal y la formación de nuevas conexiones mediante el crecimiento colateral de axones intactos." },
        { q: "Parte de las 'recuperaciones de función' observadas tras una lesión pequeña no son realmente regeneración neural, sino...", o: ["Disminución del tamaño normal del hipocampo.", "Reducción del edema cerebral o el aprendizaje de nuevas estrategias cognitivas/conductuales.", "Conversión de células sanguíneas en neuronas de la memoria."], c: 1, e: "Es importante señalar que la mejoría puede deberse a reducción del edema cerebral tras la lesión o al aprendizaje de nuevas estrategias que sustituyen funciones perdidas." },

        // REHABILITACIÓN Y CONCLUSIONES (80)
        { q: "¿En qué consiste la terapia de movimiento inducido por restricción (CIMT) en pacientes con hemiparesia post-ictus?", o: ["Forzar al paciente a usar la extremidad afectada limitando el uso de la extremidad sana.", "Masajear ambos brazos simultáneamente mientras el paciente duerme.", "Suspender la movilidad en todo el cuerpo durante semanas."], c: 0, e: "La CIMT consiste en limitar el uso de la extremidad sana para forzar la utilización de la afectada, favoreciendo la reorganización cortical." },
        { q: "Técnicas como la TMS y la tDCS, que modulan la excitabilidad cortical y facilitan la reorganización, se agrupan dentro de:", o: ["Cirugía ablativa profunda.", "Estimulación cerebral no invasiva.", "Terapias puramente de enriquecimiento ambiental."], c: 1, e: "La estimulación magnética transcraneal (TMS) y por corriente directa (tDCS) son técnicas de Estimulación cerebral no invasiva." },
        { q: "El 'Enriquecimiento ambiental' (estimulación física, social, intelectual continuada) ha demostrado favorecer notablemente en el cerebro adulto la:", o: ["Atrofia selectiva para ahorrar energía.", "Sinaptogénesis y la neurogénesis, especialmente en el hipocampo.", "Inhibición permanente del BDNF."], c: 1, e: "El enriquecimiento ambiental favorece la sinaptogénesis y la neurogénesis (especialmente en el hipocampo), retrasando el deterioro asociado al envejecimiento." }
    
];

let questions=[...originalQuestions],currentQuestion=0,score=0,answered=false,missedQuestions=[],retryMode=false;
const questionText=document.getElementById('question-text'),optionsContainer=document.getElementById('options-container'),feedbackContainer=document.getElementById('feedback-container'),nextBtn=document.getElementById('next-btn'),progressText=document.getElementById('progress-text'),scoreTracker=document.getElementById('score-tracker'),quizScreen=document.getElementById('quiz-screen'),resultScreen=document.getElementById('result-screen'),finalScore=document.getElementById('final-score'),finalMessage=document.getElementById('final-message'),progressBar=document.getElementById('progress-bar'),missedSummary=document.getElementById('missed-summary'),retryMissedBtn=document.getElementById('retry-missed-btn'),modeText=document.getElementById('mode-text'),medalText=document.getElementById('medal-text');
function loadQuestion(){answered=false;feedbackContainer.style.display='none';feedbackContainer.className='feedback';feedbackContainer.innerHTML='';nextBtn.style.display='none';const q=questions[currentQuestion],total=questions.length,percent=Math.round((currentQuestion/total)*100);progressText.innerText=`Pregunta ${currentQuestion+1} de ${total}`;progressBar.style.width=`${percent}%`;modeText.innerHTML=retryMode?'<span class="mode-label">Modo repaso: falladas</span>':'Modo completo';questionText.innerText=`${currentQuestion+1}. ${q.q}`;optionsContainer.innerHTML='';q.o.forEach((opt,index)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerText=opt;btn.onclick=()=>selectOption(index,btn);optionsContainer.appendChild(btn);});}
function selectOption(index,btn){if(answered)return;answered=true;const q=questions[currentQuestion],allBtns=optionsContainer.querySelectorAll('.option-btn');allBtns.forEach(b=>b.disabled=true);const correctText=q.o[q.c];if(index===q.c){btn.classList.add('correct');score++;scoreTracker.innerText=`Puntuación: ${score}`;feedbackContainer.classList.add('show','feedback-correct');feedbackContainer.innerHTML=`<strong>Correcto.</strong><span class="solution-label">Por qué es correcto:</span>${q.e}`;}else{btn.classList.add('incorrect');allBtns[q.c].classList.add('correct');if(!missedQuestions.some(item=>item.q===q.q)){missedQuestions.push(q)}feedbackContainer.classList.add('show','feedback-incorrect');feedbackContainer.innerHTML=`<strong>Respuesta equivocada.</strong><br>Has marcado: <b>${q.o[index]}</b><br>La solución correcta es: <b>${correctText}</b><span class="solution-label">Por qué esa es la solución correcta:</span>${q.e}`;}nextBtn.style.display='block';nextBtn.innerText=currentQuestion===questions.length-1?'Ver resultados':'Siguiente pregunta';}
function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){loadQuestion()}else{showResults()}}
function showResults(){quizScreen.style.display='none';resultScreen.style.display='block';progressBar.style.width='100%';const percentage=Math.round((score/questions.length)*100);finalScore.innerHTML=`Has acertado ${score} de ${questions.length} preguntas (${percentage}%)`;if(percentage>=90)medalText.innerText='🏆 Medalla de Oro · Dominio excelente';else if(percentage>=75)medalText.innerText='🥈 Medalla de Plata · Muy buen nivel';else if(percentage>=60)medalText.innerText='🥉 Medalla de Bronce · Base aprobada';else medalText.innerText='📚 Modo refuerzo · Conviene repasar';let message='';if(percentage>=90)message='Extraordinario. Dominas plasticidad cerebral, daño neurológico, recuperación funcional y rehabilitación.';else if(percentage>=70)message='Buen resultado. Repasa las falladas para consolidar LTP, LTD, reserva cognitiva, daño cerebral y reorganización postlesional.';else message='Conviene repasar mecanismos celulares de plasticidad, causas de daño cerebral, degeneración, regeneración y rehabilitación neuropsicológica.';finalMessage.innerText=message;if(missedQuestions.length>0){missedSummary.style.display='block';missedSummary.innerHTML=`<h3>Preguntas falladas: ${missedQuestions.length}</h3><ul>${missedQuestions.map((q,i)=>`<li>${i+1}. ${q.q}</li>`).join('')}</ul>`;retryMissedBtn.style.display='inline-block';}else{missedSummary.style.display='block';missedSummary.innerHTML='<h3>No has fallado ninguna pregunta.</h3><p>Resultado perfecto. No hay preguntas que reintentar.</p>';retryMissedBtn.style.display='none';}}
function retryMissed(){if(missedQuestions.length===0)return;questions=[...missedQuestions];missedQuestions=[];currentQuestion=0;score=0;retryMode=true;scoreTracker.innerText='Puntuación: 0';resultScreen.style.display='none';quizScreen.style.display='block';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
function restartQuiz(){questions=[...originalQuestions];currentQuestion=0;score=0;answered=false;missedQuestions=[];retryMode=false;scoreTracker.innerText='Puntuación: 0';quizScreen.style.display='block';resultScreen.style.display='none';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
loadQuestion();

</script>
