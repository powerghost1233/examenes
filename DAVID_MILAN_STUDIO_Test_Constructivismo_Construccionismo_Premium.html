<script>
const originalQuestions=[{"q": "¿En qué periodo histórico se sitúa la aparición y auge de los enfoques constructivistas y construccionistas en psicología?", "o": ["En la Ilustración del siglo XVIII.", "En la posmodernidad, hacia finales del siglo XX.", "En el Renacimiento científico del siglo XVI."], "c": 1, "e": "\"Hacia finales del siglo XX aparecen en psicología una serie de enfoques que podríamos denominar como «posmodernos». Entre estos destacan los constructivistas o construccionistas...\". [1]"}, {"q": "¿Qué aspecto fundamental de la realidad es cuestionado (con mayor o menor énfasis) por estos enfoques posmodernos frente a los paradigmas anteriores?", "o": ["El carácter «objetivo» de la realidad.", "La existencia de los procesos neurológicos periféricos.", "El condicionamiento operante de los instintos."], "c": 0, "e": "\"...el carácter «objetivo» de la realidad se pone –con mayor o menor énfasis– en cuestión. Para constructivistas y construccionistas, el sujeto de alguna forma «construye» la realidad...\". [1]"}, {"q": "Según la introducción del tema, el sujeto construye la realidad utilizando herramientas que le proporciona su comunidad. ¿Cuál es la herramienta concreta más destacada para este fin?", "o": ["El código genético mendeliano.", "El lenguaje.", "El arco reflejo incondicionado."], "c": 1, "e": "\"...cuenta con las herramientas que le proporciona su entorno social –su «comunidad»–, y en especial, una en concreto: la herramienta del lenguaje.\". [1]"}, {"q": "Los rasgos que caracterizan a los enfoques posmodernos en psicología pueden agruparse con fines didácticos en tres niveles o áreas. ¿Cuáles son?", "o": ["Metateórico, teórico y metodológico.", "Sensomotriz, preoperacional y formal.", "Fisiológico, asociativo y conductual."], "c": 0, "e": "\"Los rasgos que caracterizan a los enfoques que aparecen en la llamada posmodenidad pueden agruparse con fines didácticos en torno a tres áreas o niveles, como veremos a continuación: metateórico, teórico y metodológico.\". [2]"}, {"q": "En el nivel epistemológico, los enfoques constructivistas asumen que el conocimiento:", "o": ["Tiene una naturaleza puramente genética e innata.", "Es un reflejo directo e inalterable de la realidad física objetiva.", "Tiene una naturaleza artificial y no es una representación directa de la realidad en sí misma."], "c": 2, "e": "\"...se asume que el conocimiento tiene una naturaleza artificial. Cuando conocemos, no accedemos a una realidad externa y objetiva. El conocimiento no es una representación directa de la realidad en sí misma...\". [3]"}, {"q": "Frente a la postura objetivista tradicional que entendía la mente como un «espejo» que simplemente «reflejaba» el mundo objetivo, ¿cómo se ven los conocimientos en la posmodernidad?", "o": ["Como artificios que cumplen funciones prácticas para dar significado a los hechos.", "Como fotografías inalterables grabadas a nivel celular ciego en el tronco encefálico.", "Como engramas pasivos de información estática y absoluta."], "c": 0, "e": "\"Se pasa así de pensar que el conocimiento simplemente «refleja» la realidad, como si la mente fuera un «espejo» en el que el mundo objetivo se mira, a pensar que nuestros conocimientos son artificios que cumplen funciones prácticas.\". [3]"}, {"q": "El constructivismo considera que la actividad de conocer (hacer hipótesis, predecir y buscar control) tiene valor para garantizar la supervivencia y el desarrollo del ser humano, acercándose en este aspecto a un sentido puramente:", "o": ["Darwiniano (actividad adaptativa y evolutiva).", "Teológico medieval estático.", "Psicoanalítico freudiano de represión del ello."], "c": 0, "e": "\"El conocimiento empieza a verse así como una actividad adaptativa y evolutiva, en el más puro sentido darwiniano... tiene un valor de cara a garantizar su supervivencia y su desarrollo.\". [4]"}, {"q": "Siguiendo este símil evolutivo, ¿qué le ocurre a las ideas, teorías o hipótesis de un sujeto cuando dejan de ser explicativas o predictivas en su entorno?", "o": ["Se convierten inmediatamente en dogmas científicos inamovibles.", "Son invalidadas, sobreviviendo solo aquellas construcciones que son viables.", "Se heredan genéticamente a la siguiente generación intactas."], "c": 1, "e": "\"...pero si dejan de ser explicativas o predictivas serán invalidadas. Las teorías, ideas y creencias... están sometidas... a un continuo proceso de revisión o «selección por la experiencia». Y solo «sobreviven»... aquellas hipótesis y construcciones teóricas que son viables.\". [4]"}, {"q": "Los enfoques posmodernos cuestionan que mediante la acumulación de datos nos aproximamos a una verdad universal y absoluta. En su lugar, proponen que solo existen:", "o": ["Verdades matemáticas a priori estáticas e innatas puras.", "Verdades consensuadas en comunidades y conocimientos viables.", "Ficciones delirantes clínicas sin ningún tipo de utilidad pragmática."], "c": 1, "e": "\"Para los enfoques posmodernos no hay conocimientos verdaderos con mayúsculas, sino verdades consensuadas en comunidades y conocimientos viables.\". [4]"}, {"q": "Un postulado clave, defendido especialmente por el constructivismo radical, afirma que cuando conocemos, en realidad lo que hacemos fundamentalmente es:", "o": ["Registrar fotográficamente los lúmenes de luz del objeto exacto en la corteza.", "Captar una diferencia (nuestro conocimiento se organiza en torno a constructos relacionales de identificación y diferencia).", "Abstraer matemáticamente el número áureo platónico del objeto universal."], "c": 1, "e": "\"Otro rasgo característico... es la idea de que «conocer es captar una diferencia»... La postura constructivista defiende, al contrario, que nuestro conocimiento se organiza en torno a constructos... El conocimiento tiene así un carácter relacional, se basa en establecer un juego de identificaciones y diferencias...\". [5]"}, {"q": "El constructivismo abandona la premisa dualista tradicional al plantear que la relación entre el sujeto que conoce y el objeto conocido es de:", "o": ["Independencia total y ceguera absoluta mutua aislada estanca.", "Separación física anatómica y exclusión mutua categórica matemática pura.", "Inseparabilidad (existe una relación de interacción entre el conocedor y lo conocido)."], "c": 2, "e": "\"El constructivismo defenderá que el conocedor y lo conocido son inseparables. Esto supone una nueva ruptura... se deja a un lado la premisa de que hay una dualidad entre el sujeto y el objeto... existe una relación de interacción entre el conocedor y lo conocido.\". [6]"}, {"q": "En la posmodernidad se produce un fenómeno conocido como el \"giro lingüístico\". ¿Qué consideración especial recibe el lenguaje en esta visión?", "o": ["Se considera un simple filtro neutral pasivo para describir la realidad biológica subyacente.", "Se le otorga el papel de \"delimitar nuestras realidades\", asumiendo que habitamos universos construidos lingüísticamente.", "Se le relega a una función puramente fonética secundaria y atávica heredada del instinto animal simple de Darwin sin poder reflexivo mental analítico."], "c": 1, "e": "\"El lenguaje es la herramienta por excelencia a través de la cual elaboramos conocimientos y «construimos» la realidad. Pero el lenguaje no será visto como un mero «filtro»... El lenguaje, más bien, delimita nuestras realidades... habitamos en universos lingüísticamente construidos.\". [6]"}, {"q": "En el ámbito ontológico posmoderno, las preguntas sobre «cómo podemos conocer la realidad» (epistemología) y «qué es la realidad» (ontología) llegan prácticamente a:", "o": ["Fusionarse, asumiendo que la realidad es «construida» por el sujeto o las comunidades sociales.", "Rechazarse violentamente por la física cuántica analítica como irracionales esotéricas y pseudocientíficas póstumas medievales.", "Distanciarse irreconciliablemente creando dos disciplinas ciegas y matemáticas dogmáticas enemigas académicamente en el diván psicoanalítico asilar de la psicopatología freudiana."], "c": 0, "e": "\"...prácticamente se llega a establecer una fusión entre la epistemología (¿cómo podemos conocer la realidad?) y la propia ontología (¿qué es la realidad?)... asumen en general... que la realidad es de alguna forma «construida» por el sujeto y/o las comunidades...\". [7]"}, {"q": "Frente a la visión de los enfoques positivistas que asumían una realidad singular, tangible y fragmentable (descomponible en partes), la ontología constructivista defiende que la realidad es:", "o": ["Múltiple, compleja, construida y holista.", "Atómica, unidimensional y estática inmutable inerte muerta.", "Una alucinación psicótica clínica irrecuperable y patológica individual degenerativa neuronal asilar histérica irreversible."], "c": 0, "e": "\"Los enfoques positivistas habían asumido que la realidad es algo singular, tangible y fragmentable... En la visión constructivista la realidad es múltiple, compleja, construida y holista.\". [8]"}, {"q": "En lo referente al concepto de causalidad, la posmodernidad abandona la idea lineal simple (\"una causa antecede a un efecto\") para adoptar mecanismos de:", "o": ["Mónadas preestablecidas divinas inalterables por el ser humano pasivo mecanicista biológico atómico cerrado y sordo al medio empírico experimental.", "Reflejo medular periférico ciego exclusivamente incondicionado heredado estéril atávico pasivo asimilativo.", "Causalidad recíproca (interacciones en varios sentidos, incorporando el feedback y feed forward)."], "c": 2, "e": "\"Si los enfoques más positivistas habían asumido un concepto de causalidad «lineal»... se va a adoptar en estos nuevos enfoques una idea más compleja de la causalidad. Se empieza así a incorporar las ideas de feedback y feed forward, es decir, mecanismos de causalidad recíproca...\". [9]"}, {"q": "Desde los postulados teóricos del constructivismo, ¿cómo se concibe fundamentalmente el funcionamiento del ser humano frente al mecanicismo positivista?", "o": ["Como un ser puramente reactivo que responde mecánicamente a los estímulos.", "Como un ser proactivo, capaz de realizar comportamientos intencionales y orientados a metas.", "Como un autómata biológico regido únicamente por la segregación glandular estéril."], "c": 1, "e": "\"Una primera idea básica es que los seres humanos son proactivos, es decir, son capaces de realizar y desarrollar comportamientos intencionales y orientados a metas... A diferencia... del paradigma positivista... el ser humano es más bien un ser reactivo...\". [10]"}, {"q": "Para explicar la evolución y desarrollo del conocimiento y del sujeto, los enfoques constructivistas sustituyen las viejas teorías asociacionistas (que veían el cambio como algo cuantitativo) por:", "o": ["Teorías morfogenéticas (el cambio implica la aparición de estructuras nuevas y cualitativas a partir de otras previas).", "Teorías biométricas craneales estáticas frenológicas (el cambio depende del peso del cráneo en kilos anatómicos puros).", "Modelos mecanicistas de poleas y palancas isomorfas topológicas ciegas matemáticas en laberintos ciegos rústicos pavlovianos."], "c": 0, "e": "\"A la hora de tratar de comprender y explicar el funcionamiento humanos se pasará... de teorías asociacionistas a teorías morfogenéticas... El constructivismo, alternativamente, aporta una visión morfogenética, según la cual en el cambio... se producen variaciones de complejidad, es decir, cambios cualitativos.\". [11, 12]"}, {"q": "¿Dónde sitúan los enfoques constructivistas y construccionistas la frontera o el límite que separa e independiza claramente \"lo peculiar del individuo\" frente a \"lo que proviene de su entorno social\"?", "o": ["Lo sitúan en el grosor anatómico físico de la piel y el cráneo humano hermético biológico estéril cerrado puro asilar aislado y asocial y mudo natural orgánico.", "Admiten que estos límites empiezan a desdibujarse; el individuo y su identidad están \"distribuidos\" y se transforman en la interacción.", "Asumen que no existe individuo físico en absoluto, siendo todos una ilusión holográfica cósmica extraterrestre virtual pasiva."], "c": 1, "e": "\"...pero con la llegada del constructivismo y del construccionismo... los límites entre el individuo y su mundo –especialmente, su mundo social– empiezan a desdibujarse... La interacción... es una negociación... Se empieza a ver que la identidad e incluso el «mundo interior» de la persona... son en realidad algo distribuido...\". [13]"}, {"q": "En el nivel metodológico, frente a los tradicionales métodos destinados a \"descubrir\" o \"describir\" objetivamente el mundo, la investigación constructivista tiene preferencia clara por:", "o": ["Los métodos puramente estadísticos y las campanas de Gauss en laboratorio frío inorgánico de animales de la caja operante de Skinner molecular atómica pura matemática vacía ciega e incondicionada letárgica instintiva pasiva.", "Los métodos comprensivos (orientados a comprender los significados que personas y comunidades atribuyen a sus experiencias).", "La parapsicología adivinatoria mística del tarot astral adivinatoria decimonónica espiritualista londinense charlatana irreal mágica astrológica chamánica prehumana asimilativa profunda atávica."], "c": 1, "e": "\"Una característica en este sentido es la preferencia de métodos comprensivos frente a métodos descriptivos... la investigación constructivista se centra en comprender los significados que personas y comunidades atribuyen a sus experiencias.\". [14]"}, {"q": "Según Kenneth Gergen, un rasgo clave metodológico del constructivismo es el paso hacia \"investigaciones colaborativas\". En ellas, a los participantes:", "o": ["Se les considera verdaderos sujetos activos que aportan su propia perspectiva (investigaciones \"multivoces\").", "Se les reduce a meros \"objetos de estudio\" pasivos y numerados algorítmicamente en la estadística ciega asilar inorgánica.", "Se les obliga coercitivamente a repetir el dogma impuesto por el líder autocrático del experimento tiránico prusiano decimonónico del horror estático cerrado asilar sordo de obediencia ciega y castigo eléctrico aversivo mudo visceral pasivo y mudo."], "c": 0, "e": "\"...se desarrollarán investigaciones «multivoces», en las que las múltiples y diversas personas implicadas... pueden aportar su propia perspectiva... participando activamente, de tal forma que se les considera como verdaderos sujetos activos y no como meros «objetos de estudio».\". [15]"}, {"q": "Respecto a la selección de métodos, la postura constructivista se puede calificar de pragmática y abierta, ya que defienden:", "o": ["La imposición dictatorial de un \"único método experimental verdadero\".", "La conveniencia de la multiplicidad de métodos, sin prescribir ni descartar ninguno por principio.", "El abandono total de la palabra escrita para usar únicamente dibujos topológicos ciegos y vectores de Lewin."], "c": 1, "e": "\"Los enfoques constructivistas y construccionistas plantean, además, la conveniencia de la multiplicidad de métodos frente a la idea de que existe un «único método mejor». En principio, la metodología de estos enfoques tiene un carácter abierto...\". [16]"}, {"q": "Dado que desconfían de que los resultados puedan ser siempre generalizables y universalmente válidos en todo momento histórico, los constructivistas prefieren usar:", "o": ["Métodos ideográficos (estudiando individuos y comunidades concretos para conocer su idiosincrasia particular).", "Métodos nomotéticos y de probabilidad matemática de masas estadísticas puramente atómicas de Galton asilar biométrica frenológica aislada inanimada pasiva ciega mecanicista de reflejos somáticos ciegos repetitivos incondicionados atávicos.", "El electroencefalograma de Hans Berger y el marcador radiactivo venoso puro de positrones estático radiológico mudo e inorgánico pasivo."], "c": 0, "e": "\"Defenderán así la conveniencia de usar métodos ideográficos frente a los métodos nomotéticos. Así, se enfocarán hacia el estudio de individuos y comunidades concretos, accediendo a su idiosincrasia...\". [17]"}, {"q": "En el ámbito de la investigación constructivista, a diferencia del paradigma de que \"la investigación científica es aséptica e inmaculada\", autores como Lincoln y Guba asumen:", "o": ["Que la ciencia debe eliminar por ley todo juicio humano extirpando el lóbulo frontal analítico investigador subjetivo biológico activo.", "Que la investigación reconoce innegablemente la influencia de los valores personales, sociales o el paradigma del investigador.", "Que el único modo de ser científico es realizar experimentos a oscuras de noche sin consciencia con ratas blancas dóciles de Skinner aisladas."], "c": 1, "e": "\"Finalmente, estos enfoques van a reconocer la influencia de los valores en la investigación, por contraposición a la idea de que la investigación científica es aséptica. Tal como plantean Lincoln y Guba, el constructivismo reconoce que toda investigación explícita o implícitamente parte de una serie de valores...\". [18]"}, {"q": "¿Qué pensadores son habitualmente encuadrados bajo el epígrafe del \"constructivismo radical\"?", "o": ["B. F. Skinner, I. Pavlov, J. Watson y E. Thorndike.", "S. Freud, C. Jung y A. Adler.", "Von Glasersfeld, Von Foerster, Riedl, Watzlawick, Maturana y Varela."], "c": 2, "e": "\"Bajo este epígrafe se puede mencionar a autores como Von Glasersfeld, Von Foerster, Riedl, Watzlawick, Maturana y Varela.\". [19]"}, {"q": "El postulado fundamental del constructivismo radical afirma que el organismo accede a la realidad externa percibida:", "o": ["Solo indirectamente, gracias a una compleja serie de transformaciones neurológicas creadas por el sujeto como agente proactivo.", "De manera directa, fotográfica, inmaculada y pasiva como un espejo pulido y matemático de física cuántica inerte inorgánica.", "Mediante el arquetipo místico esotérico heredado filogenético puro onírico profundo e incondicionado instintivo atávico darwiniano."], "c": 0, "e": "\"Esta corriente constructivista sostiene que existe una realidad externa, pero que las personas u organismos solo pueden percibirla indirectamente gracias a una compleja serie de transformaciones neurológicas.\". [19]"}, {"q": "¿Por qué el investigador Lyddon denominó a este enfoque como \"constructivismo material\"?", "o": ["Porque afirma que el alma es inmaterial, inmortal, divina e inextinguible platónica pura esotérica asilar en un limbo teológico pre racional místico mágico irracional atópico ciego estático atómico.", "Porque hace énfasis en que la materia o estructura biológica de la que está hecho el organismo (su sistema perceptual) determina inevitablemente aquello que le es posible conocer y percibir.", "Porque basan todos sus experimentos en pesar en kilogramos puros exactos inorgánicos atómicos matemáticos asilados el cuerpo humano cadavérico inerte pasivo muerto inanimado forense de criminales natos extintos lombrosianos inactivos."], "c": 1, "e": "\"Lyddon ha denominado a este enfoque «constructivismo material», ya que pone su énfasis en la idea de que la estructura del organismo, es decir, la materia de la que está hecho el conocedor, determina aquello que es conocido.\". [20]"}, {"q": "A menudo, el constructivismo radical es criticado teórica y filosóficamente acusándolo de caer en la creencia o en el abismo de la \"soledad cognoscitiva\" pura o de negar la realidad exterior ajena a uno mismo, también llamada o conocida formalmente como el error de:", "o": ["Solipsismo (o idealismo).", "Frenología y correlación geométrica descriptiva biométrica campanal de Gauss probabilística asilar eugénica racista estática abstracta fría criminal forense craneal asilar.", "Asociacionismo conductista reflexológico de segundo orden molecular y motor incondicional asimilativo visceral glandular periférico y aversivo silente."], "c": 0, "e": "\"Incluso se ha criticado a este enfoque por su proximidad al solipsismo... ¿No sería esta corriente una nueva forma de idealismo?\". [20]"}, {"q": "¿Qué brillante recurso conceptual exponen Maturana y Varela en su teoría biológica del conocimiento para evitar la trampa de ser tildados de idealistas ciegos o de solipsistas radicales puros?", "o": ["Recurren a la represión superyoica edípica inconsciente letárgica asilar onírica de diván y catarsis profunda.", "Recurren a la noción de perspectiva y contabilidad lógica.", "Postulan un isomorfismo psicofisiológico exacto como los padres originales y precursores teóricos formales asimilativos puros de la Gestalt clásica germana."], "c": 1, "e": "\"Maturana y Varela escapan del solipsismo recurriendo a la noción de perspectiva y contabilidad lógica. Para estos autores, hablar de idealismo y objetivismo es el resultado del posicionamiento que adopta el observador...\". [21]"}, {"q": "Los autores Maturana y Varela lo expresan de forma concisa y paradigmática. ¿Cuál de estos es su célebre aforismo ontológico de perspectiva ineludible al narrar la realidad?:", "o": ["«El fin siempre justifica y exige la suma de todas sus valencias espaciales lewinianas topológicas cóncavas y negativas en laboratorio aislado oscuro estático sin humanos asilados».", "«El todo orgánico mecanicista canino salival es abrumadoramente menor que el nivel reflejo de sus partes incondicionales atávicas genéticas y somáticas instintivas muertas».", "«Todo lo dicho es dicho por alguien» (y «todo hacer es conocer y todo conocer es hacer»)."], "c": 2, "e": "\"Hay dos aforismos que describen muy bien la postura de Maturana y Varela: «todo lo dicho es dicho por alguien» y «todo hacer es conocer y todo conocer es hacer».\". [22]"}, {"q": "Von Foerster asume que \"conocer\" equivale a un proceso ilimitadamente recursivo en el que calculamos y elaboramos símbolos formales de la realidad. ¿Qué palabra técnica usa Foerster para definir esta asimilación u ordenamiento asombroso mental?:", "o": ["Lobotomizar visceralmente las glándulas motoras en bucle silente vegetativo parasimpático automático.", "Computar (calcular o \"computar descripciones de la realidad\").", "Condicionar aversivamente el instinto incondicionado de evitación gástrica atópica pasiva letárgica y muda refleja medular profunda asimilada biológica."], "c": 1, "e": "\"Para él, computar se define como «toda operación... por medio de la que se transforman, modifican... entidades físicas observadas...». Y en este sentido, conocer equivale a computar una realidad... computar descripciones de una realidad.\". [22]"}, {"q": "Puesto que desde la neurofisiología \"cada descripción mental propia es a su vez otra descripción de la descripción\" en un proceso mental recursivo en el que nunca tocamos el \"objeto puro en sí\", Von Foerster sortea el problema de caer en el solipsismo aislado recurriendo a:", "o": ["El ensayo y error mecánico ciego con cajas rompecabezas de laberinto de Thorndike en ratas americanas mansas inorgánicas silenciosas pasivas.", "La glándula pineal de Descartes dualista estática metafísica teológica inabarcable sin comprobación en tubo de ensayo físico químico.", "La idea de intersubjetividad y la comunidad humana (darnos cuenta que la representación asombrosa que nos hacemos nosotros de nosotros mismos es paralela y es similar al constatar a la representación humana que hacemos o presenciamos de \"otros\" seres reales humanos parecidos vivos, deduciendo pragmáticamente la existencia exterior ajena)."], "c": 2, "e": "\"No obstante, Von Foerster (1990) introduce la idea de intersubjetividad para escapar del problema del solipsismo... Von Foerster abre así paso a una idea muy sugerente: la comunidad y la intersubjetividad como criterios de realidad.\". [23, 24]"}, {"q": "De este modo, al tratar de investigar y asomarnos la \"identidad personal\" (sí mismo o self) desde el constructivismo radical, la psicología no persigue ciegamente \"descubrir la esencia pura y definitiva o inmutable en sí verdadera innegable interior estática de la persona oculta en ella\" porque en última instancia el self o el yo para el radicalismo constructivo no es otra cosa natural que:", "o": ["Una construcción más (una representación mental y computación activamente elaborada de perspectiva dada, tanto el propio yo como el ajeno).", "Un alma mística teológica medieval irrefutable puramente esotérica de luz astral.", "Una estructura biológica genética puramente anatómica estática hereditaria y física celular atómica de número y cálculo medible con láser asombroso estroboscópico de fotones cuánticos estériles de isótopos marcadores inorgánicos incoloros biométricos asilares puristas ciegos mecánicos."], "c": 0, "e": "\"...se dejará a un lado la pretensión de tratar de conocer un «sí mismo» esencial... Por tanto, cualquier cosa que digamos acerca del «yo»... del self, sería una construcción, una computación más.\". [25]"}, {"q": "Al hablar de interacciones sociales, Watzlawick desarrolló un concepto que explica cómo las personas atribuyen significados dispares o categóricos opuestos o intenciones diferentes a los demás basándose en cómo \"ordenan\" y \"fijan\" subjetivamente el comienzo o final de su conflicto interaccional o secuencia (ej. el marido que se retrae porque la esposa le regaña, y ella que le regaña porque él se retrae pasivo mudo sin fin circular asimilado). Este interesantísimo fenómeno o proceso humano comunicativo de perspectiva asimilada es bautizado técnica o formalmente y por todos como el concepto de:", "o": ["La extinción masiva demorada pasiva operante letárgica visceral simple mecánica ciega.", "La puntuación (de la secuencia de acontecimientos).", "El insight profundo o iluminación gestáltica de la reestructuración de la cuasinecesidad gástrica alimenticia asimilada y biológica estricta darwinista innata fodoriana modular ciega de campo esférico pasiva atómica e inorgánica."], "c": 1, "e": "\"...cabe destacar aquí el concepto de «puntuación» desarrollado por Watzlawick: los distintos participantes en una interacción social pueden ordenar la secuencia de acontecimientos... de forma diferente, dependiendo de la diferente posición o perspectiva...\". [26]"}, {"q": "En la teoría del constructivismo radical biológico, \"aquello que ineludiblemente define la identidad misma inconfundible íntima y vital de un objeto o de algo, o sea aquello que asombrosamente hace o lo constituye obligando a que un organismo sea forzosamente lo que es (es decir, aquellos elementos necesarios constitutivos de base y relaciones entre ellos sin los cuales dejaría de serlo en el acto y pasaría a ser otra cosa extraña o moriría en sus formas)\" se designa teóricamente como su:", "o": ["Mónada cuántica silente subcelular pasiva estática asilar de valencia estéril sin vida.", "Organización.", "Reflejo medular parasimpático inhibido latente oculto aversivo letal y puramente animal mudo irracional atávico fosilizado esotérico primitivo ciego pasivo ciego pasota en inacción orgánica total absoluta abstracta sorda matemática aislada."], "c": 1, "e": "\"La organización es aquello que define la identidad de algo, lo que hace que un organismo u objeto sea lo que es... más que por una «esencia», esta organización viene determinada por los elementos que necesariamente la componen, así como por las relaciones... si cambiara la organización... el objeto dejaría de ser lo que es.\". [27]"}, {"q": "Por contraposición a la \"organización\" basal definitoria, la \"configuración concreta de esos mismos elementos y de cómo están temporalmente conformadas y orquestadas sus uniones y relaciones accidentales o en un momento dado, y que asombrosamente puede fluir variar cambiar o diluirse o modificarse plenamente del todo sin que el objeto o persona sufra pérdida o alteración alguna en su identidad basal íntima profunda\", se describe analíticamente con el término teórico u idea conceptual fundamental formal sistémica e biológica de la:", "o": ["Latencia fotométrica.", "Estructura.", "Estadística descriptiva de la varianza mística nula y de campana pasiva estéril aislada matemática fría desprovista de realidad tangible u observable empírica fenomenológica asombrosa descriptiva humanista libre existencialista constructiva interactiva holística asimilativa integradora viva biológica pragmática dinámica en campo."], "c": 1, "e": "\"La estructura, en cambio, es un concepto más periférico. Haría referencia a la configuración concreta de los componentes... en un momento dado. La estructura puede variar sin que por ello se vea modificada la organización, es decir, sin que el objeto cambie su identidad...\". [27]"}, {"q": "A la propiedad por la que los organismos vivos y los seres se inclinan natural, incesante u obstinadamente a tender u obrar con el objetivo directo y biológico u asimilativo de preservar intacta su organización (tendiendo a reproducir sus mismas estructuras de conocimiento o identidades vitales o reponerse ante daños del devenir preservando el todo orgánico vital vivo), se la bautizó o conoce en los anales del constructivismo biológico como la magna tesis de:", "o": ["La biometría eugénica racista asilar cadavérica forense estéril del análisis criminal pasivo sordo craneal frío estático ciego instintivo de lóbulo asimétrico y criminalismo incondicionado de la locura moral.", "La represión edípica letárgica del instinto ciego animal arquetípico atópico primitivo de sombra latente de incesto en trance sugerido sugestivo onírico catártico infantil puramente oral y anal.", "Autopoiesis."], "c": 2, "e": "\"El concepto de autopoiesis incide en la idea de que los organismos tienden a preservar su organización y que, por tanto, tienden a reproducir las estructuras de conocimiento con las que cuentan previamente.\". [28]"}, {"q": "En consonancia a lo anterior, y al intentar comprender las asombrosas capacidades humanas u biológicas regulativas directrices del organismo frente a fuerzas exógenas o dictados del medio empírico hostil o de las normas del afuera, Von Foerster decreta que un sistema u organismo se dice que es o demuestra ostentar su propia \"autonomía\" verdadera interna vital plena de carácter biológica y operativa constructiva pura en sí cuando llanamente en esencia el individuo es capaz lógicamente ineludible o asombrosa de:", "o": ["Languidecer y morir letárgico asfixiado de modo abúlico ciego pasota frente al plátano colgado fuera de su envergadura atópica mecanicista en el lúgubre campo fodoriano modular mudo ciego y cínico.", "Quedarse mudo inactivo pasivo vegetal onírico sin acción alguna paralizado de manera irreversible atávica darwiniana pasiva en trance profundo catártico de disociación esquizoide severa irrecuperable y letal inorgánica aislada en sala.", "Reglamentar su propia reglamentación, de especificar internamente o de darse y elaborar libre y auto-constructivamente de forma interna su propia legalidad de acción desde sus propios términos."], "c": 2, "e": "\"El concepto de autonomía indicaría otro rasgo... son capaces de autorregularse, de darse sus propias normas, y de funcionar en sus propios términos... Von Foerster sostiene que un organismo es autónomo cuando «reglamenta su reglamentación».\". [28]"}, {"q": "Respecto de su postura sobre el conocimiento, ¿qué enorme matización y diferencia notable introduce el \"constructivismo crítico o cognitivo\" (Feixas, Mahoney, Neimeyer) frente a la visión previa radical para alejarse un poco de las críticas al esoterismo o negación de la realidad u solipsismo pasivo mudo extremo?", "o": ["Argumentan que la mente es una ilusión y que todo obedece a un magnetismo astral cósmico atópico pasivo esotérico de charlatanes y puros cartománticos silentes irracionalistas de magia astrológica eclesiástica lúgubre decimonónica o victoriana de espiritistas mudos en letargo estático de ultratumba muerta pasiva e irracional biológica atávica pasota.", "Plantean y defienden de modo realista asimilativo e innegable de carácter moderado que \"la realidad exterior y el sujeto y objeto cognoscente son plenamente interdependientes\", asumiendo que esa misma realidad en sí empírica externa no solo existe de verdad asombrosa sino que activamente le \"impone límites reales o condiciones extrasistémicas innegables a las construcciones o hipótesis que él fabrique y elabore, invalidando con dureza pragmática las que no son viables e imposibles\".", "Abrazan fervientemente la cruda física positivista asociacionista de Hull en que las mentes son meras máquinas incondicionadas de respuesta-estímulo (\"S-R\") aversivas letárgicas glandulares caninas esqueléticas muertas pasivas estáticas irracionales inorgánicas moleculares de reflejo mudo ciego mecanicista asimilado sin mediación activa analítica de procesado."], "c": 1, "e": "\"El constructivismo crítico o cognitivo matizará esa idea, planteando que el sujeto y la realidad son interdependientes... la realidad tiene una estructura propia que «pone límites externos... que limitan e influyen... la construcción continuada de cada persona...»\". [29]"}, {"q": "El constructivismo crítico u cognitivo hereda sus raíces u bebe teóricamente y fuertemente en su postulado teórico metodológico principal filosófico e ideológico formal en la inmensa u famosa o asombrosa obra y matriz de base teórica psicológica original norteamericana elaborada y desarrollada fundamental e innegable formalmente y conocida y citada referencialmente por todos a nivel general clínico psicosocial asimilativo empírico en la historia o literatura mundial por el autor:", "o": ["La teoría algorítmica de la Gramática Universal innata de Fodor y Chomsky modular innata biológica genética pre lógica muerta incondicionada estéril sintáctica pasiva atávica sorda en el cerebro inactivo del simio canario.", "La Teoría de los Constructos Personales de George Kelly (enfatizando enormemente el carácter marcadamente personal, único biográfico constructivo e idiosincrático subjetivo de base de nuestras previsiones o hipótesis para abordar el devenir asimilativo existencial y mundo empírico).", "La teoría topológica o de la Mónada pasiva matemática asimilativa teológica eclesiástica pre humana pura purista estática estéril inorgánica pasiva de las glándulas motoras periféricas viscerales mudas silentes pavlovianas asilares muertas ciegas siberianas atómicas y puramente gástricas molares incondicionales irracionales mecánicas simples automáticas pre racionales pre lógica."], "c": 1, "e": "\"...pero, muy influidos por la teoría de los constructos personales de George Kelly, esta corriente enfatiza el carácter personal de estas construcciones.\". [30]"}, {"q": "Redefiniendo o apropiándose y puliendo la vieja herramienta de lo inconsciente del psicoanálisis puro y aportándole nueva funcionalidad, esta perspectiva constructiva y cognitiva crítica habla e introduce fuertemente la idea de los denominados \"procesos tácitos de la actividad mental\", es decir:", "o": ["Las huellas mnémicas atávicas del tótem primitivo en regresión hipnótica aversiva.", "Reflejos pasivos de extinción o somáticos atómicos ciegos musculares.", "Estructuras profundas o reglas de organización (tácitas, implícitas e inconscientes, que no se guían por represión y pulsiones instintivas sino que ordenan, estructuran y asimilan el límite de aquello que podemos o no asimilar en la experiencia viva cognoscitiva)."], "c": 2, "e": "\"...concederá un papel muy relevante a lo tácito y lo implícito... Retomará... el concepto de inconsciente, pero quitándole su sentido freudiano... Guidano afirmará que «los procesos tácitos... son estructuras profundas de reglas de organización que ordenan la experiencia...»\". [30]"}, {"q": "La emoción y el desajuste emocional, en esta concepción constructivista crítica cognitivista unificada e indisociable y activa vitalista integral existencial (ej. sufrir ansiedad o tristeza súbita), no se percibe desde un modelo negativo de avería u rotura física o locura médica, sino por todo lo contrario de manera fenomenológica funcional y útil como que estas experiencias en realidad nos están asombrosamente dotando del valor utilísimo adaptativo claro y sano como:", "o": ["El llanto y gemido pre verbal arquetípico mudo histérico pasivo ciego instintivo fóbico del bebé y animal darwiniano extinto asilar de herencia mendeliana muerta pasiva e inactiva puramente motriz.", "Una \"señal\" de información asimilativa adaptativa utilísima profunda que alerta a la persona en directo de que está ocurriendo un evento grande y transformador asimilativo profundo en su sistema y matriz de constructos frente a la realidad externa cambiante que empuja validando o refutando en el mundo.", "Una patología atópica pura cínica psiquiátrica clínica inerte y catártica irreversible que degenera puramente el soma de la corteza y produce lobotomía o parálisis pasiva onírica de trance mudo sin utilidad racional lógica y adaptativa integradora empática constructiva y solidaria pragmática lógica."], "c": 1, "e": "\"Cuando ocurre un desajuste emocional... no es este realmente el núcleo del problema, sino que las emociones que se experimentan son más bien una señal de que algo está ocurriendo en nuestro sistema de constructos... La emoción tiene, por tanto, un significado funcional adaptativo, es un tipo de «señal» que informa...\". [31]"}, {"q": "Desde este paradigma de Kelly, el dolorosísimo e intensísimo sentimiento humano psicosocial de \"culpabilidad\" irrumpe lógicamente de manera asombrosa en nosotros cuando el individuo percatándose asimilativa y constructivamente de repente cae en la cuenta empírica u se observa vivenciando que:", "o": ["Se halla de forma fáctica y material en flagrante contradicción y ejecutando pragmáticamente unos actos o acciones que son total e innegablemente e incongruentemente \"incompatibles\" o ajenas o antagónicas con el \"tipo central de persona (self o constructo de identidad propia personal) que toda su vida imaginó, organizó e idealizó que era él mismo asombrosamente asimilativamente\".", "Debe lógicamente purgar aversivamente sus traumas infantiles pasados atávicos en castigos puramente dolorosos sádicos y masoquistas puros en silencio inactivo mudo aislado y mudo asilar pasivo en diván freudiano en trance catártico histérico ciego onírico purista esotérico y atávico edípico sexual incestuoso primitivo de castración infantil irracional pasiva y sorda y primitiva inoperante letárgica.", "Se olvidó temporalmente por error atencional del modelo del filtro múltiple de Posner la asimilación profunda fonológica icónica puramente ortográfica de clase cerrada sintáctica estructural en la gramática universal y fodoriana de forma purista y lógica modular serial algorítmica matemática ciega pura."], "c": 0, "e": "\"La «culpa» puede aparecer cuando la persona se encuentra realizando actos que no son esperables o compatibles con los actos que realizaría el tipo de persona que siempre imaginó ser.\". [31]"}, {"q": "Al estructurar la identidad (el self) y aplicar esta teoría en el proceso clínico de recuperación y acompañamiento a clientes en psicoterapia, estos teóricos constructivistas cognitivos presuponen a nivel estratégico asombrosamente y dictaminan teóricamente sin duda alguna y asimilativamente en los manuales de su formación directriz u obra de apoyo a terapeutas que en las horas duras de terapia se van a topar siempre de frente con mayores recelos, inmensas y más duras barreras psíquicas e inquebrantables defensas, bloqueos y \"resistencias extremas dolorosas al cambio de mejora en el paciente y asombrosa y letárgica asimilativa rigidez personal\" precisamente si se le fuerza temeraria o asombrosamente e intenta al clínico cambiar e incidir profundamente a la persona tratando de alterar y remodelar directamente de su arquitectura existencial los constructos de su:", "o": ["Estructura (los periféricos).", "Sustancia blanca inorgánica atómica pura pasiva sorda en la corteza occipital muerta estática inerte inactiva somática cadavérica asilar pasiva pura cínica frenológica de rasgo nato asimétrico irracional purista.", "Organización (los constructos nucleares u definitorios identitarios y profundos centrales que le dotan asombrosamente del \"sentimiento vital de continuidad y ser él y ser único innegociablemente personal, cuya pérdida equivaldría a perder su propia identidad y sentir miedo y alienación aguda fóbica profunda u pánico vital u aniquilación al abismo y la nada de alienarse\")."], "c": 2, "e": "\"...estos van a estar condicionados por el grado en que el cliente perciba que su identidad personal –su sistema de constructos nucleares– puede verse más o menos alterado por el proceso de terapia... el terapeuta podría trabajar sobre la estructura... pero encontrará mayores dificultades si trata de modificar su organización personal.\". [32]"}, {"q": "¿A quién se reconoce abrumadoramente en el terreno como la figura histórica referencial magna académica y pionera que lanza y cataliza, define oficialmente teóricamente los cimientos fundacionales en psicología sobre los que arranca u comienza explícita y magistralmente el pujante movimiento asimilativo norteamericano de la academia denominado el \"construccionismo social\"?", "o": ["Sigmund Freud de la escuela aristocrática de hipnosis vienesa mística onírica puramente histérica y de diván inactivo pasivo mudo atópico ciego ocioso y silente sádico incestuoso atávico y regresivo purista teológico burgués aristócrata decadente y silente.", "El investigador Kenneth Gergen.", "Iván Pavlov de los perros de San Petersburgo insonorizados en cajas moleculares periféricas de letargo condicionado y motor inactivo glandular visceral ciego salival puro matemático mecánico."], "c": 1, "e": "\"El inicio de esta corriente podemos situarlo en el artículo del psicólogo social K. Gergen titulado The Social Constructivist Movement in Modern Psychology...\". [33]"}, {"q": "La concepción más profunda que revoluciona el campo del análisis posmoderno psicológico asimilando a las mentes es que el construccionismo social desplaza todo el interés del cerebro y aísla y aparta la biología de base para decretar oficial e innegociablemente que el verdadero \"lugar del nacimiento y cuna y la fragua de todos los procesos mentales e identidades y el yo en su magnitud asimilativa superior humana asombrosamente se debe indiscutiblemente u innegable e inevitablemente a\":", "o": ["El cráneo óseo esquelético asilar pasivo biológico inorgánico predeterminado inamovible estático heredado ciego anatómico forense estéril muerto.", "La cultura (o las comunidades sociales, ya que el conocimiento es creación y de colaboración conjunta social y no surge individual y aislado en ermitas o pasivamente vacío sin asimilación grupal asombrosa real y viva interactiva y lingüística pragmática social).", "El vacío interplanetario mudo de partículas estáticas cósmicas matemáticas abstractas cínicas sin materia orgánica de la estadística pura Gaussiana sin representación humana de vida sorda y ciega pasiva de campos nulos en letargo físico helado inorgánico cuántico de la gravitación atómica sorda en vacío."], "c": 1, "e": "\"Para esta corriente de la psicología posmoderna, la cultura es el lugar de nacimiento de los procesos mentales. El conocimiento sería una creación de comunidades, no de individuos o de mentes individuales aisladas.\". [34]"}, {"q": "Frente al rol minimizado anterior y caduco asimilado históricamente de la vieja psicología asilar que la miraba por encima del hombro o la marginaba (o la vieja psicología social de masas que la asimilaba u reducía simplemente de manera pobre en laboratorios al rango empírico innegociable a que tan sólo era una triste \"variable de influencia externa que rozaba ciegamente al individuo preestablecido de antes o en solitario atómicamente y prefigurado genéticamente o formado y presionado y ya cerrado que iba o vagaba por su hábitat solitario\"), el nuevo e innovador modelo revolucionario posmoderno construccionista social, invirtiendo de manera colosal o de base asimilativa el campo entero, ahora de modo imponente asume, decreta e integra asombrosa y fundamentalmente e innegablemente que lo social (la sociedad o grupo) verdaderamente:", "o": ["No nos afecta lo más mínimo pues estamos autistas y mudos incondicionalmente por herencia genética inalterable ciega pre lógica estática innata sorda cínica cerrada esotérica muerta e irrefutable inorgánica y asilar frenológica pura pasiva inactiva abstracta matemática aislada preformada.", "Participa y nos forja íntegra y asimilativamente en nuestra identidad, dándonos el lenguaje y constituyendo \"al propio sujeto o construyéndolo asombrosamente y dándole condición de persona desde cero social y cooperativamente\" de manera dinámica asimilada y negociada en el lenguaje vital.", "Opera solo estroboscópicamente como ilusión óptica abstracta geométrica fodoriana de isomorfismo silente pasivo modular ciego y sordo aversivo estéril mecánico repetitivo en laboratorio aislado sin lenguaje consciente o introspección pragmática del acto humano analítico."], "c": 1, "e": "\"La sociedad no solo influye en el individuo, sino que participa en la construcción de su identidad, de su misma condición de sujeto, individuo o persona.\". [35]"}, {"q": "Dada la esencia intrínsecamente activa de este enfoque posmoderno y pluralista, ¿qué cualidad fundamental caracteriza las dinámicas interactivas sociales para el construccionismo social?", "o": ["El inmovilismo atávico.", "La realidad social es dinámica (proceso continuo de cambio, reconstrucción de significados y nuevas pautas).", "La fatalidad de un destino teológico inmutable pasivo mecanicista y ciego sin consciencia asombrosamente mudo."], "c": 1, "e": "\"Para el construccionismo social la realidad es dinámica. Existe un proceso continuo de cambio. Los significados no son estáticos...\". [36]"}, {"q": "En contraste radical con las sectarias posiciones dogmáticas excluyentes extremas, la epistemología posmoderna relativista del construccionismo social estipula de antemano tolerante e innegablemente con una gran asombrosa base y lógica de pluralismo puro frente a las teorías en debate de la academia oficial lo expuesto asimilativamente a continuación:", "o": ["Que existe una única verdad dogmática irrefutable científica fría estadística y universal.", "No existen comunidades de conocimiento privilegiadas, pues la comprensión de la \"verdad\" siempre es un consenso o significado socialmente compartido en grupo o tradición, y no algo objetivo inmutable preestablecido ciego o eterno asimilado ciego y absoluto o de pureza metafísica.", "Que todas las verdades son patologías psicóticas irreversibles orgánicas asilares y no tienen valor adaptativo pragmático asimilativo ni cognitivo vivo empírico constructivo integrador humano."], "c": 1, "e": "\"...cuestionamiento que hace de la idea de una verdad única, objetiva, externa... No existe una única forma de conocimiento... Por otra parte, no existirían, tampoco, «comunidades de conocimiento privilegiadas»...\". [37]"}, {"q": "El lenguaje adquiere un estatus predominante en el construccionismo. Lejos de verse como una etiqueta semántica pasiva descriptiva de cosas muertas pasivas estáticas y silentes frías atómicas inorgánicas de diccionario vacío o léxico y fonológico fodoriano o estéril modular de forma sintáctica de base vacía matemática cínica aislada en laboratorio, se le percibe poderosa o pragmáticamente u ontológicamente con claridad como:", "o": ["Ruido de inercia gástrico canino de Pavlov siberiano insonorizado opaco estéril visceral ciego cínico muerto mecánico de baba y segregación salival pasiva atávica instintiva sorda irracional de reflejo pasivo simple cínico.", "Una acción social (las palabras construyen realidades, coordinan actos de humanos que configuran nuestro marco vital, a través del cual creamos nuevos órdenes empíricos).", "Un defecto congénito atávico asilar clínico del hemisferio derecho afásico paralizado mudo en diván pasota estéril de regresión hipnótica del preconsciente silente místico mudo adivinador telepático ocultista irracional y catártico."], "c": 1, "e": "\"El lenguaje se considerará fundamentalmente como acción social. No es un mero espejo de la realidad, sino que a través del lenguaje, de las palabras, de los discursos y de las narrativas, hacemos cosas... para coordinar comportamientos en la interacción social.\". [38]"}, {"q": "El propio conocimiento y discurso científico institucional académico se analiza y mira con el prisma o herramienta de la crítica analítica social, al ser considerado inevitable e innegablemente también como nada más y nada menos o llanamente en esencia asimilativamente que:", "o": ["Un libro sagrado intocable divino teológico mudo esotérico asilar mágico astrológico intocable eterno infinito de mónadas esféricas y de plomo inalterables físicas cínicas pasivas cerradas y silentes y muertas o estériles mudas eternas e indiscutibles asombrosamente de pre racionales arcanas.", "Una \"construcción social\", que puede usarse o bien para cuestionar o bien para mantener ideologías de poder o el statu quo del grupo asimilativo de las masas con evidentes dimensiones de valores y cargas políticas empíricas.", "Una alucinación colectiva de neurosis aguda amnésica terminal puramente instintiva onírica silente y de represión severa fóbica y silente irracional del animal en nosotros irracional cínico instintivo de miedo ciego y visceral."], "c": 1, "e": "\"El propio conocimiento científico, para esta perspectiva, no deja de ser también una construcción social... las construcciones científicas entran en la vida social y son usadas por la gente para sostener, cuestionar... existe también una dimensión ética en la ciencia... mantener el statu quo...\". [39]"}, {"q": "¿Qué autor es el principal exponente que ha elaborado ampliamente y con profundidad innovadora en psicología la idea del \"self\" (la identidad personal o sí mismo de uno) concebido de manera fundamental y asombrosamente no como una esencia única cerrada estática innegable interior estéril aislada mística sino de manera viva asimilativa y constructiva directamente conceptualizada u ontológicamente asimilable como una \"construcción puramente y purista de base netamente social o relacional asimilada de sus interacciones\"?", "o": ["Kenneth Gergen.", "Burrhus Frederic Skinner.", "Wilhelm Wundt."], "c": 0, "e": "\"La idea del self como una construcción relacional ha sido ampliamente elaborada desde el construccionismo social de Gergen.\". [40]"}, {"q": "Al abandonar de lleno y rechazar el viejo enfoque internalista tradicional de personalidad (el de un ego o un yo esencial interno, único biológico estático innato o inmutable biológico u orgánico), K. Gergen abraza, se apoya en, propone u postula de plano por el contrario sin medias tintas la posición o tesis asimilativa de campo psicosocial que a nivel académico oficial purista teórico empírico u literario se conoce como una posición:", "o": ["Interaccionista (enfatizando que nuestra identidad se negocia y construye enteramente asimilativamente con los \"otros significativos\").", "Solipsista (que afirma que nada existe salvo mi consciencia soñada aislada).", "Condicionada gástrica salival purista pavloviana visceral ciega mecánica o periférica celular molecular en laboratorio aislado hermético."], "c": 0, "e": "\"Gergen se opone a la creencia en un self verdadero, auténtico y personal. Dejará de este modo a un lado la idea internalista... Como alternativa, Gergen sostiene una posición interaccionista, según la cual se enfatiza el papel de la interacción social en la construcción de la personalidad.\". [40]"}, {"q": "A nivel comunicativo pragmático, cuando verbalizamos nuestra identidad contándole nuestra historia a la gente en el devenir asimilativo comunicativo de la vida real, el construccionismo social analiza este fenómeno y afirma asombrosamente que la persona individual desempeña en esa narración de identidad la posición dual fundamental innegable de ser a la vez empírica de forma incesante e irrenunciable el:", "o": ["Tótem ancestral ciego asimilado pasivo letárgico asilar atópico mítico mágico atávico irracional puro pre reflexivo sordo mudo cínico puramente animal irracional y cínico pre humano de rebaño irracional instintivo.", "Amo sádico y el esclavo histérico pasota reprimido en diván.", "Sujeto (el autor) y objeto (el protagonista o personaje) de la misma historia."], "c": 2, "e": "\"Al hablar de nuestra identidad contamos una historia, en la que somos a la vez sujeto (el autor) y objeto (el protagonista o personaje) de la misma.\". [41]"}, {"q": "Según el análisis de Gergen de la sociedad contemporánea posmoderna y sus características, el arrollador incremento, ubicuidad total asimilada y el enorme volumen creciente de los \"otros significativos\" empujado violentamente y al alza en cifras astronómicas y multiplicado por el apogeo imparable de las redes tecnológicas ha originado sociológicamente innegablemente la emergencia social empírica palpable actual de un tipo o modelo identitario u de yo psicosocial asimilativo al que este psicólogo llama y define formal académica, técnica y literalmente sin error asimilando con la frase exacta y acuñada inmortal de forma directa y referenciada el llamado:", "o": ["\"Yo cibernético termodinámico gástrico salival de Skinner modular en laberinto en T atómico incoloro ciego cerrado mudo pasivo\".", "\"Yo místico esotérico y silente abúlico de trance sugestivo astral onírico irracional asilar puro histérico fóbico inmovilista animal e instintivo de miedo letárgico estéril cínico regresivo silente\".", "\"Yo saturado\" o \"colonizado\" (debido al inabarcable número de auditorios sociales a los que atender y con quienes debemos negociar asimilando identidades variadas u a la carta o asombrosamente dispares según qué auditorio miremos)."], "c": 2, "e": "\"...nuestro «yo» sería un «yo saturado» o «colonizado». En la era de internet y las redes sociales, cada vez disponemos de una mayor cantidad y variedad de interlocutores...\". [41]"}, {"q": "Como corolario de lo anterior asimilativo o social, y compartiendo tesis valiosas y hallazgos con Hazel Markus y Paula Nurius, Kenneth Gergen dictamina y defiende en su análisis de la identidad contemporánea asimilada del hombre moderno interaccional posmoderno empírico que no poseemos u somos depositarios de forma estática o muerta un núcleo o un yo monolítico e impenetrable, sino que en realidad nuestra vida social poliédrica viva y la identidad se sostiene y apoya albergando interiormente asombrosamente y pragmáticamente los que en la literatura se conoce y define empírica referencial técnica e indiscutiblemente como los llamados teóricamente e interaccionalmente como:", "o": ["\"Possible selves\" o \"yoes posibles\" (un self \"múltiple\" repleto de heterogeneidad).", "Campos magnéticos repulsivos de valencia lewiniana puramente muertos fodorianos modulares pre lógicos estériles y sintácticos ciegos incondicionados puristas asimilativos ciegos de arcano y teología pura de pre determinismo trágico griego pre racional adivinatorio puro sin control o acción asimilativa empírica viva y pragmática resolutiva en vida y sociedad.", "Reflejos pasivos extintos de la memoria ecoica fonológica muerta de Posner atencional fotométrica estroboscópica y atópica geométrica pasota de Hull inorgánica y muerta o estática de campana de Pavlov siberiana mola y molecular asilar ciega y sorda o vegetativa atómica animal cínica y estúpida."], "c": 0, "e": "\"...En este sentido, Gergen (1997) comparte la idea de Hazel Markus y Paula Nurius acerca de los possible selves o «yoes posibles»... la idea de un self múltiple es contraria a la idea de consistencia y autenticidad del self.\". [42]"}, {"q": "En la detallada descripción de la paulatina u gradual e inexorable \"transición de paso\" que las personas contemporáneas sufren en su propia psique o identidad social moderna empírica o biográfica para ir alejándose de las amarras de verse como un ser estricto \"consistente y verdadero esencial\" rumbo hacia abrazar plenamente la multiplicidad viva, la primera gran etapa transitoria evolutiva descrita en este cambio psicosocial asombroso de la visión de la propia persona al interactuar de inicio de forma astuta u utilitaria es la de presentarse u usar el self y actuar asimilativa empírica e interesadamente como un o de ser llanamente y en la jerga de la calle un:", "o": ["Místico ermitaño de la pradera onírica en la catarsis letárgica silenciosa irracional silente atópica mística teológica regresiva adivinatoria astral pura.", "Criminal nato puramente genético eugénico racista determinista atávico asilar mudo pasivo e instintivo irrecuperable lobotomizado letárgico asimilativo frenológico.", "Manipulador estratégico (el self manipula a voluntad pero sufriendo culpa pues secretamente en el fondo sigue creyendo a escondidas erróneamente en que debe ser puro y tener de base un \"self único o coherente irreal de forma esencial oculta reprimida asimilativa\")."], "c": 2, "e": "\"La primera de ellas es la del manipulador estratégico. El self es consciente de que puede manipular su presentación ante los demás... El individuo utilizaría pragmática y estratégicamente la presentación de su self... pueden seguir pensando que el sí mismo ha de ser coherente. Y esta contradicción podría causarles sentimientos de culpabilidad.\". [43]"}, {"q": "En la segunda etapa de este cambio posmoderno asimilativo interaccional descrito del ser, el individuo empieza a atisbar pragmáticamente que su yo se asemeja y compone o está hecho de un sinfín de recortes vitales asimilados o dispares fragmentos sociales heterogéneos y variados prestados por el mundo ajeno empírico exterior. A esta etapa de hibridación psicosocial en la que se llega a ser en palabras prestadas como un ser de colores variados de supervivencia y juego de roles interaccional dinámico u \"camaleón social\" se la reconoce en la literatura de la etapa de transición de Gergen como la etapa de la:", "o": ["Personalidad de autopoiesis mecanicista molecular.", "Personalidad pastiche.", "Neurosis amnésica irreversible de la histeria parapsicológica astrológica atópica reprimida en claustro."], "c": 1, "e": "\"La segunda etapa en la transición hacia el self múltiple es la de la personalidad pastiche... La persona empieza a darse cuenta de que su self se compone de fragmentos múltiples y heterogéneos que... viene a ser un collage... Es la etapa del «camaleón social».\". [43]"}, {"q": "Finalmente y culminando el proceso de autodescubrimiento y liberación o evolución interaccional madura moderna del individuo liberado de esencias inmutables fantasmagóricas, ¿cómo se denomina la tercera y última fase final asimilativa en la que la persona ya sin culpas ni temores de asimilación e intelecto abraza y de plano se da perfecta cuenta liberadora y real de que asombrosamente su yo es totalmente innegable de forma empírica y total fruto orgánico y flexible abierto y maleable de base un producto en movimiento y de pura interacción de redes o de grupos?", "o": ["La del self mudo inorgánico o atómico fodoriano pasivo sordo incondicional matemático modular puramente algorítmico sintáctico en vacío frío ciego de inmovilidad purista letárgica asilar.", "La del self relacional (asumiendo alegremente ser un ser múltiple, flexible y abierto al cambio total interaccional asimilativo adaptativo en vivo).", "La del dictador autócrata lewiniano represivo oscuro gótico de grupo tiránico sádico puramente estático sordo asimilador pasota cínico ciego cínico en laberinto."], "c": 1, "e": "\"La última etapa sería la del self relacional, en la que el individuo se da cuenta de que su «yo» es un resultado de la interacción social, que no dispone de un «self esencial» individual, sino múltiple, flexible y abierto al cambio.\". [43]"}, {"q": "Según el cuadro resumen que detalla y expone empírica y esquemáticamente de forma clara comparando visualmente los enormes saltos del pasado al futuro o \"el paso del self esencial al self múltiple\", respecto al \"contexto social en el que se desenvuelven los individuos\", en el modelo antiguo u asimilado caduco esencial la vida era socialmente de tipo \"homogénea o limitadísima y corta o a pocas personas asombrosamente estática pura\". Por contrapartida opuesta y posmoderna dinámica interaccional, el contexto del yo o \"Self múltiple\" es un ecosistema puramente:", "o": ["Completamente ciego autista inorgánico sordo mudo y sin contacto alguno visual o empático de ermitaño en silencio inmovilista puro irracional letárgico pasivo instintivo ciego cínico sin red y sin interactuar con nada humano y animal.", "Heterogéneo, de redes sociales amplias y con un notable incremento del número incesante veloz y asimilativo de interacciones.", "Inexistente de modo virtual onírico y holográfico puramente atópico o matemático abstracto teológico sin peso o valor biográfico empírico real asimilativo de contacto presencial vivo humano constructivo vital u organizativo humano empático analítico."], "c": 1, "e": "\"[Cuadro 2. El paso del self esencial al self múltiple] ¿Cómo es el contexto social en el que se desenvuelven los individuos? [...] Self múltiple: Heterogéneo, redes sociales amplias, incremento del número de interacciones.\". [44, 45]"}, {"q": "Y referenciando asombrosamente de nuevo este mismo y clarificador \"Cuadro 2 comparativo asimilativo\", al reflexionar e inquirir directamente acerca de \"¿qué tipo de estilos de vida y de valores están vigentes en la sociedad?\", el viejo modelo o visión esencialista defendía e imponía asimilativamente dictados \"universales o fijos ampliamente estáticos puros y compartidos o aceptados\". Frente a ello de plano, la concepción del nuevo y liberador paradigma u yo o \"Self múltiple\" es un universo y campo en donde los valores u estilos a la postre asimilativamente son:", "o": ["Múltiples y controvertidos; relativos y sujetos adaptativamente o propios y afines puramente asimilables a comunidades, a sus grupos y sus particulares y dispares colectivos sociales diversos locales empíricos vivos asimilados.", "Mundos o leyes divinas eclesiásticas lúgubres cínicas arcanas estáticas puramente dictatoriales prusianas de represión purista letárgica asilar teológica o pre racionales mágicas esotéricas ciegas puras sin asimilación.", "Matemáticas puras abstractas cuánticas frías y deshumanizadas de fotometría binaria inorgánica de Turing inanimadas estériles muertas y cerradas fodorianas ciegas de algorítmico asilado sin mente biológica orgánica o sociedad que valga nula."], "c": 0, "e": "\"[Cuadro 2] ¿Qué tipo de estilos de vida y de valores están vigentes en la sociedad? [...] Self múltiple: Múltiples y controvertidos. Relativos a comunidades, grupos y colectivos sociales.\". [45]"}, {"q": "Para asimilar el colofón teórico que engloba y condensa toda la filosofía general que late uniendo a estas dispares pero afines corrientes o la base en este temario que los hermana irreductiblemente desde su matriz académica posmoderna y según estipula la propia definición o \"Concepto Básico\" formal y literal explícita de clausura del término marco o matriz de fondo en general de \"Constructivismo\" propiamente dicho y estricto asimilativo, sus defensores y adeptos académicos comparten fundamentalmente la premisa filosófica y tesis base innegable y compartida general de base que postula sin fisuras que el conocimiento es:", "o": ["Una representación artificial de una realidad; no accedemos a la realidad en forma objetiva o esencial tal cual es, sino que elaboramos o construimos nuestra representación.", "Una alucinación mística de charlatán adivino puramente espiritualista de telequinesis parapsicológica y brujería puramente irracional o animal extinta pre lógica de sombra edípica muerta en diván.", "La frenología asilar eugénica purista cadavérica de autopsia inorgánica que suma kilos de material asimilativo en masa o pasivo atómico muerto pasivo y en letargo y abúlico de neurosis mística estéril inoperante pura."], "c": 0, "e": "\"Constructivismo. Conjunto de corrientes en psicología que compartirían una epistemología según la cual no podemos acceder al conocimiento de una realidad tal cual es, de forma «objetiva» y conociendo su «esencia». Contrariamente, el sujeto cognoscente elabora o construye representaciones... que tienen un carácter artificial.\". [46]"}, {"q": "Al diferenciar formalmente y en la base a este último \"Constructivismo\" en general puramente de base en contraste con la vuelta de tuerca posmoderna y el acento tan marcado que aportará de manera genial e innovadora al panorama mundial y pionero de esta escuela por Kenneth Gergen con su propio \"Construccionismo social\" específico como reza en la definición estricta formal del glosario o \"Conceptos básicos\" referencial último, este último se distingue, incorpora u aporta y nutre en su esencia el riquísimo e importantísimo matiz asimilativo e indudable de tesis base de que el conocimiento:", "o": ["Es dictado y emitido por arcángeles celestes etéreos en limbo metafísico teológico mudo a través y a base del trance mediúmnico profundo astral irracional asilar puro del ocultismo burgués esotérico de masas muerta atópica pasiva letárgica estática y pasota en silencio.", "Es heredado por genes de los antepasados muertos animales extintos pre lógicos mudos cínicos irrecuperables asimilativos asilares pasivos por incondicionalidad refleja en médula ósea parasimpática sorda.", "No tiene un carácter meramente individual asilado, sino que se elabora de forma totalmente colectiva y comunitaria asimilativamente inmersa en contextos socioculturales, y usando como herramientas y anclas al lenguaje y la narrativa de manera fundamental social."], "c": 2, "e": "\"Construccionismo social... Pero incorpora además una idea interesante: las construcciones de conocimiento no tienen un carácter meramente individual, sino que se elaboran de forma colectiva, en las comunidades sujetas a contextos socioculturales e históricos concretos. Las herramientas fundamentales... se basan en el uso del lenguaje...\". [46]"}, {"q": "A tenor de las \"Soluciones de las Actividades de autocomprobación\" y asumiendo todo lo repasado, el constructivismo y el construccionismo han impactado de modo abrumador asimilativamente e indiscutible y de forma utilísima y práctica real e indudable influyendo en nuestro mundo en el ámbito laboral y médico concreto aplicativo u formativo en:", "o": ["La extirpación frenológica o asilar lobotomizadora cerebral clínica y neurocirugía cínica inactiva letárgica cadavérica o criminal forense asilar y atávica ciega biométrica estadística de pesaje purista ciego en celda asilada.", "El diseño asombrosamente termodinámico de láser atómico para estroboscopios atencionales posnerianos ciegos mudos de dicotomía auricular periférica molecular fodoriana de módulos incoloros sintácticos inalterables de Wundt.", "La psicoterapia (derivándose y renovándose el proceso asombrosamente de mejora y de cambio en clientes con su trabajo sobre constructos o narrativas en enfoques interesantísimos asimilados como las terapias narrativas, de familia, grupo o de Kelly)."], "c": 2, "e": "\"Solución 4. La influencia de los enfoques constructivistas y construccionistas en la psicoterapia ha sido notable... han tratado de explicar los mecanismos de cambio en psicoterapia y también las «resistencias»... También se ha desarrollado considerablemente la psicoterapia narrativa... ha dado lugar a una revitalización de enfoques como la terapia de grupo o la terapia familiar...\". [47]"}, {"q": "¿Cómo ve y comprende a grandes rasgos un terapeuta constructivista a las \"resistencias\" del cliente en la consulta, según la base conceptual teórica expuesta y analizada a lo largo de este bloque educativo?", "o": ["Como un perverso defecto asilar del castigo sádico edípico de castración freudiana en represión del ello o del superego primitivo instintivo en trance irracional histérico mudo en diván onírico fóbico y regresivo puramente adivinatorio infantil sádico.", "Como el enorme u lógico temor de protección o pánico asimilado vital a la \"amenaza u alteración profunda u cambio de sus núcleos o de aquellos constructos profundos nucleares o a su organización o identidad basal a los que está apegado identitariamente sin los que se hundiría al abismo fóbico o a la alienación y de la que su ser preserva vitalmente en defensa o autopoiesis su integridad existencial asombrosa\".", "Como una tara estructural puramente cromosómica inorgánica del cerebelo que dicta la matemática Gaussiana purista del análisis inorgánico probabilístico forense ciego mudo asilar cadavérico asimétrico y extinto en cámara fodoriana modular sorda a los años cincuenta pasiva fría."], "c": 1, "e": "\"...las nociones de organización y estructura, constructos nucleares y periféricos, autopoiesis... Por ejemplo, a partir de ellos se han tratado de explicar los mecanismos de cambio en psicoterapia y también las «resistencias» y obstáculos...\". [32, 47]"}, {"q": "En la introducción al tema se señala que la filosofía subyacente y base en los fundamentos u los cimientos posmodernos hace chocar u polemizar confrontando teóricamente en base e innegable de forma abismal de manera frontalmente u abierta y dialécticamente a los nuevos y teóricos asimilativos u formadores constructivistas frente u o en clara hostilidad a los viejos pensadores o de la escuela opuesta general anterior o clásica a los que los asimilativos y posmodernos engloban en bloque a veces de forma genérica o como el paradigma a criticar o batir de:", "o": ["Los enfoques u autores u asimilados de la corriente de corte «objetivista» y «positivista» (quienes daban por sentado e incuestionable la pasividad humana de espejo o que la realidad exterior está exenta, era objetiva y que la mente no elabora nada sino sólo captaba pasiva o copiaba reflejos mudos).", "Los hechiceros arcanos chamanes de lo místico esotérico religioso medieval irracional e inoperante estático letárgico pasivo asilar cadavérico espiritualista y adivinatorio.", "Los artistas puramente bohemios y vagabundos irresponsables ociosos ciegos cínicos asilares o pasotas mudos de arte efímero irracional no comunicativo y pre social pre verbal asimilativo infantil y lúdico sin teoría y sin rigor mental pasivo en letargo mudo fóbico."], "c": 0, "e": "\"Estos rasgos los van a diferenciar de otros enfoques a los que se puede denominar «objetivistas», en el sentido de que para los constructivistas y construccionistas el carácter «objetivo» de la realidad se pone... en cuestión... Los enfoques positivistas habían asumido que la realidad es algo singular, tangible y fragmentable...\". [1, 8]"}, {"q": "A lo largo del documento y en su conclusión se refleja palpablemente cómo ha virado asombrosa y fundamentalmente e irremisiblemente todo el prisma moderno en la ciencia del alma: desde el antiguo énfasis desfasado pasivo atávico sordo a las nuevas voces; de manera resumida asimilativa, ¿qué tres pilares o focos nuevos son verdaderamente ahora asombrosa y plenamente protagonistas de base, directrices y amados en investigación moderna de la academia u por estos rompedores constructivistas u enfoques sociales asimilados que lo impregnan todo?:", "o": ["El cráneo óseo mudo frenológico pasivo o el pesaje cadavérico frío inorgánico de asimetría cerebral y estadística biométrica abstracta de raza instintiva asilar ciega letárgica atávica y la inacción lobotomizada de diván freudiana pasota purista y abstracta inanimada fría irracional animal de reflejo medular siberiana canina pavloviana ciega somática y atómica glandular pasiva estéril matemática.", "El lenguaje o el uso de las narrativas vivas; las metodologías analíticas de índole cualitativa; y la identidad del sí mismo / self asombrosamente de carácter social o relacional.", "El instinto darwinista canino extinto puramente fosilizado asilar animal y pre homínido en la selva cínica mística esotérica sin mente mudo a nivel reflejo o los engramas de mónadas matemáticas cuánticas estáticas predeterminadas de valencia pasiva inorgánica fría cínica y asilar de vacío atómico en laboratorio de Hull frío incoloro sin interacción asimilativa o empática u psicosocial integradora viva asombrosa y dinámica."], "c": 1, "e": "\"En estas perspectivas se enfatizará el papel del lenguaje en la construcción de significados y se abrirá paso con fuerza la metodología de análisis cualitativo, destacando por ejemplo el estudio de discursos y narrativas. Igualmente, se aportará una visión novedosa acerca del tema de la identidad personal o self...\". [48]"}, {"q": "Según el apunte teórico del constructivismo radical acerca del isomorfismo ciego del representacionalismo, ¿qué asombroso concepto o elemento filosófico subyacente nos demuestra que es teóricamente imposible salirnos de nosotros mismos u despojarnos de nuestra humanidad para fotografiar la mesa \"tal cual es\" la mesa en pureza absoluta u en sí o como sería el mundo si nosotros no tuviéramos ojos ni biología en el vacío de la nada inorgánica pura?", "o": ["Nuestra incesante inoperancia letárgica mística esotérica animal.", "El hecho innegable de que toda imagen, mundo o cosa u de la realidad, llanamente y en esencia no es nada asombrosamente sino siempre una pura \"transformación\" operante, una \"perspectiva\" y el producto de cómo choca y de la interacción real viva y biológica activa de nuestra maquinaria vital u sentidos con las cosas y nuestro punto de vista y que no somos un espejo mágico ciego.", "El magnetismo astrológico purista eclesiástico del éter inmaterial pre humano adivinatorio espiritualista letárgico asilar atópico místico silente de lobotomía inactiva animal en letargo y pasota."], "c": 1, "e": "\"El organismo, a través de su sistema perceptivo y de sistema nervioso, opera como un agente que nunca accede a la realidad «tal cual es», sino a la representación que él se hace de ella... es, básicamente, una transformación de esta, que surge como producto de la interacción entre la realidad física y el sujeto que la percibe.\". [19]"}, {"q": "Entre los teóricos citados como \"constructivistas críticos\", y especialmente gracias a las enormes y profundas aportaciones e innovadoras o visiones analíticas integradas por Guidano y otros en este movimiento moderno de psicología, han otorgado un lugar central o importante papel u \"autorregulador\" en el marco asombroso del ordenamiento vital y que subyace nuclearmente e inconscientemente estructurando sin nosotros saberlo nuestro actuar en las sombras de las bambalinas a lo que ellos llaman en psicología o en sus obras como el:", "o": ["Arco reflejo canino salival simple asimilador gástrico ciego mecánico de Wundt mudo visceral.", "Inconsciente o lo tácito y los implícitos u procesos \"tácitos\" (estructuras profundas no psicoanalíticas).", "Súper-Yo arcaico o pre humano ancestral irracional mágico sádico de sombra onírica y represión incestuosa puramente pre verbal fóbico catártica pasiva en trance inmovilizador de castración de asilar ciego cínico asimilativo puro y dogmático atómico."], "c": 1, "e": "\"...concederá un papel muy relevante a lo tácito y lo implícito en el conocimiento. Retomará de este modo el concepto de inconsciente, pero quitándole su sentido freudiano y redefiniéndolo. Se trata más bien de procesos que caen fuera del alcance de la conciencia... Guidano afirmará que «los procesos tácitos... son estructuras profundas...»\". [30]"}, {"q": "Cuando Kenneth Gergen expone que un determinado \"conocimiento o forma de comprensión de las cosas\" se mantiene triunfante y sobrevive en pie a lo largo del tiempo o décadas, nos dice asombrosamente y pragmáticamente o analíticamente y para frustración de algunos puristas que este triunfo o vigencia social no se debe maravillosamente o en última instancia tanto a la absoluta pureza de su \"validez empírica o científica o racional\", sino asimilativamente al indudable peso de:", "o": ["Las vicisitudes humanas de los \"procesos sociales\" en grupo, como el éxito en la negociación grupal, la victoria de una retórica u la comunicación e influencia humana sobre los discursos competidores (el triunfo de la palabra humana en la disputa interaccional pragmática asimilativa del grupo u poder).", "Las herencias mendelianas genéticas atávicas mudas pasivas inanimadas de las mónadas puras atómicas incoloras ciegas matemáticas de cálculo preestablecido inamovible fodoriano modular asimilativo estéril inorgánico sin alma.", "Los designios eclesiásticos arcanos del chamán pre humano místico irracional sádico irracional animal sordo y mudo puramente de letargo mágico esotérico y pasota mudo."], "c": 0, "e": "\"3. El grado en el cual una forma de comprensión prevalece o es sostenida a través del tiempo no depende fundamentalmente de la validez empírica de la perspectiva en cuestión sino de las vicisitudes de los procesos sociales (por ejemplo, comunicación, negociación, conflicto, retórica) (...)\". [49]"}, {"q": "Siguiendo el apunte del giro hacia la investigación y el rol del conocimiento como crítica social, un psicólogo o pensador encuadrado de lleno en el movimiento u escuela del construccionismo social no se contentaría analíticamente en una investigación con presentar tablas y números asépticos, sino que le surgirían, plantearía sin miedo en voz alta asombrosa y obligatoriamente las incómodas interrogantes pragmáticas, éticas o políticas profundas en el foro como:", "o": ["¿Cuánto pesa el cerebro en vacío inorgánico sordo estéril en kilos ciegos anatómicos cadavéricos puristas de frenología de asimetría animal asilar de Lombroso del siglo decimonónico cínico irracionalista mudo puro y matemático?", "¿Qué es privilegiado y qué destruido por las formas en que configuramos el mundo?, ¿quién gana y quién pierde en el sistema actual?, ¿
