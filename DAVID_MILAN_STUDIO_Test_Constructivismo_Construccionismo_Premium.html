qué políticas, ideologías o cosmovisiones se ven reforzadas u aplastadas o por esta práctica psicológica hegemónica en activo?", "¿Cuándo lograremos lobotomizar pacífica silenciosamente estéril inorgánica u matemáticamente ciego el lóbulo frontal vivo para apagar la consciencia humana viva y convertir al hombre asimilativo e interaccional libre y feliz cooperativo asombroso en una caja de Skinner canina y salival gástrica mecánica muda?"], "c": 1, "e": "\"Incluso en el ámbito del dominio experto de la psicología profesional, podríamos preguntarnos: ¿qué es privilegiado y qué destruido por las formas en que configuramos el mundo?, ¿quién gana y quién pierde?, ¿qué políticas, ideologías, cosmovisiones e instituciones son reforzadas y cuáles cuestionadas?\". [39]"}, {"q": "Al hilo del papel activo y tolerante frente al resto y a otros, la escuela del construccionismo social persigue verdaderamente, por vocación asimilada intelectual en su paradigma y base con el resto de las escuelas y teorías afines y dispares u tradiciones de toda laya a su alrededor u del saber u oponentes analíticas en vez de la destrucción dogmática una asimilativa actitud integradora promoviendo y propugnando asombrosamente:", "o": ["El integrismo purista sádico inactivo pre rústico dogmático sordo y mudo asilar inanimado e inoperante pasivo de secta aislada matemática purista abstracta cínica.", "La integración y el diálogo tolerante y abierto sincero de y entre las perspectivas y tradiciones distintas para lograr de esta interacción forjar o alcanzar pacífica constructiva cooperativa y colaborativamente hacia y logrando nuevos marcos asimilativos de significado pluralista u utilísimo para la vida y psicología como disciplina.", "La quema asilar mágica purista mística esotérica astrológica puramente medieval del texto irracional e instintiva darwiniana y letárgica canina pavloviana de la parapsicología onírica y fóbica cínica aislada en diván asilar regresiva inorgánica atópica y ciega incondicional."], "c": 1, "e": "\"No obstante, no debe olvidarse que además de este propósito de «deconstrucción» y crítica, el construccionismo social propugna la integración y el diálogo entre perspectivas distintas para alcanzar nuevos marcos de significado. Por sus propios fundamentos epistemológicos, se trata de un enfoque tolerante con otras escuelas y teorías.\". [39]"}, {"q": "Si un terapeuta en una consulta analiza el yo (self) de un cliente como algo que no está roto en su esencia íntima por sí sola (porque la esencia no existe), sino que lo ve asimilativamente como una identidad dinámica que se está construyendo mal, ahogada entre las narrativas opresivas o de culpa cruzada forjadas entre él y su \"audiencia u otros significativos en su vida laboral u marital viva pragmática u de grupo\", ¿en qué escuela o marco contemporáneo asimilativo paradigmático estaríamos indiscutiblemente sumergidos analítica o referenciados teórica u innegablemente operando a nivel clínico u oficial manual de manera clara?:", "o": ["Constructivismo/Construccionismo (específicamente la visión relacional interaccionista u narrativa dialógica asimilativa de base de autores como Kenneth Gergen y la multiplicidad).", "Frenología y criminalística analítica anatómica eugénica racista asilar cadavérica forense sorda y estática fría pasota asilar biológica atómica puramente instintiva animal.", "Conductismo operante de castigo aversivo de primera ola puramente y visceral pasivo sordo molecular atómico inanimado de la caja opaca americana insonorizada mecanicista animal estéril fodoriana y cínica pasiva."], "c": 0, "e": "\"La identidad propia de cada uno se forma en un continuo proceso de negociación social... El yo sería un «yo saturado» o «colonizado». En la era de internet... disponemos de una mayor cantidad y variedad de interlocutores...\". [41, 50]"}, {"q": "El hecho innegable de que la corriente del construccionismo enfatice asombrosa o teóricamente el pragmatismo analítico por la vida útil o lo constructivo de uso y abrace en la praxis métodos \"comprensivos\", le ha valido y convertido e instaurado a nivel de práctica y campo analítico asombrosamente o de terreno de base una actitud vital o espíritu científico que, metodológicamente asimilando, se podría tildar, calificar u o describir a voces llanamente de forma analítica en su uso de los instrumentos, de ser innegable o de espíritu libre u asombrosamente:", "o": ["Inmovilista asilar mudo teológico puramente y mágico pre lógico asimilador irracional.", "Ecléctico (e incluso anárquico y abierto no rígido, asimilando cualquier método desde que resulte útil y nos aporte su óptica y sepa para qué y qué aporta a las conclusiones plurales y comprensión del todo holístico vivo).", "Dictatorial represivo oscuro sádico mecanicista determinista purista biológico anatómico forense estéril pasivo celular ciego matemático y vacío inorgánico sordo asimétrico purista fodoriano estricto en laboratorio de control."], "c": 1, "e": "\"En principio, la metodología de estos enfoques tiene un carácter abierto, de tal forma que no prescribe ningún método ni deja de lado a otros... Podría decirse que en lo metodológico, esta es una corriente ecléctica o incluso anárquica.\". [16]"}, {"q": "Cuando leemos la afirmación \"El sujeto cognoscente queda atrapado en un círculo de computaciones y descripciones de la realidad, mientras que la «realidad objetiva» no aparece por ningún lado, sino que parece que nos alejamos de ella cada vez más\", nos hallamos lógicamente sumidos en el problema del solipsismo puro planteado innegable por la vía reflexiva de un autor concreto. ¿De qué destacado teórico es este desarrollo y argumentación teórica citada y de computar recursivo en el constructivismo?:", "o": ["I. Pavlov y su canino purista asimilativo ciego instintivo animal asilar y pre lógico irracional visceral glandular digestivo pasivo en la cámara estática cínica.", "Von Foerster.", "George A. Miller atencional fotométrico asilar binario analógico Turing matemático asilar estático."], "c": 1, "e": "\"También Von Foerster plantea una idea similar. Este autor asume que el conocimiento es un proceso ilimitadamente recursivo de cálculo... cada descripción es a su vez una descripción de una descripción... El sujeto cognoscente queda atrapado en un círculo de computaciones y descripciones de la realidad, mientras que la «realidad objetiva» no aparece por ningún lado...\". [22]"}, {"q": "Para ejemplificar que los constructos asimilativos posmodernos y constructivistas en nuestra mente siempre son de naturaleza \"relacional y de comparación u no abstracta\", el texto recurre, como caso visual ilustrativo muy claro para nosotros en vida asombrosa real, a citar el pragmático u cotidiano y clarificador ejemplo que detalla y narra cómo, cuando y mediante el cual el ser humano elabora una de las cosas más corrientes empíricas del mundo que es nada menos y asimilativamente o vital e interaccionalmente que el formarnos asombrosamente o:", "o": ["Formarnos impresiones de la gente (al clasificar su forma de ser u al otro de manera relacional operante, ej: de si es de base «amable» u oponiéndolo en el constructo base mental asimilado nuestro diferencialmente frente y frente a alguien de carácter «antipático» operante).", "Deducir el radio de la hipotenusa de un triángulo rectángulo mediante fórmulas abstractas algebraicas platónicas puras matemáticas sin sentido existencial pragmático vital humano en el aire sin tiza inorgánico estéril e invisible mudo inanimado.", "Memorizar fotométricamente listas ciegas mnemotécnicas irracionales sin sentido de Ebbinghaus de vocales sueltas incoloras inanimadas y sin vida en un vacío letárgico asilar cínico de Wundt purista mecanicista atómico estático pasivo inoperante."], "c": 0, "e": "\"...Tales «constructos» no son representaciones abstractas de la realidad, sino formas de construirla al establecer diferencias. Por ejemplo, cuando nos formamos impresiones sobre la forma de ser de alguien, podemos recurrir a diferenciaciones como «es una persona amable» por oposición a «es una persona antipática»...\". [5]"}, {"q": "En la Solución de las actividades de autocomprobación, a la hora de explicar y condensar el núcleo del \"Constructivismo y construccionismo\", se detalla que el conocimiento asombroso como nosotros lo elaboramos empíricamente y en nuestra visión no cumple una aburrida tarea ni papel mudo vacío inorgánico puro ni pasivo y fotográfico en la mente con el que reflejemos el entorno exterior de forma fidedigna. Muy por el contrario, este valiosísimo conocimiento ostenta y posee innegablemente un rol e irrenunciable e importante rasgo de supervivencia de utilidad y acción de carácter plenamente vivo de índole:", "o": ["Pragmático (con el conocimiento hacemos cosas).", "Inerte (no sirve para nada y es estéril, puro eco vacío y fósil atávico pasivo muerto sordo matemático).", "Asilar (sólo útil en el manicomio decimonónico de represión fóbica irracional catártica pre lógica instintiva)."], "c": 0, "e": "\"Solución 1... Nuestras teorías y nuestro lenguaje no son un «espejo» que refleja de forma objetiva y neutra la realidad; al contrario... Más que una función representacional, el conocimiento tiene un carácter pragmático, con él hacemos cosas.\". [51]"}, {"q": "A modo de compendio, si unimos las tesis biológicas posmodernas, el conocimiento y sus límites, y el estudio del individuo y su psicoterapia, podemos afirmar que los teóricos del movimiento posmoderno, constructivista y social están en perfecta sincronía analítica sintonizando con las fuerzas y debates de su tiempo y, como indica literalmente el cierre formal u conclusión general y corolario final de forma explícita de su influencia asimilativa en nuestra ciencia y mundo en la academia de este asombroso módulo universitario, \"la psicología aparece, de forma indudable e innegable de arriba abajo, en el temario teñida de\":", "o": ["Dogmatismo asilar mecanicista eugénico racista inorgánico sordo forense estático atómico pasivo ciego y cínico pre determinista atávico fodoriano matemático purista animal sin alma orgánico y de reflejo siberiano letal.", "Esoterismo y telequinesis astral onírica parapsicológica y mediúmnica puramente regresiva y mágica instintiva pre homínida.", "Posmodernidad."], "c": 2, "e": "\"...las ideas psicológicas están en clara conexión con las creencias, las filosofías, los valores y las dinámicas sociales propias del contexto histórico y cultural donde emergen. Y en este caso, la psicología aparece teñida de posmodernidad.\". [52]"}, {"q": "Al repasar los conceptos fundamentales de los constructivistas en su afán integrador e ideográfico humanista metodológico de base, nos encontramos como idea motriz o matriz asimilativa central la imperiosa exigencia innegable y abrumadora a nivel de campo experimental vivo que la ciencia psicológica tiene que dar un paso hacia delante fundamental e inexcusable orientando valientemente de forma pragmática u colaborativa sus estudios y de salir del aislamiento analítico para \"enfocarse e ir hacia\":", "o": ["El silencio de la biblioteca estéril purista de latín teológico monástico eclesiástico lúgubre asilar pre lógico irracional asilar mágico y astral esotérico puramente sordo asombrosamente mudo.", "La fría disección purista asimétrica frenológica anatómica atómica inorgánica pasiva instintiva y ciega y estática animal pre verbal atávica darwiniana cadavérica mecanicista ciega matemática fodoriana estéril aislada mola en cámara y lóbulo vacío.", "El estudio de individuos y comunidades concretos (accediendo a su idiosincrasia particular humana con respeto y pragmatismo pluralista holístico asimilativo empírico)."], "c": 2, "e": "\"Defenderán así la conveniencia de usar métodos ideográficos frente a los métodos nomotéticos. Así, se enfocarán hacia el estudio de individuos y comunidades concretos, accediendo a su idiosincrasia y tratando de conocer sus particularidades diferenciales.\". [17]"}, {"q": "La asunción de que \"nuestro propio self\" en gran medida de manera pragmática real y operante y constructiva \"es en definitiva y puramente el resultado de una negociación entre la representación que los demás tienen de cada uno de nosotros y la representación que tenemos nosotros de nosotros mismos o en plural\", ha revitalizado e impulsado teóricamente de lleno enormes campos aplicados asimilativos vivos del tratamiento asombrosamente social y del acompañamiento psicológico en occidente en forma destacada y explícita por Gergen y de la escuela u como por ejemplo de forma innegable:", "o": ["La extirpación de lobotomía frontal sorda mística adivinatoria estática regresiva y fóbica puramente animal atávica onírica profunda catártica mística asilar en aislamiento.", "La terapia de familia o y enfoques de terapia de grupo interaccional.", "El castigo aversivo eléctrico en cámara operante pasota y sorda asimilativo ciego mecanicista mecanicista atómico estéril incoloro modular serial pasivo matemático estricto incondicionado gástrico atópico irracional cínico ciego."], "c": 1, "e": "\"La intersubjetividad también juega un papel decisivo en las ideas constructivistas sobre la identidad personal o el self. Incluso... se han desarrollado importantes aplicaciones para el campo de la terapia de familia, como en el caso de Watzlawick... También se ha desarrollado... una revitalización de enfoques como la terapia de grupo o la terapia familiar...\". [47, 53, 54]"}, {"q": "A modo de conclusión general del test y del temario base que rige el posmodernismo constructivo y construccionista psicosocial, un investigador que hoy asuma este modelo se lanzaría al ruedo de la clínica o aula teórica no tratando asimilativamente e ilusamente en su trabajo con humanos en sociedad de descubrir ingenuamente, aislar y pescar como si fuese una cosa o la \"esencia inamovible oculta innegable sorda pasiva profunda\" que anida en cada ser, sino todo lo contrario en ayudar u fomentar en las sesiones, en su estudio analítico activo vivo cooperativo que las personas valientemente:", "o": ["Construyan o edifiquen sanamente mediante el uso de redes, negociaciones dialógicas e intercambio discursivo pragmáticas \"narrativas operantes\", \"historias\" y significados propios constructivos más útiles asimilativos y viables para su devenir vivo interaccional con sus prójimos.", "Se extingan asimilativamente en pasividad, amnesia retroactiva e histeria en coma letárgico asilar fóbico regresivo edípico onírico catártico infantil ciego atávico animal en un encierro lúgubre de diván y silencio mudo mágico arcano espiritualista estático de charlatanería decimonónica de esoterismo pasota.", "Asuman estáticamente su tara matemática física estadística inorgánica atómica genética y eugénica racista asilar cínica forense cadavérica y ciega instintiva lobotomizada modular o purista serial algorítmica matemática sorda mola gástrica inanimada inoperante inactiva irrecuperable asimilativa de Wundt."], "c": 0, "e": "\"La identidad propia de cada uno se forma en un continuo proceso de negociación social... Lo que somos es ante todo el producto de una negociación de narrativas... llegar a un significado compartido acerca de «quiénes somos» y «quién es» cada individuo. Más aún, el lenguaje también es capaz de crear nuevas realidades y, consecuentemente, emplear nuevos términos para referirse al «yo», o generar nuevas narrativas sobre nuestra identidad...\". [41]"}];
let questions=[...originalQuestions],current=0,score=0,missed=[],retryMode=false;

function loadQuestion(){
let q=questions[current];
document.getElementById('prog').innerText=`Pregunta ${current+1} de ${questions.length}`;
document.getElementById('fill').style.width=(current/questions.length*100)+'%';
document.getElementById('mode').innerText=retryMode?'Modo repaso':'Modo completo';
document.getElementById('q').innerText=`${current+1}. ${q.q}`;
document.getElementById('fb').className='feedback';
document.getElementById('fb').style.display='none';
document.getElementById('next').style.display='none';
let opts=document.getElementById('opts');opts.innerHTML='';
q.o.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>answer(i,b);opts.appendChild(b);});
}

function answer(i,btn){
let q=questions[current];
let all=document.querySelectorAll('.opt');
all.forEach(x=>x.disabled=true);
if(i===q.c){
btn.classList.add('correct');
score++;
document.getElementById('score').innerText='Puntuación: '+score;
document.getElementById('fb').className='feedback show good';
document.getElementById('fb').innerHTML='<b>Correcto.</b><br>'+q.e;
}else{
btn.classList.add('incorrect');
all[q.c].classList.add('correct');
if(!missed.some(m=>m.q===q.q)) missed.push(q);
document.getElementById('fb').className='feedback show bad';
document.getElementById('fb').innerHTML='<b>Incorrecto.</b><br><br>La respuesta correcta es: <b>'+q.o[q.c]+'</b><br><br>'+q.e;
}
document.getElementById('next').style.display='inline-block';
document.getElementById('next').innerText=current===questions.length-1?'Ver resultados':'Siguiente';
}

function nextQuestion(){current++; if(current<questions.length) loadQuestion(); else showResults();}

function showResults(){
document.getElementById('quiz').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('fill').style.width='100%';
let pct=Math.round(score/questions.length*100);
document.getElementById('final').innerHTML=`${score}/${questions.length} · ${pct}%`;
document.getElementById('medal').innerText=pct>=90?'🏆 Medalla de Oro · Dominio excelente':pct>=75?'🥈 Medalla de Plata · Muy buen nivel':pct>=60?'🥉 Medalla de Bronce · Base aprobada':'📚 Modo refuerzo · Conviene repasar';
document.getElementById('msg').innerText='Constructivismo y Construccionismo Social: posmodernidad, realidad construida, lenguaje, constructivismo radical, Gergen, self y narrativas.';
document.getElementById('missed').innerHTML=missed.length?'<h3>Preguntas falladas: '+missed.length+'</h3><ul>'+missed.map((x,i)=>'<li>'+(i+1)+'. '+x.q+'</li>').join('')+'</ul>':'<b>Perfecto. Sin errores.</b>';
document.getElementById('retry').style.display=missed.length?'inline-block':'none';
}

function retryMissed(){
questions=[...missed];missed=[];current=0;score=0;retryMode=true;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}

function restartQuiz(){
questions=[...originalQuestions];current=0;score=0;missed=[];retryMode=false;
document.getElementById('score').innerText='Puntuación: 0';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';
loadQuestion();
}
loadQuestion();
</script>
