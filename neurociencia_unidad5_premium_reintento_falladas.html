<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurociencia Unidad 5 Premium | DAVID MILÁN STUDIO</title>
<style>
:root{--bg:#05070d;--bg2:#0b1323;--gold:#d4af37;--gold2:#f3d98b;--white:#f8f4e8;--muted:#aab3c5;--green:#33d17a;--red:#ff6b6b;--blue:#4da3ff}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at top left,rgba(212,175,55,.22),transparent 34%),radial-gradient(circle at bottom right,rgba(30,90,180,.28),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2),#05070d);color:var(--white);display:flex;justify-content:center;align-items:center;padding:35px 18px}
.quiz-container{width:100%;max-width:980px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(212,175,55,.28);border-radius:30px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.brand{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);color:var(--gold2);letter-spacing:3px;font-weight:800;font-size:13px;margin-bottom:18px;background:rgba(255,255,255,.04)}
h1{font-size:clamp(30px,5vw,54px);line-height:1;margin-bottom:10px;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;color:transparent}
h2{font-size:17px;color:var(--muted);font-weight:400;margin-bottom:26px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.stat{padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);color:var(--gold2);font-weight:800}
.progress-wrap{height:10px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin-bottom:24px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:.35s ease}
.question-card{background:rgba(4,8,16,.55);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px}
.question{font-size:21px;font-weight:800;line-height:1.45;margin-bottom:22px}
.options{display:grid;gap:13px}
.option-btn{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));color:var(--white);font-size:16px;text-align:left;cursor:pointer;transition:.25s ease}
.option-btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(212,175,55,.65);box-shadow:0 12px 30px rgba(212,175,55,.12)}
.option-btn:disabled{cursor:not-allowed;opacity:.95}
.correct{background:rgba(51,209,122,.16)!important;border-color:var(--green)!important;color:#dfffea!important}
.incorrect{background:rgba(255,107,107,.16)!important;border-color:var(--red)!important;color:#ffe0e0!important}
.feedback{display:none;margin-top:22px;padding:20px;border-radius:20px;line-height:1.65;font-size:15px}
.feedback.show{display:block}.feedback-correct{background:rgba(51,209,122,.12);border-left:5px solid var(--green)}.feedback-incorrect{background:rgba(255,107,107,.12);border-left:5px solid var(--red)}
.feedback strong{font-size:18px}.solution-label{display:block;margin-top:12px;color:var(--gold2);font-weight:900}
.controls{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:16px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;transition:.25s ease}.btn:hover{transform:translateY(-2px)}
.next-btn{display:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080b12}.secondary-btn{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.14)}
.score-container{display:none;text-align:center;padding:24px}.score-text{font-size:30px;font-weight:900;color:var(--gold2);margin-bottom:18px}.result-message{color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:24px}
.medal{display:inline-block;margin:14px 0 10px;padding:12px 18px;border-radius:999px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.10);color:var(--gold2);font-weight:900}
.missed-box{text-align:left;margin:24px 0;padding:20px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}.missed-box h3{color:var(--gold2);margin-bottom:12px}.missed-box ul{padding-left:20px;color:#dbe2f2;line-height:1.6}
.mode-label{color:var(--blue);font-weight:900}
@media(max-width:650px){.quiz-container{padding:22px}.question-card{padding:20px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="quiz-container">
  <div class="brand">DAVID MILÁN STUDIO</div>
  <h1>Mega-Test Premium</h1>
  <h2>Unidad 5 · Desarrollo del Sistema Nervioso</h2>
  <div id="quiz-screen">
    <div class="topbar">
      <div class="stat" id="progress-text">Pregunta 1 de 80</div>
      <div class="stat" id="score-tracker">Puntuación: 0</div>
      <div class="stat" id="mode-text">Modo completo</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="question-card">
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div id="feedback-container" class="feedback"></div>
      <div class="controls">
        <button class="btn secondary-btn" onclick="restartQuiz()">Reiniciar test</button>
        <button id="next-btn" class="btn next-btn" onclick="nextQuestion()">Siguiente pregunta</button>
      </div>
    </div>
  </div>
  <div id="result-screen" class="score-container">
    <div class="score-text" id="final-score"></div>
    <div class="medal" id="medal-text"></div>
    <div class="result-message" id="final-message"></div>
    <div id="missed-summary" class="missed-box"></div>
    <div class="controls" style="justify-content:center;">
      <button class="btn secondary-btn" onclick="restartQuiz()">Volver a intentar todo</button>
      <button class="btn next-btn" id="retry-missed-btn" onclick="retryMissed()">Reintentar preguntas falladas</button>
    </div>
  </div>
</div>
<script>
const originalQuestions = [

        // INTRODUCCIÓN Y ONTOGENIA
        { q: "¿De qué factores depende el proceso de desarrollo del sistema nervioso a lo largo del ciclo vital?", o: ["Únicamente de una programación genética inmutable.", "Exclusivamente de la estimulación ambiental postnatal.", "De una programación genética precisa, influida por múltiples factores ambientales."], c: 2, e: "El desarrollo se basa en una programación genética precisa, pero también está influido por múltiples factores ambientales." },
        { q: "¿Cuáles son las transformaciones fundamentales que experimentan las células del SN en su desarrollo?", o: ["Se multiplican, migran, se especializan y forman conexiones sinápticas.", "Se fusionan, destruyen tejido innecesario y se calcifican.", "Únicamente aumentan de tamaño sin cambiar de función."], c: 0, e: "Las células del SN experimentan transformaciones fundamentales: se multiplican, migran, se especializan y forman conexiones sinápticas." },
        { q: "¿En qué etapa del ciclo vital comienza la formación y desarrollo del sistema nervioso?", o: ["En el tercer trimestre de gestación.", "En las primeras semanas de gestación.", "Inmediatamente después del nacimiento."], c: 1, e: "La formación y desarrollo del SN comienza en las primeras semanas de gestación." },
        { q: "¿Cuál es la primera célula que se origina tras la fecundación, dando origen al desarrollo del nuevo ser humano?", o: ["El neuroblasto.", "El glioblasto.", "El cigoto."], c: 2, e: "El cigoto, es la primera célula que se origina tras la fecundación, dando origen al desarrollo del nuevo ser humano." },
        { q: "¿Cómo se produce el desarrollo completo del organismo a partir del cigoto?", o: ["Mediante el crecimiento masivo de una única célula.", "Por la agregación de células maternas externas.", "Mediante divisiones sucesivas del cigoto en células hijas (dos, cuatro, etc.)."], c: 2, e: "El proceso por el cual se produce el desarrollo completo es la división del cigoto en células hijas (dos, cuatro, en divisiones sucesivas)." },
        { q: "¿Qué nombre reciben las primeras células tras la fecundación que tienen la capacidad de transformarse en cualquier tipo de célula, tejido u órgano?", o: ["Células madre embrionarias.", "Células totipotenciales.", "Células pluripotentes."], c: 1, e: "Las primeras células tras la fecundación tienen la capacidad de transformarse en cualquier tipo de célula, tejido u órgano y se denominan totipotenciales." },
        { q: "Durante el desarrollo de la placa neural, ¿qué ejes básicos se establecen en el embrión temprano?", o: ["Eje derecho-izquierdo exclusivamente.", "Eje antero-posterior, dorsal-ventral y medial-lateral.", "Eje superior-inferior y cortical-subcortical."], c: 1, e: "Las células precursoras se especializan paralelamente con el desarrollo del embrión y el establecimiento de los ejes básicos: antero-posterior, dorsal-ventral y medial-lateral." },
        { q: "A diferencia de las células totipotenciales, ¿qué pueden formar las células de la placa neural (pluripotentes o células madre embrionarias)?", o: ["Solo pueden especializarse en células del SN, pero no en otro tipo.", "Cualquier célula u órgano del cuerpo.", "Solo células musculares y óseas."], c: 0, e: "Las células que se localizan en la placa neural conservan la capacidad de especializarse en células del SN, pero no en otro tipo; se las denomina pluripotentes o células madre embrionarias." },
        { q: "¿Qué capacidad característica tienen las células madre embrionarias del sistema nervioso?", o: ["Destruir neuronas defectuosas mediante apoptosis pasiva.", "Migrar al sistema digestivo para formar ganglios periféricos.", "Regenerarse a sí mismas aparentemente de forma ilimitada."], c: 2, e: "Estas células especifican tienen aparentemente una capacidad ilimitada de regenerarse a sí mismas y de conversión en cualquier célula del SN." },
        
        // GASTRULACIÓN
        { q: "Aproximadamente a los 20 días tras la fecundación, ¿qué dos capas de tejido forman el embrión?", o: ["Endodermo y mesodermo.", "Epiblasto e hipoblasto.", "Tubo neural y cresta neural."], c: 1, e: "Aproximadamente, 20 días tras la fecundación, el embrión humano está formado por dos capas de tejido: epiblasto e hipoblasto." },
        { q: "¿De qué capa temprana de tejido (situada sobre el hipoblasto) se originan la piel, el SN y los músculos?", o: ["El saco vitelino.", "El epiblasto.", "La notocorda."], c: 1, e: "El epiblasto (capa de células cilíndricas situadas sobre el hipoblasto) es de la cual se originan la piel, SN y músculos." },
        { q: "¿Cuál es la función del saco vitelino, al que contribuye el hipoblasto?", o: ["Formar la futura médula espinal.", "Dar origen a la epidermis.", "Proporcionar nutrientes y oxígeno al embrión en la etapa de formación."], c: 2, e: "El hipoblasto contribuye a la formación del saco vitelino, estructura que proporciona nutrientes y oxígeno al embrión." },
        { q: "¿Cómo comienza el proceso de gastrulación?", o: ["Como una explosión celular en el mesodermo.", "Como una invaginación local (plegamiento hacia dentro) de células del epiblasto.", "Como el cierre de los neuróporos rostral y caudal."], c: 1, e: "El proceso de gastrulación comienza como una invaginación (plegamiento hacia dentro) local de células." },
        { q: "Tras la gastrulación, el embrión se divide en tres capas germinales. ¿Cuáles son?", o: ["Endodermo, mesodermo y ectodermo.", "Prosencéfalo, mesencéfalo y rombencéfalo.", "Epiblasto, hipoblasto y trofoblasto."], c: 0, e: "A partir de este proceso, se produce una división en tres capas germinales: Endodermo, Mesodermo y Ectodermo." },
        { q: "¿Qué capa germinal más interna es el origen del sistema digestivo, hígado, páncreas y sistema respiratorio?", o: ["Mesodermo.", "Ectodermo.", "Endodermo."], c: 2, e: "Endodermo: capa más interna. Es el origen del sistema digestivo, hígado, páncreas y sistema respiratorio." },
        { q: "¿De qué capa surgen los tejidos óseos, musculares, cartilaginosos y el sistema circulatorio?", o: ["Ectodermo.", "Mesodermo.", "Endodermo."], c: 1, e: "Mesodermo: capa media... A partir de esta capa se desarrollan los tejidos óseos, musculares, cartilaginosos y dermis de la piel, sistema circulatorio y genitourinario." },
        { q: "¿Qué es la notocorda y dónde aparece?", o: ["Un cilindro de células mesodérmicas del que surge la columna vertebral.", "Un pliegue ectodérmico que origina el tubo digestivo.", "Un grupo de células totipotenciales en el endodermo."], c: 0, e: "La notocorda (cilindro de células mesodérmicas...) aparece en el mesodermo, de la cual surge la columna vertebral." },
        { q: "¿Qué estructura es esencial para el posterior desarrollo del SN ya que surge del mesodermo de manera temprana?", o: ["La notocorda.", "La glándula pineal.", "El quiasma óptico."], c: 0, e: "La aparición de la notocorda es un evento esencial para el posterior desarrollo del SN." },
        { q: "¿De qué capa externa del embrión surge la epidermis y se considera precursora del Sistema Nervioso?", o: ["Endodermo.", "Mesodermo.", "Ectodermo."], c: 2, e: "Ectodermo: capa más externa del embrión. A partir del ectodermo surgen la epidermis... Además, es precursor del SN." },
        { q: "¿Qué elementos determinan la línea media y los ejes que guían la posición específica del SN central y periférico?", o: ["La concentración de calcio y potasio en el cigoto.", "La posición que adquieren el mesodermo y el ectodermo, formándose de acuerdo con la notocorda.", "La acción de las células gliales migratorias exclusivamente."], c: 1, e: "Según la posición que han adquirido tanto el mesodermo, como el ectodermo, se determina la línea media y ejes del embrión, formándose de acuerdo con la posición de la notocorda." },

        // NEURULACIÓN Y VESÍCULAS
        { q: "La neurulación es el inicio del desarrollo del SN y se compone de dos eventos principales. El primero es:", o: ["La sinaptogénesis activa.", "La inducción neural (formación del neuroectodermo).", "La muerte neuronal programada."], c: 1, e: "Eventos principales: 1. Inducción neural: tras la gastrulación, parte del ectodermo se convierte en neuroectodermo." },
        { q: "El segundo evento de la neurulación es la formación de dos estructuras a partir de la placa neural. ¿Cuáles son?", o: ["El telencéfalo y diencéfalo.", "El tubo neural y la cresta neural.", "El mesencéfalo y rombencéfalo."], c: 1, e: "2. Formación del tubo y cresta neural a partir de la placa neural: en esta fase se forman las principales subdivisiones del SN." },
        { q: "La placa neural comprende la superficie mediodorsal del...", o: ["Endodermo.", "Mesodermo.", "Neuroectodermo."], c: 2, e: "Esta estructura (neuroectodermo) es el origen del SN ya que comprende en la superficie mediodorsal la placa neural." },
        { q: "Cuando la placa neural se repliega, aparece un surco rodeado por dos pliegues llamados...", o: ["Vesículas ópticas y auditivas.", "Neuróporo rostral y neuróporo caudal.", "Astas dorsales y ventrales."], c: 1, e: "La placa neural se repliega apareciendo un surco rodeado de dos pliegues: neuróporo rostral y neuróporo caudal." },
        { q: "El tubo neural se forma al unirse los pliegues de la placa neural. ¿De qué es el origen principal?", o: ["De las células del Sistema Nervioso Periférico.", "De los huesos del cráneo.", "De las células del SNC: neuronas y glía."], c: 2, e: "Forman un surco dando lugar al tubo neural, el cual es el origen de las células del SNC: neuronas y glía." },
        { q: "¿De dónde se originan las subdivisiones del Sistema Nervioso Periférico (SNP)?", o: ["Del tubo neural.", "De la notocorda.", "De la cresta neural."], c: 2, e: "El resto de las áreas de la placa neural se separan de dicho tubo uniéndose para formar la cresta neural (origen del SNP)." },
        { q: "Aproximadamente a los 40 días de gestación, el tubo neural se curva y aparecen...", o: ["Tres vesículas primarias.", "Cinco lóbulos corticales maduros.", "Los ventrículos laterales definitivos."], c: 0, e: "Aproximadamente a los 40 días de gestación, el tubo neural comienza a curvarse... apareciendo tres vesículas primarias." },
        { q: "¿Cuáles son las tres vesículas primarias que aparecen en el tubo neural?", o: ["Telencéfalo, Diencéfalo y Mielencéfalo.", "Prosencéfalo, Mesencéfalo y Rombencéfalo.", "Metencéfalo, Mesencéfalo y Mielencéfalo."], c: 1, e: "Apareciendo tres vesículas primarias: Prosencéfalo, Mesencéfalo, y Rombencéfalo." },
        { q: "¿Qué estructuras surgen a partir del Prosencéfalo?", o: ["El cerebelo y el bulbo raquídeo.", "El telencéfalo y el diencéfalo.", "Los colículos superiores e inferiores."], c: 1, e: "Prosencéfalo: a partir de esta estructura surgen las estructuras del cerebro anterior: telencéfalo y diencéfalo." },
        { q: "La corteza cerebral y el hipocampo se originan en la zona dorsal de una vesícula secundaria. ¿De cuál?", o: ["Del diencéfalo.", "Del metencéfalo.", "Del telencéfalo."], c: 2, e: "Telencéfalo (...la zona dorsal es el origen de la corteza cerebral e hipocampo)." },
        { q: "¿De dónde surgen los ganglios basales y el bulbo olfatorio?", o: ["De la zona ventral del telencéfalo.", "De la zona dorsal del mesencéfalo.", "Del mielencéfalo."], c: 0, e: "Y la zona ventral (del telencéfalo) de los ganglios basales y bulbo olfatorio." },
        { q: "El tálamo, hipotálamo y las vesículas ópticas (retina) se originan a partir de la porción caudal del prosencéfalo, conocida como:", o: ["Mielencéfalo.", "Diencéfalo.", "Metencéfalo."], c: 1, e: "Diencéfalo (porción caudal. Origen del tálamo, hipotálamo y vesículas ópticas)." },
        { q: "¿En qué vesícula primaria se originan los colículos superiores e inferiores (porción dorsal) y el tegmento (porción ventral)?", o: ["En el Prosencéfalo.", "En el Mesencéfalo.", "En el Rombencéfalo."], c: 1, e: "Mesencéfalo... Su porción dorsal es el origen de los colículos... y la ventral del tegmento mesencefálico." },
        { q: "¿De qué vesícula primaria surgen el metencéfalo y el mielencéfalo?", o: ["Rombencéfalo.", "Prosencéfalo.", "Mesencéfalo."], c: 0, e: "Rombencéfalo... A partir de esta estructura se originan el metencéfalo y mielencéfalo." },
        { q: "El cerebelo y la protuberancia tienen su origen embriológico en el:", o: ["Mielencéfalo.", "Metencéfalo.", "Diencéfalo."], c: 1, e: "Metencéfalo (origen del cerebelo y protuberancia)." },
        { q: "¿Qué estructura deriva anatómica y funcionalmente del Mielencéfalo?", o: ["El tálamo.", "La médula espinal.", "El bulbo raquídeo."], c: 2, e: "Mielencéfalo (origen del bulbo raquídeo)." },
        { q: "Durante el desarrollo, el tubo neural permanece hueco. ¿A qué da origen ese espacio hueco?", o: ["Al sistema circulatorio periférico.", "Al espacio subaracnoideo.", "Al sistema ventricular y canal de la médula espinal."], c: 2, e: "El tubo neural permanece hueco, siendo también el origen del sistema ventricular: ventrículos laterales, tercer y cuarto ventrículo y canal de la médula espinal." },
        { q: "¿De qué porción de la cresta neural surgen los ganglios sensoriales craneales, glándula tiroides y dientes?", o: ["Cresta neural craneal.", "Cresta neural vagal.", "Cresta neural sacra."], c: 0, e: "Cresta neural craneal: origen de los ganglios sensoriales craneales, glándula tiroides y dientes." },
        { q: "El sistema entérico, ganglios parasimpáticos y células musculares lisas en aorta surgen de:", o: ["La cresta neural del tronco.", "La cresta neural vagal.", "La placa neural central."], c: 1, e: "Cresta neural vagal: origen del sistema entérico, ganglios parasimpáticos y células musculares lisas en aorta." },
        { q: "¿Qué población de la cresta neural origina los ganglios sensoriales de la raíz dorsal y ganglios simpáticos anteriores?", o: ["Cresta neural sacra.", "Cresta neural craneal.", "Cresta neural del tronco."], c: 2, e: "Cresta neural del tronco: origen de los ganglios sensoriales de la raíz dorsal y ganglios simpáticos anteriores." },
        { q: "La cresta neural sacra da origen a:", o: ["Células del sistema nervioso entérico y ganglios posteriores de la cadena simpática.", "El sistema respiratorio completo.", "Los colículos superiores."], c: 0, e: "Cresta neural sacra: da origen a las células del sistema nervioso entérico y ganglios posteriores de la cadena simpática." },

        // PROLIFERACIÓN
        { q: "¿Qué ocurre con las células del tubo neural durante la fase de 'Proliferación celular'?", o: ["Se diferencian en neuronas maduras con largas dendritas.", "Aumentan su cantidad para originar las neuronas y la glía.", "Se desplazan paralelamente a la corteza cerebral."], c: 1, e: "Proliferación celular... las células del tubo proliferan, es decir, aumentan su cantidad... se originan las neuronas y glía." },
        { q: "Las células madre del neuroepitelio aumentan su número mediante un proceso de división que produce dos células hijas idénticas. ¿Cómo se llama?", o: ["Apoptosis.", "Meiosis.", "Mitosis."], c: 2, e: "Comienzan a dividirse por mitosis (proceso de división celular en el cual una célula madre se divide para producir dos células hijas idénticas)." },
        { q: "Tras múltiples divisiones de las células progenitoras, ¿qué células se producen en la última división celular?", o: ["Células musculares estriadas.", "Células inmaduras (neuroblastos posmitóticos) o glioblastos.", "Óvulos y espermatozoides."], c: 1, e: "Estas células en su última división producen células inmaduras (neuroblastos posmitóticos) o glioblastos." },
        { q: "¿Qué ocurre con la capacidad de división de una célula una vez se convierte en neurona inmadura?", o: ["Da lugar a la incapacidad de mayores divisiones.", "Aumenta exponencialmente, dividiéndose cada hora.", "Se divide mediante meiosis para formar gametos."], c: 0, e: "El surgimiento de la neurona da lugar a la incapacidad de mayores divisiones." },
        { q: "A diferencia de las neuronas, ¿qué células conservan la capacidad de renovación y reemplazo a lo largo de la vida?", o: ["Los eritrocitos.", "Las células gliales.", "Los mioblastos."], c: 1, e: "Aunque, por otro lado, las células gliales siguen teniendo esta capacidad, con diferentes grados de renovación y reemplazo a lo largo de la vida." },
        { q: "¿Qué factores influyen en el momento en el que las células se vuelven posmitóticas y se diferencian unas de otras?", o: ["Factores de transcripción y moléculas de señalización.", "La dieta materna exclusivamente.", "La temperatura ambiente en la que migran."], c: 0, e: "Estas distinciones entre unas células y otras están influenciadas por la actuación de diversos factores de transcripción y moléculas de señalización." },

        // MIGRACIÓN
        { q: "El proceso mediante el cual las células originadas se desplazan por el tubo neural hasta su destino se denomina:", o: ["Sinaptogénesis.", "Proliferación.", "Migración."], c: 2, e: "La migración es el proceso en el que las células originadas en la proliferación celular comienzan el desplazamiento a lo largo del tubo neural hasta su lugar de destino." },
        { q: "¿En qué estado se encuentran las células durante la etapa de migración?", o: ["Totalmente maduras y mielinizadas.", "En estado inmaduro ya que carecen de axones y dendritas.", "Formando ya sinapsis complejas y provisionales."], c: 1, e: "En esta etapa las células permanecen en estado inmaduro ya que carecen de sus futuras prolongaciones: axones y dendritas." },
        { q: "¿Qué estructura proporciona soporte mecánico para la migración radial de las neuronas inmaduras?", o: ["La cresta neural.", "La notocorda.", "La glía radial (formada por glioblastos)."], c: 2, e: "Migración radial: parte de las neuronas inmaduras del tubo neural, se desplazan hasta su lugar de destino ayudándose de la glía radial." },
        { q: "En la migración radial, ¿dónde mantiene su soma la glía radial para proyectar su prolongación?", o: ["En la superficie de la piel.", "En la zona ventricular.", "En la piamadre."], c: 1, e: "La glía radial mantiene su soma en la zona ventricular y produce una prolongación hasta la superficie del neuroepitelio." },
        { q: "El desplazamiento de las neuronas inmaduras de forma paralela a la superficie cortical se denomina:", o: ["Migración pasiva.", "Migración radial.", "Migración tangencial."], c: 2, e: "Migración tangencial: desplazamiento de las neuronas inmaduras de forma paralela a la superficie cortical." },
        { q: "¿Qué método de migración implica que las prolongaciones de las células 'exploren' el entorno para guiar el camino del cuerpo celular?", o: ["Cambio de localización en el soma.", "Alineación por apoptosis.", "Rebotes citoplasmáticos."], c: 0, e: "Cambio de localización en el soma: las prolongaciones de las células se extienden hacia el lugar de destino para “explorar” el entorno de manera que guían el camino del cuerpo celular." },
        { q: "La 'migración mediada por neuroglia' utiliza una red temporal de células específicas llamadas:", o: ["Células musculares.", "Neurogliocitos radiales.", "Eritrocitos."], c: 1, e: "Migración mediada por neuroglia: este mecanismo implica una red temporal de neurogliocitos denominados neurogliocitos radiales." },

        // DIFERENCIACIÓN Y SINAPTOGÉNESIS
        { q: "Tras la migración, las neuronas se agrupan con las adyacentes para formar estructuras. ¿Qué moléculas facilitan esto?", o: ["Neurotransmisores GABAérgicos.", "Endorfinas endógenas.", "Moléculas de adhesión celular (MACs)."], c: 2, e: "Este proceso es facilitado por moléculas de adhesión celular (MACs) situadas en la superficie celular." },
        { q: "¿En qué etapa la neurona alcanza su morfología fisiológica definitiva y surgen los axones y dendritas?", o: ["Gastrulación.", "Diferenciación celular y maduración.", "Neurulación."], c: 1, e: "Diferenciación celular... en la cual la neurona alcanza su morfología y función fisiológica definitiva... Surgen en este momento los axones y dendritas." },
        { q: "¿Qué estructura especializada se encuentra en los extremos de axones y dendritas para buscar conexiones extendiendo y retrayendo filopodios?", o: ["El cono de crecimiento.", "El botón sináptico estático.", "El nódulo de Ranvier."], c: 0, e: "La estructura que lleva a cabo esto y que se encuentra en ambas prolongaciones, es el cono de crecimiento que extiende y retrae los filopodios." },
        { q: "Para que el cono de crecimiento extienda sus prolongaciones correctamente, se ayuda de sustancias en el entorno como:", o: ["Hormonas digestivas.", "Sustancias neurotróficas (ej. factor neurotrófico de crecimiento nervioso).", "Tóxicos ambientales selectivos."], c: 1, e: "Se sabe que en el entorno neuronal existen sustancias neurotróficas, como es el factor neurotrófico de crecimiento nervioso, que favorecen el crecimiento de las prolongaciones." },
        { q: "¿Qué propone la Hipótesis de la quimioafinidad (Sperry)?", o: ["Los axones conectan al azar hasta encontrar energía eléctrica.", "Cada célula tiene una señal característica de identificación de tipo químico complementaria a la de otras células.", "La glía radial empuja los axones mecánicamente."], c: 1, e: "Hipótesis de la quimioafinidad del crecimiento axónico (Sperry): según esta hipótesis cada célula tiene una señal característica de identificación de tipo químico... hacia señales de otras células que son complementarias." },
        { q: "La hipótesis actual de las sustancias de reconocimiento postula que el crecimiento axónico está influido por...", o: ["La temperatura basal del líquido cefalorraquídeo.", "Diversas señales químicas en la ruta (moléculas de orientación y axones de crecimiento adyacente).", "Únicamente por estímulos visuales."], c: 1, e: "Postula que el crecimiento axónico está influido por diversas señales químicas a lo largo de la ruta. Entre ellas: moléculas de orientación... axones de crecimiento adyacente." },
        { q: "Una vez completada la formación de las vías de conexión, las células inician la sinaptogénesis. ¿Qué característica tiene este proceso en etapas iniciales?", o: ["Una extrema escasez de sinapsis.", "Una sobreproducción de sinapsis provisionales.", "El recubrimiento inmediato de todas las dendritas con mielina."], c: 1, e: "Esquema: Sinaptogénesis -> Establecimiento de primeras conexiones... 'Sobreproducción' de sinapsis provisionales." },

        // MUERTE NEURONAL
        { q: "Para contrarrestar la sobreproducción neuronal, el organismo sigue una estrategia de muerte neuronal. ¿Cuándo ocurre fundamentalmente?", o: ["En el primer mes de gestación.", "A los 10 años de edad.", "En el tercer trimestre de gestación y primeras semanas de vida."], c: 2, e: "Que posteriormente se contrarresta por la muerte neuronal en el tercer trimestre de gestación y primeras semanas de vida." },
        { q: "¿Cómo se denomina al proceso ACTIVO de muerte celular programada, más común durante el desarrollo?", o: ["Apoptosis.", "Necrosis.", "Fagocitosis pasiva."], c: 0, e: "La muerte neural puede seguir un proceso es un proceso activo (apoptosis), más común durante el desarrollo." },
        { q: "¿Qué proceso digestivo acompaña a la apoptosis neuronal evitando la inflamación del tejido?", o: ["Necrosis explosiva.", "Fagocitación (ingestión y destrucción por células especializadas).", "Sangrado microcapilar."], c: 1, e: "El proceso de apoptosis conlleva la fagocitación (ingestión y destrucción de partículas por células especializadas) de las neuronas." },
        { q: "A diferencia de la apoptosis, ¿cómo se denomina la muerte celular PASIVA más común en neuronas adultas tras una lesión?", o: ["Meiosis celular.", "Mitosis acelerada.", "Necrosis."], c: 2, e: "O pasivo (necrosis), más común en las neuronas adultas." },
        { q: "¿Cuál es una consecuencia perjudicial del proceso de necrosis en el tejido cerebral?", o: ["Genera la fragmentación y vertido del contenido celular al exterior, produciendo inflamación orgánica.", "Reorganiza los circuitos limpiamente.", "Crea nuevas células madre de reemplazo."], c: 0, e: "El de necrosis supone la fragmentación y vertido del contenido celular al líquido extracelular lo que produce inflamación orgánica." },
        { q: "Una vez regulado el número de neuronas por apoptosis, ¿qué sucede con las conexiones sinápticas sobrantes?", o: ["Desaparecen por completo del organismo.", "Se produce una redistribución, haciéndose más preciso el patrón de inervación.", "Se congelan hasta el desarrollo de la pubertad."], c: 1, e: "Una vez se regula el número de neuronas... se produce como hemos mencionado una redistribución, dando lugar a una nueva disposición sináptica, haciéndose más preciso el patrón de inervación." },

        // DESARROLLO POSTNATAL
        { q: "¿Hasta qué etapa de la vida no alcanza su plena madurez el cerebro humano?", o: ["Hasta los tres años de edad.", "Hasta el inicio de la escuela primaria.", "Hasta el final de la adolescencia."], c: 2, e: "El cerebro humano se desarrolla más lentamente que el de otras especies y no alcanza su plena madurez hasta el final de la adolescencia." },
        { q: "Si la mayoría de las neuronas migran antes del parto, ¿por qué aumenta el volumen cerebral postnatalmente?", o: ["Por el nacimiento de miles de millones de neuronas nuevas.", "Por la inflamación crónica de los ventrículos cerebrales.", "Por la sinaptogénesis, mielinización axonal y aumento de las ramas dendríticas."], c: 2, e: "Este crecimiento es la consecuencia de los procesos de sinaptogénesis, mielinización axonal y aumento de las ramas dendríticas." },
        { q: "En el desarrollo postnatal, ¿qué factor clave fomenta el desarrollo de circuitos neurales y reorganiza los existentes?", o: ["El peso del bebé al nacer.", "La experiencia y la interacción con el entorno.", "La temperatura uterina previa."], c: 1, e: "Se sabe que la experiencia fomenta el desarrollo de circuitos neurales activos y el mantenimiento o la reorganización de los existentes." },
        { q: "Uno de los mecanismos de influencia de la experiencia es la regulación de la expresión génica. ¿Qué dirige dicha expresión?", o: ["La destrucción de mitocondrias.", "La eliminación de mielina inactiva.", "La síntesis de moléculas de adherencia celular."], c: 2, e: "Regulación de la expresión génica que dirige la síntesis de moléculas de adherencia celular." },
        { q: "La actividad neural originada por la experiencia del entorno influye también en la liberación de...", o: ["Glóbulos blancos.", "Plaquetas.", "Neurotrofinas."], c: 2, e: "La actividad neural influye en la liberación de neurotrofinas. Al influir en la actividad neural podría fomentar el crecimiento de neuronas." },

        // IMPLICACIONES CLÍNICAS
        { q: "Las alteraciones en el desarrollo típico del sistema nervioso pueden producirse por dos grandes grupos de factores. ¿Cuáles?", o: ["Solo factores maternos alimenticios.", "Solo factores ambientales radiactivos.", "Factores internos (propiedades celulares/genéticas) y factores externos (tóxicos/radiación)."], c: 2, e: "Tanto factores internos (propiedades de las células o factores relacionados con el ciclo celular), como factores externos (tóxicos, radiación, temperatura…), pueden producir cambios en el desarrollo normal." },
        { q: "Una mutación en el cromosoma 7 que impide la separación de los dos hemisferios cerebrales y altera estructuras faciales se denomina:", o: ["Holoprosencefalia.", "Parkinsonismo temprano.", "Síndrome Alcohólico Fetal."], c: 0, e: "La holoprosencefalia es una malformación asociada a una mutación genética (cromosoma 7) del cerebro anterior, por la que la separación habitual de los dos hemisferios cerebrales no se produce adecuadamente." },
        { q: "La mutación del gen DCX provoca un agrandamiento de los ventrículos y falta de surcos o circunvoluciones. ¿De qué malformación se trata?", o: ["Microcefalia.", "Lisencefalia.", "Hidrocefalia."], c: 1, e: "Otras mutaciones genéticas específicas (alteración del gen DCX) conllevan... lisencefalia, en la que los ventrículos laterales están agrandados, la sustancia blanca subcortical es inferior a la normal y no se observan surcos ni circunvoluciones." },
        { q: "Una alteración en la neurogénesis y migración típica de las células del cerebelo origina el tumor cerebral más común en la infancia llamado:", o: ["Glioblastoma multiforme.", "Meduloblastoma.", "Astrocitoma difuso."], c: 1, e: "Otra alteración producida en este caso por una alteración en la neurogénesis y migración típica de las células del cerebelo es la aparición del tumor cerebral más común en la infancia, el meduloblastoma." },
        { q: "El trastorno hereditario donde el cerebro se daña y genera discapacidad intelectual por la acumulación del aminoácido fenilalanina se denomina:", o: ["Corea de Huntington.", "Fenilcetonuria.", "Esclerosis lateral amiomielínica."], c: 1, e: "Fenilcetonuria: trastorno hereditario del metabolismo de proteínas en la que el cerebro resulta dañado por la acumulación de fenilalanina." },
        { q: "El síndrome alcohólico fetal (SAF), un daño externo causado por consumo de alcohol materno, presenta alteraciones físicas y también:", o: ["Sordera cortical bilateral total.", "Ausencia completa del tubo digestivo inferior.", "Dificultades en el aprendizaje, inestabilidad motora o síntomas de hiperactividad."], c: 2, e: "El síndrome alcohólico fetal (SAF) incluye alteraciones de los rasgos faciales... Además, durante el desarrollo postnatal, los niños presentan dificultades en el aprendizaje, inestabilidad motora o síntomas de hiperactividad." }
    
];

let questions=[...originalQuestions],currentQuestion=0,score=0,answered=false,missedQuestions=[],retryMode=false;
const questionText=document.getElementById('question-text'),optionsContainer=document.getElementById('options-container'),feedbackContainer=document.getElementById('feedback-container'),nextBtn=document.getElementById('next-btn'),progressText=document.getElementById('progress-text'),scoreTracker=document.getElementById('score-tracker'),quizScreen=document.getElementById('quiz-screen'),resultScreen=document.getElementById('result-screen'),finalScore=document.getElementById('final-score'),finalMessage=document.getElementById('final-message'),progressBar=document.getElementById('progress-bar'),missedSummary=document.getElementById('missed-summary'),retryMissedBtn=document.getElementById('retry-missed-btn'),modeText=document.getElementById('mode-text'),medalText=document.getElementById('medal-text');
function loadQuestion(){answered=false;feedbackContainer.style.display='none';feedbackContainer.className='feedback';feedbackContainer.innerHTML='';nextBtn.style.display='none';const q=questions[currentQuestion],total=questions.length,percent=Math.round((currentQuestion/total)*100);progressText.innerText=`Pregunta ${currentQuestion+1} de ${total}`;progressBar.style.width=`${percent}%`;modeText.innerHTML=retryMode?'<span class="mode-label">Modo repaso: falladas</span>':'Modo completo';questionText.innerText=`${currentQuestion+1}. ${q.q}`;optionsContainer.innerHTML='';q.o.forEach((opt,index)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerText=opt;btn.onclick=()=>selectOption(index,btn);optionsContainer.appendChild(btn);});}
function selectOption(index,btn){if(answered)return;answered=true;const q=questions[currentQuestion],allBtns=optionsContainer.querySelectorAll('.option-btn');allBtns.forEach(b=>b.disabled=true);const correctText=q.o[q.c];if(index===q.c){btn.classList.add('correct');score++;scoreTracker.innerText=`Puntuación: ${score}`;feedbackContainer.classList.add('show','feedback-correct');feedbackContainer.innerHTML=`<strong>Correcto.</strong><span class="solution-label">Por qué es correcto:</span>${q.e}`;}else{btn.classList.add('incorrect');allBtns[q.c].classList.add('correct');if(!missedQuestions.some(item=>item.q===q.q)){missedQuestions.push(q)}feedbackContainer.classList.add('show','feedback-incorrect');feedbackContainer.innerHTML=`<strong>Respuesta equivocada.</strong><br>Has marcado: <b>${q.o[index]}</b><br>La solución correcta es: <b>${correctText}</b><span class="solution-label">Por qué esa es la solución correcta:</span>${q.e}`;}nextBtn.style.display='block';nextBtn.innerText=currentQuestion===questions.length-1?'Ver resultados':'Siguiente pregunta';}
function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){loadQuestion()}else{showResults()}}
function showResults(){quizScreen.style.display='none';resultScreen.style.display='block';progressBar.style.width='100%';const percentage=Math.round((score/questions.length)*100);finalScore.innerHTML=`Has acertado ${score} de ${questions.length} preguntas (${percentage}%)`;if(percentage>=90)medalText.innerText='🏆 Medalla de Oro · Dominio excelente';else if(percentage>=75)medalText.innerText='🥈 Medalla de Plata · Muy buen nivel';else if(percentage>=60)medalText.innerText='🥉 Medalla de Bronce · Base aprobada';else medalText.innerText='📚 Modo refuerzo · Conviene repasar';let message='';if(percentage>=90)message='Impresionante. Dominas neuroembriología, neurulación, migración, diferenciación y maduración del sistema nervioso.';else if(percentage>=70)message='Buen resultado. Repasa las falladas para consolidar vesículas cerebrales, proliferación, migración y apoptosis.';else message='Conviene repasar gastrulación, neurulación, cresta neural, proliferación celular, migración y desarrollo postnatal.';finalMessage.innerText=message;if(missedQuestions.length>0){missedSummary.style.display='block';missedSummary.innerHTML=`<h3>Preguntas falladas: ${missedQuestions.length}</h3><ul>${missedQuestions.map((q,i)=>`<li>${i+1}. ${q.q}</li>`).join('')}</ul>`;retryMissedBtn.style.display='inline-block';}else{missedSummary.style.display='block';missedSummary.innerHTML='<h3>No has fallado ninguna pregunta.</h3><p>Resultado perfecto. No hay preguntas que reintentar.</p>';retryMissedBtn.style.display='none';}}
function retryMissed(){if(missedQuestions.length===0)return;questions=[...missedQuestions];missedQuestions=[];currentQuestion=0;score=0;retryMode=true;scoreTracker.innerText='Puntuación: 0';resultScreen.style.display='none';quizScreen.style.display='block';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
function restartQuiz(){questions=[...originalQuestions];currentQuestion=0;score=0;answered=false;missedQuestions=[];retryMode=false;scoreTracker.innerText='Puntuación: 0';quizScreen.style.display='block';resultScreen.style.display='none';nextBtn.innerText='Siguiente pregunta';loadQuestion();}
loadQuestion();

</script>
